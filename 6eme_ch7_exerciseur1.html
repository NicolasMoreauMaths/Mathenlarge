<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Angles — Exerciseur interactif</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #eef2f7; --grid: #d5dce6; --card: #fff;
    --blue: #1a6fa0; --blue-light: #2d8dc7;
    --blue-pale: rgba(26,111,160,0.08); --blue-border: rgba(26,111,160,0.2);
    --purple: #6b3fa0; --purple-pale: rgba(107,63,160,0.1);
    --orange: #b85c0b; --orange-pale: rgba(184,92,11,0.1);
    --green: #1b7a40; --green-pale: rgba(27,122,64,0.1);
    --red: #c0392b; --red-pale: rgba(192,57,43,0.08);
    --gold: #b8860b; --gold-pale: rgba(184,134,11,0.12);
    --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
    --shadow: rgba(30,41,59,0.08);
}
body {
    font-family: 'DM Sans', sans-serif; min-height: 100vh;
    background: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex; justify-content: center;
    padding: 16px 10px 60px; color: var(--text); -webkit-text-size-adjust: 100%;
}
.app { max-width: 900px; width: 100%; }
.app-header {
    background: linear-gradient(135deg,#0c1624 0%,#162236 45%,#1c3358 100%);
    color:#fff; padding:18px 24px; border-radius:16px 16px 0 0;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 20px rgba(12,22,36,0.4); position:relative; overflow:hidden;
}
.app-header::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.07),transparent 50%); pointer-events:none; }
.app-header-bar { position:absolute; bottom:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#1b7a40,#1a6fa0,#6b3fa0,#c0392b); }
.app-title { font-size:1.2em; font-weight:700; position:relative; display:flex; align-items:center; gap:10px; font-family:'Playfair Display',serif; }
.app-title::before { content:'📐'; font-size:1.1em; font-family:sans-serif; }
.main { background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 16px 16px; padding:32px 28px; box-shadow:0 8px 28px var(--shadow); min-height:60vh; }
.screen { display:none; animation:fadeIn 0.3s ease; }
.screen.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
h1 { font-size:1.5em; font-weight:700; text-align:center; margin-bottom:8px; color:var(--blue); font-family:'Playfair Display',serif; }
.sub { text-align:center; font-size:0.92em; color:var(--text-light); margin-bottom:24px; line-height:1.6; }
.btn { font-family:'DM Sans',sans-serif; padding:11px 26px; border-radius:12px; font-size:0.93em; font-weight:600; cursor:pointer; transition:all 0.2s; border:2px solid; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:none; }
.btn:disabled { opacity:0.3; cursor:not-allowed; }
.btn-blue { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 2px 12px rgba(26,111,160,0.2); }
.btn-blue:hover:not(:disabled) { background:var(--blue-light); transform:translateY(-2px); }
.btn-green { background:var(--green); color:#fff; border-color:var(--green); }
.btn-green:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-2px); }
.btn-ghost { background:transparent; color:var(--text-light); border-color:var(--border); }
.btn-ghost:hover { background:var(--bg); border-color:var(--text-light); }
.controls { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
.menu-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin:20px 0; }
.mc { background:var(--card); border:2px solid var(--border); border-radius:14px; padding:20px 16px; text-align:center; cursor:pointer; transition:all 0.25s; position:relative; min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.mc:hover { border-color:var(--blue); transform:translateY(-4px); box-shadow:0 8px 24px var(--shadow); }
.mc-icon { font-size:2em; margin-bottom:8px; }
.mc-t { font-size:0.9em; color:var(--blue); font-weight:700; margin-bottom:4px; }
.mc-d { font-size:0.78em; color:var(--text-light); line-height:1.4; }
.ex-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.ex-badge { background:var(--blue-pale); color:var(--blue); padding:6px 16px; border-radius:20px; font-size:0.84em; font-weight:700; }
.ex-score { font-size:0.88em; color:var(--text-light); font-weight:600; }
.pbar { width:100%; background:var(--border); border-radius:6px; height:6px; overflow:hidden; margin-bottom:20px; }
.pfill { height:100%; background:linear-gradient(90deg,#1b7a40,#1a6fa0,#6b3fa0); border-radius:6px; transition:width 0.4s; }
.hint-wrap { margin:0 0 18px; text-align:center; }
.hint-btn { background:none; border:1.5px dashed var(--gold); border-radius:10px; color:var(--gold); font-family:'DM Sans',sans-serif; font-size:0.84em; font-weight:600; cursor:pointer; padding:7px 18px; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px; }
.hint-btn:hover { background:var(--gold-pale); }
.hint-body { display:none; margin-top:8px; background:var(--gold-pale); border:1.5px dashed var(--gold); border-radius:10px; padding:10px 16px; font-size:0.84em; color:#7a5800; line-height:1.7; }
.hint-body.open { display:block; animation:fadeIn 0.2s; }
.q-prompt { font-size:1.05em; font-weight:600; margin-bottom:18px; line-height:1.6; text-align:center; }
.angle-canvas-wrap { display:flex; justify-content:center; margin:12px 0; background:#f8fafc; border-radius:12px; border:1px solid var(--border); padding:16px; overflow-x:auto; }

/* ── SAISIE ANGLE : canvas-based, pas de styles spécifiques nécessaires ── */

/* ── CHOICE BUTTONS ── */
.choice-grid { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:20px 0; }
.choice-btn { font-family:'DM Sans',sans-serif; font-size:0.95em; font-weight:700; padding:14px 22px; border:2px solid var(--border); border-radius:12px; background:white; cursor:pointer; transition:all 0.2s; min-width:100px; text-align:center; }
.choice-btn:hover { border-color:var(--blue); transform:translateY(-2px); }
.choice-btn.chosen { background:var(--purple-pale); border-color:var(--purple); color:var(--purple); }
.choice-btn.ok { background:var(--green-pale); border-color:var(--green); color:var(--green); }
.choice-btn.err { background:var(--red-pale); border-color:var(--red); color:var(--red); animation:shake 0.3s; }
.fb { margin-top:20px; padding:14px 18px; border-radius:12px; font-size:0.93em; text-align:center; display:none; animation:fadeIn 0.3s; font-weight:600; line-height:1.7; }
.fb.ok  { display:block; background:var(--green-pale); color:var(--green); border:2px solid rgba(27,122,64,0.2); }
.fb.bad { display:block; background:var(--red-pale); color:var(--red); border:2px solid rgba(192,57,43,0.15); }
.rc { width:140px; height:140px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:20px auto; border:6px solid; }
.rc.good { border-color:var(--green); background:var(--green-pale); }
.rc.mid  { border-color:var(--orange); background:var(--orange-pale); }
.rc.bad  { border-color:var(--red); background:var(--red-pale); }
.rp { font-size:2.2em; font-weight:700; line-height:1; font-family:'Playfair Display',serif; }
.rm { font-size:1.05em; text-align:center; margin:16px 0; line-height:1.5; }

/* ── RAPPORTEUR ── */
.proto-controls { display:flex; gap:.8rem; margin:.8rem 0; flex-wrap:wrap; align-items:center; justify-content:center; }
.proto-controls label { font-size:.85rem; font-weight:600; color:var(--text-light); }
.proto-controls input[type=range] { flex:1; min-width:180px; max-width:280px; accent-color:var(--blue); }
.proto-display { font-family:'JetBrains Mono',monospace; font-size:1.8rem; font-weight:600; color:var(--blue); min-width:80px; text-align:center; }
.proto-nature { font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:600; padding:.25rem .7rem; border-radius:50px; display:inline-block; }
.proto-canvas-wrap { display:flex; justify-content:center; margin:1rem 0; overflow-x:auto; touch-action:none; }
.proto-canvas-wrap canvas { cursor:grab; touch-action:none; display:block; }
.proto-canvas-wrap canvas:active { cursor:grabbing; }
.proto-hint { font-size:.82rem; color:var(--text-light); text-align:center; margin-top:.3rem; }
.proto-target { background:var(--blue-pale); border:2px solid var(--blue-border); border-radius:10px; padding:10px 20px; text-align:center; margin-bottom:12px; font-size:0.95em; font-weight:600; }
.proto-target .target-val { font-family:'JetBrains Mono',monospace; font-size:1.5em; font-weight:700; color:var(--blue); }
.proto-tolerance { font-size:0.75em; color:var(--text-light); margin-top:2px; }

@media (max-width:640px) {
    .app-header{padding:14px 18px} .app-title{font-size:1em} .main{padding:22px 16px}
    h1{font-size:1.25em} .menu-grid{grid-template-columns:1fr}
    .choice-btn{min-width:80px;padding:10px 14px;font-size:0.88em}
}

  /* ══ RESPONSIVE ENHANCEMENTS ══ */
  svg{max-width:100%;height:auto;}
  @media(max-width:480px){
    .app-header{padding:12px 14px;}
    .app-title{font-size:0.92em;gap:6px;}
    .app-badge{font-size:0.6em;}
    .main{padding:16px 12px;}
    h1{font-size:1.1em;}
    .sub{font-size:.84em;}
    .btn{padding:9px 16px;font-size:.86em;min-height:40px;}
    .mc{padding:14px 12px;min-height:100px;}
    .mc-icon{font-size:1.6em;}
    .mc-t{font-size:.82em;}
    .mc-d{font-size:.72em;}
    .ctx-card{padding:10px 12px;font-size:.86em;}
    .formula-remind{padding:8px 10px;font-size:.8em;}
    .q-prompt{font-size:.95em;}
    .answer-input{width:110px;font-size:1em;padding:8px 10px;}
    .fb{padding:10px 12px;font-size:.86em;}
    .rc{width:110px;height:110px;}
    .rp{font-size:1.8em;}
    .controls{gap:8px;}
    .choice-btn{min-width:60px;padding:8px 10px;font-size:.82em;}
  }
  @media(max-width:380px){
    body{padding:8px 4px 50px;}
    .app-header{padding:10px 10px;}
    .app-title{font-size:0.85em;}
    .main{padding:12px 8px;}
    h1{font-size:1em;}
    .mc{min-height:80px;padding:10px 8px;}
    .answer-input{width:95px;font-size:.9em;}
    .btn{padding:7px 12px;font-size:.8em;}
  }

</style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Les Angles — 6ème</div>
        <div class="app-header-bar"></div>
    </div>
    <div class="main">
        <div id="screen-menu" class="screen active">
            <h1>Choisis un exercice</h1>
            <p class="sub">Trois exerciseurs pour maîtriser la notion d'angle, le rapporteur et les types d'angles.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Thème</span>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
            <div id="exBody"></div>
            <div class="fb" id="fb"></div>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue"  id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
            </div>
        </div>
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc"><div class="rp" id="rp">0/0</div></div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue"  id="btnRetry">Recommencer</button>
            </div>
        </div>
    </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
    { id:'nommer',     icon:'🔤', title:'Nommer un angle',        desc:'Écrire les trois lettres — le chapeau apparaît automatiquement sur le sommet', n:8 },
    { id:'rapporteur', icon:'📐', title:'Utiliser le rapporteur', desc:'Construire un angle donné en degrés à l\'aide du rapporteur interactif', n:6 },
    { id:'nature',     icon:'🔷', title:'Nature d\'un angle',     desc:'Reconnaître si un angle est nul, aigu, droit, obtus ou plat', n:10 },
];

let state = { levelId:null, qIndex:0, total:0, score:0, questions:[], checked:false };

/* ============================================================
   UTILS
   ============================================================ */
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function hint(text){
    return `<div class="hint-wrap">
        <button class="hint-btn" onclick="toggleHint(this)">💡 Indice</button>
        <div class="hint-body">${text}</div>
    </div>`;
}
function toggleHint(btn){
    const b=btn.nextElementSibling;
    b.classList.toggle('open');
    btn.textContent=b.classList.contains('open')?'💡 Masquer l\'indice':'💡 Indice';
}

/* Rend un nom d'angle (3 lettres) avec chapeau LARGE sur les 3 lettres — style widehat LaTeX */
function renderAngleName(name, colorVertex='#c0392b', colorSide='#1a6fa0'){
    if(name.length!==3) return `<strong>${name}</strong>`;
    const [a,v,b]=name;
    /* SVG chapeau large : s'étend sur toute la largeur du groupe de 3 lettres.
       On utilise un SVG positionné en absolute au-dessus d'un span relatif. */
    const W=58, H=14; // dimensions du chapeau SVG
    const hat=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="max-width:100%;height:auto;position:absolute;top:-${H}px;left:50%;transform:translateX(-50%);display:block;pointer-events:none;">
        <polyline points="2,${H} ${W/2},2 ${W-2},${H}"
            fill="none" stroke="${colorSide}" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
    return `<span style="display:inline-flex;align-items:baseline;gap:1px;font-family:'JetBrains Mono',monospace;font-size:1.05em;font-weight:700;position:relative;padding-top:${H}px">
        ${hat}
        <span style="color:${colorSide}">${a}</span><span style="color:${colorVertex}">${v}</span><span style="color:${colorSide}">${b}</span>
    </span>`;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
}

function buildMenu(){
    const grid=document.getElementById('menuGrid');
    grid.innerHTML='';
    LEVELS.forEach(lv=>{
        const el=document.createElement('div');
        el.className='mc';
        el.innerHTML=`<div class="mc-icon">${lv.icon}</div><div class="mc-t">${lv.title}</div><div class="mc-d">${lv.desc}</div>`;
        el.addEventListener('click',()=>startLevel(lv.id));
        grid.appendChild(el);
    });
}
document.getElementById('btnMenu').addEventListener('click',()=>showScreen('screen-menu'));
document.getElementById('btnMenu2').addEventListener('click',()=>showScreen('screen-menu'));
document.getElementById('btnRetry').addEventListener('click',()=>startLevel(state.levelId));

/* ============================================================
   ENGINE
   ============================================================ */
const GENERATORS={}, RENDERERS={}, CHECKERS={};

function startLevel(id){
    const lv=LEVELS.find(l=>l.id===id);
    state={levelId:id,qIndex:0,total:lv.n,score:0,questions:[],checked:false};
    for(let i=0;i<lv.n;i++) state.questions.push(GENERATORS[id]());
    document.getElementById('exBadge').textContent=lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion(){
    const q=state.questions[state.qIndex];
    document.getElementById('exScore').textContent=`Question ${state.qIndex+1}/${state.total}`;
    document.getElementById('pfill').style.width=`${(state.qIndex/state.total)*100}%`;
    const fb=document.getElementById('fb'); fb.className='fb'; fb.innerHTML='';
    document.getElementById('btnCheck').style.display='inline-flex';
    document.getElementById('btnNext').style.display='none';
    state.checked=false;
    const box=document.getElementById('exBody'); box.innerHTML='';
    RENDERERS[state.levelId](q,box);
}

document.getElementById('btnCheck').addEventListener('click',()=>{
    if(state.checked) return;
    const q=state.questions[state.qIndex];
    const result=CHECKERS[state.levelId](q);
    if(!result) return;
    state.checked=true;
    const fb=document.getElementById('fb');
    fb.className=result.ok?'fb ok':'fb bad';
    fb.innerHTML=(result.ok?'✓ ':'✗ ')+result.msg;
    if(result.ok) state.score++;
    document.getElementById('btnCheck').style.display='none';
    document.getElementById('btnNext').style.display='inline-flex';
    document.getElementById('btnNext').textContent=state.qIndex+1<state.total?'Suivant →':'Voir les résultats';
});

document.getElementById('btnNext').addEventListener('click',()=>{
    state.qIndex++;
    if(state.qIndex>=state.total) showResults();
    else renderQuestion();
});

function showResults(){
    const s=state.score,t=state.total,pct=Math.round(s/t*100);
    const rc=document.getElementById('rc');
    rc.className='rc '+(pct>=70?'good':pct>=40?'mid':'bad');
    document.getElementById('rp').textContent=`${s}/${t}`;
    document.getElementById('rm').textContent=pct===100?'🎉 Excellent ! Tu maîtrises parfaitement ce chapitre !':pct>=70?'👍 Très bien ! Continue tes efforts.':pct>=40?'💪 Pas mal ! Relis la leçon et recommence.':'📚 Courage ! Revois la leçon sur les angles.';
    showScreen('screen-res');
}

/* ============================================================
   DESSIN D'UN ANGLE (SVG propre)
   ============================================================ */
/*
   Principe : le sommet est toujours à gauche-bas (vx,vy).
   Côté A : horizontal vers la droite.
   Côté B : à angleDeg au-dessus de l'horizontale.
   On choisit les dimensions pour que le dessin soit toujours lisible.
*/
function drawAngleFigure(vertex, sideA, sideB, angleDeg, {W=300,H=200,colorV='#c0392b',colorS='#1a6fa0'}={}){
    // Sommet positionné pour laisser de la place aux labels
    const vx=60, vy=H-30;
    const len=W-90; // longueur des côtés

    // Côté A : horizontal
    const ax=vx+len, ay=vy;

    // Côté B
    const rad=angleDeg*Math.PI/180;
    const bx=vx+len*Math.cos(rad);
    const by=vy-len*Math.sin(rad);

    // Arc de l'angle (rayon 40)
    const arcR=40;
    let arcPath='';
    let rightMark='';

    if(angleDeg===0){
        // Pas d'arc pour angle nul
        arcPath='';
    } else if(Math.abs(angleDeg-90)<0.5){
        // Carré pour angle droit (pas d'arc)
        const sq=20;
        rightMark=`<rect x="${vx}" y="${vy-sq}" width="${sq}" height="${sq}" fill="rgba(184,92,11,0.10)" stroke="var(--orange)" stroke-width="1.8" fill-rule="evenodd"/>`;
    } else {
        const ax2=vx+arcR, ay2=vy;
        const bx2=vx+arcR*Math.cos(rad), by2=vy-arcR*Math.sin(rad);
        const large=angleDeg>180?1:0;
        arcPath=`<path d="M ${ax2.toFixed(2)} ${ay2.toFixed(2)} A ${arcR} ${arcR} 0 ${large} 0 ${bx2.toFixed(2)} ${by2.toFixed(2)}"
            stroke="var(--orange)" stroke-width="2" fill="rgba(184,92,11,0.09)"/>`;
    }

    // Label B : positionner en bout du côté B, décalé perpendiculairement
    const labelOffset=16;
    // Normale à la direction de B
    const bLx=(bx+labelOffset*Math.cos(rad+Math.PI/2)).toFixed(1);
    const bLy=(by-labelOffset*Math.sin(rad+Math.PI/2)+5).toFixed(1);
    // Si ça dépasse en haut, on met juste au-dessus
    const bLyFinal=by<20?'12':bLy;

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="width:${W}px;height:${H}px;max-width:100%;overflow:visible;">
  <!-- Côté A -->
  <line x1="${vx}" y1="${vy}" x2="${ax}" y2="${ay}"
        stroke="${colorS}" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Côté B -->
  ${angleDeg===0?'':`<line x1="${vx}" y1="${vy}" x2="${bx.toFixed(2)}" y2="${by.toFixed(2)}"
        stroke="${colorS}" stroke-width="2.5" stroke-linecap="round"/>`}
  ${arcPath}
  ${rightMark}
  <!-- Sommet -->
  <circle cx="${vx}" cy="${vy}" r="5" fill="${colorV}"/>
  <!-- Bouts des côtés -->
  <circle cx="${ax}" cy="${ay}" r="3.5" fill="${colorS}"/>
  ${angleDeg===0?'':`<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="3.5" fill="${colorS}"/>`}
  <!-- Label sommet -->
  <text x="${vx-14}" y="${vy+16}" font-family="DM Sans,sans-serif" font-size="15"
        fill="${colorV}" font-weight="700">${vertex}</text>
  <!-- Label sideA -->
  <text x="${ax+8}" y="${ay+6}" font-family="DM Sans,sans-serif" font-size="15"
        fill="${colorS}" font-weight="700">${sideA}</text>
  <!-- Label sideB -->
  ${angleDeg===0
    ? `<text x="${ax+8}" y="${ay-16}" font-family="DM Sans,sans-serif" font-size="15" fill="${colorS}" font-weight="700">${sideB}</text>`
    : `<text x="${bLx}" y="${bLyFinal}" font-family="DM Sans,sans-serif" font-size="15" fill="${colorS}" font-weight="700">${sideB}</text>`}
</svg>`;
}

/* ── Widget saisie : un seul champ canvas qui affiche les lettres + chapeau ── */
function buildAngleInputWidget(q){
    /*
      Principe : un <canvas> affiche les 3 lettres avec le chapeau dessiné
      par-dessus la lettre du milieu. Un <input> invisible superposé capte
      la frappe. Pas de doublon : l'input réel est rendu invisible (opacity:0)
      et le canvas est l'unique rendu visuel.
    */
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0;';

    // Instruction
    const instr=document.createElement('div');
    instr.style.cssText='font-size:0.82em;color:var(--text-light);';
    instr.textContent='Saisis les 3 lettres — le chapeau apparaît sur le sommet (lettre du milieu)';
    wrap.appendChild(instr);

    // Conteneur canvas + input superposé
    const holder=document.createElement('div');
    holder.style.cssText='position:relative;cursor:text;';

    // Canvas de rendu
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const CW=220, CH=80; // taille logique en px CSS
    const canvas=document.createElement('canvas');
    canvas.width=CW*dpr; canvas.height=CH*dpr;
    canvas.style.cssText=`width:${CW}px;height:${CH}px;display:block;border-radius:14px;`;
    holder.appendChild(canvas);

    // Input invisible par-dessus (capte la frappe)
    const inp=document.createElement('input');
    inp.type='text'; inp.maxLength=3;
    inp.autocomplete='off'; inp.autocorrect='off'; inp.autocapitalize='characters'; inp.spellcheck=false;
    inp.style.cssText=`position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:text;font-size:16px;border:none;outline:none;background:transparent;`;
    holder.appendChild(inp);
    wrap.appendChild(holder);

    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);

    // Couleurs et état
    let borderColor='#9b72cf'; // purple par défaut
    let borderStyle='dashed';
    let bgColor='#ffffff';
    let stateVal='idle';

    const FONT_SIZE=34; // taille des lettres
    const LETTER_Y=CH-10; // baseline des lettres
    // Marges horizontales pour centrer les 3 lettres avec espacement naturel
    const PAD=18; // marge gauche/droite
    const USABLE=CW-PAD*2;
    // Positions X des 3 lettres : réparties uniformément
    const XS=[PAD+USABLE*0.15, CW/2, PAD+USABLE*0.85];

    function drawField(val){
        ctx.clearRect(0,0,CW,CH);

        /* ── Fond + bordure ── */
        ctx.save();
        roundRect(ctx,2,2,CW-4,CH-4,12);
        ctx.fillStyle=bgColor; ctx.fill();
        ctx.strokeStyle=borderColor; ctx.lineWidth=3;
        ctx.setLineDash(borderStyle==='dashed'?[6,4]:[]);
        ctx.stroke();
        ctx.restore();

        /* ── Les 3 lettres ── */
        ctx.font=`700 ${FONT_SIZE}px 'JetBrains Mono',monospace`;
        ctx.textBaseline='alphabetic';

        // Lettre 1 — côté (bleue)
        if(val[0]){
            ctx.save(); ctx.fillStyle='#1a6fa0';
            ctx.textAlign='center';
            ctx.fillText(val[0], XS[0], LETTER_Y);
            ctx.restore();
        }
        // Lettre 2 — sommet (rouge)
        if(val[1]){
            ctx.save(); ctx.fillStyle='#c0392b';
            ctx.textAlign='center';
            ctx.fillText(val[1], XS[1], LETTER_Y);
            ctx.restore();
        }
        // Lettre 3 — côté (bleue)
        if(val[2]){
            ctx.save(); ctx.fillStyle='#1a6fa0';
            ctx.textAlign='center';
            ctx.fillText(val[2], XS[2], LETTER_Y);
            ctx.restore();
        }

        /* ── Underscores pour les lettres manquantes ── */
        for(let i=val.length;i<3;i++){
            ctx.save();
            ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=2; ctx.setLineDash([]);
            const ux=XS[i], uy=LETTER_Y+3;
            ctx.beginPath(); ctx.moveTo(ux-12,uy); ctx.lineTo(ux+12,uy);
            ctx.stroke();
            ctx.restore();
        }

        /* ── Chapeau large sur les 3 lettres (style widehat LaTeX) ──
           Le chapeau s'étend de la lettre 1 à la lettre 3.
           Forme : deux segments qui se rejoignent en pointe au-dessus du centre.
           Extrémités légèrement relevées (petites pattes) comme un vrai widehat.
        */
        if(val.length===3){
            // Coordonnées du chapeau
            const hatY_tip  = 8;   // pointe du chapeau (haut)
            const hatY_ends = 20;  // hauteur des extrémités
            const hatY_feet = 17;  // petite patte aux extrémités (légèrement au-dessus de ends)
            const margin=6;        // débordement de chaque côté par rapport aux lettres extrêmes
            const xLeft  = XS[0]-margin;
            const xRight = XS[2]+margin;
            const xMid   = CW/2;
            // Petites pattes verticales aux extrémités (comme le vrai widehat)
            const footLen=5;

            ctx.save();
            ctx.strokeStyle='#1a6fa0'; // bleu foncé, neutre
            ctx.lineWidth=2.4;
            ctx.lineCap='round'; ctx.lineJoin='round';
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(xLeft,  hatY_ends);
            ctx.lineTo(xMid,   hatY_tip);
            ctx.lineTo(xRight, hatY_ends);
            ctx.stroke();
            ctx.restore();
        } else if(val.length===2){
            /* Chapeau partiel : couvre lettres 1+2, pointe au centre provisoire */
            const hatY_tip=10, hatY_ends=21, footLen=4;
            const xLeft=XS[0]-6, xRight=XS[1]+6, xMid=(XS[0]+XS[1])/2;
            ctx.save();
            ctx.strokeStyle='rgba(26,111,160,0.5)';
            ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(xLeft, hatY_ends);
            ctx.lineTo(xMid,  hatY_tip);
            ctx.lineTo(xRight, hatY_ends);
            ctx.stroke();
            ctx.restore();
        }

        /* ── Curseur clignotant ── */
        if(val.length<3 && document.activeElement===inp){
            const curX = val.length===0 ? XS[0] : val.length===1 ? XS[1] : XS[2];
            ctx.save();
            ctx.strokeStyle='#64748b'; ctx.lineWidth=1.5; ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(curX+16, CH*0.3);
            ctx.lineTo(curX+16, CH*0.88);
            ctx.stroke();
            ctx.restore();
        }
    }

    function roundRect(ctx,x,y,w,h,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
        ctx.closePath();
    }

    // Curseur clignotant
    let cursorInterval=null;
    inp.addEventListener('focus',()=>{
        borderColor='#1a6fa0'; borderStyle='solid'; drawField(inp.value.toUpperCase());
        cursorInterval=setInterval(()=>drawField(inp.value.toUpperCase()),500);
    });
    inp.addEventListener('blur',()=>{
        if(stateVal==='idle'){ borderColor='#9b72cf'; borderStyle='dashed'; }
        clearInterval(cursorInterval); drawField(inp.value.toUpperCase());
    });

    inp.addEventListener('input',function(){
        const val=this.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
        this.value=val;
        drawField(val);
    });

    // Clic sur canvas → focus input
    canvas.addEventListener('click',()=>inp.focus());

    // Méthodes publiques
    wrap._getValue=()=>inp.value.toUpperCase().trim();
    wrap._setState=(s)=>{
        stateVal=s;
        if(s==='ok'){  borderColor='#1b7a40'; borderStyle='solid'; bgColor='rgba(27,122,64,0.08)'; }
        if(s==='err'){ borderColor='#c0392b'; borderStyle='solid'; bgColor='rgba(192,57,43,0.06)'; }
        drawField(inp.value.toUpperCase());
    };
    wrap._focus=()=>{ setTimeout(()=>inp.focus(),60); };

    // Dessin initial
    drawField('');
    return wrap;
}

let _angleWidget=null;

RENDERERS.nommer=function(q,box){
    const svgHtml=drawAngleFigure(q.vertex,q.sideA,q.sideB,q.angleDeg,{W:300,H:180});
    box.innerHTML=`
        ${hint(`Un angle se nomme avec <strong>3 lettres</strong>. La lettre du <strong style="color:var(--red)">sommet</strong> est toujours <strong>au milieu</strong>. Exemple : pour un angle de sommet A entre les côtés [AB) et [AC), on écrit B̂AC.`)}
        <p class="q-prompt">Nomme l'angle ci-dessous :<br>
        <span style="font-size:0.82em;font-weight:400;color:var(--text-light)">(le sommet est le point rouge — deux noms sont acceptés)</span></p>
        <div class="angle-canvas-wrap">${svgHtml}</div>
    `;
    _angleWidget=buildAngleInputWidget(q);
    box.appendChild(_angleWidget);
    _angleWidget._focus();
};

CHECKERS.nommer=function(q){
    const val=_angleWidget._getValue();
    const ok1=q.sideA+q.vertex+q.sideB;
    const ok2=q.sideB+q.vertex+q.sideA;
    const ok=val===ok1||val===ok2;
    _angleWidget._setState(ok?'ok':'err');
    if(ok) return {ok:true, msg:`Bravo ! L'angle se note ${renderAngleName(ok1)} ou ${renderAngleName(ok2)}. Le sommet <strong style="color:var(--red)">${q.vertex}</strong> est bien au milieu !`};
    if(val.length!==3) return {ok:false, msg:`Il faut exactement 3 lettres. La réponse était ${renderAngleName(ok1)} ou ${renderAngleName(ok2)}.`};
    if(val[1]!==q.vertex) return {ok:false, msg:`Le sommet <strong style="color:var(--red)">${q.vertex}</strong> doit être <strong>au milieu</strong> ! La réponse : ${renderAngleName(ok1)} ou ${renderAngleName(ok2)}.`};
    return {ok:false, msg:`Pas tout à fait. La réponse était ${renderAngleName(ok1)} ou ${renderAngleName(ok2)}.`};
};

/* ============================================================
   NIVEAU 2 : RAPPORTEUR INTERACTIF
   ============================================================ */
let protoAngle=45, protoTarget=0, protoDragging=false;
let _protoCx, _protoBaseY, _protoR, _protoCssW, _protoCssH;

function getNature(d){
    if(d===0)   return {text:'Nul',   bg:'#f1f5f9',             color:'#64748b'};
    if(d<90)    return {text:'Aigu',  bg:'var(--blue-pale)',    color:'var(--blue)'};
    if(d===90)  return {text:'Droit', bg:'var(--green-pale)',   color:'var(--green)'};
    if(d<180)   return {text:'Obtus', bg:'var(--purple-pale)',  color:'var(--purple)'};
    return              {text:'Plat',  bg:'var(--red-pale)',     color:'var(--red)'};
}

GENERATORS.rapporteur=function(){
    const pool=[30,45,55,60,70,75,90,105,115,120,135,150,25,140];
    return {target:shuffle(pool)[0]};
};

RENDERERS.rapporteur=function(q,box){
    protoTarget=q.target;
    protoAngle=rnd(15,165);
    const nat=getNature(q.target);
    box.innerHTML=`
        ${hint('Place le côté mobile (point violet) sur la graduation cible. La <strong>ligne de foi</strong> est alignée sur le côté horizontal. Lis la valeur sur la <strong>graduation extérieure</strong> du rapporteur !')}
        <div class="proto-target">
            Construis un angle de <span class="target-val">${q.target}°</span>
            <span style="margin-left:8px;padding:3px 10px;border-radius:20px;font-size:0.82em;background:${nat.bg};color:${nat.color};font-weight:700">${nat.text}</span>
            <div class="proto-tolerance">Tolérance : ± 3°</div>
        </div>
        <div class="proto-controls">
            <label for="protoSlider">Angle :</label>
            <input type="range" id="protoSlider" min="0" max="180" value="${protoAngle}" step="1">
            <span class="proto-display" id="protoDisplay">${protoAngle}°</span>
            <span class="proto-nature" id="protoNature"></span>
        </div>
        <div class="proto-canvas-wrap">
            <canvas id="protoCanvas"></canvas>
        </div>
        <div class="proto-hint">💡 Fais glisser le curseur, ou clique/touche directement sur le rapporteur !</div>
    `;
    initProtractor(q);
};

function initProtractor(q){
    const canvas=document.getElementById('protoCanvas');
    const ctx=canvas.getContext('2d');
    const slider=document.getElementById('protoSlider');
    const display=document.getElementById('protoDisplay');
    const natureEl=document.getElementById('protoNature');

    /* Dimensions responsives */
    const maxW=Math.min(560, window.innerWidth-60);
    const cssW=maxW, cssH=Math.round(maxW*0.62);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=cssW*dpr; canvas.height=cssH*dpr;
    canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
    ctx.scale(dpr,dpr);

    /* Géométrie du rapporteur */
    const cx=cssW/2;
    const baseY=cssH*0.68;
    const R=Math.round(cssW*0.40);
    _protoCx=cx; _protoBaseY=baseY; _protoR=R; _protoCssW=cssW; _protoCssH=cssH;

    function drawProto(deg){
        ctx.clearRect(0,0,cssW,cssH);

        /* ── Demi-disque du rapporteur ── */
        ctx.beginPath();
        ctx.arc(cx,baseY,R,Math.PI,0,false);
        ctx.closePath();
        ctx.fillStyle='rgba(219,234,254,0.45)';
        ctx.fill();
        // Bord extérieur
        ctx.beginPath();
        ctx.arc(cx,baseY,R,Math.PI,0,false);
        ctx.strokeStyle='#1a6fa0'; ctx.lineWidth=2.5; ctx.stroke();
        // Ligne de base
        ctx.beginPath();
        ctx.moveTo(cx-R,baseY); ctx.lineTo(cx+R,baseY);
        ctx.strokeStyle='#1a6fa0'; ctx.lineWidth=2; ctx.stroke();

        /*
         ── Double graduation comme un vrai rapporteur ──
         Graduation EXTÉRIEURE : 0° à droite → 180° à gauche  (sens direct de lecture, côté droit = 0)
         Graduation INTÉRIEURE : 0° à gauche → 180° à droite  (sens inverse, côté gauche = 0)
         Chaque graduation d° se place sur le cercle à l'angle (180-d)*π/180 depuis l'axe +x.
         Les ticks extérieurs partent du bord vers l'intérieur.
         Les labels extérieurs (graduation 1) sont proches du bord.
         Les labels intérieurs (graduation 2) sont un peu plus à l'intérieur.
        */
        const Rout=R;          // bord extérieur
        const Rin =R*0.72;    // limite intérieure des ticks

        for(let d=0;d<=180;d++){
            // Position sur le demi-cercle : d° de la graduation extérieure
            // angle trigonométrique depuis +x : (180-d)*π/180
            const theta=(180-d)*Math.PI/180;
            const cosT=Math.cos(theta), sinT=Math.sin(theta);
            const x0=cx+Rout*cosT, y0=baseY-Rout*sinT;

            const isMain=d%10===0, isMid=d%5===0;

            // Ticks extérieurs (graduation 1 : 0→180 de droite à gauche)
            const tOuter=isMain?18:isMid?11:5;
            const x1=cx+(Rout-tOuter)*cosT, y1=baseY-(Rout-tOuter)*sinT;
            ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
            ctx.strokeStyle=isMain?'#1e40af':'#93c5fd';
            ctx.lineWidth=isMain?1.8:isMid?1.1:0.6;
            ctx.setLineDash([]);
            ctx.stroke();

            // Ticks intérieurs (graduation 2 : 0→180 de gauche à droite, donc valeur = 180-d)
            const tInner=isMain?14:isMid?9:4;
            const x2=cx+(Rin+tInner)*cosT, y2=baseY-(Rin+tInner)*sinT;
            const xIn=cx+Rin*cosT, yIn=baseY-Rin*sinT;
            ctx.beginPath(); ctx.moveTo(xIn,yIn); ctx.lineTo(x2,y2);
            ctx.strokeStyle=isMain?'#6b21a8':'#c4b5fd';
            ctx.lineWidth=isMain?1.4:isMid?0.9:0.5;
            ctx.stroke();

            // Labels graduation extérieure (0→180, droite→gauche) — proches du bord
            if(isMain){
                const lDist=Rout-27;
                const lx=cx+lDist*cosT, ly=baseY-lDist*sinT;
                ctx.save();
                ctx.font=`600 ${d===0||d===180?10:8.5}px "DM Sans",sans-serif`;
                ctx.fillStyle='#1e3a8a';
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(String(d),lx,ly);
                ctx.restore();
            }

            // Labels graduation intérieure (0→180, gauche→droite) = valeur 180-d
            if(isMain){
                const d2=180-d; // valeur affichée sur la graduation intérieure
                const lDist2=Rin+28;
                const lx2=cx+lDist2*cosT, ly2=baseY-lDist2*sinT;
                ctx.save();
                ctx.font=`500 ${d2===0||d2===180?10:8}px "DM Sans",sans-serif`;
                ctx.fillStyle='#6b21a8';
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(String(d2),lx2,ly2);
                ctx.restore();
            }
        }

        /* ── Point central ── */
        ctx.beginPath(); ctx.arc(cx,baseY,5,0,Math.PI*2);
        ctx.fillStyle='#c0392b'; ctx.fill();

        /* ── L'angle tracé ── */
        const angleRad=deg*Math.PI/180;
        const sideColor='#6b3fa0';

        // Arc de l'angle (remplissage)
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx,baseY);
        ctx.arc(cx,baseY,55,0,-angleRad,true);
        ctx.closePath();
        ctx.fillStyle='rgba(107,63,160,0.15)';
        ctx.fill();
        ctx.restore();

        // Arc stroke
        if(deg>0&&deg<180){
            ctx.beginPath();
            ctx.arc(cx,baseY,55,0,-angleRad,true);
            ctx.strokeStyle=sideColor; ctx.lineWidth=2.2; ctx.setLineDash([]); ctx.stroke();
        }

        // Côté fixe (horizontal, vers la droite)
        ctx.beginPath();
        ctx.moveTo(cx,baseY); ctx.lineTo(cx+R+26,baseY);
        ctx.strokeStyle=sideColor; ctx.lineWidth=2.8; ctx.setLineDash([]); ctx.stroke();

        // Côté mobile
        const mobX=cx+(R+26)*Math.cos(angleRad);
        const mobY=baseY-(R+26)*Math.sin(angleRad);
        ctx.beginPath();
        ctx.moveTo(cx,baseY); ctx.lineTo(mobX,mobY);
        ctx.strokeStyle=sideColor; ctx.lineWidth=2.8; ctx.stroke();

        // Point draggable sur le côté mobile
        const dotR2=R*0.72;
        const dotX=cx+dotR2*Math.cos(angleRad);
        const dotY=baseY-dotR2*Math.sin(angleRad);
        ctx.beginPath(); ctx.arc(dotX,dotY,9,0,Math.PI*2);
        ctx.fillStyle=sideColor; ctx.fill();
        ctx.beginPath(); ctx.arc(dotX,dotY,5,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.fill();

        // Repère sur le bord extérieur (graduation ext, angle courant)
        const hlTheta=(180-deg)*Math.PI/180;
        const hlX=cx+R*Math.cos(hlTheta), hlY=baseY-R*Math.sin(hlTheta);
        ctx.beginPath(); ctx.arc(hlX,hlY,5,0,Math.PI*2);
        ctx.fillStyle=sideColor; ctx.fill();

        // Valeur de l'angle dans le secteur
        if(deg>6&&deg<174){
            const midRad=angleRad/2;
            const lr=Math.min(68,R*0.36);
            const lx=cx+lr*Math.cos(midRad), ly=baseY-lr*Math.sin(midRad);
            ctx.save();
            ctx.font=`700 13px "DM Sans",sans-serif`;
            ctx.fillStyle=sideColor;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(deg+'°',lx,ly);
            ctx.restore();
        }

        // Labels O, A, B
        ctx.save();
        ctx.font='700 14px "DM Sans",sans-serif';
        ctx.fillStyle='#c0392b'; ctx.textAlign='center';
        ctx.fillText('O',cx,baseY+18);
        ctx.fillStyle=sideColor; ctx.textAlign='left';
        ctx.fillText('A',cx+R+32,baseY+6);
        // B : au bout du côté mobile, décalé perpendiculairement
        const bLx=mobX+14*Math.cos(angleRad);
        const bLy=mobY-14*Math.sin(angleRad);
        ctx.textAlign='center';
        ctx.fillText('B',bLx,bLy);
        ctx.restore();

        // "ligne de foi"
        ctx.save();
        ctx.font='italic 9px "DM Sans",sans-serif';
        ctx.fillStyle='rgba(26,111,160,0.55)';
        ctx.textAlign='center';
        ctx.fillText('ligne de foi',cx+R*0.45,baseY+16);
        ctx.restore();

        // Flèche cible sur le bord du rapporteur (vert)
        const tTheta=(180-protoTarget)*Math.PI/180;
        const tX=cx+(R+10)*Math.cos(tTheta), tY=baseY-(R+10)*Math.sin(tTheta);
        ctx.save();
        ctx.beginPath(); ctx.arc(tX,tY,5,0,Math.PI*2);
        ctx.fillStyle='rgba(27,122,64,0.65)'; ctx.fill();
        ctx.restore();
    }

    function updateProto(val){
        protoAngle=Math.round(Math.max(0,Math.min(180,parseInt(val))));
        slider.value=protoAngle;
        display.textContent=protoAngle+'°';
        const n=getNature(protoAngle);
        natureEl.textContent=n.text;
        natureEl.style.background=n.bg;
        natureEl.style.color=n.color;
        drawProto(protoAngle);
    }

    slider.addEventListener('input',function(){ updateProto(this.value); });

    function angleFromEvent(e){
        const rect=canvas.getBoundingClientRect();
        let cx2,cy2;
        if(e.touches){ cx2=e.touches[0].clientX; cy2=e.touches[0].clientY; }
        else { cx2=e.clientX; cy2=e.clientY; }
        const sx=cssW/rect.width, sy=cssH/rect.height;
        const dx=(cx2-rect.left)*sx-_protoCx;
        const dy=(cy2-rect.top)*sy-_protoBaseY;
        if(dy>12) return null; // sous la ligne de base
        let a=Math.atan2(-dy,dx)*180/Math.PI;
        if(a<0) a+=360;
        if(a>180) return null;
        return Math.round(a);
    }

    canvas.addEventListener('mousedown',e=>{ protoDragging=true; const a=angleFromEvent(e); if(a!==null) updateProto(a); });
    canvas.addEventListener('mousemove',e=>{ if(!protoDragging)return; const a=angleFromEvent(e); if(a!==null) updateProto(a); });
    document.addEventListener('mouseup',()=>{ protoDragging=false; });
    canvas.addEventListener('touchstart',e=>{ e.preventDefault(); protoDragging=true; const a=angleFromEvent(e); if(a!==null) updateProto(a); },{passive:false});
    canvas.addEventListener('touchmove', e=>{ e.preventDefault(); if(!protoDragging)return; const a=angleFromEvent(e); if(a!==null) updateProto(a); },{passive:false});
    canvas.addEventListener('touchend', ()=>{ protoDragging=false; });

    updateProto(protoAngle);
}

CHECKERS.rapporteur=function(q){
    const diff=Math.abs(protoAngle-q.target);
    const nat=getNature(q.target);
    if(diff<=3) return {ok:true,  msg:`Bravo ! Tu as construit un angle de <strong>${protoAngle}°</strong> — la cible était <strong>${q.target}°</strong>. C'est un angle <strong>${nat.text.toLowerCase()}</strong> !`};
    return {ok:false, msg:`Ton angle mesure <strong>${protoAngle}°</strong> mais la cible était <strong>${q.target}°</strong> (écart : ${diff}°). Le point vert sur le rapporteur indique la graduation à atteindre.`};
};

/* ============================================================
   NIVEAU 3 : NATURE D'UN ANGLE
   ============================================================ */
GENERATORS.nature=function(){
    const types=['nul','aigu','droit','obtus','plat'];
    const type=types[rnd(0,types.length-1)];
    let deg;
    switch(type){
        case 'nul':   deg=0;         break;
        case 'aigu':  deg=rnd(15,85); break;
        case 'droit': deg=90;        break;
        case 'obtus': deg=rnd(95,165);break;
        case 'plat':  deg=180;       break;
    }
    return {deg,type};
};

RENDERERS.nature=function(q,box){
    let svgHtml;
    if(q.deg===0){
        svgHtml=drawAngleNul();
    } else if(q.deg===180){
        svgHtml=drawAnglePlat();
    } else {
        svgHtml=drawAngleFigure('S','A','B',q.deg,{W:300,H:190,colorV:'#c0392b',colorS:'#1a6fa0'});
    }

    const choices=[
        {val:'nul',   label:'Nul',   color:'#64748b',       bg:'#f1f5f9'},
        {val:'aigu',  label:'Aigu',  color:'var(--blue)',   bg:'var(--blue-pale)'},
        {val:'droit', label:'Droit', color:'var(--green)',  bg:'var(--green-pale)'},
        {val:'obtus', label:'Obtus', color:'var(--purple)', bg:'var(--purple-pale)'},
        {val:'plat',  label:'Plat',  color:'var(--red)',    bg:'var(--red-pale)'},
    ];

    box.innerHTML=`
        ${hint(`<strong>Aide-mémoire :</strong><br>
        • <strong>Nul</strong> : 0° — les deux côtés se confondent<br>
        • <strong>Aigu</strong> : strictement entre 0° et 90°<br>
        • <strong>Droit</strong> : exactement 90° (petit carré dans le dessin)<br>
        • <strong>Obtus</strong> : strictement entre 90° et 180°<br>
        • <strong>Plat</strong> : exactement 180° — les côtés forment une droite`)}
        <p class="q-prompt">Quelle est la nature de cet angle ?</p>
        <div class="angle-canvas-wrap">${svgHtml}</div>
        <div class="choice-grid">
            ${choices.map(c=>`<button class="choice-btn" data-val="${c.val}"
                style="border-color:${c.color};color:${c.color}"
                onclick="selectNature(this)">${c.label}</button>`).join('')}
        </div>
    `;
};

/* Angle nul : dessin propre montrant deux côtés superposés */
function drawAngleNul(){
    const W=300,H=130;
    // Deux flèches superposées, légèrement décalées visuellement
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="width:${W}px;height:${H}px;max-width:100%;overflow:visible;">
  <!-- Fond indiquant que c'est spécial -->
  <!-- Côté A et côté B confondus (tracés en tirets l'un sur l'autre) -->
  <line x1="60" y1="70" x2="230" y2="70" stroke="#1a6fa0" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="230" y2="70" stroke="#6b3fa0" stroke-width="1.5" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- Sommet -->
  <circle cx="60" cy="70" r="5" fill="#c0392b"/>
  <!-- Bouts -->
  <circle cx="230" cy="70" r="3.5" fill="#1a6fa0"/>
  <!-- Labels -->
  <text x="45" y="92" font-family="DM Sans,sans-serif" font-size="15" fill="#c0392b" font-weight="700">S</text>
  <text x="234" y="65" font-family="DM Sans,sans-serif" font-size="15" fill="#1a6fa0" font-weight="700">A</text>
  <text x="234" y="84" font-family="DM Sans,sans-serif" font-size="15" fill="#6b3fa0" font-weight="700">B</text>
  <!-- Annotation -->
  <text x="120" y="48" font-family="DM Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">côtés confondus (0°)</text>
  <line x1="120" y1="52" x2="120" y2="65" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>
</svg>`;
}

/* Angle plat : une droite avec arc au-dessus */
function drawAnglePlat(){
    const W=300,H=140;
    const vx=60,vy=100,ex=240;
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="width:${W}px;height:${H}px;max-width:100%;overflow:visible;">
  <line x1="${vx}" y1="${vy}" x2="${ex}" y2="${vy}" stroke="#1a6fa0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arc semi-circulaire au-dessus -->
  <path d="M ${vx+50} ${vy} A 50 50 0 0 1 ${vx+50+100} ${vy}"
        stroke="var(--orange)" stroke-width="2" fill="rgba(184,92,11,0.08)"/>
  <!-- Sommet -->
  <circle cx="${vx+50}" cy="${vy}" r="5" fill="#c0392b"/>
  <!-- Bouts -->
  <circle cx="${vx}" cy="${vy}" r="3.5" fill="#1a6fa0"/>
  <circle cx="${ex}" cy="${vy}" r="3.5" fill="#1a6fa0"/>
  <!-- Labels -->
  <text x="${vx+50-6}" y="${vy+18}" font-family="DM Sans,sans-serif" font-size="15" fill="#c0392b" font-weight="700">S</text>
  <text x="${vx-14}" y="${vy+5}" font-family="DM Sans,sans-serif" font-size="15" fill="#1a6fa0" font-weight="700">A</text>
  <text x="${ex+6}" y="${vy+5}" font-family="DM Sans,sans-serif" font-size="15" fill="#1a6fa0" font-weight="700">B</text>
</svg>`;
}

function selectNature(btn){
    if(state.checked) return;
    document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('chosen'));
    btn.classList.add('chosen');
}

CHECKERS.nature=function(q){
    const chosen=document.querySelector('.choice-btn.chosen');
    if(!chosen) return {ok:false, msg:'Clique sur une réponse avant de vérifier !'};
    const val=chosen.dataset.val;
    const ok=val===q.type;
    document.querySelectorAll('.choice-btn').forEach(b=>{
        b.classList.remove('ok','err','chosen');
        if(b.dataset.val===q.type) b.classList.add('ok');
        else if(b.dataset.val===val&&!ok) b.classList.add('err');
    });
    const reasons={
        nul:   `0° — les deux côtés se confondent.`,
        aigu:  `${q.deg}° est strictement compris entre 0° et 90°.`,
        droit: `90° exactement — repère le petit carré dans le dessin !`,
        obtus: `${q.deg}° est strictement compris entre 90° et 180°.`,
        plat:  `180° — les deux côtés forment une droite.`,
    };
    const label=q.type.charAt(0).toUpperCase()+q.type.slice(1);
    if(ok) return {ok:true,  msg:`Exact ! Cet angle est <strong>${label}</strong> : ${reasons[q.type]}`};
    return {ok:false, msg:`Pas tout à fait. Cet angle est <strong>${label}</strong> : ${reasons[q.type]}`};
};

/* ============================================================
   TOUCHE ENTRÉE
   ============================================================ */
document.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    if(document.activeElement&&document.activeElement.tagName==='TEXTAREA') return;
    const nxt=document.getElementById('btnNext');
    const chk=document.getElementById('btnCheck');
    if(nxt.style.display!=='none'){ nxt.click(); return; }
    if(chk.style.display!=='none'&&!state.checked) chk.click();
});
