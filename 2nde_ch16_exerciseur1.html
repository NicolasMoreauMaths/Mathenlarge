<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entraîneur de démonstrations · Seconde</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" onload="if(window.__rerenderMath) window.__rerenderMath();"></script>
<style>
:root{
  --bg:#f4f1eb;--card:#fff;--text:#2b2724;--mid:#5c5652;--light:#8a8380;
  --blue:#1a6fa0;--blue-l:#e8f2fa;
  --green:#1b7a40;--green-l:#e6f5ec;
  --purple:#6b3fa0;--purple-l:#f1ecf8;
  --orange:#b85c0b;--orange-l:#fef2e8;
  --red:#c0392b;--red-l:#fceae8;
  --gold:#b8860b;--gold-l:#fef8e8;
  --border:#e0dbd4;
  --shadow:0 3px 14px rgba(0,0,0,.06);
  --shadow-lg:0 10px 30px rgba(20,15,10,.12);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;
  background-image:radial-gradient(circle at 15% 8%, rgba(26,111,160,.05), transparent 40%),
                    radial-gradient(circle at 85% 92%, rgba(107,63,160,.05), transparent 40%);
}
.font-display{font-family:'Playfair Display',serif;}
#app{max-width:780px;margin:0 auto;padding:1.6rem 1.1rem 5rem;}
.katex{font-size:1.02em;}
.katex-display{margin:.5em 0 !important;}

/* entrée douce */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeInUp .45s cubic-bezier(.22,1,.36,1) both;}

/* confettis */
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(420deg);opacity:0;}}

/* ══════ HERO ══════ */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f1b2d,#1a2940 45%,#1e3a5f);border-radius:20px;padding:2.6rem 1.8rem 2.2rem;margin-bottom:2.2rem;text-align:center;color:#fff;box-shadow:var(--shadow-lg);}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 15% 20%, rgba(26,111,160,.35), transparent 45%),
  radial-gradient(circle at 85% 15%, rgba(107,63,160,.3), transparent 45%),
  radial-gradient(circle at 50% 100%, rgba(27,122,64,.25), transparent 50%);
  pointer-events:none;}
.hero-inner{position:relative;z-index:1;}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:rgba(255,255,255,.5);}
.hero h1{font-size:clamp(1.6rem,4.4vw,2.3rem);font-weight:800;margin-top:.6rem;letter-spacing:-.01em;}
.hero p{font-size:.92rem;color:rgba(255,255,255,.62);margin-top:.6rem;max-width:430px;margin-left:auto;margin-right:auto;}
.hero-stats{display:flex;justify-content:center;align-items:center;gap:1.6rem;margin-top:1.5rem;flex-wrap:wrap;}
.hero-stat .num{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:800;line-height:1;}
.hero-stat .lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);margin-top:.15rem;}
.hero-divider{width:1px;height:30px;background:rgba(255,255,255,.15);}
.hero-bar-wrap{max-width:340px;margin:1.3rem auto 0;}
.hero-bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;}
.hero-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4fa3d1,#4fbf7f);transition:width .6s cubic-bezier(.22,1,.36,1);}
.hero-bar-label{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:.4rem;letter-spacing:.03em;}

/* ══════ PALIERS ══════ */
.palier{margin-bottom:2.2rem;}
.palier-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;flex-wrap:wrap;}
.palier-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 4px currentColor22;}
.palier-head h2{font-size:1.08rem;font-weight:700;flex:1;}
.palier-mini{display:flex;align-items:center;gap:.5rem;}
.palier-mini-track{width:70px;height:5px;border-radius:99px;background:var(--border);overflow:hidden;}
.palier-mini-fill{height:100%;border-radius:99px;transition:width .5s;}
.palier-mini-count{font-size:.72rem;font-weight:700;color:var(--mid);}

/* ══════ CARDS GRID ══════ */
.grid{display:grid;grid-template-columns:1fr;gap:.75rem;}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.demo-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s, border-color .2s;font-family:inherit;position:relative;}
.demo-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.demo-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem;gap:.4rem;}
.num-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:.85rem;flex-shrink:0;}
.demo-card-title{font-weight:600;font-size:.88rem;}

/* ══════ STATUS BADGE ══════ */
.status-badge{font-size:.66rem;font-weight:700;padding:.22rem .55rem;border-radius:50px;white-space:nowrap;display:inline-flex;align-items:center;gap:.3rem;}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ══════ BUTTONS ══════ */
.btn{display:inline-flex;align-items:center;gap:.45rem;font-family:inherit;font-size:.85rem;font-weight:700;padding:.62rem 1.1rem;border-radius:10px;border:none;cursor:pointer;transition:transform .15s, box-shadow .15s, opacity .15s;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.14);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--mid);box-shadow:none;}
.btn-back{background:none;border:none;color:var(--mid);font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;margin-bottom:1.1rem;font-family:inherit;transition:color .15s;}
.btn-back:hover{color:var(--text);}

/* ══════ DEMO DETAIL ══════ */
.demo-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1.4rem;box-shadow:var(--shadow);}
.demo-box-head{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;margin-bottom:.6rem;}
.demo-box-head h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;}
.demo-box .statement{font-size:.92rem;color:var(--mid);margin-bottom:.6rem;}
.demo-box .method{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;}

/* ══════ MODE MENU ══════ */
.mode-grid{display:grid;grid-template-columns:1fr;gap:.75rem;margin-bottom:1.4rem;}
@media(min-width:520px){.mode-grid{grid-template-columns:1fr 1fr;}}
.mode-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;display:flex;gap:.75rem;align-items:flex-start;text-align:left;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s;}
.mode-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.mode-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.mode-card-title{font-weight:700;font-size:.9rem;}
.mode-card-desc{font-size:.77rem;color:var(--mid);margin-top:.15rem;}

/* ══════ STATUS BOX ══════ */
.status-box{background:linear-gradient(135deg,#faf8f3,#f4f1eb);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;}
.status-box .lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--mid);margin-bottom:.7rem;}
.status-actions{display:flex;gap:.6rem;flex-wrap:wrap;}

/* ══════ MODE CONTENT ══════ */
.mode-content{background:linear-gradient(180deg,#f8f6f1,var(--bg));border-radius:18px;padding:1.3rem;}
.mode-intro{font-size:.86rem;color:var(--mid);margin-bottom:1.1rem;}
.step-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem .95rem;margin-bottom:.45rem;}
.step-card .t{font-weight:700;font-size:.86rem;margin-bottom:.15rem;}
.step-card .x{font-size:.86rem;color:var(--mid);}

/* ══════ RECONSTITUTION ══════ */
.recon-zone{background:var(--gold-l);border:1.5px dashed #eadfb8;border-radius:var(--r);padding:1.1rem;margin-bottom:1.1rem;min-height:76px;}
.recon-zone-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);margin-bottom:.7rem;}
.recon-placed{display:flex;gap:.65rem;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.65rem .85rem;margin-bottom:.45rem;cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:background .2s, border-color .2s;}
.recon-placed.ok{background:var(--green-l);border-color:var(--green);}
.recon-placed.ko{background:var(--red-l);border-color:var(--red);}
.recon-num{font-weight:800;font-size:.86rem;color:var(--gold);flex-shrink:0;}
.recon-pool-item{width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;font-size:.86rem;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:.45rem;transition:transform .15s, box-shadow .15s;}
.recon-pool-item:hover{transform:translateX(3px);box-shadow:var(--shadow);}
.recon-controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.6rem;}
.recon-result{font-size:.86rem;font-weight:700;}

/* ══════ TROUS / QUIZ ══════ */
.quiz-box{background:var(--gold-l);border:1.5px solid #eadfb8;border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:.95rem;}
.quiz-q{font-weight:700;font-size:.86rem;margin-bottom:.65rem;}
.quiz-opt{width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.6rem .85rem;font-size:.85rem;font-family:inherit;cursor:pointer;margin-bottom:.45rem;display:flex;justify-content:space-between;align-items:center;transition:background .2s,border-color .2s,transform .15s;}
.quiz-opt:hover:not(:disabled){transform:translateX(3px);}
.quiz-opt.ok{background:var(--green-l);border-color:var(--green);}
.quiz-opt.ko{background:var(--red-l);border-color:var(--red);}
.quiz-opt:disabled{cursor:default;}

/* ══════ SQUELETTE ══════ */
.skel-box{background:var(--gold-l);border:1.5px solid #eadfb8;border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1.1rem;}
.skel-box .lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem;}
.skel-item{font-weight:700;font-size:.9rem;margin-bottom:.5rem;display:flex;gap:.5rem;}
.skel-item .n{color:var(--gold);flex-shrink:0;}

/* ══════ CACHE ══════ */
.cache-box{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.3rem;box-shadow:var(--shadow);}
.cache-step-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.cache-title{font-weight:700;font-size:.92rem;margin-bottom:.6rem;}
.cache-text{font-size:.86rem;color:var(--mid);margin-bottom:1rem;}
.cache-rate{display:flex;gap:.6rem;flex-wrap:wrap;}
.cache-result{background:linear-gradient(135deg,var(--gold-l),#fff);border:1.5px solid #eadfb8;border-radius:var(--r);padding:1.5rem;text-align:center;}
.cache-result .trophy{font-size:2.1rem;}
.cache-result .score{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800;margin:.5rem 0;}

.reset-link{display:block;text-align:center;margin-top:2.2rem;font-size:.75rem;color:var(--light);text-decoration:underline;background:none;border:none;cursor:pointer;font-family:inherit;}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(26,111,160,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(26,111,160,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .hero { padding:16px 8px; }
  .hero-inner { gap:8px; }
  h1, .font-display { font-size:1.1rem; }
  .eyebrow { font-size:0.7rem; }
  .grid { gap:8px; }
  .mode-card, .demo-card { padding:10px; }
  .mode-card-title, .demo-card-title { font-size:0.9rem; }
  .demo-box { padding:10px; }
  .demo-box-head { font-size:0.85rem; }
  .cache-box { padding:8px; }
  .cache-title { font-size:0.9rem; }
  .btn, .btn-ghost, .btn-back { font-size:0.82rem; padding:8px 12px; }
  .method { padding:10px; }
  .lbl { font-size:0.8rem; }
  .answers { gap:6px; }
  .hero-bar-label { font-size:0.7rem; }
  .hero-stats { gap:6px; flex-wrap:wrap; }
}
/* ── KaTeX overflow ── */
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══════════════════════ DONNÉES ═══════════════════════ */
const THEME = {
  blue:   { main:'#1a6fa0', light:'#e8f2fa', label:'1 · Nombres, calculs, algèbre' },
  green:  { main:'#1b7a40', light:'#e6f5ec', label:'2 · Fonctions' },
  purple: { main:'#6b3fa0', light:'#f1ecf8', label:'3 · Géométrie' },
};

const DEMOS = [
  { id:'multiples', num:1, theme:'blue',
    title:"Somme de deux multiples de a",
    statement:"Si \\(m\\) et \\(n\\) sont deux multiples d'un même entier \\(a\\), alors \\(m+n\\) est aussi un multiple de \\(a\\).",
    method:"Démonstration directe",
    steps:[
      {t:"On traduit les hypothèses", x:"\\(m\\) multiple de \\(a\\) : il existe un entier \\(k\\) tel que \\(m=ka\\). \\(n\\) multiple de \\(a\\) : il existe un entier \\(k'\\) tel que \\(n=k'a\\)."},
      {t:"On calcule m+n", x:"\\[m+n=ka+k'a=(k+k')a.\\]"},
      {t:"On conclut", x:"\\(k+k'\\) est un entier, donc \\(m+n\\) s'écrit « entier \\(\\times a\\) » : c'est un multiple de \\(a\\)."},
    ],
    skeleton:["\\(m=ka,\\ n=k'a\\)","\\(m+n=(k+k')a\\)","entier \\(\\Rightarrow\\) multiple"],
    quiz:[
      {q:"Pourquoi utilise-t-on deux lettres différentes \\(k\\) et \\(k'\\) ?", options:["Rien n'indique que \\(m\\) et \\(n\\) ont le même quotient par \\(a\\)","Pour respecter l'ordre alphabétique","Parce que \\(m\\) et \\(n\\) sont toujours égaux"], correct:0},
      {q:"Que montre le calcul de l'étape 2 ?", options:["Que \\(m+n\\) s'écrit comme un produit entier \\(\\times a\\)","Que \\(m=n\\)","Que \\(a\\) est pair"], correct:0},
    ]},
  { id:'carre-impair', num:2, theme:'blue',
    title:"Le carré d'un nombre impair est impair",
    statement:"Si \\(n\\) est un entier impair, alors \\(n^2\\) est impair.",
    method:"Démonstration directe",
    steps:[
      {t:"On traduit « n impair »", x:"\\(n\\) impair : il existe un entier \\(k\\) tel que \\(n=2k+1\\)."},
      {t:"On calcule n²", x:"\\[n^2=(2k+1)^2=4k^2+4k+1.\\]"},
      {t:"On fait apparaître 2×entier+1", x:"\\[n^2=2(2k^2+2k)+1,\\] avec \\(2k^2+2k\\) entier."},
    ],
    skeleton:["\\(n=2k+1\\)","\\(n^2=4k^2+4k+1\\)","\\(n^2=2(2k^2+2k)+1\\) impair"],
    quiz:[
      {q:"Pourquoi ne peut-on pas se contenter de vérifier \\(3^2\\) et \\(5^2\\) ?", options:["Un exemple ne prouve jamais une propriété générale","3 et 5 ne sont pas impairs","Il faut toujours au moins 10 exemples"], correct:0},
      {q:"Dans le développement de \\((2k+1)^2\\), quel terme oublie-t-on souvent ?", options:["Le double produit \\(2\\times2k\\times1=4k\\)","Le terme \\(1^2\\)","Le terme \\((2k)^2\\)"], correct:0},
    ]},
  { id:'racine2', num:3, theme:'blue',
    title:"√2 est irrationnel",
    statement:"\\(\\sqrt2\\) ne peut pas s'écrire sous la forme d'une fraction \\(\\dfrac{a}{b}\\) avec \\(a\\) et \\(b\\) entiers naturels.",
    method:"Raisonnement par l'absurde",
    steps:[
      {t:"On suppose le contraire", x:"On suppose \\(\\sqrt2=\\dfrac{a}{b}\\), fraction irréductible (\\(a\\) et \\(b\\) sans diviseur commun autre que 1)."},
      {t:"On élève au carré", x:"\\[2=\\frac{a^2}{b^2} \\Longrightarrow a^2=2b^2.\\]"},
      {t:"a est pair", x:"\\(a^2\\) est pair. Si \\(a\\) était impair, \\(a^2\\) serait impair (démo 2) : contradiction. Donc \\(a\\) est pair, \\(a=2k\\)."},
      {t:"b est pair", x:"\\[(2k)^2=2b^2 \\Longrightarrow b^2=2k^2.\\] Donc \\(b\\) est pair aussi."},
      {t:"Contradiction", x:"\\(a\\) et \\(b\\) sont tous deux pairs : cela contredit l'irréductibilité de \\(\\dfrac{a}{b}\\)."},
    ],
    skeleton:["absurde : \\(\\sqrt2=\\frac{a}{b}\\) irréductible","\\(a^2=2b^2\\)","\\(a\\) pair","\\(b\\) pair","contradiction"],
    quiz:[
      {q:"Que suppose-t-on au départ dans un raisonnement par l'absurde ?", options:["Le contraire de ce qu'on veut démontrer","Exactement ce qu'on veut démontrer","Rien du tout"], correct:0},
      {q:"Pourquoi la fraction doit-elle être irréductible dès le départ ?", options:["Sans cette hypothèse, il n'y a pas de contradiction possible à la fin","Pour que le calcul soit plus rapide","Ce n'est pas nécessaire"], correct:0},
    ]},
  { id:'tiers-decimal', num:4, theme:'blue',
    title:"1/3 n'est pas décimal",
    statement:"Le nombre \\(\\dfrac13\\) n'est pas un nombre décimal.",
    method:"Raisonnement par l'absurde",
    steps:[
      {t:"On suppose le contraire", x:"On suppose \\(\\dfrac13=\\dfrac{k}{10^n}\\), avec \\(k\\) entier relatif et \\(n\\) entier naturel."},
      {t:"On élimine les dénominateurs", x:"\\[10^n=3k.\\] Donc \\(10^n\\) est un multiple de 3."},
      {t:"Critère de divisibilité par 3", x:"\\(10^n\\) s'écrit « 1 suivi de \\(n\\) zéros » : somme des chiffres = 1, non divisible par 3."},
      {t:"Contradiction", x:"\\(10^n\\) n'est pas divisible par 3, ce qui contredit l'étape 2."},
    ],
    skeleton:["absurde : \\(\\frac13=\\frac{k}{10^n}\\)","\\(10^n=3k\\)","somme des chiffres de \\(10^n\\) = 1","contradiction"],
    quiz:[
      {q:"\\(\\dfrac13\\) est-il un nombre rationnel ?", options:["Oui, c'est un quotient de deux entiers","Non, jamais","Seulement si \\(n=0\\)"], correct:0},
      {q:"Quel critère (connu depuis le collège) permet de conclure ?", options:["Un nombre est divisible par 3 ssi la somme de ses chiffres l'est","Un nombre est divisible par 3 ssi il est pair","Il n'existe aucun critère"], correct:0},
    ]},
  { id:'racine-produit', num:5, theme:'blue',
    title:"√(ab) = √a × √b",
    statement:"Pour tous réels positifs \\(a\\) et \\(b\\) : \\(\\sqrt{ab}=\\sqrt a\\times\\sqrt b\\).",
    method:"Raisonnement par unicité",
    steps:[
      {t:"√a×√b est positif", x:"\\(a\\geq0\\), \\(b\\geq0\\) \\(\\Rightarrow\\) \\(\\sqrt a\\geq0\\) et \\(\\sqrt b\\geq0\\) \\(\\Rightarrow\\) leur produit est \\(\\geq0\\)."},
      {t:"Son carré vaut ab", x:"\\[(\\sqrt a\\times\\sqrt b)^2=(\\sqrt a)^2\\times(\\sqrt b)^2=ab.\\]"},
      {t:"On conclut", x:"\\(\\sqrt a\\times\\sqrt b\\) est positif et son carré vaut \\(ab\\). Or \\(\\sqrt{ab}\\) est le seul nombre positif dont le carré vaut \\(ab\\). Donc ils sont égaux."},
    ],
    skeleton:["\\(\\sqrt a\\times\\sqrt b\\geq0\\)","\\((\\sqrt a\\times\\sqrt b)^2=ab\\)","\\(\\sqrt{ab}\\) = seul nombre positif de carré \\(ab\\)"],
    quiz:[

];

  nouveau:  {label:'Pas encore tenté', color:'#8a8380', bg:'#eeece7'},

/* ═══════════════════════ ÉTAT ═══════════════════════ */
let progress = JSON.parse(localStorage.getItem('demo-progress') || '{}');
let state = { view:'home', demoId:null, mode:null };
let modeState = {};

function saveProgress(){ localStorage.setItem('demo-progress', JSON.stringify(progress)); }
function getDemo(id){ return DEMOS.find(d => d.id === id); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(a.length>1 && a.every((v,i)=>v===i)) return shuffle(arr);
  return a;
}

/* ═══════════════════════ CONFETTIS ═══════════════════════ */
function celebrate(){
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(layer);
  const emojis = ['🎉','✨','⭐','🏆','💫'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const left = Math.random()*100;
    const size = 14+Math.random()*16;
    const dur = 1.6+Math.random()*1.3;
    const delay = Math.random()*.35;
    s.style.cssText = `position:absolute;left:${left}%;top:-40px;font-size:${size}px;animation:confettiFall ${dur}s ease-in forwards;animation-delay:${delay}s;`;
    layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(), 3200);
}

/* ═══════════════════════ NAVIGATION ═══════════════════════ */
function openDemo(id){ state.view='demo'; state.demoId=id; state.mode=null; render(); }
function goHome(){ state.view='home'; state.demoId=null; state.mode=null; render(); }
function backToModes(){ state.mode=null; render(); }
function openMode(modeId){
  state.mode = modeId;
  const demo = getDemo(state.demoId);
  if(modeId==='reconstitution') modeState = { pool: shuffle(demo.steps.map((_,i)=>i)), built: [], checked:false };
  if(modeId==='trous') modeState = { answers:{} };
  if(modeId==='squelette') modeState = { revealed:false };
  if(modeId==='cache') modeState = { idx:0, revealed:false, ratings:[] };
  render();
}
function setStatus(id, status){
  const wasMastered = progress[id]==='maitrisee';
  progress[id]=status;
  saveProgress();
  render();
  if(status==='maitrisee' && !wasMastered) celebrate();
}
function resetAll(){
  if(confirm('Réinitialiser toute ta progression ? Cette action est irréversible.')){
    progress = {}; saveProgress(); render();
  }
}

/* ═══════════════════════ RENDU : ACCUEIL ═══════════════════════ */
function renderHome(){
  const total = DEMOS.length;
  const mastered = DEMOS.filter(d => progress[d.id]==='maitrisee').length;
  const toReview = DEMOS.filter(d => progress[d.id]==='a_revoir').length;
  const pct = Math.round((mastered/total)*100);

  let html = `
    <div class="hero fade-in">
      <div class="hero-inner">
        <span class="eyebrow">Mathématiques · Seconde · 2026-2027</span>
        <h1 class="font-display">Entraîneur de démonstrations</h1>
        <p>11 démonstrations, 4 façons de s'entraîner. Choisis une démo pour commencer.</p>
        <div class="hero-stats">
          <div class="hero-stat"><div class="num font-display">${mastered}/${total}</div><div class="lbl">maîtrisées</div></div>
          <div class="hero-divider"></div>
          <div class="hero-stat"><div class="num font-display" style="color:#f9c97c">${toReview}</div><div class="lbl">à revoir</div></div>
        </div>
        <div class="hero-bar-wrap">
          <div class="hero-bar-track"><div class="hero-bar-fill" style="width:${pct}%"></div></div>
          <div class="hero-bar-label">${pct}% du programme maîtrisé</div>
        </div>
      </div>
    </div>`;

  PALIERS.forEach((themeKey, pIdx) => {
    const t = THEME[themeKey];
    const items = DEMOS.filter(d => d.theme === themeKey);
    const masteredInPalier = items.filter(d => progress[d.id]==='maitrisee').length;
    const palierPct = Math.round((masteredInPalier/items.length)*100);
    html += `<div class="palier fade-in" style="animation-delay:${.08+pIdx*.06}s">
      <div class="palier-head">
        <span class="palier-dot" style="background:${t.main}"></span>
        <h2 class="font-display" style="color:${t.main}">${t.label}</h2>
        <div class="palier-mini">
          <div class="palier-mini-track"><div class="palier-mini-fill" style="width:${palierPct}%;background:${t.main}"></div></div>
          <span class="palier-mini-count">${masteredInPalier}/${items.length}</span>
        </div>
      </div>
      <div class="grid">`;
    items.forEach((d, i) => {
      const st = STATUS[progress[d.id] || 'nouveau'];
      html += `
        <button class="demo-card fade-in" style="animation-delay:${.1+pIdx*.06+i*.04}s" onclick="openDemo('${d.id}')">
          <div class="demo-card-top">
            <span class="num-badge" style="background:${t.light};color:${t.main}">${d.num}</span>
            <span class="status-badge" style="color:${st.color};background:${st.bg}"><span class="status-dot"></span>${st.label}</span>
          </div>
          <div class="demo-card-title">${d.title}</div>
        </button>`;
    });
    html += `</div></div>`;
  });

  html += `<button class="reset-link" onclick="resetAll()">Réinitialiser toute ma progression</button>`;
  return html;
}

/* ═══════════════════════ RENDU : ÉCRAN DÉMO ═══════════════════════ */
function renderDemoScreen(){
  const demo = getDemo(state.demoId);
  const t = THEME[demo.theme];
  const st = STATUS[progress[demo.id] || 'nouveau'];

  let html = `<button class="btn-back fade-in" onclick="${state.mode ? 'backToModes()' : 'goHome()'}">← ${state.mode ? 'Retour aux modes' : "Retour à l'accueil"}</button>`;

  html += `
    <div class="demo-box fade-in" style="border-left:5px solid ${t.main}">
      <div class="demo-box-head">
        <span class="num-badge" style="background:${t.light};color:${t.main}">${demo.num}</span>
        <h2 class="font-display">${demo.title}</h2>
        <span class="status-badge" style="color:${st.color};background:${st.bg}"><span class="status-dot"></span>${st.label}</span>
      </div>
      <p class="statement">${demo.statement}</p>
      <div class="method" style="color:${t.main}">🧭 ${demo.method}</div>
    </div>`;

  if(!state.mode){
    html += `<div class="mode-grid">`;
    MODES.forEach((m, i) => {
      html += `
        <button class="mode-card fade-in" style="animation-delay:${.05+i*.05}s" onclick="openMode('${m.id}')">
          <div class="mode-icon" style="background:${t.light}">${m.icon}</div>
          <div>
            <div class="mode-card-title">${m.label}</div>
            <div class="mode-card-desc">${m.desc}</div>
          </div>
        </button>`;
    });
    html += `</div>`;

    html += `
      <div class="status-box fade-in" style="animation-delay:.28s">
        <div class="lbl">Marquer cette démonstration</div>
        <div class="status-actions">
          <button class="btn" style="background:${progress[demo.id]==='maitrisee' ? '#1b7a40' : '#e6f5ec'};color:${progress[demo.id]==='maitrisee' ? '#fff' : '#1b7a40'}" onclick="setStatus('${demo.id}','maitrisee')">✓ Maîtrisée</button>
          <button class="btn" style="background:${progress[demo.id]==='a_revoir' ? '#b85c0b' : '#fef2e8'};color:${progress[demo.id]==='a_revoir' ? '#fff' : '#b85c0b'}" onclick="setStatus('${demo.id}','a_revoir')">↻ À revoir</button>
        </div>
      </div>`;
  } else {
    html += `<div class="mode-content fade-in">`;
    if(state.mode==='reconstitution') html += renderReconstitution(demo);
    if(state.mode==='trous') html += renderTrous(demo);

    if(state.mode==='cache') html += renderCache(demo);
    html += `</div>`;
  }
  return html;
}

/* ═══════════════════════ MODE : RECONSTITUTION ═══════════════════════ */
function renderReconstitution(demo){
  const { pool, built, checked } = modeState;
  let html = `<p class="mode-intro">Clique sur les étapes ci-dessous, dans l'ordre où tu penses qu'elles s'enchaînent logiquement.</p>`;

  html += `<div class="recon-zone"><div class="recon-zone-label">Ta reconstitution</div>`;
  if(built.length===0){
    html += `<div style="font-size:.85rem;font-style:italic;color:#8a8380;">(clique une étape en bas pour commencer)</div>`;
  }
  built.forEach((stepIdx, pos) => {
    const ok = stepIdx === pos;
    const cls = checked ? (ok ? 'ok' : 'ko') : '';
    html += `
      <button class="recon-placed ${cls}" onclick="${checked ? '' : `undoReconStep(${pos})`}">
        <span class="recon-num">${pos+1}.</span>
        <span>
          <div style="font-weight:700;font-size:.86rem;">${demo.steps[stepIdx].t}</div>
          <div style="font-size:.84rem;color:#5c5652;margin-top:.15rem;">${demo.steps[stepIdx].x}</div>
        </span>
        ${checked ? `<span style="margin-left:auto;font-weight:800;color:${ok ? '#1b7a40' : '#c0392b'}">${ok ? '✓' : '✗'}</span>` : ''}
      </button>`;
  });
  html += `</div>`;

  if(pool.length > 0){
    pool.forEach(i => {
      html += `<button class="recon-pool-item" onclick="pickReconStep(${i})">${demo.steps[i].t}</button>`;
    });
  }

  const allOk = checked && built.every((v,i) => v===i);
  html += `<div class="recon-controls">
    <button class="btn" style="background:${THEME[demo.theme].main};color:#fff" onclick="checkRecon()" ${(pool.length>0 || checked) ? 'disabled' : ''}>Vérifier</button>
    <button class="btn btn-ghost" onclick="resetRecon()">🔀 Remélanger</button>
    ${checked ? `<span class="recon-result" style="color:${allOk ? '#1b7a40' : '#c0392b'}">${allOk ? '✓ Ordre correct !' : "Certaines étapes ne sont pas à la bonne place."}</span>` : ''}
  </div>`;
  return html;
}
function pickReconStep(i){
  modeState.built.push(i);
  modeState.pool = modeState.pool.filter(x => x!==i);
  render();
}
function undoReconStep(pos){
  const val = modeState.built[pos];
  modeState.built = modeState.built.filter((_,k) => k!==pos);
  modeState.pool.push(val);
  render();
}
function checkRecon(){ modeState.checked = true; render(); }
function resetRecon(){
  const demo = getDemo(state.demoId);
  modeState = { pool: shuffle(demo.steps.map((_,i)=>i)), built: [], checked:false };
  render();
}

/* ═══════════════════════ MODE : TROUS À COMBLER ═══════════════════════ */
function renderTrous(demo){
  let html = `<p class="mode-intro">Relis la démonstration complète, puis complète le raisonnement sur les points clés.</p>`;
  html += `<div class="demo-box" style="margin-bottom:1.2rem;">`;
  demo.steps.forEach(s => { html += `<div class="step-card" style="border:none;padding:.5rem 0;"><div class="t">${s.t}</div><div class="x">${s.x}</div></div>`; });
  html += `</div>`;

  demo.quiz.forEach((q, qi) => {
    const chosen = modeState.answers[qi];
    html += `<div class="quiz-box"><div class="quiz-q">❓ ${q.q}</div>`;
    q.options.forEach((opt, oi) => {
      let cls = '';
      if(chosen !== undefined){
        if(oi === q.correct) cls = 'ok';
        else if(oi === chosen) cls = 'ko';
      }
      const mark = chosen!==undefined ? (oi===q.correct ? '✓' : (oi===chosen ? '✗' : '')) : '';
      html += `<button class="quiz-opt ${cls}" ${chosen!==undefined?'disabled':''} onclick="chooseTrous(${qi},${oi})"><span>${opt}</span><span>${mark}</span></button>`;
    });
    html += `</div>`;
  });
  return html;
}
function chooseTrous(qi, oi){
  if(modeState.answers[qi] !== undefined) return;
  modeState.answers[qi] = oi;
  render();
}

/* ═══════════════════════ MODE : SQUELETTE ═══════════════════════ */
function renderSquelette(demo){
  let html = `<p class="mode-intro">Voici seulement les mots-clés de la démonstration. Essaie de la réciter en entier (à voix haute ou sur une feuille) avant de révéler le corrigé.</p>`;
  html += `<div class="skel-box"><div class="lbl">🔑 Squelette</div>`;
  demo.skeleton.forEach((k, i) => { html += `<div class="skel-item"><span class="n">${i+1}.</span> ${k}</div>`; });
  html += `</div>`;

  if(!modeState.revealed){
    html += `<button class="btn" style="background:${THEME[demo.theme].main};color:#fff" onclick="revealSquelette()">👁️ Voir le corrigé complet</button>`;
  } else {
    html += `<div class="demo-box fade-in">`;
    demo.steps.forEach(s => { html += `<div class="step-card" style="border:none;padding:.5rem 0;"><div class="t">${s.t}</div><div class="x">${s.x}</div></div>`; });
    html += `</div>`;
  }
  return html;
}
function revealSquelette(){ modeState.revealed = true; render(); }

/* ═══════════════════════ MODE : CACHE-RÉVÈLE ═══════════════════════ */
function renderCache(demo){
  const n = demo.steps.length;
  const { idx, revealed, ratings } = modeState;
  let html = `<p class="mode-intro">Essaie de deviner l'étape suivante avant de la révéler, puis évalue-toi honnêtement.</p>`;

  if(idx < n){
    html += `<div class="cache-box fade-in">
      <div class="cache-step-lbl">Étape ${idx+1} / ${n}</div>
      <div class="cache-title">${demo.steps[idx].t}</div>`;
    if(!revealed){
      html += `<button class="btn" style="background:${THEME[demo.theme].main};color:#fff" onclick="revealCache()">👁️ Révéler cette étape</button>`;
    } else {
      html += `<div class="cache-text">${demo.steps[idx].x}</div>
        <div class="cache-rate">
          <button class="btn" style="background:#e6f5ec;color:#1b7a40" onclick="rateCache(true)">✓ Je l'avais trouvée</button>
          <button class="btn" style="background:#fceae8;color:#c0392b" onclick="rateCache(false)">✗ Pas trouvée</button>
        </div>`;
    }
    html += `</div>`;
  } else {
    const score = ratings.filter(Boolean).length;
    html += `<div class="cache-result fade-in">
      <div class="trophy">🏆</div>
      <div class="score font-display">${score} / ${n} étapes trouvées seul·e</div>
      <div style="font-size:.86rem;color:#5c5652;">${score===n ? "Excellent, tu maîtrises bien cette démonstration !" : "Continue à t'entraîner sur les étapes manquées."}</div>
    </div>`;
  }
  return html;
}
function revealCache(){ modeState.revealed = true; render(); }
function rateCache(knew){
  modeState.ratings.push(knew);
  modeState.idx += 1;
  modeState.revealed = false;
  const wasLast = modeState.idx >= getDemo(state.demoId).steps.length;
  render();
  if(wasLast){
    const n2 = getDemo(state.demoId).steps.length;
    const score = modeState.ratings.filter(Boolean).length;
    if(score === n2) celebrate();
  }
}

/* ═══════════════════════ RENDU PRINCIPAL + KATEX ═══════════════════════ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = state.view==='home' ? renderHome() : renderDemoScreen();
  if(window.renderMathInElement){
    renderMathInElement(app, {
      delimiters: [
        {left:'\\(', right:'\\)', display:false},
        {left:'\\[', right:'\\]', display:true}
      ],
      throwOnError:false
    });
  }
}
window.__rerenderMath = render;
render();
</script>
