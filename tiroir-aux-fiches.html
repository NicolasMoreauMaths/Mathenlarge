<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Tiroir aux Fiches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--bg2:#151820;--bg3:#1c2029;--brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);--txt:#e4e4e7;--txt2:#8a8f9d;--txt3:#555a66;--acc:#2dd4a8;--acc2:rgba(45,212,168,.1);--cc:#6b7280;--cpc:#3b82f6;--cr:#a855f7;--csr:#ec4899;--cur:#f43f5e;--cl:#f59e0b;--bgc:linear-gradient(135deg,#374151,#4b5563);--bgpc:linear-gradient(135deg,#1e3a5f,#2563eb);--bgr:linear-gradient(135deg,#4c1d95,#7c3aed);--bgsr:linear-gradient(135deg,#831843,#ec4899);--bgur:linear-gradient(135deg,#7f1d1d,#ef4444);--bgl:linear-gradient(135deg,#78350f,#f59e0b);--fd:"Fraunces",Georgia,serif;--fb:"DM Sans",-apple-system,sans-serif;--rad:10px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fb);background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;overflow-x:hidden}h1,h2,h3,h4{font-family:var(--fd)}button{font-family:var(--fb);cursor:pointer}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--brd);margin-bottom:10px}
.brand-icon{width:38px;height:38px;border-radius:8px;background:var(--acc2);border:1px solid rgba(45,212,168,.25);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.brand-name{font-family:var(--fd);font-size:1rem;font-weight:700;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.ni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:6px;background:none;border:none;color:var(--txt2);font-size:.9rem;font-weight:500;text-align:left;transition:all .12s;position:relative}
.ni svg{flex-shrink:0;opacity:.65;width:20px;height:20px}.ni:hover{background:rgba(255,255,255,.04);color:var(--txt)}.ni.active{background:var(--acc2);color:var(--acc)}.ni.active svg{opacity:1}
.nbdg{position:absolute;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--cur);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.content{flex:1;min-width:0;padding:20px 36px 60px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:16px}
.bal{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--brd);padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:600}
.coin{width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:inline-flex;align-items:center;justify-content:center;font-size:.5rem;color:#fff;font-weight:800}
.view{display:none}.view.active{display:block;animation:fu .2s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.vh{margin-bottom:18px}.vh h1{font-size:1.5rem;font-weight:700;margin-bottom:3px}.vh p{color:var(--txt2);font-size:.9rem}
/* Disc picker */
.dg{display:flex;gap:6px;margin:10px 0;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.db{background:var(--bg3);border:2px solid var(--brd);border-radius:8px;padding:8px 10px 6px;text-align:center;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:62px}
.db:hover{border-color:var(--brd2);transform:translateY(-2px)}.db.active{border-color:var(--acc);background:var(--acc2)}
.db .di{font-size:1.4rem}.db .dn{font-size:.62rem;font-weight:600;color:var(--txt2);line-height:1.2}.db.active .dn{color:var(--acc)}
.db.ult{border-color:var(--cl);background:rgba(245,158,11,.06)}.db.ult .dn{color:var(--cl)}
/* Pack zone */
.pz{text-align:center;padding:20px 0}
.pack-svg{width:180px;height:230px;margin:0 auto 20px;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}.pack-svg:hover{transform:scale(1.04) rotate(-1deg)}
.obtn{font-weight:700;font-size:1.1rem;padding:15px 44px;border-radius:var(--rad);border:none;background:var(--acc);color:#0d0f13;transition:all .12s;box-shadow:0 4px 20px rgba(45,212,168,.25)}
.obtn:hover:not(:disabled){background:#3ee8b8;transform:translateY(-1px)}.obtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.pack-info{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--brd2);border-radius:var(--rad);padding:10px 24px;margin-top:14px}
.pack-big{font-size:1.2rem;font-weight:700;color:var(--acc)}.pack-sub{font-size:.75rem;color:var(--txt2)}.pack-tmr{font-size:.72rem;color:var(--txt3)}
.pbox{max-width:400px;margin:10px auto;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:7px 12px;font-size:.7rem;color:var(--txt2);display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}
.pbox span{display:inline-flex;align-items:center;gap:3px}
.pinfo{font-size:.72rem;color:var(--txt3);margin-top:6px}
#dst{font-size:.78rem;color:var(--txt2);margin-top:6px}
.htog{background:none;border:none;color:var(--acc);font-size:.76rem;margin-top:5px;text-decoration:underline;text-underline-offset:3px}
.hpan{max-width:500px;margin:8px auto 0;text-align:left;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:10px 14px;font-size:.76rem;color:var(--txt2)}.hpan ul{margin:5px 0;padding-left:14px}.hpan li{margin-bottom:2px}
/* Carousel overlay */
.carousel{position:fixed;inset:0;z-index:95;background:rgba(8,10,15,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.carousel.on{display:flex}
.car-close{position:absolute;top:14px;right:18px;background:var(--bg3);border:1px solid var(--brd2);width:34px;height:34px;border-radius:50%;color:var(--txt);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.car-top{font-size:.9rem;color:var(--txt2);margin-bottom:14px}.car-top strong{color:var(--acc)}
.car-card{width:290px;height:430px;margin:0 auto;perspective:1200px;cursor:pointer;position:relative}
.car-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.car-card.flipped .car-inner{transform:rotateY(180deg)}
.car-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden}
.car-back{background:var(--bg3);border:2px solid var(--brd2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.car-back .cbi{font-size:2.8rem;opacity:.2}.car-back .cbh{font-size:.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em}
.car-card.gl-sr .car-back{box-shadow:0 0 22px 8px rgba(236,72,153,.4),inset 0 0 14px rgba(236,72,153,.12);border-color:rgba(236,72,153,.4)}
.car-card.gl-ur .car-back{box-shadow:0 0 28px 10px rgba(244,63,94,.5),inset 0 0 16px rgba(244,63,94,.15);border-color:rgba(244,63,94,.4)}
.car-card.gl-l .car-back{box-shadow:0 0 35px 14px rgba(245,158,11,.55),inset 0 0 20px rgba(245,158,11,.2);border-color:rgba(245,158,11,.5);animation:gp 1.2s ease-in-out infinite}
@keyframes gp{0%,100%{box-shadow:0 0 35px 14px rgba(245,158,11,.55),inset 0 0 20px rgba(245,158,11,.2)}50%{box-shadow:0 0 50px 20px rgba(245,158,11,.7),inset 0 0 28px rgba(245,158,11,.3)}}
.car-front{transform:rotateY(180deg);display:flex;flex-direction:column;border:2px solid rgba(255,255,255,.12)}
.car-front .ciz{width:100%;height:210px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.car-front .ciz img{width:100%;height:100%;object-fit:cover}
.car-front .rbp{position:absolute;top:8px;left:8px;z-index:2}
.car-front .dtag{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 6px;font-size:.6rem;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:3px}
.car-front .cbot{padding:10px 14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;background:var(--bg2)}
.car-front .cbot h3{font-size:1rem;font-weight:700;line-height:1.2;margin:0}.car-front .cbot .cd{font-size:.72rem;color:var(--txt2);margin:0;overflow:hidden;flex:1;line-height:1.4}
.car-front .csr{display:flex;margin-top:auto;border-top:1px solid var(--brd)}.car-front .cs{flex:1;text-align:center;padding:6px 2px;display:flex;align-items:center;justify-content:center;gap:4px}.car-front .cs:first-child{border-right:1px solid var(--brd)}
.csi{font-size:.7rem}.csv{font-size:.95rem;font-weight:700}.cs.atk .csi,.cs.atk .csv{color:#f43f5e}.cs.def .csi,.cs.def .csv{color:#3b82f6}
.car-front.r-c .ciz{background:var(--bgc)}.car-front.r-pc .ciz{background:var(--bgpc)}.car-front.r-r .ciz{background:var(--bgr)}.car-front.r-sr .ciz{background:var(--bgsr)}.car-front.r-ur .ciz{background:var(--bgur)}.car-front.r-l .ciz{background:var(--bgl)}
.car-front.r-l{box-shadow:0 0 24px rgba(245,158,11,.3)}.car-front.r-ur{box-shadow:0 0 18px rgba(244,63,94,.2)}
@media(prefers-reduced-motion:no-preference){.car-front.r-l .ciz::after,.car-front.r-ur .ciz::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);background-size:250% 100%;animation:sh 3s ease-in-out infinite;pointer-events:none}@keyframes sh{0%{background-position:120% 0}100%{background-position:-20% 0}}}
.car-recycle{margin-top:8px;padding:8px 20px;border-radius:var(--rad);border:none;background:rgba(244,63,94,.15);color:#f43f5e;font-weight:600;font-size:.82rem;cursor:pointer;transition:background .12s}.car-recycle:hover{background:rgba(244,63,94,.25)}
.car-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.car-arr{width:42px;height:42px;border-radius:50%;background:var(--bg3);border:1px solid var(--brd2);color:var(--txt);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}.car-arr:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}.car-arr:disabled{opacity:.2;cursor:default}
.car-dots{display:flex;gap:6px;align-items:center}
.car-dot{width:10px;height:10px;border-radius:50%;background:var(--txt3);transition:all .15s;cursor:pointer}.car-dot.cur{background:var(--acc);transform:scale(1.25)}
.car-dot.dot-sr{background:var(--csr)}.car-dot.dot-ur{background:var(--cur)}.car-dot.dot-l{background:var(--cl)}
.car-more{margin-top:14px;padding:11px 28px;border-radius:var(--rad);border:none;background:var(--acc);color:#0d0f13;font-weight:700;font-size:.92rem;cursor:pointer}.car-more:hover{background:#3ee8b8}
/* Quiz */
.quiz-box{background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--rad);padding:16px;max-width:320px;margin:12px auto 0;text-align:left}
.quiz-box h4{font-size:.85rem;margin:0 0 8px;color:var(--acc)}
.quiz-box p{font-size:.78rem;color:var(--txt2);margin:0 0 10px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:5px}
.quiz-opt{padding:8px 12px;border-radius:6px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);font-size:.78rem;text-align:left;cursor:pointer;transition:all .12s;font-family:var(--fb)}
.quiz-opt:hover{border-color:var(--acc)}
.quiz-opt.correct{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.quiz-opt.wrong{border-color:var(--cur);background:rgba(244,63,94,.1);color:var(--cur)}
/* Confetti */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}
.confetti{position:absolute;width:8px;height:8px;opacity:0;animation:confFall 1.8s ease-out forwards}
@keyframes confFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(.3)}}
/* Badges & tags */
.rb{display:inline-block;font-size:.58rem;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:3px;color:#fff;text-transform:uppercase;line-height:1.4}
.rb-c{background:var(--cc)}.rb-pc{background:var(--cpc)}.rb-r{background:var(--cr)}.rb-sr{background:var(--csr)}.rb-ur{background:var(--cur)}.rb-l{background:var(--cl);color:#000}
.dtag2{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--txt2);margin-left:3px}
.mph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.mph svg{width:100%;height:100%}
/* Collection tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s;position:relative;display:flex;flex-direction:column}.tile:hover{border-color:var(--brd2);transform:translateY(-2px)}
.tiz{width:100%;height:110px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.tiz img{width:100%;height:100%;object-fit:cover}.tiz .rbp{position:absolute;top:5px;left:5px;z-index:2}.tiz .dtag{position:absolute;bottom:5px;right:5px;z-index:2;background:rgba(0,0,0,.55);border-radius:3px;padding:1px 5px;font-size:.55rem;color:var(--txt)}
.tfv{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.4);border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;color:var(--txt3);z-index:2}.tfv.on{color:var(--cl)}
.tbd{padding:7px 9px 9px;display:flex;flex-direction:column;gap:3px;flex:1}.tbd h4{font-size:.78rem;font-weight:600;margin:0;line-height:1.2}
.tst{display:flex;gap:6px;font-size:.7rem;font-weight:600}.tst .atk{color:#f43f5e}.tst .def{color:#3b82f6}
.tac{display:flex;gap:4px;margin-top:auto;padding-top:3px}
.sb,.bb{flex:1;padding:5px 6px;border-radius:5px;border:none;font-size:.66rem;font-weight:600;cursor:pointer}
.sb{background:rgba(244,63,94,.1);color:#f43f5e}.sb:hover{background:rgba(244,63,94,.2)}
.bb{background:var(--acc2);color:var(--acc)}.bb:hover:not(:disabled){background:rgba(45,212,168,.2)}.bb:disabled{opacity:.35;cursor:default}
.bulk-btn{background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.2);padding:6px 14px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;margin-bottom:12px}.bulk-btn:hover{background:rgba(244,63,94,.2)}
.eh{grid-column:1/-1;font-size:.85rem;color:var(--txt3);text-align:center;padding:25px 0}
/* Disc progress */
.dprog{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.dp{background:var(--bg3);border:1px solid var(--brd);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.dp-icon{font-size:1rem;flex-shrink:0}.dp-info{flex:1;min-width:0}.dp-name{font-size:.7rem;font-weight:600;color:var(--txt)}.dp-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:3px;overflow:hidden}.dp-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .3s}.dp-count{font-size:.6rem;color:var(--txt3)}
/* Filters */
.fr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.fb{background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:500;cursor:pointer;transition:all .1s}.fb.active{border-color:var(--acc);color:var(--acc);background:var(--acc2)}.fb:hover:not(.active){border-color:var(--brd2);color:var(--txt)}
.pr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.cp{font-size:.68rem;padding:2px 7px;border-radius:999px;border:1px solid currentColor;font-weight:500}
.cp.r-c{color:var(--cc)}.cp.r-pc{color:var(--cpc)}.cp.r-r{color:var(--cr)}.cp.r-sr{color:var(--csr)}.cp.r-ur{color:var(--cur)}.cp.r-l{color:var(--cl)}
.pgn{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap}
.pg{background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);padding:4px 9px;border-radius:5px;font-size:.75rem;cursor:pointer}.pg:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}.pg:disabled{opacity:.3;cursor:default}.pg.cur{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.si{width:100%;max-width:300px;padding:7px 11px;border-radius:6px;border:1px solid var(--brd);background:var(--bg3);color:var(--txt);font-size:.8rem;margin-bottom:8px;font-family:var(--fb)}.si::placeholder{color:var(--txt3)}.si:focus{outline:none;border-color:var(--acc)}
.tg{display:flex;flex-wrap:wrap;gap:5px}.tp{background:var(--bg3);border:1px solid var(--brd);color:var(--txt2);font-size:.73rem;padding:5px 9px;border-radius:999px;cursor:pointer;font-family:var(--fb)}.tp:hover{border-color:var(--acc);color:var(--txt)}.tp.ow{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
/* Achievements */
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--brd);border-radius:var(--rad);margin-bottom:6px;opacity:.4;cursor:default}
.ach.rdy{opacity:1;border-color:var(--acc);cursor:pointer;background:var(--acc2)}.ach.rdy:hover{background:rgba(45,212,168,.15)}
.ach.done{opacity:.65;border-color:var(--brd2)}
.achi{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--bg3);flex-shrink:0}.ach.rdy .achi,.ach.done .achi{background:var(--acc2)}
.acht h4{margin:0 0 1px;font-size:.82rem}.acht p{margin:0;font-size:.72rem;color:var(--txt2)}
.achr{margin-left:auto;font-size:.72rem;font-weight:600;color:var(--acc);white-space:nowrap}
/* Profile */
.pcard{background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--rad);padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pav{width:50px;height:50px;border-radius:50%;background:var(--acc2);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--acc);font-family:var(--fd)}
.pinf h3{font-size:1rem;font-weight:700;margin:0 0 1px}.pinf p{font-size:.78rem;color:var(--txt2);margin:0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:14px}
.sb2{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:12px;text-align:center}.sv{display:block;font-family:var(--fd);font-size:1.4rem;font-weight:700}.sl{font-size:.7rem;color:var(--txt2)}
.vit{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:14px;margin-bottom:14px}.vit h3{font-size:.9rem;font-weight:700;margin-bottom:10px}
.vg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vs{aspect-ratio:3/4;border:2px dashed var(--brd2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:.7rem;color:var(--txt3)}.vs:hover{border-color:var(--acc)}.vs.filled{border-style:solid;padding:0;overflow:hidden}
.vs.filled .tiz{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.vs.filled .tiz img{width:100%;height:100%;object-fit:contain}
/* Disc chart in profile */
.dchart{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.dcr{display:flex;align-items:center;gap:6px;font-size:.72rem}.dcr-icon{width:20px;text-align:center}.dcr-bar{flex:1;height:12px;background:var(--bg);border-radius:3px;overflow:hidden}.dcr-fill{height:100%;background:var(--acc);border-radius:3px;min-width:2px}.dcr-n{width:24px;text-align:right;font-weight:600;color:var(--txt)}

  const mults=[[.35,.55],[.5,.72],[.7,.95],[.9,1.2],[1.15,1.5],[1.45,1.85]];
  const ri=RAR.findIndex(r=>r.id===rar);const[lo,hi]=mults[ri]||mults[0];const mult=lo+Math.random()*(hi-lo);
  const atk=Math.min(9999,Math.round(baseA*mult));const def=Math.min(9999,Math.round(baseD*mult));
  return{title:page.title,extract:page.extract||'',url:page.fullurl||`https://fr.wikipedia.org/wiki/${encodeURIComponent(page.title.replace(/ /g,'_'))}`,thumb:page.thumbnail?page.thumbnail.source:null,views,rarity:rar,disc:disc||'maths',atk,def,qscore:Math.round((atk*.45+def*.55)/100*100)/100}

let curD='maths';
async function drawPack(){
  recharge();const isU=curD==='ultimate';
  const cost=isU?ULT_COST:PCOST;const nCards=isU?1:PSZ;
  const free=!isU&&S.freePacks>0;
  if(!free&&S.ecus<cost){toast('Pas assez d\'écus.');return}
  const ob=document.querySelector('#v-paquets .obtn');if(!ob)return;ob.disabled=true;
  const dst=document.querySelector('#v-paquets #dst');if(dst)dst.textContent='Chargement…';sRip();
  try{
    var pool,drawDisc;
    if(isU){var rp=await getRandomPool();pool=rp.pool;drawDisc=rp.disc}else{pool=await getPool(curD);drawDisc=curD}
    console.log('Pool:',pool.length,drawDisc);if(!pool.length)throw new Error('Pool vide');
    S.pity=(S.pity||0)+1;const isPity=S.pity>=PITY;
    let rarities;
    if(isU){rarities=['l']}
    else{rarities=isPity?rollPack(true):rollPack(false);if(isPity)S.pity=0}
    if(free)S.freePacks--;else S.ecus-=cost;
    const batch=sample(pool,Math.min(12,pool.length));const pages=await fetchPages(batch);
    console.log('Batch:',batch.slice(0,3),'... Pages:',pages.length);
    if(!pages.length)throw new Error('Aucune page valide');
    const withViews=pages.map(function(p){return{page:p,views:estimatePopularity(p)}});
    withViews.sort((a,b)=>b.views-a.views);
    const rOrder=['l','ur','sr','r','pc','c'];const cards=[];const used=new Set();
    const slots=rarities.map((r,i)=>({r,i})).sort((a,b)=>rOrder.indexOf(a.r)-rOrder.indexOf(b.r));
    for(const slot of slots){
      let best=null;const tierIdx=rOrder.indexOf(slot.r);
      const maxIdx=Math.max(1,Math.floor(withViews.length*(tierIdx+1)/rOrder.length));
      for(let j=0;j<maxIdx&&j<withViews.length;j++){if(!used.has(j)){best=j;used.add(j);break}}
      if(best===null){for(let j=0;j<withViews.length;j++){if(!used.has(j)){best=j;used.add(j);break}}}
      const{page,views}=withViews[best];const disc=drawDisc;
      cards[slot.i]=mkCard(page,slot.r,disc,views);
    }
    S.stats.packs+=1;cards.forEach(addCard);addXP(10);dailyProgress.packsToday=(dailyProgress.packsToday||0)+1;save();checkMissions();ckAch();refreshUI();showCarousel(cards);
    if(FIREBASE_ENABLED&&fbUser)syncToCloud().catch(function(){});
    if(dst)dst.textContent='';renderPI();
  }catch(e){console.error('drawPack error:',e);if(dst)dst.textContent='Erreur : '+e.message}finally{ob.disabled=false}
}

let duelState=null; // {phase, myDeck, cpuDeck, myHand, cpuHand, round, myScore, cpuScore, mullCount, myPlayed, cpuPlayed, log}
const DUEL_COST=10,DUEL_WIN=30,DUEL_DRAW=15,DUEL_LOSE=5;

function renderDuel(){
  const v=$('v-duel');
  if(!duelState){
    // Entry screen
    const unique=new Map();S.coll.forEach(c=>{if(!unique.has(c.title))unique.set(c.title,c)});
    const hasEnough=unique.size>=5;
    v.innerHTML=`<header class="vh" style="text-align:center"><h1>⚔ Duel de Fiches</h1><p>Affrontez le CPU en 5 manches. Choisissez ATK ou DEF à chaque tour.</p></header>
      <div style="text-align:center;max-width:400px;margin:0 auto">
        <div style="background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:16px;margin-bottom:14px">
          <p style="font-size:.85rem;color:var(--txt);margin-bottom:10px">🃏 Sélectionnez 5 cartes de votre collection pour former votre main.</p>
          <p style="font-size:.78rem;color:var(--txt2)">Coût d'entrée : <strong>${DUEL_COST}É</strong> · Victoire : <strong>${DUEL_WIN}É</strong> · Égalité : <strong>${DUEL_DRAW}É</strong> · Défaite : <strong>${DUEL_LOSE}É</strong></p>
        </div>
        ${hasEnough?`<button class="duel-btn go" id="dstart">Choisir mes cartes (${DUEL_COST}É)</button>`:`<p style="font-size:.85rem;color:var(--cur)">Il faut au moins 5 fiches uniques pour jouer.</p>`}
      </div>`;
    if(hasEnough)v.querySelector('#dstart').addEventListener('click',startDuelPick);
    return;
  }
  if(duelState.phase==='pick'){duelState.phase='mulligan';renderDuel();return}
  if(duelState.phase==='mulligan')renderDuelMulligan();
  else if(duelState.phase==='battle')renderDuelBattle();
  else if(duelState.phase==='result')renderDuelResult();
}

function startDuelPick(){
  if(S.ecus<DUEL_COST){toast('Pas assez d\'écus.');return}
  const unique=new Map();S.coll.forEach(c=>{if(!unique.has(c.title))unique.set(c.title,c)});
  const all=[...unique.values()];
  if(all.length<5){toast('Il faut au moins 5 fiches uniques.');return}
  S.ecus-=DUEL_COST;save();refreshUI();
  // Random draw of 5 cards from collection
  const myHand=sample(all,5);
  // CPU deck: 5 random cards, matched to similar power level
  const avgPow=myHand.reduce((s,c)=>s+c.atk+c.def,0)/5;
  const cpuPool=all.slice().sort((a,b)=>Math.abs((a.atk+a.def)-avgPow)-Math.abs((b.atk+b.def)-avgPow));
  let cpuHand=sample(cpuPool.slice(0,Math.max(10,cpuPool.length)),5);
  // Ensure exactly 5 cards - fill with random if needed
  while(cpuHand.length<5){cpuHand.push(all[Math.floor(Math.random()*all.length)])}
  duelState={phase:'mulligan',selected:[],mullCount:0,myDeck:myHand,cpuDeck:cpuHand,myHand:[...myHand],cpuHand:[...cpuHand],round:0,myScore:0,cpuScore:0,myPlayed:null,cpuPlayed:null,log:[]};
  renderDuel();
}

  function fillPick(){

    $('dpick').innerHTML=list.map(c=>{const isSel=sel.some(s=>s.title===c.title);return`<div class="dp-card${isSel?' sel':''}" data-t="${esc(c.title)}"><div class="dp-ph" style="background:var(--bg${c.rarity})">${c.thumb?`<img class="dp-img" src="${c.thumb}">`:(DISCS[c.disc]||{i:'📐'}).i}</div><span class="rb dp-rb rb-${c.rarity}">${rT(c.rarity).s}</span><div class="dp-nm">${esc(trunc(c.title,20))}</div><div class="dp-st"><span style="color:#f43f5e">⚔${fN(c.atk)}</span><span style="color:#3b82f6">🛡${fN(c.def)}</span></div></div>`}).join('');
  }

/* ===== Pack tear animation ===== */
function tearAnimation(callback){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:97;display:flex;align-items:center;justify-content:center;background:rgba(8,10,15,.9);animation:fu .15s ease';
  const discI=curD==='ultimate'?'🌟':(DISCS[curD]||{i:'📐'}).i;
  ov.innerHTML='<div style="text-align:center"><div id="tear-pack" style="font-size:5rem;transition:transform .4s ease,opacity .3s;cursor:pointer">'+discI+'</div><p style="color:var(--txt2);font-size:.85rem;margin-top:12px">Glissez pour ouvrir !</p></div>';
  document.body.appendChild(ov);
  const pk=ov.querySelector('#tear-pack');
  let started=false;
  function doTear(){if(started)return;started=true;pk.style.transform='scale(1.3) rotate(10deg)';pk.style.opacity='0';sRip();
    /* particles */
    for(let i=0;i<20;i++){const p=document.createElement('div');p.style.cssText='position:absolute;width:6px;height:6px;border-radius:50%;background:var(--acc);pointer-events:none;';p.style.left=50+Math.random()*10-5+'%';p.style.top='50%';p.style.transition='all '+(0.4+Math.random()*0.4)+'s ease-out';ov.appendChild(p);requestAnimationFrame(function(){p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.opacity='0'})}
    setTimeout(function(){ov.remove();callback()},500)}
  pk.addEventListener('click',doTear);
  let sx=0;pk.addEventListener('mousedown',function(e){sx=e.clientX});
  pk.addEventListener('mouseup',function(e){if(Math.abs(e.clientX-sx)>40)doTear()});
  pk.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  pk.addEventListener('touchend',function(e){if(e.changedTouches&&Math.abs(e.changedTouches[0].clientX-sx)>40)doTear()});
  /* Auto-close after 5s if no interaction */
  setTimeout(function(){if(!started)doTear()},5000);
}

    if(!classCode||classCode.length<3){document.getElementById('fb-err').textContent='Code classe trop court.';return}
    try{
      document.getElementById('fb-err').textContent='Connexion...';
      /* Anonymous auth */
      let cred;
      const savedUid=localStorage.getItem('tiroir-fb-uid');
      if(savedUid){try{cred=await fbAuth.signInAnonymously()}catch(e){cred=await fbAuth.signInAnonymously()}}
      else{cred=await fbAuth.signInAnonymously()}
      fbUser=cred.user;
      localStorage.setItem('tiroir-fb-uid',fbUser.uid);
      fbClass=classCode;
      localStorage.setItem('tiroir-fb-class',classCode);
      S.pseudo=pseudo;save();
      /* Save player profile to Firestore */
      await syncToCloud();
      modal.classList.remove('open');
      toast('🌐 Connecté ! Votre tag : '+pseudo+pTag(fbUser.uid));
      refreshUI();
      /* Re-render active view so it shows logged-in state */
      var av=document.querySelector('.view.active');
      if(av){var vn=av.id.replace('v-','');switchView(vn)}
    }catch(e){document.getElementById('fb-err').textContent='Erreur : '+e.message;console.error(e)}
  });
}

/* Sync local collection to cloud */
async function syncToCloud(){
  if(!fbUser||!fbClass||!fbDb)return;
  const ref=fbDb.collection('classes').doc(fbClass).collection('players').doc(fbUser.uid);
  const unique=new Map();S.coll.forEach(function(c){if(!unique.has(c.title))unique.set(c.title,c)});
  await ref.set({
    pseudo:S.pseudo||'Inconnu',
    avatar:S.avatar||'📐',
    level:S.level||0,
    title:getTitle(S.level||0),
    cardCount:unique.size,
    totalCards:S.coll.length,
    topCards:[...unique.values()].sort(function(a,b){return(b.atk+b.def)-(a.atk+a.def)}).slice(0,20).map(function(c){return{title:c.title,rarity:c.rarity,atk:c.atk,def:c.def,disc:c.disc}}),
    lastSeen:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}

/* ===== TRADES ===== */
async function getPlayers(){
  if(!fbDb||!fbClass)return[];
  const snap=await fbDb.collection('classes').doc(fbClass).collection('players').get();
  return snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(p){return p.id!==fbUser?.uid});
}

async function proposeTrade(toId,toPseudo,offerCards,offerEcus,wantCards,wantEcus){
  if(!fbDb||!fbClass||!fbUser)return;
  if(!offerCards.length&&!offerEcus&&!wantCards.length&&!wantEcus){toast('Échange vide.');return}
  await fbDb.collection('classes').doc(fbClass).collection('trades').add({
    from:fbUser.uid,
    fromPseudo:S.pseudo,
    to:toId,
    toPseudo:toPseudo,
    offerCards:offerCards.map(function(c){return{title:c.title,rarity:c.rarity,atk:c.atk,def:c.def,disc:c.disc}}),
    offerEcus:offerEcus||0,
    wantCards:wantCards.map(function(c){return{title:c.title,rarity:c.rarity,atk:c.atk,def:c.def,disc:c.disc}}),
    wantEcus:wantEcus||0,
    status:'pending',
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  toast('Offre envoyée à '+esc(toPseudo)+' !');
}

async function acceptTrade(tradeId,tradeData){
  if(!fbDb||!fbClass||!fbUser)return;
  /* Give me their offered cards */
  (tradeData.offerCards||[]).forEach(function(c){S.coll.push(Object.assign({},c,{views:0,extract:'',url:'',thumb:null,qscore:0}))});
  /* Remove my cards that I gave */
  (tradeData.wantCards||[]).forEach(function(wc){var idx=S.coll.findIndex(function(c){return c.title===wc.title});if(idx>=0)S.coll.splice(idx,1)});
  /* Ecus */
  S.ecus=(S.ecus||0)+(tradeData.offerEcus||0)-(tradeData.wantEcus||0);
  if(S.ecus<0)S.ecus=0;
  save();
  await fbDb.collection('classes').doc(fbClass).collection('trades').doc(tradeId).update({status:'accepted'});
  await syncToCloud();
  toast('Échange accepté !');addXP(10);ckAch();
  refreshUI();
}

async function rejectTrade(tradeId){
  if(!fbDb||!fbClass)return;
  await fbDb.collection('classes').doc(fbClass).collection('trades').doc(tradeId).update({status:'rejected'});
  toast('Échange refusé.');
}

function renderCardPicker(containerId,cards,selectedTitles,onSelect,searchId){

  }).join('');

          '<br><span style="color:var(--cur)">Veut :</span> '+(wCards||'rien')+(wEcus?' + '+fN(wEcus)+' écus':'')+'</p></div>'+
          (t.status==='pending'&&isRecv?'<div style="display:flex;gap:5px;flex-wrap:wrap"><button class="bb" data-accept="'+d.id+'">✓ Accepter</button><button class="duel-btn go" data-negotiate="'+d.id+'" style="font-size:.78rem;padding:6px 12px;background:var(--bg3);color:var(--acc);border:1px solid var(--acc)">💬 Négocier</button><button class="sb" data-reject="'+d.id+'">✗ Refuser</button></div>':'<span class="achr" style="opacity:.5">'+t.status+'</span>')+
          '</div>';

      list.querySelectorAll('[data-accept]').forEach(function(b){b.addEventListener('click',function(){var id=b.dataset.accept;var t=snap.docs.find(function(d){return d.id===id});if(t)acceptTrade(id,t.data()).then(function(){loadTrades()})})});
      list.querySelectorAll('[data-reject]').forEach(function(b){b.addEventListener('click',function(){rejectTrade(b.dataset.reject).then(function(){loadTrades()})})});

  async function showNewTrade(){showNewTradeWith(null,null,[],0,[],0)}

  async function showNewTradeWith(preToId,preToPseudo,preOffer,preOfferEcus,preWant,preWantEcus){
    const list=document.getElementById('trades-list');
    list.innerHTML='<p style="color:var(--txt3)">Chargement...</p>';
    var friends=await getFriends();
    var playerSnap=await fbDb.collection('classes').doc(fbClass).collection('players').get();
    var playerMap={};playerSnap.docs.forEach(function(d){playerMap[d.id]=d.data()});
    if(!friends.length){list.innerHTML='<p class="eh">Ajoutez d\'abord des amis pour échanger !</p>';return}

    var selFriend=preToId?{id:preToId,pseudo:preToPseudo}:null;
    var offerSel=preOffer.map(function(c){return c.title});
    var wantSel=preWant.map(function(c){return c.title});
    var offerEcus=preOfferEcus||0;
    var wantEcus=preWantEcus||0;

    function draw(){
      var unique=new Map();S.coll.forEach(function(c){if(!unique.has(c.title))unique.set(c.title,c)});
      var myCards=[...unique.values()];
      var theirCards=[];
      if(selFriend){var p=playerMap[selFriend.id];if(p&&p.topCards)theirCards=p.topCards}

      list.innerHTML=
        '<div style="margin-bottom:14px"><p style="font-weight:600;margin-bottom:6px">Échanger avec :</p>'+
        '<div class="fr" id="tr-friends">'+friends.map(function(f){
          var p=playerMap[f.uid]||{};
          return'<button class="fb'+(selFriend&&selFriend.id===f.uid?' active':'')+'" data-fid="'+f.uid+'" data-fpseudo="'+esc(p.pseudo||f.pseudo)+'">'+(p.avatar||f.avatar||'📐')+' '+(p.pseudo||f.pseudo)+pTag(f.uid)+'</button>';
        }).join('')+'</div></div>'+
        (selFriend?
        '<div style="display:flex;gap:16px;flex-wrap:wrap">'+
          /* LEFT: what I give */
          '<div style="flex:1;min-width:250px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:14px">'+
            '<h3 style="font-size:.95rem;color:var(--acc);margin-bottom:8px">🎁 Ce que je donne</h3>'+
            (offerSel.length?'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+offerSel.map(function(t,i){var c=myCards.find(function(x){return x.title===t});return c?'<span class="fb active" style="cursor:pointer" data-rmoff="'+i+'">'+esc(trunc(c.title,16))+' <span class="rb rb-'+c.rarity+'" style="font-size:.45rem">'+rT(c.rarity).s+'</span> ✕</span>':''}).join('')+'</div>':'')+
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="coin">É</span><input type="number" class="si" id="tr-oecus" value="'+offerEcus+'" min="0" max="'+(S.ecus||0)+'" style="max-width:100px;margin:0"><span style="font-size:.8rem;color:var(--txt3)">/ '+fN(S.ecus||0)+'</span></div>'+
            '<input type="search" class="si" id="tr-osearch" placeholder="Rechercher dans mes cartes..." style="max-width:100%">'+
            '<div class="duel-pick" id="tr-ocards" style="max-height:30vh"></div>'+
          '</div>'+
          /* RIGHT: what I want */
          '<div style="flex:1;min-width:250px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rad);padding:14px">'+
            '<h3 style="font-size:.95rem;color:var(--cur);margin-bottom:8px">💎 Ce que je veux</h3>'+
            (wantSel.length?'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+wantSel.map(function(t,i){var c=theirCards.find(function(x){return x.title===t});return c?'<span class="fb active" style="cursor:pointer;border-color:var(--cur);color:var(--cur)" data-rmwant="'+i+'">'+esc(trunc(c.title,16))+' <span class="rb rb-'+c.rarity+'" style="font-size:.45rem">'+rT(c.rarity).s+'</span> ✕</span>':''}).join('')+'</div>':'')+
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="coin">É</span><input type="number" class="si" id="tr-wecus" value="'+wantEcus+'" min="0" style="max-width:100px;margin:0"></div>'+

              '<div class="duel-pick" id="tr-wcards" style="max-height:30vh"></div>'

          '</div>'+
        '</div>'+

        :'<p style="color:var(--txt3);text-align:center;padding:16px">Sélectionnez un ami ci-dessus.</p>');

      document.getElementById('tr-friends')?.addEventListener('click',function(e){var b=e.target.closest('[data-fid]');if(!b)return;selFriend={id:b.dataset.fid,pseudo:b.dataset.fpseudo};offerSel=[];wantSel=[];wantEcus=0;draw()});

      /* Bind offer card picker */
      renderCardPicker('tr-ocards',myCards,offerSel,function(title){
        var idx=offerSel.indexOf(title);if(idx>=0)offerSel.splice(idx,1);else offerSel.push(title);draw();
      },'tr-osearch');
      document.getElementById('tr-osearch')?.addEventListener('input',function(){
        renderCardPicker('tr-ocards',myCards,offerSel,function(title){
          var idx=offerSel.indexOf(title);if(idx>=0)offerSel.splice(idx,1);else offerSel.push(title);draw();
        },'tr-osearch');
      });

      /* Bind want card picker */
      if(theirCards.length){
        renderCardPicker('tr-wcards',theirCards,wantSel,function(title){
          var idx=wantSel.indexOf(title);if(idx>=0)wantSel.splice(idx,1);else wantSel.push(title);draw();
        },null);
      }

      list.querySelectorAll('[data-rmoff]').forEach(function(b){b.addEventListener('click',function(){offerSel.splice(+b.dataset.rmoff,1);draw()})});

      /* Ecus inputs */
      document.getElementById('tr-oecus')?.addEventListener('change',function(){offerEcus=Math.max(0,Math.min(S.ecus||0,+this.value||0));draw()});
      document.getElementById('tr-wecus')?.addEventListener('change',function(){wantEcus=Math.max(0,+this.value||0);draw()});

      /* Send button */
      document.getElementById('tr-send')?.addEventListener('click',function(){
        if(!selFriend)return;
        var unique=new Map();S.coll.forEach(function(c){if(!unique.has(c.title))unique.set(c.title,c)});
        var oc=offerSel.map(function(t){return unique.get(t)}).filter(Boolean);
        var wc=wantSel.map(function(t){return theirCards.find(function(x){return x.title===t})}).filter(Boolean);
        proposeTrade(selFriend.id,selFriend.pseudo,oc,offerEcus,wc,wantEcus).then(function(){tab='sent';loadTrades()});
      });
    }
    draw();
  }

  v.querySelector('#et-recv').addEventListener('click',function(){tab='recv';v.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active')});this.classList.add('active');loadTrades()});

  v.querySelector('#et-new').addEventListener('click',function(){tab='new';v.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active')});this.classList.add('active');loadTrades()});
  loadTrades();
}

async function playPvPDuel(duelId){
  const doc=await fbDb.collection('classes').doc(fbClass).collection('pvp').doc(duelId).get();
  if(!doc.exists){toast('Duel introuvable.');pvpState=null;renderPvP();return}
  const data=doc.data();
  if(data.status!=='ready'){toast('L\'adversaire n\'a pas encore répondu.');pvpState={phase:'waiting',duelId:duelId,role:'challenger'};renderPvP();return}

  // Determine role
  const iAmChallenger=data.challengerUid===fbUser.uid;
  const myCards=iAmChallenger?data.challengerCards:data.opponentCards;
  const theirCards=iAmChallenger?data.opponentCards:data.challengerCards;
  const theirPseudo=iAmChallenger?data.opponentPseudo:data.challengerPseudo;

  // Auto-resolve 5 rounds: compare cards by position, alternating ATK/DEF
  var myScore=0,cpuScore=0,log=[];
  for(var i=0;i<5;i++){
    var mine=myCards[i],theirs=theirCards[i];
    var useAtk=i%2===0; // alternate ATK/DEF
    var myStat=useAtk?mine.atk:mine.def;
    var theirStat=useAtk?theirs.atk:theirs.def;
    var diff=myStat-theirStat;
    if(diff>0)myScore++;else if(diff<0)cpuScore++;
    log.push({round:i+1,myCard:mine,theirCard:theirs,stat:useAtk?'ATK':'DEF',myVal:myStat,theirVal:theirStat,result:diff>0?'win':diff<0?'lose':'draw'});
  }

  pvpState={phase:'result',duelId:duelId,myScore:myScore,cpuScore:cpuScore,log:log,theirPseudo:theirPseudo,role:iAmChallenger?'challenger':'opponent'};

  // Mark duel as finished
  await fbDb.collection('classes').doc(fbClass).collection('pvp').doc(duelId).update({status:'finished'});

  renderPvP();
}

  S.ecus+=reward;S.stats.duelsPlayed=(S.stats.duelsPlayed||0)+1;
  if(won){S.stats.duelsWon=(S.stats.duelsWon||0)+1;addXP(35)}else if(draw){addXP(15)}else{addXP(8)}
  save();ckAch();refreshUI();
  if(won){sLeg();fireConfetti()}else if(draw){sRare()}

  var logHtml=p.log.map(function(r){
    var color=r.result==='win'?'var(--acc)':r.result==='lose'?'var(--cur)':'var(--txt2)';
    return'<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg3);border-radius:6px;margin-bottom:4px"><span style="font-weight:700;color:var(--txt3);width:60px">Manche '+r.round+'</span><span style="flex:1;font-size:.82rem">'+esc(trunc(r.myCard.title,15))+' <span style="color:'+color+'">'+r.stat+' '+fN(r.myVal)+'</span> vs '+esc(trunc(r.theirCard.title,15))+' <span style="opacity:.7">'+fN(r.theirVal)+'</span></span><span style="font-size:1.1rem">'+(r.result==='win'?'✅':r.result==='lose'?'❌':'➖')+'</span></div>'
  }).join('');

  v.innerHTML='<div class="duel-result"><h2>'+(won?'🏆 Victoire !':draw?'🤝 Égalité':'💀 Défaite')+'</h2>'+
    '<div class="duel-score"><span class="you">Vous : '+p.myScore+'</span><span class="cpu">'+p.theirPseudo+' : '+p.cpuScore+'</span></div>'+
    '<p style="color:var(--acc);font-weight:600">+'+reward+' écus</p>'+
    '<div style="margin:16px 0;max-width:400px">'+logHtml+'</div>'+
    '<button class="duel-btn go" id="pvp-again" style="margin-top:8px">Retour</button></div>';
  document.getElementById('pvp-again')?.addEventListener('click',function(){pvpState=null;renderPvP()});
}

/* ===== PULSE ANIMATION ===== */
if(!document.getElementById('pvp-style')){
  var pvpCss=document.createElement('style');pvpCss.id='pvp-style';
  pvpCss.textContent='@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.6}}';
  document.head.appendChild(pvpCss);
}

/* Auto-login if previously connected */
if(FIREBASE_ENABLED){
  fbClass=localStorage.getItem('tiroir-fb-class');
  fbAuth.onAuthStateChanged(function(user){
    if(user){fbUser=user;syncToCloud().catch(function(){})}
  });
}
</script>
