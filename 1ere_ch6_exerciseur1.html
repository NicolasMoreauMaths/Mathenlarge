<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonctions exponentielles — Exerciseur interactif — Première</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #eef2f7;
    --grid: #d5dce6;
    --card: #fff;
    --blue: #1a6fa0;
    --blue-light: #2d8dc7;
    --blue-pale: rgba(26, 111, 160, 0.08);
    --blue-border: rgba(26, 111, 160, 0.2);
    --purple: #6b3fa0;
    --purple-light: #8b5fc8;
    --purple-pale: rgba(107, 63, 160, 0.1);
    --orange: #b85c0b;
    --orange-pale: rgba(184, 92, 11, 0.1);
    --orange-border: rgba(184, 92, 11, 0.25);
    --green: #1b7a40;
    --green-pale: rgba(27, 122, 64, 0.1);
    --red: #c0392b;
    --red-pale: rgba(192, 57, 43, 0.08);
    --teal: #0d9488;
    --teal-pale: rgba(13, 148, 136, 0.1);
    --gold: #b8860b;
    --gold-pale: rgba(184, 134, 11, 0.12);
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(30, 41, 59, 0.08);
}

body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: 16px 10px 60px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
}

.app { max-width: 900px; width: 100%; }

.app-header {
    background: linear-gradient(135deg, #001f3f 0%, #003366 45%, #0369a1 100%);
    color: #fff;
    padding: 18px 24px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(12, 22, 36, 0.4);
    position: relative;
    overflow: hidden;
}

.app-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 50%);
    pointer-events: none;
}

.app-header-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #0369a1, #be185d, #059669, #7c3aed);
}

.app-title {
    font-size: 1.25em;
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.app-title::before { content: '📈'; font-size: 1.15em; }

.main {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 28px var(--shadow);
    min-height: 60vh;
}

.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
}

h1 {
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--blue);
}

.sub {
    text-align: center;
    font-size: 0.92em;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
}

/* ── BUTTONS ── */
.btn {
    font-family: 'DM Sans', sans-serif;
    padding: 11px 26px;
    border-radius: 12px;
    font-size: 0.93em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
}

.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-blue { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 2px 12px rgba(26,111,160,0.2); }
.btn-blue:hover:not(:disabled) { background: var(--blue-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(26,111,160,0.3); }

.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }

.btn-ghost { background: transparent; color: var(--text-light); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text-light); }

.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

/* ── MENU ── */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin: 20px 0;
}

.mc {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mc:hover { border-color: var(--blue); transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
.mc-icon { font-size: 2em; margin-bottom: 8px; }
.mc-t { font-size: 0.9em; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
.mc-d { font-size: 0.78em; color: var(--text-light); line-height: 1.4; }
.mc-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--orange-pale); color: var(--orange);
    font-size: 0.68em; font-weight: 700; padding: 3px 10px; border-radius: 12px;
}

/* ── EX HEADER ── */
.ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.ex-badge { background: var(--blue-pale); color: var(--blue); padding: 6px 16px; border-radius: 20px; font-size: 0.84em; font-weight: 700; }
.ex-score { font-size: 0.88em; color: var(--text-light); font-weight: 600; }

.pbar { width: 100%; background: var(--border); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 20px; }
.pfill { height: 100%; background: linear-gradient(90deg, #0369a1, #be185d, #059669); border-radius: 6px; transition: width 0.4s; }

/* ── CONTEXT CARD ── */
.ctx-card {
    background: linear-gradient(135deg, #f5f9ff, #eff4ff);
    border: 1.5px solid #c5d8f0;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.93em;
    line-height: 1.7;
}

.ctx-card .ctx-label {
    font-size: 0.68em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--blue); margin-bottom: 6px; display: block;
}

/* ── FORMULA REMINDER ── */
.formula-remind {
    background: var(--gold-pale);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.84em;
    color: #7a5800;
    margin: 0 0 18px;
    text-align: center;
    line-height: 1.8;
}

/* ── QUESTION BLOCK ── */
.q-prompt {
    font-size: 1.05em;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.6;
    text-align: center;
}

/* ── INPUT FIELD ── */
.answer-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.answer-unit {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--text-light);
}

.answer-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    width: 160px;
    padding: 10px 12px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
}

.answer-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-pale); }
.answer-input.ok { border-color: var(--green); background: var(--green-pale); color: var(--green); }
.answer-input.err { border-color: var(--red); background: var(--red-pale); animation: shake 0.3s; }
.answer-input.wide { width: 220px; }
.answer-input.narrow { width: 110px; }

/* ── MULTI-INPUT ROW ── */
.row-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.row-label { font-size: 0.85em; font-weight: 600; color: var(--text-light); }

/* ── CHOICE BUTTONS ── */
.choice-grid {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
}

.choice-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95em;
    font-weight: 700;
    padding: 14px 22px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 120px;
    text-align: center;
}

.choice-btn:hover { border-color: var(--blue); transform: translateY(-2px); }
.choice-btn.chosen { background: var(--purple); border-color: var(--purple); color: white; }
.choice-btn.ok { background: var(--green-pale); border-color: var(--green); color: var(--green); }
.choice-btn.err { background: var(--red-pale); border-color: var(--red); color: var(--red); animation: shake 0.3s; }

/* ── CALCULATOR ── */
.calc-wrap {
    background: #1e293b;
    border-radius: 16px;
    padding: 16px;
    max-width: 320px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.calc-display {
    background: #0f172a;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-family: 'DM Sans', monospace;
    font-size: 1.5em;
    font-weight: 600;
    color: #7dd3fc;
    text-align: right;
    min-height: 52px;
    overflow: hidden;
    word-break: break-all;
}

.calc-expr {
    font-size: 0.55em;
    color: #475569;
    text-align: right;
    min-height: 18px;
    margin-bottom: 4px;
    font-family: 'DM Sans', monospace;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.calc-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 1em;
    font-weight: 700;
    padding: 12px 6px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 46px;
}

.calc-btn:active { transform: scale(0.93); }
.calc-num { background: #334155; color: #f1f5f9; }
.calc-num:hover { background: #475569; }
.calc-op { background: #1a6fa0; color: #fff; }
.calc-op:hover { background: #2d8dc7; }
.calc-pow { background: #6b3fa0; color: #fff; }
.calc-pow:hover { background: #8b5fc8; }
.calc-frac { background: #0d9488; color: #fff; font-size: 0.85em; }
.calc-frac:hover { background: #14b8a6; }
.calc-arrow { background: #334155; color: #cbd5e1; font-size: 1.1em; }
.calc-arrow:hover { background: #475569; color: #fff; }
.calc-eq { background: #1b7a40; color: #fff; }
.calc-eq:hover { filter: brightness(1.1); }
.calc-eq-wide { grid-column: span 4; }
.calc-clear { background: #7f1d1d; color: #fecaca; }
.calc-clear:hover { background: #991b1b; }
.calc-back { background: #4c1d95; color: #ddd6fe; }
.calc-back:hover { background: #5b21b6; }
.calc-zero { grid-column: span 2; }

.calc-toggle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--text-light);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    margin: 0 auto 12px;
    display: block;
    transition: all 0.2s;
}

.calc-toggle:hover { background: var(--bg); border-color: var(--text-light); }
.calc-container { display: none; }
.calc-container.visible { display: block; }

/* ── AFFICHAGE NATUREL (exposant réduit + fraction empilée) ── */
.cn-pow { display: inline-flex; align-items: flex-start; }
.cn-exp-wrap { display: inline-flex; align-items: flex-start; margin-left: 1px; transform: translateY(-0.35em); }
.cn-exp-plain { font-size: 0.6em; line-height: 1; min-width: 0.4em; display: inline-block; }
.cn-frac { display: inline-flex; flex-direction: column; align-items: center; font-size: 0.55em; line-height: 1.15; margin: 0 2px; }
.cn-fnum, .cn-fden { padding: 0 3px; min-width: 0.6em; text-align: center; }
.cn-fbar { width: 100%; height: 0; border-top: 2px solid currentColor; margin: 1px 0; }
.cn-cursor { display: inline-block; width: 2px; height: 0.9em; background: currentColor; margin-left: 1px; vertical-align: middle; animation: calcBlink 1s step-start infinite; }
@keyframes calcBlink { 50% { opacity: 0; } }

/* ── STEP BLOCKS ── */
.step-block { margin-bottom: 18px; padding-bottom: 14px; }
.step-block.locked { opacity: 0.88; }
.step-block.locked .answer-input { pointer-events: none; }

.step-divider { border: none; border-top: 1.5px dashed var(--border); margin: 4px auto 18px; max-width: 500px; }

.step-tag {
    display: inline-block;
    font-size: 0.72em; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text-light);
    text-align: center; width: 100%; margin-bottom: 8px;
}

.step-tag.locked-tag { color: var(--green); }
.step-tag.locked-tag::before { content: '✓  '; }

/* ── SUITE TABLE ── */
.suite-table-wrap { overflow-x: auto; margin: 14px 0; }
.suite-table {
    border-collapse: collapse;
    margin: 0 auto;
    font-size: 1em;
}
.suite-table th {
    background: #dbeafe;
    color: var(--blue);
    font-weight: 700;
    padding: 8px 14px;
    border: 2px solid #93c5fd;
    text-align: center;
    white-space: nowrap;
}
.suite-table td {
    background: #fff;
    border: 1px solid #93c5fd;
    padding: 8px 14px;
    text-align: center;
    white-space: nowrap;
}
.suite-table td.given { background: #eff6ff; font-weight: 700; color: var(--blue); }
.suite-table td.blank { padding: 4px 6px; }

/* ── FEEDBACK ── */
.fb {
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 0.95em;
    line-height: 1.6;
    margin: 16px 0 4px;
    text-align: center;
    min-height: 0;
    transition: all 0.2s;
}
.fb:empty { display: none; padding: 0; margin: 0; }
.fb.ok { background: var(--green-pale); color: var(--green); border: 1.5px solid rgba(27,122,64,0.3); }
.fb.bad { background: var(--red-pale); color: var(--red); border: 1.5px solid rgba(192,57,43,0.3); }

/* ── RESULTS ── */
.rc {
    width: 160px; height: 160px; border-radius: 50%;
    border: 8px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin: 20px auto; background: var(--card);
}
.rc.good { border-color: var(--green); background: var(--green-pale); }
.rc.mid  { border-color: var(--orange); background: var(--orange-pale); }
.rc.bad  { border-color: var(--red); background: var(--red-pale); }
.rp { font-size: 2.2em; font-weight: 700; line-height: 1; }
.rm { font-size: 1.05em; text-align: center; margin: 16px 0; line-height: 1.5; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

@media (max-width: 640px) {
    .app-header { padding: 14px 18px; }
    .app-title { font-size: 1.05em; }
    .main { padding: 22px 16px; }
    h1 { font-size: 1.25em; }
    .menu-grid { grid-template-columns: 1fr; }
    .answer-input { width: 130px; font-size: 1.1em; }
}
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }
  .choice-btn { font-size:0.85rem; padding:8px; }
  .choice-grid { gap:6px; }
  .q-prompt { font-size:0.9rem; }
  .step-block { padding:8px; }
  .step-tag { font-size:0.75rem; }
  .fb { font-size:0.85rem; padding:8px; }
  .formula-remind { font-size:0.85rem; padding:8px; overflow-x:auto; }
  .ctx-card { padding:8px; font-size:0.85rem; }
  .answer-input { font-size:0.9rem; }
}
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
svg[viewBox] { max-width:100%; height:auto; }
.mc, .screen, .step-block { overflow-wrap:break-word; word-break:break-word; }
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,#0369a1,#1a6fa0);color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(3,105,161,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(3,105,161,0.5);}

/* ===== RESPONSIVE RENFORCÉ ===== */
@media(max-width:768px){
  body { padding: 12px 8px 50px; }
  .app { padding: 0 6px; }
  .app-header { padding: 12px 16px; border-radius: 12px 12px 0 0; }
  .app-title { font-size: 1rem; }
  .main { padding: 16px 14px; }
  h1 { font-size: 1.2em; }
  .menu-grid { grid-template-columns: 1fr; }
  .mc { padding: 12px; }
  .controls { flex-wrap: wrap; gap: 6px; justify-content: center; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.84rem; padding: 8px 14px; }
  .expr-line { font-size: 1.25em; }
  .term-input { width: 78px; font-size: 1em; }
  .id-btn { min-width: 120px; font-size: 0.76em; }
  .var-btn { min-width: 110px; padding: 10px 12px; }
  .memo-wrap { grid-template-columns: 1fr; }
  .build-input { width: 50px; }
  .step-block { padding: 10px; }
  .fb { font-size: 0.88rem; }
}
@media(max-width:480px){
  body { padding: 8px 4px 40px; }
  .app { padding: 0 2px; }
  .app-header { padding: 10px 12px; }
  .app-title { font-size: 0.92rem; }
  .main { padding: 12px 10px; }
  h1 { font-size: 1.1em; }
  .expr-line { font-size: 1.1em; }
  .term-input { width: 66px; font-size: 0.92em; }
  .id-btn { min-width: 100px; }
  .var-btn { min-width: 90px; padding: 8px 10px; font-size: 0.78em; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.8rem; padding: 7px 11px; }
  .mc-t { font-size: 0.9rem; }
}
@media(max-width:360px){
  .app-title { font-size: 0.85rem; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.76rem; padding: 6px 9px; }
  .expr-line { font-size: 1rem; }
  .term-input { width: 56px; }
}
svg[viewBox] { max-width:100%; height:auto; }
table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
.katex-display,.katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
.mc,.screen,.step-block,.mc-t { overflow-wrap:break-word; word-break:break-word; }

</style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Fonctions exponentielles — Première</div>
        <div class="app-header-bar"></div>
    </div>
    <div class="main">

        <!-- MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Choisis un thème</h1>
            <p class="sub">Six exerciseurs pour maîtriser la fonction exponentielle : règles de calcul sur les puissances, images, racines, taux d'évolution moyen, sens de variation et problèmes de seuil.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- EXERCISE -->
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Thème</span>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
            <div id="exBody"></div>
            <div class="fb" id="fb"></div>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue" id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
                <button class="btn btn-ghost" id="btnSkip" style="display:none">Passer →</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc"><div class="rp" id="rp">0%</div></div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue" id="btnRetry">Recommencer</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ==========================================================
   CONFIG NIVEAUX
   ========================================================== */
const LEVELS = [
    { id: 'regles',    icon: '🧮', title: 'Règles de calcul sur les puissances', desc: 'Utiliser aⁿ, a⁻ⁿ, aᵐ×aⁿ et (aᵐ)ⁿ', n: 10 },
    { id: 'image',     icon: '🚀', title: 'Calculer une image f(x) = aˣ',        desc: 'Évaluer une fonction exponentielle en un réel donné', n: 10, badge: 'Calculatrice' },
    { id: 'racine',    icon: '√',  title: 'Exposant 1/n — racines',              desc: 'Calculer a^(1/n) dans les cas « ronds »', n: 10 },
    { id: 'tauxMoyen', icon: '📊', title: "Taux d'évolution moyen",              desc: 'Répartir un coefficient multiplicateur sur plusieurs périodes', n: 8, badge: 'Calculatrice' },
    { id: 'variation', icon: '↗',  title: 'Sens de variation',                   desc: 'Croissante, décroissante ou constante selon la base a', n: 10 },
    { id: 'seuil',     icon: '🎯', title: 'Résoudre un problème de seuil',       desc: 'Lire un tableau de valeurs pour repérer un dépassement de seuil', n: 8 },
];

let state = { levelId: null, qIndex: 0, total: 0, score: 0, questions: [], checked: false, attempts: 0 };

/* ==========================================================
   UTILS
   ========================================================== */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rndArr(arr) { return arr[rnd(0, arr.length - 1)]; }

function normNum(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(',', '.').replace(/\s+/g, '');
    if (s === '') return null;
    s = s.replace(/\u2212/g, '-');
    // Accepte les fractions du type "a/b" (ex : 1/9) en plus des décimaux
    const fracMatch = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (fracMatch) {
        const num = parseFloat(fracMatch[1]);
        const den = parseFloat(fracMatch[2]);
        if (den === 0) return null;
        return num / den;
    }
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
}

function close(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

function fmt(x) {
    const r = Math.round(x * 100) / 100;
    return r % 1 === 0 ? String(r) : String(r).replace('.', ',');
}

function fmtLatex(x) {
    return fmt(x).replace('-', '-');
}

/* ==========================================================
   NAVIGATION
   ========================================================== */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    LEVELS.forEach(lv => {
        const el = document.createElement('div');
        el.className = 'mc';
        el.innerHTML = `
            ${lv.badge ? `<div class="mc-badge">${lv.badge}</div>` : ''}
            <div class="mc-icon">${lv.icon}</div>
            <div class="mc-t">${lv.title}</div>
            <div class="mc-d">${lv.desc}</div>
        `;
        el.addEventListener('click', () => startLevel(lv.id));
        grid.appendChild(el);
    });
}

document.getElementById('btnMenu').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnMenu2').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnRetry').addEventListener('click', () => startLevel(state.levelId));

buildMenu();

function renderKatex(el) {
    if (window.renderMathInElement) {
        renderMathInElement(el || document.body, {
            delimiters: [
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true },
            ],
            throwOnError: false
        });
    }
}

/* ==========================================================
   MOTEUR GÉNÉRIQUE
   ========================================================== */
const GENERATORS = {};
const RENDERERS  = {};
const CHECKERS   = {};

function startLevel(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    state.levelId = levelId;
    state.qIndex  = 0;
    state.score   = 0;
    state.total   = lv.n;
    state.questions = [];
    for (let i = 0; i < lv.n; i++) state.questions.push(GENERATORS[levelId]());
    document.getElementById('exBadge').textContent = lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion() {
    state.checked  = false;
    state.attempts = 0;
    document.getElementById('exScore').textContent = `Question ${state.qIndex + 1}/${state.total}`;
    document.getElementById('pfill').style.width = (state.qIndex / state.total * 100) + '%';
    const body = document.getElementById('exBody');
    body.innerHTML = '';
    const fb = document.getElementById('fb');
    fb.className = 'fb'; fb.textContent = '';
    document.getElementById('btnCheck').style.display = '';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnNext').style.display = 'none';
    document.getElementById('btnSkip').style.display  = 'none';
    RENDERERS[state.levelId](state.questions[state.qIndex], body);
    renderKatex(body);
}

document.getElementById('btnCheck').addEventListener('click', () => {
    if (state.checked) return;
    const q = state.questions[state.qIndex];
    const result = CHECKERS[state.levelId](q);
    const fb      = document.getElementById('fb');
    const btnCheck = document.getElementById('btnCheck');
    const btnNext  = document.getElementById('btnNext');
    const btnSkip  = document.getElementById('btnSkip');

    if (result.ok) {
        fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + (result.msg || 'Exact, bien joué !');
        renderKatex(fb);
        if (result.advanceOnly) {
            // Étape intermédiaire validée : effacer le feedback, garder "Vérifier"
            setTimeout(() => { fb.className = 'fb'; fb.textContent = ''; }, 1600);
            btnNext.style.display = 'none';
            btnSkip.style.display = 'none';
            return;
        }
        // Bonne réponse finale
        state.checked = true;
        state.score++;
        btnCheck.style.display = 'none';
        btnSkip.style.display  = 'none';
        btnNext.style.display  = '';
    } else {
        // Mauvaise réponse : on laisse "Vérifier" actif pour corriger
        // et on propose "Passer" pour continuer sans point
        fb.className = 'fb bad';
        fb.innerHTML = '✗ ' + (result.msg || "Ce n\'est pas encore ça, réessaie.");
        renderKatex(fb);
        btnNext.style.display = 'none';   // pas de Suivant direct
        btnSkip.style.display = '';        // "Passer" disponible
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    state.qIndex++;
    if (state.qIndex >= state.total) showResults();
    else renderQuestion();
});

document.getElementById('btnSkip').addEventListener('click', () => {
    // L'élève passe sans avoir eu la bonne réponse (pas de point)
    state.qIndex++;
    if (state.qIndex >= state.total) showResults();
    else renderQuestion();
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const exScreen = document.getElementById('screen-ex');
    if (!exScreen.classList.contains('active')) return;
    e.preventDefault();
    const btnNext  = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');
    if (btnNext.style.display !== 'none' && btnNext.offsetParent) btnNext.click();
    else if (btnCheck.style.display !== 'none' && !btnCheck.disabled) btnCheck.click();
});

function showResults() {
    document.getElementById('pfill').style.width = '100%';
    const pct = Math.round(state.score / state.total * 100);
    const rc = document.getElementById('rc');
    rc.className = 'rc ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    document.getElementById('rp').textContent = pct + '%';
    let msg;
    if (pct >= 80) msg = `Excellent ! ${state.score}/${state.total} bonnes réponses. Tu maîtrises ce thème.`;
    else if (pct >= 50) msg = `${state.score}/${state.total} bonnes réponses. C'est en bonne voie, encore un peu d'entraînement !`;
    else msg = `${state.score}/${state.total} bonnes réponses. Reprends la leçon et réessaie, tu vas progresser.`;
    document.getElementById('rm').textContent = msg;
    showScreen('screen-res');
}

/* ==========================================================
   CALCULATRICE INTÉGRÉE — affichage « naturel »
   (exposant réduit en hauteur, fraction empilée num/dén,
   comme sur une calculatrice scientifique réelle)
   ========================================================== */
function calcHTML(id) {
    return `
    <button class="calc-toggle" id="calc-toggle-${id}" onclick="toggleCalc('${id}')">🔢 Afficher la calculatrice</button>
    <div class="calc-container" id="calc-${id}">
        <div class="calc-wrap">
            <div class="calc-display" id="calc-disp-${id}">
                <div class="calc-expr" id="calc-expr-${id}"></div>
                <div id="calc-val-${id}">0</div>
            </div>
            <div class="calc-grid">
                <button class="calc-btn calc-clear" onclick="cCalc('${id}','C')">C</button>
                <button class="calc-btn calc-back"  onclick="cCalc('${id}','⌫')">⌫</button>
                <button class="calc-btn calc-op"    onclick="cCalc('${id}','paren')">( )</button>
                <button class="calc-btn calc-op"    onclick="cCalc('${id}','÷')">÷</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','7')">7</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','8')">8</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','9')">9</button>
                <button class="calc-btn calc-op"    onclick="cCalc('${id}','×')">×</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','4')">4</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','5')">5</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','6')">6</button>
                <button class="calc-btn calc-op"    onclick="cCalc('${id}','−')">−</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','1')">1</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','2')">2</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','3')">3</button>
                <button class="calc-btn calc-op"    onclick="cCalc('${id}','+')">+</button>
                <button class="calc-btn calc-pow"   onclick="cCalc('${id}','^')">xʸ</button>
                <button class="calc-btn calc-frac"  onclick="cCalc('${id}','frac')">a⁄b</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}','0')">0</button>
                <button class="calc-btn calc-num"   onclick="cCalc('${id}',',')">,</button>
                <button class="calc-btn calc-arrow" onclick="cCalc('${id}','left')" aria-label="Flèche gauche">←</button>
                <button class="calc-btn calc-arrow" onclick="cCalc('${id}','down')" aria-label="Flèche bas (aller au dénominateur)">↓</button>
                <button class="calc-btn calc-arrow" onclick="cCalc('${id}','up')" aria-label="Flèche haut (revenir au numérateur)">↑</button>
                <button class="calc-btn calc-arrow" onclick="cCalc('${id}','right')" aria-label="Flèche droite">→</button>
                <button class="calc-btn calc-eq calc-eq-wide" onclick="cCalc('${id}','=')">＝</button>
            </div>
        </div>
    </div>`;
}

const calcState = {};

function toggleCalc(id) {
    const c = document.getElementById('calc-' + id);
    const btn = document.getElementById('calc-toggle-' + id);
    const visible = c.classList.toggle('visible');
    btn.textContent = visible ? '🔢 Masquer la calculatrice' : '🔢 Afficher la calculatrice';
    if (!calcState[id]) calcState[id] = newCalcState();
}

function newCalcState() {
    return { blocks: [{ t: 'txt', v: '' }], mode: 'normal', activePowIndex: null, fresh: true, lastExprBlocks: null };
}

function escHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

/* Construit l'affichage HTML « naturel » (exposant réduit + fraction empilée) */
function blocksToDisplayHTML(blocks, s, showCursor) {
    let html = blocks.map((b, i) => {
        if (b.t === 'txt') {
            let v = escHtml(b.v);
            if (showCursor && s && s.mode === 'normal' && i === blocks.length - 1) v += '<span class="cn-cursor"></span>';
            return v;
        }
        // bloc puissance
        const isActive = !!(showCursor && s && s.activePowIndex === i);
        let expHtml;
        if (b.expMode === 'frac') {
            const numCur = isActive && s.mode === 'exp-frac-num' ? '<span class="cn-cursor"></span>' : '';
            const denCur = isActive && s.mode === 'exp-frac-den' ? '<span class="cn-cursor"></span>' : '';
            expHtml = `<span class="cn-frac"><span class="cn-fnum">${escHtml(b.num)}${numCur}</span><span class="cn-fbar"></span><span class="cn-fden">${escHtml(b.den)}${denCur}</span></span>`;
        } else {
            const plainCur = isActive && s.mode === 'exp' ? '<span class="cn-cursor"></span>' : '';
            expHtml = `<span class="cn-exp-plain">${escHtml(b.exp)}${plainCur}</span>`;
        }
        return `<span class="cn-pow"><span class="cn-base">${escHtml(b.base)}</span><span class="cn-exp-wrap">${expHtml}</span></span>`;
    }).join('');
    return html;
}

/* Traduit les blocs en expression JavaScript évaluable */
function blocksToJsExpr(blocks) {
    return blocks.map(b => {
        if (b.t === 'txt') {
            return b.v.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
        }
        const baseJs = (b.base || '0').replace(/,/g, '.');
        let expJs;
        if (b.expMode === 'frac') {
            const numJs = (b.num || '0').replace(/,/g, '.');
            const denJs = (b.den || '1').replace(/,/g, '.');
            expJs = `(${numJs})/(${denJs})`;
        } else {
            expJs = (b.exp || '0').replace(/,/g, '.');
        }
        return `(${baseJs})**(${expJs})`;
    }).join('');
}

function isCalcEmpty(s) {
    return s.blocks.length === 1 && s.blocks[0].t === 'txt' && s.blocks[0].v === '';
}

function renderCalc(id) {
    const s = calcState[id];
    const disp = document.getElementById('calc-val-' + id);
    const exprEl = document.getElementById('calc-expr-' + id);
    disp.innerHTML = isCalcEmpty(s) ? '0' : blocksToDisplayHTML(s.blocks, s, true);
    exprEl.innerHTML = (s.fresh && s.lastExprBlocks) ? blocksToDisplayHTML(s.lastExprBlocks, null, false) + ' =' : '';
}

function appendToActive(s, ch) {
    if (s.mode === 'normal') {
        let last = s.blocks[s.blocks.length - 1];
        if (!last || last.t !== 'txt') { last = { t: 'txt', v: '' }; s.blocks.push(last); }
        last.v += ch;
    } else if (s.mode === 'exp') {
        s.blocks[s.activePowIndex].exp += ch;
    } else if (s.mode === 'exp-frac-num') {
        s.blocks[s.activePowIndex].num += ch;
    } else if (s.mode === 'exp-frac-den') {
        s.blocks[s.activePowIndex].den += ch;
    }
}

/* Touche xʸ : transforme le nombre en cours de saisie en base, ouvre un exposant */
function startPower(s) {
    if (s.mode !== 'normal') return;
    const last = s.blocks[s.blocks.length - 1];
    if (!last || last.t !== 'txt') return;
    const m = last.v.match(/(-?\d+(?:,\d+)?)$/);
    if (!m) return; // pas de nombre en fin de saisie : on ignore la touche
    const base = m[1];
    last.v = last.v.slice(0, -base.length);
    if (last.v === '') s.blocks.pop();
    s.blocks.push({ t: 'pow', base, expMode: 'plain', exp: '', num: '', den: '' });
    s.activePowIndex = s.blocks.length - 1;
    s.mode = 'exp';
}

/* Touche a⁄b : transforme l'exposant en cours en fraction (num/dén empilés) */
function handleFrac(s) {
    if (s.mode === 'exp') {
        const pow = s.blocks[s.activePowIndex];
        pow.expMode = 'frac';
        pow.num = pow.exp || '';
        pow.exp = '';
        pow.den = '';
        s.mode = 'exp-frac-num';
    } else if (s.mode === 'exp-frac-num') {
        s.mode = 'exp-frac-den'; // passe au dénominateur
    }
    // en mode normal ou déjà au dénominateur, la touche n'a pas d'effet pour l'instant
}

/* Flèches directionnelles : navigation dans la fraction / l'exposant en cours */
function handleDown(s) {
    // Numérateur → dénominateur
    if (s.mode === 'exp-frac-num') s.mode = 'exp-frac-den';
}

function handleUp(s) {
    // Dénominateur → numérateur
    if (s.mode === 'exp-frac-den') s.mode = 'exp-frac-num';
}

function handleRight(s) {
    // Sort de l'exposant / de la fraction pour continuer à écrire normalement
    if (s.mode !== 'normal') exitPowerIfOpen(s);
}

function handleLeft(s) {
    // Dans une fraction, revient au numérateur
    if (s.mode === 'exp-frac-den') { s.mode = 'exp-frac-num'; return; }
    if (s.mode !== 'normal') return; // déjà dans l'exposant/numérateur : rien de plus à gauche
    // Depuis le mode normal : revient éditer la puissance qui précède (si le curseur est juste après)
    let idx = s.blocks.length - 1;
    if (idx >= 0 && s.blocks[idx].t === 'txt' && s.blocks[idx].v === '' && idx > 0 && s.blocks[idx - 1].t === 'pow') {
        idx -= 1;
    }
    const target = s.blocks[idx];
    if (target && target.t === 'pow') {
        if (s.blocks.length - 1 !== idx) s.blocks.pop(); // retire le bloc texte vide superflu
        s.activePowIndex = idx;
        s.mode = target.expMode === 'frac' ? 'exp-frac-den' : 'exp';
    }
}

/* Referme un exposant resté ouvert (avant un opérateur, une parenthèse ou un =) */
function exitPowerIfOpen(s) {
    if (s.mode !== 'normal') {
        s.mode = 'normal';
        s.activePowIndex = null;
        s.blocks.push({ t: 'txt', v: '' });
    }
}

function countParens(s) {
    let opens = 0, closes = 0;
    s.blocks.forEach(b => { if (b.t === 'txt') { opens += (b.v.match(/\(/g) || []).length; closes += (b.v.match(/\)/g) || []).length; } });
    return { opens, closes };
}

function handleParen(s) {
    exitPowerIfOpen(s);
    let last = s.blocks[s.blocks.length - 1];
    if (!last || last.t !== 'txt') { last = { t: 'txt', v: '' }; s.blocks.push(last); }
    const { opens, closes } = countParens(s);
    last.v += (opens > closes) ? ')' : '(';
}

function backspace(s) {
    if (s.mode === 'exp-frac-den') {
        const pow = s.blocks[s.activePowIndex];
        if (pow.den.length > 0) pow.den = pow.den.slice(0, -1);
        else s.mode = 'exp-frac-num';
        return;
    }
    if (s.mode === 'exp-frac-num') {
        const pow = s.blocks[s.activePowIndex];
        if (pow.num.length > 0) pow.num = pow.num.slice(0, -1);
        else { pow.expMode = 'plain'; pow.exp = ''; s.mode = 'exp'; }
        return;
    }
    if (s.mode === 'exp') {
        const pow = s.blocks[s.activePowIndex];
        if (pow.exp.length > 0) { pow.exp = pow.exp.slice(0, -1); return; }
        // exposant vide : on supprime toute la puissance et on restaure la base en texte normal
        s.blocks.pop();
        const last = s.blocks[s.blocks.length - 1];
        if (last && last.t === 'txt') last.v += pow.base;
        else s.blocks.push({ t: 'txt', v: pow.base });
        s.mode = 'normal'; s.activePowIndex = null;
        return;
    }
    // mode normal
    const last = s.blocks[s.blocks.length - 1];
    if (!last) return;
    if (last.t === 'pow') { s.blocks.pop(); return; }
    if (last.v.length > 0) last.v = last.v.slice(0, -1);
    else s.blocks.pop();
}

function doEquals(s) {
    exitPowerIfOpen(s);
    let resultStr;
    try {
        const jsExpr = blocksToJsExpr(s.blocks);
        if (jsExpr.trim() === '') return;
        const v = Function('"use strict"; return (' + jsExpr + ')')();
        resultStr = isFinite(v) ? String(Math.round(v * 10000) / 10000).replace('.', ',') : 'Erreur';
    } catch (e) { resultStr = 'Erreur'; }
    s.lastExprBlocks = s.blocks;
    s.blocks = [{ t: 'txt', v: resultStr === 'Erreur' ? '' : resultStr }];
    s.mode = 'normal'; s.activePowIndex = null; s.fresh = true;
}

function cCalc(id, key) {
    if (!calcState[id]) calcState[id] = newCalcState();
    const s = calcState[id];

    if (key === 'C') { calcState[id] = newCalcState(); renderCalc(id); return; }
    if (key === '⌫') { backspace(s); s.fresh = false; renderCalc(id); return; }

    // Après un résultat (fresh) : un chiffre repart de zéro, un opérateur poursuit avec le résultat
    if (s.fresh) {
        if (/^[0-9]$/.test(key) || key === ',') { s.blocks = [{ t: 'txt', v: '' }]; s.mode = 'normal'; s.activePowIndex = null; }
        s.fresh = false;
    }

    if (key === '=') { doEquals(s); renderCalc(id); return; }
    if (key === '^') { startPower(s); renderCalc(id); return; }
    if (key === 'frac') { handleFrac(s); renderCalc(id); return; }
    if (key === 'paren') { handleParen(s); renderCalc(id); return; }
    if (key === 'down') { handleDown(s); renderCalc(id); return; }
    if (key === 'up') { handleUp(s); renderCalc(id); return; }
    if (key === 'left') { handleLeft(s); renderCalc(id); return; }
    if (key === 'right') { handleRight(s); renderCalc(id); return; }
    if (['+', '-', '×', '÷', '−'].includes(key)) { exitPowerIfOpen(s); appendToActive(s, key); renderCalc(id); return; }

    appendToActive(s, key);
    renderCalc(id);
}

function lockStep(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('locked');
    const tag = el.querySelector('.step-tag');
    if (tag) tag.classList.add('locked-tag');
    el.querySelectorAll('input').forEach(i => i.disabled = true);
}

/* ==========================================================
   NIVEAU 1 : RÈGLES DE CALCUL SUR LES PUISSANCES
   ========================================================== */

GENERATORS.regles = function () {
    const types = ['a0', 'aneg', 'produit', 'puissance'];
    const type = rndArr(types);
    const aPool = [2, 3, 4, 5, 6, 7, 8, 9, 10];
    const a = rndArr(aPool);

    if (type === 'a0') {
        return { type, a };
    } else if (type === 'aneg') {
        // Couples (a, n) choisis pour que a^n reste modeste (≤ 100)
        const pairs = [
            { a: 2, n: 1 }, { a: 2, n: 2 }, { a: 2, n: 3 },
            { a: 3, n: 1 }, { a: 3, n: 2 }, { a: 3, n: 3 },
            { a: 4, n: 1 }, { a: 4, n: 2 },
            { a: 5, n: 1 }, { a: 5, n: 2 },
            { a: 6, n: 1 }, { a: 6, n: 2 },
            { a: 7, n: 1 }, { a: 8, n: 1 }, { a: 9, n: 1 }, { a: 10, n: 1 }, { a: 10, n: 2 }
        ];
        const pick = rndArr(pairs);
        const value = 1 / Math.pow(pick.a, pick.n);
        return { type, a: pick.a, n: pick.n, value };
    } else if (type === 'produit') {
        const m = rnd(1, 6), n = rnd(1, 6);
        return { type, a, m, n, sum: m + n };
    } else {
        const m = rnd(2, 5), n = rnd(2, 4);
        return { type, a, m, n, prod: m * n };
    }
};

RENDERERS.regles = function (q, box) {
    let prompt, unit;
    if (q.type === 'a0') {
        prompt = `Que vaut \\(${q.a}^0\\) ?`;
        unit = `\\(${q.a}^0 =\\)`;
    } else if (q.type === 'aneg') {
        prompt = `Que vaut \\(${q.a}^{-${q.n}}\\) ?<br><small style="color:var(--text-light);font-weight:400">Donne la fraction ou la valeur décimale (arrondie si besoin).</small>`;
        unit = `\\(${q.a}^{-${q.n}} =\\)`;
    } else if (q.type === 'produit') {
        prompt = `On écrit \\(${q.a}^{${q.m}} \\times ${q.a}^{${q.n}}\\) sous la forme \\(${q.a}^{\\,p}\\).<br>Quelle est la valeur de l'exposant \\(p\\) ?`;
        unit = `\\(p =\\)`;
    } else {
        prompt = `On écrit \\((${q.a}^{${q.m}})^{${q.n}}\\) sous la forme \\(${q.a}^{\\,p}\\).<br>Quelle est la valeur de l'exposant \\(p\\) ?`;
        unit = `\\(p =\\)`;
    }
    box.innerHTML = `
        <div class="formula-remind">Rappels : \\(a^0=1\\) &nbsp;·&nbsp; \\(a^{-n}=\\dfrac{1}{a^n}\\) &nbsp;·&nbsp; \\(a^m\\times a^n=a^{m+n}\\) &nbsp;·&nbsp; \\((a^m)^n=a^{mn}\\)</div>
        <div class="q-prompt">${prompt}</div>
        <div class="answer-wrap">
            <span class="answer-unit">${unit}</span>
            <input type="text" class="answer-input narrow" id="ans" placeholder="…" inputmode="decimal">
        </div>`;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.regles = function (q) {
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    let expected, explanation, eps;

    if (q.type === 'a0') {
        expected = 1;
        eps = 0.01;
        explanation = `Par convention, tout nombre non nul élevé à la puissance 0 vaut 1 : \\(${q.a}^0 = 1\\).`;
    } else if (q.type === 'aneg') {
        expected = q.value;
        eps = Math.max(0.001, Math.abs(expected) * 0.03);
        explanation = `\\(${q.a}^{-${q.n}} = \\dfrac{1}{${q.a}^{${q.n}}} = \\dfrac{1}{${Math.pow(q.a, q.n)}} \\approx ${fmt(expected)}\\). (La fraction \\(\\dfrac{1}{${Math.pow(q.a, q.n)}}\\) est aussi acceptée.)`;
    } else if (q.type === 'produit') {
        expected = q.sum;
        eps = 0.01;
        explanation = `On additionne les exposants : \\(${q.m} + ${q.n} = ${q.sum}\\).`;
    } else {
        expected = q.prod;
        eps = 0.01;
        explanation = `On multiplie les exposants : \\(${q.m} \\times ${q.n} = ${q.prod}\\).`;
    }

    const ok = v !== null && close(v, expected, eps);
    inp.classList.add(ok ? 'ok' : 'err');
    if (ok) return { ok: true, msg: `Exact ! ${explanation}` };
    return { ok: false, msg: explanation };
};

/* ==========================================================
   NIVEAU 2 : CALCULER UNE IMAGE f(x) = aˣ
   ========================================================== */

const CONTEXTES_IMAGE = [
    A => `Une population évolue selon \\(f(x) = ${A}\\times a^{\\,x}\\).`,
    A => `Un capital évolue selon \\(f(x) = ${A}\\times a^{\\,x}\\).`,
    A => `Une dose de médicament évolue selon \\(f(x) = ${A}\\times a^{\\,x}\\).`,
];

GENERATORS.image = function () {
    const withContext = Math.random() < 0.35;
    let a, x, A;
    if (withContext) {
        // Avec contexte (multiplicateur A) : bases et exposants restreints pour éviter les très grands nombres
        // (une base < 1 élevée à un exposant négatif peut vite exploser, donc on limite A et on exclut les bases trop petites)
        const bases = [2, 3, 1.5, 1.2, 0.8, 0.5, 2.5];
        a = rndArr(bases);
        x = rndArr([-2, -1, 0, 1, 2]);
        A = rndArr([10, 20]);
    } else {
        const bases = [2, 3, 4, 5, 0.5, 1.5, 1.2, 0.8, 0.25, 2.5];
        a = rndArr(bases);
        x = rndArr([-3, -2, -1, 0, 1, 2, 3]);
        A = 1;
    }
    const value = A * Math.pow(a, x);
    return { a, x, A, withContext, value };
};

RENDERERS.image = function (q, box) {
    let ctxHtml = '', prompt;
    if (q.withContext) {
        ctxHtml = `<div class="ctx-card"><span class="ctx-label">📝 Situation</span>Une quantité évolue selon \\(f(x) = ${q.A}\\times ${fmtLatex(q.a)}^{\\,x}\\).</div>`;
        prompt = `Calcule \\(f(${q.x})\\).`;
    } else {
        prompt = `Soit \\(f(x) = ${fmtLatex(q.a)}^{x}\\). Calcule \\(f(${q.x})\\).`;
    }
    box.innerHTML = `
        ${ctxHtml}
        <div class="formula-remind">Rappel : \\(a^0=1\\), \\(a^{-n}=\\dfrac{1}{a^n}\\). Sur la calculatrice, tape la base puis la touche \\(x^y\\) : l'exposant s'affiche en petit, pas besoin de parenthèses. Arrondis si besoin au centième.</div>
        <div class="q-prompt">${prompt}</div>
        <div class="answer-wrap">
            <span class="answer-unit">\\(f(${q.x}) =\\)</span>
            <input type="text" class="answer-input" id="ans" placeholder="…" inputmode="decimal">
        </div>
        ${calcHTML('image')}`;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.image = function (q) {
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const expected = q.value;
    const eps = Math.max(0.02, Math.abs(expected) * 0.015);
    const ok = v !== null && close(v, expected, eps);
    inp.classList.add(ok ? 'ok' : 'err');
    const detail = q.withContext
        ? `\\(f(${q.x}) = ${q.A}\\times ${fmtLatex(q.a)}^{${q.x}} \\approx ${fmt(expected)}\\).`
        : `\\(f(${q.x}) = ${fmtLatex(q.a)}^{${q.x}} \\approx ${fmt(expected)}\\).`;
    if (ok) return { ok: true, msg: `Exact ! ${detail}` };
    return { ok: false, msg: detail };
};

/* ==========================================================
   NIVEAU 3 : EXPOSANT 1/n — RACINES
   ========================================================== */

const SQUARES = [4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144];
const CUBES   = [8, 27, 64, 125, 216];

GENERATORS.racine = function () {
    const n = rndArr([2, 3]);
    let a, answer;
    if (n === 2) {
        a = rndArr(SQUARES);
        answer = Math.round(Math.sqrt(a));
    } else {
        a = rndArr(CUBES);
        answer = Math.round(Math.cbrt(a));
    }
    return { a, n, answer };
};

RENDERERS.racine = function (q, box) {
    const label = q.n === 2 ? `\\(${q.a}^{1/2}\\)` : `\\(${q.a}^{1/3}\\)`;
    const hint = q.n === 2
        ? `Cherche le nombre positif dont le carré vaut ${q.a}.`
        : `Cherche le nombre positif dont le cube vaut ${q.a}.`;
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(a^{1/n}\\) est le nombre positif qui, élevé à la puissance \\(n\\), redonne \\(a\\). Pour \\(n=2\\), c'est la racine carrée ; pour \\(n=3\\), la racine cubique.</div>
        <div class="q-prompt">Que vaut ${label} ?<br><small style="color:var(--text-light);font-weight:400">${hint}</small></div>
        <div class="answer-wrap">
            <span class="answer-unit">${label} =</span>
            <input type="text" class="answer-input narrow" id="ans" placeholder="…" inputmode="decimal">
        </div>`;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.racine = function (q) {
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const ok = v !== null && close(v, q.answer, 0.01);
    inp.classList.add(ok ? 'ok' : 'err');
    const explanation = q.n === 2
        ? `\\(${q.a}^{1/2} = \\sqrt{${q.a}} = ${q.answer}\\), car \\(${q.answer}^2 = ${q.a}\\).`
        : `\\(${q.a}^{1/3} = ${q.answer}\\), car \\(${q.answer}^3 = ${q.a}\\).`;
    if (ok) return { ok: true, msg: `Exact ! ${explanation}` };
    return { ok: false, msg: explanation };
};

/* ==========================================================
   NIVEAU 4 : TAUX D'ÉVOLUTION MOYEN
   ========================================================== */

const CONTEXTES_TAUX = [
    (k, n) => `Le chiffre d'affaires d'une entreprise est multiplié par ${fmt(k)} en ${n} ans.`,
    (k, n) => `Une population est multipliée par ${fmt(k)} en ${n} ans.`,
    (k, n) => `Le prix d'un bien est multiplié par ${fmt(k)} en ${n} ans.`,
    (k, n) => `Un capital placé est multiplié par ${fmt(k)} en ${n} ans.`,
];

GENERATORS.tauxMoyen = function () {
    const kPool = [1.1, 1.15, 1.2, 1.25, 1.3, 1.4, 1.5, 1.8, 2, 0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9];
    const k = rndArr(kPool);
    const n = rnd(2, 6);
    const ctx = rndArr(CONTEXTES_TAUX)(k, n);
    const coeff = Math.pow(k, 1 / n); // 1 + t
    const t = coeff - 1;
    return { k, n, ctx, coeff, t };
};

RENDERERS.tauxMoyen = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : si une quantité est multipliée par \\(k\\) en \\(n\\) périodes identiques, alors \\((1+t)^n = k \\iff 1+t = k^{1/n}\\). Sur la calculatrice : tape \\(k\\), la touche \\(x^y\\), puis la touche \\(a/b\\) pour saisir l'exposant \\(1/n\\) sous forme de fraction (comme sur une vraie calculatrice, sans parenthèses à ajouter).</div>
        <div class="ctx-card"><span class="ctx-label">📝 Situation</span>${q.ctx}</div>
        <div class="step-block active" id="step0">
            <div class="step-tag">Étape 1 · Coefficient multiplicateur par période</div>
            <div class="row-inputs">
                <span class="row-label">\\(1+t =\\)</span>
                <input type="text" class="answer-input narrow" id="ansCoeff" placeholder="…" inputmode="decimal">
            </div>
        </div>
        ${calcHTML('taux')}`;
    setTimeout(() => document.getElementById('ansCoeff')?.focus(), 50);
};

CHECKERS.tauxMoyen = function (q) {
    const box = document.getElementById('exBody');
    const stepsDone = box.querySelectorAll('.step-block.locked').length;

    // ── Étape 1 : coefficient multiplicateur 1+t ──
    if (stepsDone === 0) {
        const inp = document.getElementById('ansCoeff');
        const v = normNum(inp.value);
        inp.classList.remove('ok', 'err');
        const ok = v !== null && close(v, q.coeff, 0.005);
        inp.classList.add(ok ? 'ok' : 'err');
        if (ok) {
            lockStep('step0');
            const hr = document.createElement('hr'); hr.className = 'step-divider';
            box.insertBefore(hr, box.querySelector('.calc-toggle'));
            const div = document.createElement('div'); div.className = 'step-block active'; div.id = 'step1';
            div.innerHTML = `
                <div class="step-tag">Étape 2 · Taux d'évolution moyen en %</div>
                <div class="row-inputs">
                    <span class="row-label">\\(t \\approx\\)</span>
                    <input type="text" class="answer-input narrow" id="ansT" placeholder="…" inputmode="decimal">
                    <span class="row-label">%</span>
                </div>`;
            box.insertBefore(div, box.querySelector('.calc-toggle'));
            renderKatex(div);
            setTimeout(() => document.getElementById('ansT')?.focus(), 50);
            return { ok: true, msg: `\\(1+t = ${fmt(q.k)}^{1/${q.n}} \\approx ${fmt(q.coeff)}\\). Maintenant déduis le taux \\(t\\) en pourcentage !`, advanceOnly: true };
        }
        return { ok: false, msg: `\\(1+t = k^{1/n} = ${fmt(q.k)}^{1/${q.n}} \\approx \\mathbf{${fmt(q.coeff)}}\\).` };
    }

    // ── Étape 2 : taux en pourcentage ──
    const inp = document.getElementById('ansT');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const expectedPct = q.t * 100;
    const ok = v !== null && close(v, expectedPct, 0.5);
    inp.classList.add(ok ? 'ok' : 'err');
    const sign = q.t >= 0 ? '+' : '';
    if (ok) return { ok: true, msg: `Exact ! \\(t \\approx ${fmt(q.t)}\\), soit environ ${sign}${fmt(expectedPct)} % par période.` };
    return { ok: false, msg: `\\(t = (1+t) - 1 \\approx ${fmt(q.coeff)} - 1 = ${fmt(q.t)}\\), soit environ ${sign}${fmt(expectedPct)} % par période.` };
};

/* ==========================================================
   NIVEAU 5 : SENS DE VARIATION
   ========================================================== */

const CONTEXTS_VAR_EXP = [
    a => `La fonction exponentielle \\(f(x) = ${fmtLatex(a)}^{x}\\).`,
    a => `Une fonction \\(f\\) définie par \\(f(x) = ${fmtLatex(a)}^{x}\\).`,
    a => `Une quantité qui évolue selon \\(g(x) = 5\\times ${fmtLatex(a)}^{x}\\).`,
];

GENERATORS.variation = function () {
    const aPool = [0.2, 0.3, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5, 2, 2.5, 3, 4, 5, 10];
    const a = rndArr(aPool);
    const ctx = rndArr(CONTEXTS_VAR_EXP)(a);
    const answer = a > 1 ? 'croissante' : a < 1 ? 'décroissante' : 'constante';
    return { a, ctx, answer };
};

RENDERERS.variation = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(a > 1\\) → croissante &nbsp;|&nbsp; \\(0 < a < 1\\) → décroissante &nbsp;|&nbsp; \\(a = 1\\) → constante</div>
        <div class="q-prompt">${q.ctx}<br>Comment se comporte-t-elle ?</div>
        <div class="choice-grid">
            <button class="choice-btn" data-val="croissante">↗ Croissante</button>
            <button class="choice-btn" data-val="décroissante">↘ Décroissante</button>
            <button class="choice-btn" data-val="constante">→ Constante</button>
        </div>`;
    box._choice = null;
    box.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('chosen'));
            btn.classList.add('chosen');
            box._choice = btn.dataset.val;
        });
    });
};

CHECKERS.variation = function (q) {
    const box = document.getElementById('exBody');
    if (!box._choice) return { ok: false, msg: 'Choisis une réponse !' };

    box.querySelectorAll('.choice-btn').forEach(b => {
        b.classList.remove('ok', 'err');
        if (b.dataset.val === q.answer) b.classList.add('ok');
        else if (b.dataset.val === box._choice) b.classList.add('err');
    });

    const ok = box._choice === q.answer;
    if (q.a === 1) {
        if (ok) return { ok: true, msg: `Exact ! \\(a = 1\\) donc \\(1^x = 1\\) pour tout \\(x\\) : la fonction est constante.` };
        return { ok: false, msg: `\\(a = 1\\) → \\(1^x = 1\\) quel que soit \\(x\\) → la fonction est <strong>constante</strong>.` };
    }
    if (ok) return { ok: true, msg: `Exact ! \\(a = ${fmtLatex(q.a)} ${q.a > 1 ? '> 1' : '< 1 \\text{ (et } a>0)'}\\) donc la fonction est ${q.answer}.` };
    return { ok: false, msg: `\\(a = ${fmtLatex(q.a)} ${q.a > 1 ? '> 1' : ', \\; 0 < a < 1'}\\) → la fonction est <strong>${q.answer}</strong>.` };
};

/* ==========================================================
   NIVEAU 6 : RÉSOUDRE UN PROBLÈME DE SEUIL
   ========================================================== */

const CONTEXTES_SEUIL = [
    (A, a) => `Une population évolue selon \\(P(t) = ${A}\\times ${fmtLatex(a)}^{\\,t}\\) (\\(t\\) en années).`,
    (A, a) => `Un capital évolue selon \\(C(t) = ${A}\\times ${fmtLatex(a)}^{\\,t}\\) (\\(t\\) en années).`,
    (A, a) => `Une dose de médicament dans le sang évolue selon \\(D(t) = ${A}\\times ${fmtLatex(a)}^{\\,t}\\) (\\(t\\) en heures).`,
];

GENERATORS.seuil = function () {
    const growth = Math.random() < 0.5;
    const A = rndArr([20, 50, 80, 100]);
    const a = growth ? rndArr([1.1, 1.15, 1.2, 1.25]) : rndArr([0.75, 0.8, 0.85, 0.9]);
    const tStart = rnd(0, 3);
    const table = [];
    for (let i = 0; i < 5; i++) {
        const t = tStart + i;
        table.push({ t, val: Math.round(A * Math.pow(a, t) * 10) / 10 });
    }
    // Choisit un point de franchissement (pas la 1ère colonne, pour laisser "avant" visible)
    const crossIdx = rnd(1, 4);
    const before = table[crossIdx - 1].val;
    const at = table[crossIdx].val;
    let S = Math.round((before + at) / 2);
    if (growth) {
        if (S <= before) S = before + 1;
        if (S >= at) S = at - 1;
    } else {
        if (S >= before) S = before - 1;
        if (S <= at) S = at + 1;
    }
    const answer = table[crossIdx].t;
    const ctx = rndArr(CONTEXTES_SEUIL)(A, a);
    return { A, a, growth, S, table, answer, ctx };
};

RENDERERS.seuil = function (q, box) {
    const heads = q.table.map(r => `<td>${r.t}</td>`).join('');
    const vals  = q.table.map(r => `<td>${fmt(r.val)}</td>`).join('');
    const comp = q.growth
        ? `dépasse <strong>${fmt(q.S)}</strong>`
        : `passe sous <strong>${fmt(q.S)}</strong>`;
    box.innerHTML = `
        <div class="formula-remind">Sans dérivée ni logarithme à ce niveau, on résout un problème de seuil <strong>par balayage</strong>, à l'aide d'un tableau de valeurs.</div>
        <div class="ctx-card"><span class="ctx-label">📝 Situation</span>${q.ctx}</div>
        <div class="q-prompt">À partir de quelle valeur de \\(t\\) la quantité ${comp} ?</div>
        <div class="suite-table-wrap">
          <table class="suite-table">
            <thead><tr><th>\\(t\\)</th>${heads}</tr></thead>
            <tbody><tr><th>Valeur</th>${vals}</tr></tbody>
          </table>
        </div>
        <div class="answer-wrap">
            <span class="answer-unit">\\(t =\\)</span>
            <input type="text" class="answer-input narrow" id="ans" placeholder="…" inputmode="decimal">
        </div>`;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.seuil = function (q) {
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const ok = v !== null && close(v, q.answer, 0.5);
    inp.classList.add(ok ? 'ok' : 'err');
    const rowBefore = q.table.find(r => r.t === q.answer - 1);
    const rowAt = q.table.find(r => r.t === q.answer);
    const verb = q.growth ? 'dépasse' : 'passe sous';
    const explanation = `En lisant le tableau : à \\(t = ${q.answer - 1}\\), la valeur est ${fmt(rowBefore.val)} ; à \\(t = ${q.answer}\\), elle vaut ${fmt(rowAt.val)}. C'est donc à partir de \\(t = ${q.answer}\\) que la quantité ${verb} ${fmt(q.S)}.`;
    if (ok) return { ok: true, msg: `Exact ! ${explanation}` };
    return { ok: false, msg: explanation };
};
