<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloriage Magique — Relatifs × ÷</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--card:#fff;--txt:#2d2d2d;--txt2:#888;--bdr:#e0ddd5;--acc:#e74c3c;--acc-lt:#fdecea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--txt);max-width:920px;margin:0 auto;padding:12px;-webkit-user-select:none;user-select:none}
h1{font-size:19px;text-align:center;font-weight:700;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:12px}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:700px){.layout{flex-direction:column;align-items:center}}
.col-draw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-panel{flex:1;min-width:0}
.svg-wrap{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:10px;width:min(85vw,380px)}
.svg-wrap svg{width:100%;height:auto}
.zone{fill:#f5f4ef;stroke:#333;stroke-width:1.8;cursor:pointer;transition:fill .2s}
.zone:hover{filter:brightness(.95)}
.zone-num{font-family:'Quicksand',sans-serif;font-weight:700;font-size:11px;fill:#666;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.panel{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:14px}
.panel-empty{display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;min-height:100px;text-align:center;line-height:1.6}
.pcontent{display:none}
.zone-badge{display:inline-block;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;margin-bottom:8px}
.equation{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.qcm{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.qcm-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:10px;background:var(--card);cursor:pointer;transition:all .15s;font-size:15px;font-weight:600;font-family:'Quicksand',sans-serif}
.qcm-btn:hover{background:var(--acc-lt);border-color:var(--acc)}
.qcm-btn.picked{border-color:var(--acc);background:var(--acc-lt)}
.qcm-swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.qcm-letter{width:22px;height:22px;line-height:22px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:11px;border-radius:6px;flex-shrink:0}
.qcm-expr{flex:1;min-width:0}
.leg-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--txt2)}
.leg-grid{display:flex;flex-wrap:wrap;gap:4px}
.leg-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg);font-size:12px}
.leg-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.leg-text{font-weight:600}
.eq-title{font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--txt2)}
.eq-list{display:flex;flex-direction:column;gap:3px}
.eq-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.eq-item:hover{background:var(--acc-lt)}
.eq-item.done{background:#e8f8f0;border-color:#1d9e75}
.eq-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:10px;border-radius:5px;flex-shrink:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{padding:9px 16px;font-size:13px;font-weight:700;font-family:'Quicksand',sans-serif;border:1.5px solid var(--bdr);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-g{background:#1d9e75;color:#fff;border-color:#1d9e75}
.score{text-align:center;font-size:13px;color:var(--txt2);min-height:20px;padding:6px 0}
.score b{color:var(--acc)}
@media(max-width:700px){.svg-wrap{width:min(95vw,380px)}.panel{width:min(95vw,400px)}.equation{font-size:18px}.qcm-btn{font-size:14px;padding:8px 10px}}
</style>
</head>
<body>
<h1>Coloriage Magique — Multiplications et Divisions de Relatifs</h1>
<p class="sub">Effectue le calcul, choisis le bon résultat, et colorie la zone.</p>
<div class="layout">
<div class="col-draw">
  <div class="svg-wrap">
    <svg viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
      <!-- Rocket nose cone -->
      <polygon class="zone" id="z1" points="180,20 145,110 215,110"/>
      <text class="zone-num" x="180" y="80">1</text>
      <!-- Upper body -->
      <rect class="zone" id="z2" x="145" y="110" width="70" height="60"/>
      <text class="zone-num" x="180" y="143">2</text>
      <!-- Window -->
      <circle class="zone" id="z3" cx="180" cy="210" r="25"/>
      <text class="zone-num" x="180" y="210">3</text>
      <!-- Body around window left -->
      <path class="zone" id="z4" d="M145,170 L145,250 L155,250 Q155,210 155,185 Q160,175 170,172 L180,170 Z"/>
      <text class="zone-num" x="152" y="215" style="font-size:9px">4</text>
      <!-- Body around window right -->
      <path class="zone" id="z5" d="M215,170 L215,250 L205,250 Q205,210 205,185 Q200,175 190,172 L180,170 Z"/>
      <text class="zone-num" x="208" y="215" style="font-size:9px">5</text>
      <!-- Lower body -->
      <rect class="zone" id="z6" x="145" y="250" width="70" height="50"/>
      <text class="zone-num" x="180" y="278">6</text>
      <!-- Body bottom -->
      <rect class="zone" id="z7" x="145" y="300" width="70" height="50"/>
      <text class="zone-num" x="180" y="328">7</text>
      <!-- Left fin -->
      <polygon class="zone" id="z8" points="145,280 145,360 95,380 95,340"/>
      <text class="zone-num" x="123" y="345">8</text>
      <!-- Right fin -->
      <polygon class="zone" id="z9" points="215,280 215,360 265,380 265,340"/>
      <text class="zone-num" x="237" y="345">9</text>
      <!-- Nozzle -->
      <polygon class="zone" id="z10" points="155,350 205,350 215,380 145,380"/>
      <text class="zone-num" x="180" y="368">10</text>
      <!-- Flame center -->
      <polygon class="zone" id="z11" points="165,380 195,380 185,440 175,440"/>
      <text class="zone-num" x="180" y="415">11</text>
      <!-- Flame outer left -->
      <polygon class="zone" id="z12" points="155,380 170,380 168,460 148,430"/>
      <text class="zone-num" x="158" y="425">12</text>
      <!-- Flame outer right -->
      <polygon class="zone" id="z13" points="205,380 190,380 192,460 212,430"/>
      <text class="zone-num" x="202" y="425">13</text>
      <!-- Flame tip -->
      <polygon class="zone" id="z14" points="160,450 200,450 180,500"/>
      <text class="zone-num" x="180" y="475">14</text>
      <!-- Star 1 -->
      <circle class="zone" id="z15" cx="60" cy="100" r="15"/>
      <text class="zone-num" x="60" y="100">15</text>
      <!-- Star 2 -->
      <circle class="zone" id="z16" cx="310" cy="160" r="15"/>
      <text class="zone-num" x="310" y="160">16</text>
      <!-- Star 3 -->
      <circle class="zone" id="z17" cx="50" cy="320" r="12"/>
      <text class="zone-num" x="50" y="320">17</text>
      <!-- Star 4 -->
      <circle class="zone" id="z18" cx="310" cy="400" r="12"/>
      <text class="zone-num" x="310" y="400">18</text>
    </svg>
  </div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="razAll()">Tout effacer</button>
    <button class="btn btn-a" onclick="checkAll()">Vérifier</button>
  </div>
</div>
<div class="col-panel">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">← Clique sur une zone<br>pour voir son calcul</div>
    <div class="pcontent" id="pcontent">
      <div class="zone-badge" id="zbadge">Zone 1</div>
      <div class="equation" id="peq"></div>
      <div class="qcm" id="qcm"></div>
    </div>
    <div class="leg-title" style="margin-top:12px">Couleurs</div>
    <div class="leg-grid" id="legGrid"></div>
    <div class="eq-title">Tous les calculs</div>
    <div class="eq-list" id="eqList"></div>
  </div>
</div>
</div>
<script>
const COLORS={
  rouge:{name:"Rouge",css:"#e74c3c"},
  orange:{name:"Orange",css:"#e67e22"},
  jaune:{name:"Jaune",css:"#f1c40f"},
  vert:{name:"Vert",css:"#27ae60"},
  bleu:{name:"Bleu",css:"#5dade2"},
  violet:{name:"Violet",css:"#8e44ad"},
  gris:{name:"Gris",css:"#7f8c8d"},
  blanc:{name:"Blanc",css:"#ecf0f1"}
};

// Multiplications and divisions of signed numbers.
// Mix: (−a)×b, a×(−b), (−a)×(−b), a÷(−b), (−a)÷(−b), chains of 3, etc.
// QCM: 4 choices, typical errors = wrong sign.

const ZONES=[
  // z1: Nose → rouge
  {id:1, eq:"(−1) × (−2) × (−3) × (−2)", sol:12, choices:[
    {val:"12",color:"rouge",correct:true},
    {val:"−12",color:"bleu"},
    {val:"8",color:"vert"},
    {val:"−8",color:"jaune"}]},
  // z2: Upper body → blanc
  {id:2, eq:"(−36) ÷ (−4)", sol:9, choices:[
    {val:"9",color:"blanc",correct:true},
    {val:"−9",color:"rouge"},
    {val:"8",color:"orange"},
    {val:"−8",color:"violet"}]},
  // z3: Window → bleu
  {id:3, eq:"7 × (−3)", sol:-21, choices:[
    {val:"21",color:"blanc"},
    {val:"−21",color:"bleu",correct:true},
    {val:"−10",color:"rouge"},
    {val:"10",color:"jaune"}]},
  // z4: Body left → blanc
  {id:4, eq:"(−5) × (−2) × (−1) × (−3)", sol:30, choices:[
    {val:"−30",color:"violet"},
    {val:"30",color:"blanc",correct:true},
    {val:"−11",color:"rouge"},
    {val:"11",color:"vert"}]},
  // z5: Body right → blanc
  {id:5, eq:"(−48) ÷ (−8)", sol:6, choices:[
    {val:"−6",color:"orange"},
    {val:"6",color:"blanc",correct:true},
    {val:"−8",color:"rouge"},
    {val:"8",color:"bleu"}]},
  // z6: Lower body → gris
  {id:6, eq:"(−2) × (−3) × (−4)", sol:-24, choices:[
    {val:"−24",color:"gris",correct:true},
    {val:"24",color:"blanc"},
    {val:"−9",color:"vert"},
    {val:"9",color:"rouge"}]},
  // z7: Body bottom → gris
  {id:7, eq:"42 ÷ (−6)", sol:-7, choices:[
    {val:"7",color:"orange"},
    {val:"−7",color:"gris",correct:true},
    {val:"−8",color:"bleu"},
    {val:"8",color:"rouge"}]},
  // z8: Left fin → rouge
  {id:8, eq:"(−4) × (−3)", sol:12, choices:[
    {val:"12",color:"rouge",correct:true},
    {val:"−12",color:"gris"},
    {val:"1",color:"jaune"},
    {val:"−1",color:"violet"}]},
  // z9: Right fin → rouge
  {id:9, eq:"(−2) × (−1) × 3 × (−1) × (−2)", sol:12, choices:[
    {val:"−12",color:"bleu"},
    {val:"8",color:"blanc"},
    {val:"12",color:"rouge",correct:true},
    {val:"−8",color:"vert"}]},
  // z10: Nozzle → gris
  {id:10, eq:"(−56) ÷ 8", sol:-7, choices:[
    {val:"−7",color:"gris",correct:true},
    {val:"7",color:"rouge"},
    {val:"−8",color:"violet"},
    {val:"48",color:"jaune"}]},
  // z11: Flame center → jaune
  {id:11, eq:"(−9) × (−2)", sol:18, choices:[
    {val:"18",color:"jaune",correct:true},
    {val:"−18",color:"gris"},
    {val:"−11",color:"bleu"},
    {val:"11",color:"rouge"}]},
  // z12: Flame outer left → orange
  {id:12, eq:"(−3) × (−5)", sol:15, choices:[
    {val:"−15",color:"violet"},
    {val:"15",color:"orange",correct:true},
    {val:"−8",color:"bleu"},
    {val:"8",color:"vert"}]},
  // z13: Flame outer right → orange
  {id:13, eq:"(−60) ÷ (−4)", sol:15, choices:[
    {val:"15",color:"orange",correct:true},
    {val:"−15",color:"gris"},
    {val:"56",color:"rouge"},
    {val:"−56",color:"bleu"}]},
  // z14: Flame tip → rouge
  {id:14, eq:"(−6) × (−2)", sol:12, choices:[
    {val:"−12",color:"orange"},
    {val:"12",color:"rouge",correct:true},
    {val:"−4",color:"bleu"},
    {val:"4",color:"vert"}]},
  // z15: Star 1 → jaune
  {id:15, eq:"(−1) × (−1) × (−1) × (−1) × (−9) × (−2)", sol:18, choices:[
    {val:"−18",color:"rouge"},
    {val:"18",color:"jaune",correct:true},
    {val:"−14",color:"violet"},
    {val:"14",color:"blanc"}]},
  // z16: Star 2 → jaune
  {id:16, eq:"(−72) ÷ (−4)", sol:18, choices:[
    {val:"18",color:"jaune",correct:true},
    {val:"−18",color:"gris"},
    {val:"−76",color:"bleu"},
    {val:"76",color:"rouge"}]},
  // z17: Star 3 → jaune
  {id:17, eq:"(−1) × (−1) × 2 × (−3) × (−3)", sol:18, choices:[
    {val:"18",color:"jaune",correct:true},
    {val:"−18",color:"violet"},
    {val:"−10",color:"rouge"},
    {val:"10",color:"vert"}]},
  // z18: Star 4 → jaune
  {id:18, eq:"(−90) ÷ (−5)", sol:18, choices:[
    {val:"−18",color:"orange"},
    {val:"18",color:"jaune",correct:true},
    {val:"85",color:"gris"},
    {val:"−85",color:"bleu"}]},
];

let zoneColors={},selZone=-1;
function init(){buildLegend();buildEqList();ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el)el.addEventListener('click',()=>selectZone(z.id));});}
function selectZone(id){selZone=id;document.getElementById('pempty').style.display='none';document.getElementById('pcontent').style.display='block';const z=ZONES.find(z=>z.id===id);document.getElementById('zbadge').textContent='Zone '+id;document.getElementById('peq').textContent=z.eq+' = ?';buildQCM(z);document.querySelectorAll('.eq-item').forEach(el=>{el.style.outline=el.dataset.id==id?'2px solid var(--acc)':'none';});if(window.innerWidth<=700)document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});}
function buildQCM(z){const qcm=document.getElementById('qcm');qcm.innerHTML='';const L=['A','B','C','D'];z.choices.forEach((ch,i)=>{const btn=document.createElement('div');btn.className='qcm-btn'+(zoneColors[z.id]===ch.color?' picked':'');btn.innerHTML='<span class="qcm-letter">'+L[i]+'</span><div class="qcm-swatch" style="background:'+COLORS[ch.color].css+'"></div><span class="qcm-expr">'+ch.val+'</span>';btn.addEventListener('click',()=>pickChoice(z.id,ch.color));qcm.appendChild(btn);});}
function pickChoice(zid,ck){zoneColors[zid]=ck;const el=document.getElementById('z'+zid);if(el){el.style.fill=COLORS[ck].css;el.classList.add('colored');}const z=ZONES.find(z=>z.id===zid);buildQCM(z);const ei=document.querySelector('.eq-item[data-id="'+zid+'"]');if(ei)ei.classList.add('done');}
function buildLegend(){const g=document.getElementById('legGrid');const r=document.createElement('div');r.style.cssText='font-size:12px;color:var(--txt2);margin-bottom:6px;line-height:1.5;width:100%';r.innerHTML='Effectue le calcul puis choisis <b>le bon résultat</b>. Attention aux signes !';g.appendChild(r);for(const[k,c] of Object.entries(COLORS)){const i=document.createElement('div');i.className='leg-item';i.innerHTML='<div class="leg-swatch" style="background:'+c.css+'"></div><span class="leg-text">'+c.name+'</span>';g.appendChild(i);}}
function buildEqList(){const l=document.getElementById('eqList');ZONES.forEach(z=>{const i=document.createElement('div');i.className='eq-item';i.dataset.id=z.id;i.innerHTML='<span class="eq-num">'+z.id+'</span> '+z.eq;i.addEventListener('click',()=>selectZone(z.id));l.appendChild(i);});}
function checkAll(){let ok=0;ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);const c=z.choices.find(c=>c.correct).color;if(zoneColors[z.id]===c){ok++;el.style.stroke='#1d9e75';el.style.strokeWidth='3';}else if(zoneColors[z.id]!==undefined){el.style.stroke='#e24b4a';el.style.strokeWidth='3';}});const s=document.getElementById('score');if(ok===ZONES.length)s.innerHTML='🎉 <b>Parfait !</b> '+ok+'/'+ZONES.length+' zones correctes !';else s.innerHTML='<b>'+ok+'/'+ZONES.length+'</b> zones correctes';}
function razAll(){zoneColors={};ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el){el.style.fill='#f5f4ef';el.style.stroke='#333';el.style.strokeWidth='1.8';el.classList.remove('colored');}});document.querySelectorAll('.eq-item').forEach(el=>{el.classList.remove('done');el.style.outline='none';});document.getElementById('score').innerHTML='';document.getElementById('pempty').style.display='flex';document.getElementById('pcontent').style.display='none';selZone=-1;}
init();
</script>
<a href="index.html" class="btn-retour-flottant"><span>🏠</span> Menu</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5c67f2;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5c67f2;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all .3s ease}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5c67f2;color:white}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem}}
</style>
</body>
</html>
