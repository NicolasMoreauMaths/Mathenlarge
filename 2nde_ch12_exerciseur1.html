<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonctions de référence — Exerciseur</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#eef2f7;--grid:#d5dce6;--card:#fff;
  --blue:#1a6fa0;--blue-l:#2d8dc7;--blue-pale:rgba(26,111,160,0.08);
  --purple:#6b3fa0;
  --orange:#b85c0b;--orange-pale:rgba(184,92,11,0.1);
  --green:#1b7a40;--green-pale:rgba(27,122,64,0.1);
  --red:#c0392b;--red-pale:rgba(192,57,43,0.08);
  --gold:#b8860b;--gold-pale:rgba(184,134,11,0.12);
  --text:#1e293b;--text-l:#64748b;--border:#e2e8f0;--shadow:rgba(30,41,59,0.08);
  --C:#1a6fa0;--C-pale:rgba(26,111,160,0.1);
  --I:#6b3fa0;--I-pale:rgba(107,63,160,0.1);
  --S:#1b7a40;--S-pale:rgba(27,122,64,0.1);
  --K:#0f766e;--K-pale:rgba(15,118,110,0.1);
}
body{font-family:'DM Sans',sans-serif;min-height:100vh;background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;display:flex;justify-content:center;padding:16px 10px 60px;color:var(--text);}
.app{max-width:920px;width:100%;}
.app-header{background:linear-gradient(135deg,#0c1624,#162236 45%,#1c3358);color:#fff;
  padding:18px 24px;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 20px rgba(12,22,36,0.4);position:relative;overflow:hidden;}
.app-header::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.07),transparent 50%);pointer-events:none;}
.app-header-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--C),var(--I),var(--S),var(--K));}
.app-title{font-size:1.15em;font-weight:700;position:relative;display:flex;align-items:center;gap:10px;}
.app-title::before{content:'📐';font-size:1.1em;}
.btn-hdr{background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.4);color:#fff;
  padding:8px 16px;border-radius:10px;font-size:0.85em;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .2s;display:none;align-items:center;gap:5px;}
.btn-hdr:hover{background:rgba(255,255,255,0.3);}
.btn-hdr.vis{display:flex;}
.main{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;
  padding:32px 28px;box-shadow:0 8px 28px var(--shadow);min-height:60vh;}
.screen{display:none;animation:fadeIn .3s ease;}.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1{font-size:1.4em;font-weight:700;text-align:center;margin-bottom:8px;color:var(--blue);}
.sub{text-align:center;font-size:.91em;color:var(--text-l);margin-bottom:20px;line-height:1.6;}
.menu-sect{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-l);
  margin:22px 0 6px 2px;display:flex;align-items:center;gap:8px;}
.menu-sect::after{content:'';flex:1;height:1px;background:var(--border);}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0;}
.mc{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px 12px 14px;text-align:center;
  cursor:pointer;transition:all .25s;position:relative;min-height:116px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mc:hover{transform:translateY(-3px);box-shadow:0 8px 24px var(--shadow);}
.mc.C:hover{border-color:var(--C);}.mc.I:hover{border-color:var(--I);}.mc.S:hover{border-color:var(--S);}.mc.K:hover{border-color:var(--K);}.mc.M:hover{border-color:var(--gold);}
.mc-icon{font-size:1.7em;margin-bottom:5px;}
.mc-t{font-size:.83em;font-weight:700;margin-bottom:3px;line-height:1.3;}
.mc-t.C{color:var(--C);}.mc-t.I{color:var(--I);}.mc-t.S{color:var(--S);}.mc-t.K{color:var(--K);}.mc-t.M{color:var(--gold);}
.mc-d{font-size:.71em;color:var(--text-l);line-height:1.4;}
.mc-tag{position:absolute;top:8px;font-size:.67em;font-weight:700;padding:2px 8px;border-radius:10px;}
.mc-tag.left{left:9px;}
.mc-tag.right{right:9px;background:var(--orange-pale);color:var(--orange);}
.mc-tag.C{background:var(--C-pale);color:var(--C);}
.mc-tag.I{background:var(--I-pale);color:var(--I);}
.mc-tag.S{background:var(--S-pale);color:var(--S);}
.mc-tag.K{background:var(--K-pale);color:var(--K);}
.ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.ex-badge{padding:6px 16px;border-radius:20px;font-size:.83em;font-weight:700;}
.ex-badge.C{background:var(--C-pale);color:var(--C);}
.ex-badge.I{background:var(--I-pale);color:var(--I);}
.ex-badge.S{background:var(--S-pale);color:var(--S);}
.ex-badge.K{background:var(--K-pale);color:var(--K);}
.ex-badge.M{background:var(--gold-pale);color:var(--gold);}
.ex-score{font-size:.87em;color:var(--text-l);font-weight:600;}
.pbar{width:100%;background:var(--border);border-radius:6px;height:6px;overflow:hidden;margin-bottom:20px;}
.pfill{height:100%;background:linear-gradient(90deg,var(--C),var(--I),var(--S));border-radius:6px;transition:width .4s;}
.btn{font-family:'DM Sans',sans-serif;padding:10px 22px;border-radius:12px;font-size:.92em;font-weight:600;
  cursor:pointer;transition:all .2s;border:2px solid;min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-blue:hover:not(:disabled){background:var(--blue-l);transform:translateY(-2px);}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px);}
.btn-ghost{background:transparent;color:var(--text-l);border-color:var(--border);}
.btn-ghost:hover{background:var(--bg);border-color:var(--text-l);}
.btn-sm{padding:6px 14px;font-size:.8em;min-height:32px;border-radius:8px;}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.formula-box{background:var(--gold-pale);border:1.5px dashed var(--gold);border-radius:10px;
  padding:10px 16px;font-size:.85em;color:#7a5800;margin:0 0 16px;text-align:center;line-height:1.9;}
.ctx-card{background:linear-gradient(135deg,#f5f9ff,#eff4ff);border:1.5px solid #c5d8f0;border-radius:12px;
  padding:14px 18px;margin-bottom:16px;font-size:.95em;line-height:1.7;text-align:center;}
.ctx-label{font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:5px;display:block;}
.hint-box{background:var(--blue-pale);border:1.5px dashed var(--blue);border-radius:10px;
  padding:12px 16px;font-size:.88em;color:var(--blue);margin:14px 0;text-align:center;line-height:1.7;}
.graph-toggle-bar{display:flex;justify-content:flex-end;margin-bottom:4px;}
.gwrap{margin:4px 0 16px;transition:all .3s;}
.gwrap.hidden{display:none;}
.gsvg{width:100%;max-width:520px;height:auto;background:#fbfdff;border:1.5px solid var(--border);border-radius:12px;display:block;margin:0 auto;}
.ai{font-family:'DM Sans',sans-serif;font-size:1.18em;font-weight:700;padding:8px 10px;
  text-align:center;border:3px dashed var(--purple);border-radius:12px;background:#fff;
  outline:none;transition:all .2s;color:var(--text);}
.ai:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale);}
.ai.ok{border-color:var(--green)!important;background:var(--green-pale);color:var(--green);border-style:solid;}
.ai.err{border-color:var(--red)!important;background:var(--red-pale);animation:shake .3s;border-style:solid;}
.ai-w{width:130px;}.ai-n{width:80px;}.ai-xl{width:200px;}
.arow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0;}
.arow-lbl{font-size:.87em;font-weight:600;color:var(--text-l);}
.sqrt-pad{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px;}
.sqrt-btn{font-family:'DM Sans',sans-serif;font-size:.88em;font-weight:700;padding:5px 12px;
  border:2px solid var(--S-pale);border-radius:8px;background:var(--S-pale);color:var(--S);cursor:pointer;transition:all .2s;}
.sqrt-btn:hover{border-color:var(--S);background:var(--green-pale);}
.cgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
.cbtn{font-family:'DM Sans',sans-serif;font-size:.92em;font-weight:700;padding:12px 18px;
  border:2px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;transition:all .2s;
  min-width:100px;text-align:center;line-height:1.5;}
.cbtn:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px);}
.cbtn:disabled{opacity:.65;cursor:not-allowed;}
.cbtn.chosen{background:var(--purple);border-color:var(--purple);color:#fff;}
.cbtn.ok{background:var(--green-pale);border-color:var(--green);color:var(--green);}
.cbtn.err{background:var(--red-pale);border-color:var(--red);color:var(--red);animation:shake .3s;}
.step{margin-bottom:16px;}.step.locked{opacity:.88;}
.step.locked .ai,.step.locked .cbtn{pointer-events:none;}
.sdiv{border:none;border-top:1.5px dashed var(--border);margin:6px auto 18px;max-width:560px;}
.stag{display:block;font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-l);text-align:center;margin-bottom:9px;}
.stag.done{color:var(--green);}.stag.done::before{content:'✓  ';}
.qprompt{font-size:1em;font-weight:600;margin-bottom:14px;line-height:1.6;text-align:center;}
.stable{display:flex;justify-content:center;margin:12px auto;overflow-x:auto;}
.st{border-collapse:collapse;}
.st td{padding:6px 12px;text-align:center;font-weight:700;font-size:.9em;
  border-top:2.5px solid var(--text);border-bottom:2.5px solid var(--text);white-space:nowrap;}
.st .lc{border:none!important;text-align:right;padding-right:10px;color:var(--text-l);font-size:.78em;font-weight:600;}
.st .xc{border-left:3px double var(--purple);border-right:3px double var(--purple);}
.st .gc{font-size:1.05em;color:var(--blue);}
.st .fc{background:#fdecea;color:var(--red);font-weight:900;border-left:3px solid var(--red)!important;border-right:3px solid var(--red)!important;}
.st .pos{color:var(--green);font-weight:800;}
.st .neg{color:var(--red);font-weight:800;}
.st .zer{color:var(--gold);font-weight:800;}
.vtable{display:flex;justify-content:center;margin:12px auto;overflow-x:auto;}
.vt{border-collapse:collapse;}
.vt td{padding:7px 12px;text-align:center;font-weight:700;font-size:.9em;
  border-top:2.5px solid var(--text);border-bottom:2.5px solid var(--text);white-space:nowrap;}
.vt .lc{border:none!important;text-align:right;padding-right:10px;color:var(--text-l);font-size:.78em;font-weight:600;}
.vt .xc{border-left:3px double var(--purple);border-right:3px double var(--purple);}
.vt .gc{font-size:1.05em;color:var(--blue);}
.vt .fc{background:#fdecea;color:var(--red);font-weight:900;border-left:3px solid var(--red)!important;border-right:3px solid var(--red)!important;}
.fb{margin-top:18px;padding:14px 18px;border-radius:12px;font-size:.93em;text-align:center;
  display:none;animation:fadeIn .3s;font-weight:600;line-height:1.7;}
.fb.ok{display:block;background:var(--green-pale);color:var(--green);border:2px solid rgba(27,122,64,.2);}
.fb.bad{display:block;background:var(--red-pale);color:var(--red);border:2px solid rgba(192,57,43,.15);}
.rc{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:18px auto;border:6px solid;}
.rc.good{border-color:var(--green);background:var(--green-pale);}
.rc.mid{border-color:var(--orange);background:var(--orange-pale);}
.rc.bad{border-color:var(--red);background:var(--red-pale);}
.rp{font-size:2em;font-weight:700;line-height:1;}
.rm{font-size:1em;text-align:center;margin:14px 0;line-height:1.5;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@media(max-width:640px){
  .app-header{padding:12px 14px;}.app-title{font-size:.95em;}
  .main{padding:18px 12px;}h1{font-size:1.15em;}
  .mgrid{grid-template-columns:1fr 1fr;}
  .ai-w{width:112px;}.ai-xl{width:170px;}
}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(26,111,160,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(26,111,160,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 900px tablette ── */
@media(max-width:900px){
  .app { padding:0 12px; }
  .main { padding:12px; }
}
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-header-bar { flex-wrap:wrap; gap:4px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .mc-badge, .ex-badge { font-size:0.7rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }
  .choice-btn, .choice-grid .btn { font-size:0.85rem; padding:8px; }
  .choice-grid { gap:6px; }
  .q-prompt { font-size:0.9rem; }
  .screen { font-size:0.85rem; padding:10px; }
  .step-block { padding:8px; }
  .step-tag { font-size:0.75rem; }
  .fb { font-size:0.85rem; padding:8px; }
  .formula-remind, .formula-box { font-size:0.85rem; padding:8px; overflow-x:auto; }
  .ctx-card { padding:8px; font-size:0.85rem; }
  .answer-input, .ans-input { font-size:0.9rem; }
  .answer-wrap, .row-inputs { flex-wrap:wrap; gap:6px; }
  .pbar { height:6px; }
  .mode-toggle, .mode-btn { font-size:0.8rem; }
  .menu-btn { font-size:0.8rem; }
  .ex-top { flex-wrap:wrap; gap:4px; }
  .ex-score { font-size:0.8rem; }
}
/* ── overflow helpers ── */
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
svg[viewBox] { max-width:100%; height:auto; }
.mc, .screen, .step-block { overflow-wrap:break-word; word-break:break-word; }

@media(max-width:380px){
  .formula-box { font-size:0.82rem; padding:6px; overflow-x:auto; }
  .cgrid, .mgrid { gap:4px; }
  .gwrap { overflow-x:auto; max-width:100%; }
  .graph-toggle-bar { flex-wrap:wrap; gap:4px; }
  .arow { flex-wrap:wrap; gap:4px; }
  .arow-lbl { font-size:0.8rem; }
  .hint-box { font-size:0.82rem; padding:8px; }
  .ai, .ai-w, .ai-xl { font-size:0.85rem; }
  .vtable { font-size:0.75rem; overflow-x:auto; display:block; }
}

</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-title">Fonctions de référence — 2<sup>de</sup></div>
    <button class="btn-hdr" id="hdrMenu">☰ Menu</button>
    <div class="app-header-bar"></div>
  </div>
  <div class="main">
    <div class="screen active" id="S_menu">
      <h1>Fonctions de référence</h1>
      <p class="sub" id="subTitle"></p>
      <div class="menu-sect C" id="sectC"></div>
      <div class="mgrid" id="gC"></div>
      <div class="menu-sect I" id="sectI"></div>
      <div class="mgrid" id="gI"></div>
      <div class="menu-sect S" id="sectS"></div>
      <div class="mgrid" id="gS"></div>
      <div class="menu-sect K" id="sectK"></div>
      <div class="mgrid" id="gK"></div>
      <div class="menu-sect M" id="sectM" style="color:var(--gold)">Bilan mixte</div>
      <div class="mgrid" id="gM"></div>
    </div>
    <div class="screen" id="S_ex">
      <div class="ex-top">
        <span class="ex-badge C" id="exBadge"></span>
        <span class="ex-score">Score : <span id="scLbl">0/0</span></span>
      </div>
      <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
      <div id="zone"></div>
      <div class="hint-box" id="hintBox" style="display:none"></div>
      <div class="fb" id="fb"></div>
      <div class="controls">
        <button class="btn btn-ghost" id="btnMenu">← Menu</button>
        <button class="btn btn-ghost" id="btnHint">💡 Indice</button>
        <button class="btn btn-green" id="btnCheck">✓ Vérifier</button>
        <button class="btn btn-blue" id="btnNext" style="display:none">Suivant →</button>
      </div>
    </div>
    <div class="screen" id="S_res">
      <h1>Résultats</h1>
      <div class="rc" id="rc"><div class="rp" id="rPct">—</div></div>
      <p class="rm" id="rMsg"></p>
      <div class="controls">
        <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
        <button class="btn btn-blue" id="btnRetry">🔁 Recommencer</button>
      </div>
    </div>
  </div>
</div>
<script>

/* ═══ UTILS ═══ */
const $=id=>document.getElementById(id);
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[rnd(0,arr.length-1)];}

/* KaTeX: render \(...\) and \[...\] in an element */
function rk(el){
  if(!el||!window.renderMathInElement)return;
  renderMathInElement(el,{
    delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
    throwOnError:false
  });
}

/* Render a KaTeX string into a NEW span and return it */
function katexSpan(tex){
  const s=document.createElement('span');
  s.textContent='\\('+tex+'\\)';
  rk(s);
  return s;
}

/* Safe numeric parse */
function normNum(s){
  if(s==null)return null;
  s=String(s).trim().replace(',','.').replace(/\s/g,'').replace(/\u2212/g,'-');
  if(!s)return null;
  if(s.includes('/')){const[n,d]=s.split('/').map(Number);if(isNaN(n)||isNaN(d)||d===0)return null;return n/d;}
  const v=parseFloat(s);return isNaN(v)?null:v;
}
function safeEval(expr){
  try{
    let s=String(expr).replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s/g,'');
    if(!/^[-\d.+*\/()^√]+$/.test(s))return NaN;
    s=s.replace(/√(\d+(?:\.\d+)?)/g,'Math.sqrt($1)');
    return Function('"use strict";return('+s+')')();
  }catch{return NaN;}
}
function okNum(a,b){
  if(a===null||b===null||!isFinite(a)||!isFinite(b))return false;
  return Math.abs(a-b)<0.012||(Math.abs(b)>0.001&&Math.abs((a-b)/b)<0.008);
}
function r2(x){return Math.round(x*100)/100;}
function r4(x){return Math.round(x*10000)/10000;}
function fmtN(x){if(!isFinite(x))return '∞';return String(r2(x)).replace('.',',');}
function texN(n){
  if(!isFinite(n))return '+\\infty';
  if(Number.isInteger(n))return String(n);
  for(let d=2;d<=20;d++){const num=n*d;if(Math.abs(Math.round(num)-num)<1e-9){const m=Math.round(num);const g=gcd(Math.abs(m),d);return`\\frac{${m/g}}{${d/g}}`;}}
  return fmtN(n);
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}

function mkBtn(tex, val, extraClass){

function mkCgrid(choices, gridSel){

/* ═══ GRAPH SVG ═══ */
function makeGraph(fnType,opts){
  opts=opts||{};
  const W=520,H=290,pL=40,pR=20,pT=18,pB=28;
  let xmin=opts.xmin||(fnType==='racine'?-0.5:fnType==='cube'?-3.3:-4.5);
  let xmax=opts.xmax||(fnType==='racine'?10:fnType==='cube'?3.3:4.5);
  let ymin=opts.ymin||(fnType==='carre'?-0.6:fnType==='racine'?-0.4:fnType==='cube'?-30:-4.8);
  let ymax=opts.ymax||(fnType==='carre'?20:fnType==='cube'?30:4.8);
  if(opts.markX!==undefined){
    const mx=opts.markX;
    if(fnType==='carre'){const my=mx*mx;if(my>ymax-1)ymax=my+2;if(mx<xmin+0.5)xmin=mx-0.5;if(mx>xmax-0.5)xmax=mx+0.5;}
    else if(fnType==='racine'){if(mx>xmax-1)xmax=mx+2;const my=Math.sqrt(mx);if(my>ymax-0.5)ymax=my+1;}
    else if(fnType==='cube'){const my=mx*mx*mx;if(my>ymax-1)ymax=my+3;if(my<ymin+1)ymin=my-3;if(mx<xmin+0.5)xmin=mx-0.5;if(mx>xmax-0.5)xmax=mx+0.5;}
  }
  if(opts.markY!==undefined){
    const my=opts.markY;
    if(fnType==='carre'&&my>0){const s=Math.sqrt(my);if(s>xmax-0.5)xmax=s+1;if(-s<xmin+0.5)xmin=-s-1;if(my>ymax-1)ymax=my+2;}
    else if(fnType==='racine'&&my>=0){const mx2=my*my;if(mx2>xmax-1)xmax=mx2+2;}
    else if(fnType==='cube'){const mx3=Math.cbrt(my);if(mx3>xmax-0.5)xmax=mx3+1;if(mx3<xmin+0.5)xmin=mx3-1;if(my>ymax-1)ymax=my+3;if(my<ymin+1)ymin=my-3;}
  }
  if(opts.lineY!==undefined&&opts.lineY>ymax-1)ymax=opts.lineY+2;
  if(opts.lineY!==undefined&&opts.lineY<ymin+1)ymin=opts.lineY-2;
  const toX=x=>pL+(x-xmin)/(xmax-xmin)*(W-pL-pR);
  const toY=y=>H-pB-(y-ymin)/(ymax-ymin)*(H-pT-pB);
  const ax=toX(0),ay=toY(0);
  let g='';
  const tx=xmax-xmin>12?2:1, ty=ymax-ymin>12?2:1;
  for(let gx=Math.ceil(xmin);gx<=Math.floor(xmax);gx++){
    g+=`<line x1="${toX(gx)}" y1="${pT}" x2="${toX(gx)}" y2="${H-pB}" stroke="#d5dce6" stroke-width="1"/>`;
    if(gx!==0&&gx%tx===0)g+=`<text x="${toX(gx)}" y="${Math.min(ay+15,H-pB+14)}" font-size="11" text-anchor="middle" fill="#64748b">${gx}</text>`;
  }
  for(let gy=Math.ceil(ymin);gy<=Math.floor(ymax);gy++){
    g+=`<line x1="${pL}" y1="${toY(gy)}" x2="${W-pR}" y2="${toY(gy)}" stroke="#d5dce6" stroke-width="1"/>`;
    if(gy!==0&&gy%ty===0)g+=`<text x="${Math.max(ax-6,pL-4)}" y="${toY(gy)+4}" font-size="11" text-anchor="end" fill="#64748b">${gy}</text>`;
  }
  const ay0=Math.min(Math.max(ay,pT),H-pB),ax0=Math.min(Math.max(ax,pL),W-pR);
  g+=`<line x1="${pL}" y1="${ay0}" x2="${W-pR}" y2="${ay0}" stroke="#1e293b" stroke-width="1.8"/>
      <line x1="${ax0}" y1="${pT}" x2="${ax0}" y2="${H-pB}" stroke="#1e293b" stroke-width="1.8"/>
      <polygon points="${W-pR},${ay0} ${W-pR-7},${ay0-4} ${W-pR-7},${ay0+4}" fill="#1e293b"/>
      <polygon points="${ax0},${pT} ${ax0-4},${pT+7} ${ax0+4},${pT+7}" fill="#1e293b"/>
      <text x="${W-pR-3}" y="${ay0-7}" font-size="12" fill="#1e293b" text-anchor="end">x</text>
      <text x="${ax0+5}" y="${pT+11}" font-size="12" fill="#1e293b">y</text>`;
  const COL={carre:'#1a6fa0',inverse:'#6b3fa0',racine:'#1b7a40',cube:'#0f766e'};
  const col=COL[fnType];
  function path(x0,x1,fn){
    const pts=[];
    for(let i=0;i<=400;i++){const x=x0+(x1-x0)*i/400,y=fn(x);if(!isFinite(y)||y<ymin-0.5||y>ymax+0.5)continue;pts.push(`${toX(x).toFixed(1)},${toY(y).toFixed(1)}`);}
    return pts.length>1?`<path d="M ${pts.join(' L ')}" fill="none" stroke="${col}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`:'';
  }
  if(fnType==='carre')g+=path(xmin,xmax,x=>x*x);
  else if(fnType==='inverse'){g+=path(xmin,-0.04,x=>1/x);g+=path(0.04,xmax,x=>1/x);}
  else if(fnType==='cube')g+=path(xmin,xmax,x=>x*x*x);
  else g+=path(0,xmax,x=>Math.sqrt(x));
  if(opts.lineY!==undefined&&isFinite(opts.lineY)){
    const ly=toY(opts.lineY);
    if(ly>=pT&&ly<=H-pB){
      const kstr=Number.isInteger(opts.lineY)?String(opts.lineY):r2(opts.lineY);
      g+=`<line x1="${pL}" y1="${ly}" x2="${W-pR}" y2="${ly}" stroke="#b85c0b" stroke-width="1.8" stroke-dasharray="6,4"/>`;
      g+=`<text x="${pL+3}" y="${ly-4}" font-size="11" fill="#b85c0b">y=${kstr}</text>`;
    }
  }
  if(opts.markX!==undefined){
    const mx=opts.markX;
    let my=fnType==='carre'?mx*mx:fnType==='inverse'?1/mx:fnType==='cube'?mx*mx*mx:Math.sqrt(mx);
    if(isFinite(my)&&my>=ymin&&my<=ymax){
      g+=`<line x1="${toX(mx)}" y1="${ay0}" x2="${toX(mx)}" y2="${toY(my)}" stroke="rgba(184,92,11,.6)" stroke-width="1.5" stroke-dasharray="5,4"/>
          <line x1="${ax0}" y1="${toY(my)}" x2="${toX(mx)}" y2="${toY(my)}" stroke="rgba(184,92,11,.6)" stroke-width="1.5" stroke-dasharray="5,4"/>
          <circle cx="${toX(mx)}" cy="${toY(my)}" r="5.5" fill="#6b3fa0" stroke="#fff" stroke-width="1.5"/>`;
    }
  }
  if(opts.markY!==undefined){
    const my=opts.markY;
    let mxs=[];
    if(fnType==='carre'&&my>=0){mxs=my===0?[0]:[Math.sqrt(my),-Math.sqrt(my)];}
    else if(fnType==='inverse'&&my!==0){mxs=[1/my];}
    else if(fnType==='racine'&&my>=0){mxs=[my*my];}
    else if(fnType==='cube'){mxs=[Math.cbrt(my)];}
    mxs.forEach(mx=>{
      if(!isFinite(mx)||mx<xmin||mx>xmax)return;
      g+=`<line x1="${toX(mx)}" y1="${ay0}" x2="${toX(mx)}" y2="${toY(my)}" stroke="rgba(184,92,11,.6)" stroke-width="1.5" stroke-dasharray="5,4"/>
          <line x1="${ax0}" y1="${toY(my)}" x2="${toX(mx)}" y2="${toY(my)}" stroke="rgba(184,92,11,.6)" stroke-width="1.5" stroke-dasharray="5,4"/>
          <circle cx="${toX(mx)}" cy="${toY(my)}" r="5.5" fill="#6b3fa0" stroke="#fff" stroke-width="1.5"/>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="gsvg" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;">${g}</svg>`;
}

function graphBlock(fnType,opts){
  const wrap=document.createElement('div');

}

/* ═══ VARIATION / SIGN TABLES ═══ 
   Built via DOM, never innerHTML with math strings
*/
function makeVarTable(rows){
  // rows: array of {label_tex, cells: [{tex, cls, va}], arrows:[{tex,cls}]}
  // label_tex: KaTeX string for row header
  // cells: column values; arrows: between columns
  const wrap=document.createElement('div');wrap.className='vtable';
  const tbl=document.createElement('table');tbl.className='vt';
  rows.forEach(row=>{
    const tr=document.createElement('tr');
    // label cell
    const lc=document.createElement('td');lc.className='lc';
    lc.textContent='\\('+row.label+'\\)';rk(lc);
    tr.appendChild(lc);
    row.cells.forEach((cell,i)=>{
      const td=document.createElement('td');
      if(cell.cls)td.className=cell.cls;
      if(cell.va)td.style.verticalAlign=cell.va==='top'?'top':'bottom',td.style.paddingTop=cell.va==='top'?'4px':'',td.style.paddingBottom=cell.va==='bot'?'4px':'';
      if(cell.tex==='||'){td.textContent='||';}
      else{td.textContent='\\('+cell.tex+'\\)';rk(td);}
      tr.appendChild(td);
      // gap/arrow after (except last) — always add gap cell for alignment
      if(i<row.cells.length-1){
        const ga=document.createElement('td');ga.className='gc';
        if(row.arrows&&row.arrows[i])ga.textContent=row.arrows[i];
        tr.appendChild(ga);
      }
    });
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);return wrap;
}

function makeSignTable(rows){
  // Same structure as makeVarTable but class .stable/.st
  const wrap=document.createElement('div');wrap.className='stable';
  const tbl=document.createElement('table');tbl.className='st';
  rows.forEach(row=>{
    const tr=document.createElement('tr');
    const lc=document.createElement('td');lc.className='lc';
    lc.textContent='\\('+row.label+'\\)';rk(lc);
    tr.appendChild(lc);
    row.cells.forEach((cell,i)=>{
      const td=document.createElement('td');
      if(cell.cls)td.className=cell.cls;
      if(cell.content==='||'){td.textContent='||';}
      else if(cell.content==='+'){td.className=(td.className+' pos').trim();td.textContent='+';}
      else if(cell.content==='-'){td.className=(td.className+' neg').trim();td.textContent='−';}
      else if(cell.content==='0'&&cell.cls&&cell.cls.includes('xc')){td.className=(td.className+' zer').trim();td.textContent='\\(0\\)';rk(td);}
      else if(cell.tex){td.textContent='\\('+cell.tex+'\\)';rk(td);}
      else td.innerHTML='';
      tr.appendChild(td);
      if(i<row.cells.length-1){
        const ga=document.createElement('td');ga.className='gc';
        if(row.arrows&&row.arrows[i]){
          if(row.arrows[i]==='+'){ga.className='gc pos';ga.textContent='+';}
          else if(row.arrows[i]==='-'){ga.className='gc neg';ga.textContent='−';}
          else ga.textContent=row.arrows[i];
        }
        tr.appendChild(ga);
      }
    });
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);return wrap;
}

    const icon=document.createElement('div');icon.className='mc-icon';icon.textContent=lv.icon;card.appendChild(icon);
    // title: render KaTeX
    const titleEl=document.createElement('div');titleEl.className=`mc-t ${lv.cls}`;
    titleEl.innerHTML='\\('+lv.titleTex+'\\)';

      const descEl=document.createElement('div');descEl.className='mc-d';
      descEl.innerHTML='\\('+lv.descTex+'\\)';

    }
    rk(card);

}

function startLevel(id){
  const lv=LVS.find(l=>l.id===id);
  st={lvId:id,qi:0,sc:0,total:lv.n,qs:[],done:false};
  const badge=$('exBadge');
  badge.innerHTML='\\('+lv.titleTex+'\\)';
  badge.className='ex-badge '+lv.cls;
  rk(badge);
  $('hdrMenu').classList.add('vis');
  showScreen('S_ex');
  loadQ();
}

function loadQ(){
  st.done=false;
  $('scLbl').textContent=`${st.sc}/${st.qi}`;
  $('pfill').style.width=(st.qi/st.total*100)+'%';
  $('fb').className='fb';
  $('hintBox').style.display='none';
  $('btnCheck').style.display='';$('btnCheck').disabled=false;
  $('btnNext').style.display='none';$('btnNext').textContent='Suivant →';
  $('zone').innerHTML='';
  REND[st.lvId](st.qs[st.qi],$('zone'));
  rk($('zone'));
}

function finish(ok,msg){
  if(st.done)return;
  if(ok){
    st.done=true;st.sc++;
    $('scLbl').textContent=`${st.sc}/${st.qi+1}`;
    const fb=$('fb');fb.innerHTML='✓ '+msg;fb.className='fb ok';rk(fb);
    $('btnCheck').style.display='none';$('btnNext').style.display='';
    $('btnNext').textContent='Suivant →';
  } else {
    // Wrong: show feedback, keep btnCheck, show "Passer" as btnNext
    const fb=$('fb');fb.innerHTML='✗ '+msg;fb.className='fb bad';rk(fb);
    $('btnCheck').style.display='';
    // Show "Passer" button so student can skip if they want
    $('btnNext').style.display='';$('btnNext').textContent='Passer →';
  }
}
function advanceMsg(msg){
  const fb=$('fb');fb.innerHTML='✓ '+msg;fb.className='fb ok';rk(fb);
  setTimeout(()=>{if(!st.done)fb.className='fb';},1600);
}

$('hdrMenu').addEventListener('click',()=>showScreen('S_menu'));
$('btnMenu').addEventListener('click',()=>showScreen('S_menu'));
$('btnMenu2').addEventListener('click',()=>showScreen('S_menu'));
$('btnRetry').addEventListener('click',()=>startLevel(st.lvId));
$('btnHint').addEventListener('click',()=>{
  const fn=HINT[st.lvId];if(!fn)return;
  const box=$('hintBox');box.style.display='block';
  box.innerHTML=fn(st.qs[st.qi]);rk(box);
});
$('btnCheck').addEventListener('click',()=>{
  if(st.done)return;
  const res=CHK[st.lvId](st.qs[st.qi]);
  if(!res)return;
  if(res.advance){advanceMsg(res.msg);return;}
  if(res.retry){
    // Wrong answer on a choice question: show feedback but let student try again
    const fb=$('fb');fb.innerHTML='✗ '+res.msg;fb.className='fb bad';rk(fb);
    return;
  }
  finish(res.ok,res.msg);
});
$('btnNext').addEventListener('click',()=>{
  // If not done yet (Passer), mark as done without scoring
  if(!st.done){st.done=true;$('scLbl').textContent=`${st.sc}/${st.qi+1}`;}
  st.qi++;
  if(st.qi>=st.total)showResults();else loadQ();
});
function showResults(){
  const pct=Math.round(st.sc/st.total*100);
  $('rPct').textContent=pct+'%';
  $('rc').className='rc '+(pct>=75?'good':pct>=50?'mid':'bad');
  $('rMsg').textContent=pct===100?'🎉 Parfait ! Maîtrise totale !':pct>=75?'👏 Très bien, continue !':pct>=50?'👍 Bon travail, persévère !':'💪 Relis ton cours et recommence !';
  showScreen('S_res');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  if(id==='S_menu')$('hdrMenu').classList.remove('vis');
  window.scrollTo({top:0,behavior:'smooth'});

function checkImg(q,fname,texFunc){
  const bv=$('bv');if(bv&&bv.disabled)return;
  $('btnCheck').style.display='none';
  const xv=normNum($('inX').value);
  const xOk=xv!==null&&okNum(xv,q.x);
  $('inX').classList.remove('ok','err');$('inX').classList.add(xOk?'ok':'err');
  if(xOk)$('inX').disabled=true;
  const raw=($('inCalc').value||'').trim();
  const ev=safeEval(raw);const numRaw=normNum(raw);
  const calcOk=okNum(ev,q.y)||okNum(numRaw,q.y);
  $('inCalc').classList.remove('ok','err');$('inCalc').classList.add(calcOk?'ok':'err');
  if(!calcOk||!xOk){
    $('btnCheck').style.display='';
    const fb=$('fb');fb.className='fb bad';
    const msg=document.createElement('div');
    if(xOk){msg.appendChild(document.createTextNode('Vérifie ton calcul. Résultat : '));msg.appendChild(katexSpan(texN(q.y)+'.'))}
    else{msg.appendChild(document.createTextNode('La valeur dans la parenthèse doit être '));msg.appendChild(katexSpan(texN(q.x)+'.'))}
    fb.innerHTML='✗ ';fb.appendChild(msg);rk(fb);return;
  }
  $('inCalc').disabled=true;if(bv)bv.disabled=true;
  const xs=q.x<0?`(${texN(q.x)})`:texN(q.x);
  const isExpr=/[+\-*\/×÷^√]/.test(raw.replace(/^-/,''));
  if(isExpr&&numRaw===null){
    const hint=$('zone').querySelector('.ctx-card');
    if(hint){hint.innerHTML='<span class="ctx-label">✅ Bon calcul !</span>Donne maintenant le <strong>résultat final</strong>.';}
    const row2=document.createElement('div');row2.className='arow';row2.style.gap='8px';
    const inRes=document.createElement('input');inRes.className='ai ai-w';inRes.id='inRes';inRes.inputMode='decimal';inRes.placeholder='résultat ?';
    row2.appendChild(document.createTextNode('= '));row2.appendChild(inRes);
    $('imgFields').appendChild(row2);
    if(bv)bv.style.display='none';
    const ctrlDiv=$('zone').querySelector('.controls');
    const bv2=document.createElement('button');bv2.className='btn btn-green';bv2.textContent='✓ Valider';ctrlDiv.appendChild(bv2);
    const doRes=()=>{
      const rv=normNum($('inRes').value);
      $('inRes').classList.remove('ok','err');
      if(okNum(rv,q.y)){$('inRes').classList.add('ok');$('inRes').disabled=true;bv2.disabled=true;
        finish(true,`\\(${fname}(${xs})=${texN(q.y)}\\).`);
      }else{$('inRes').classList.add('err');$('fb').className='fb bad';$('fb').innerHTML=`✗ Pas tout à fait — le résultat est \\(${texN(q.y)}\\).`;rk($('fb'));}
    };
    bv2.addEventListener('click',doRes);inRes.addEventListener('keydown',e=>{if(e.key==='Enter')doRes();});
    setTimeout(()=>inRes.focus(),40);
  } else {
    if(bv)bv.style.display='none';
    finish(true,`\\(${fname}(${xs})=${texN(q.y)}\\).`);
  }
}

/* ═══ I5g — Inéquations 1/x (graphique) ═══ */
function computeI5sol(q){
  // x=0 is ALWAYS excluded (denominator). Brackets at 0 are always open.
  // Bracket at 1/k: open for strict inequality, closed for non-strict.
  const strict=q.side==='gt'||q.side==='lt';
  const pos=q.side==='gt'||q.side==='ge';
  const cb=strict?'[':']'; // bracket at 1/k: open if strict, closed if non-strict
  if(q.k===0)return{tex:pos?']0\\,;\\,+\\infty[':']-\\infty\\,;\\,0['};
  const inv=r4(1/q.k);const iT=texN(inv);
  if(q.k>0){
    // k>0: intersection at 1/k>0, x=0 in negative zone
    // pos: ]0 ; 1/k[  or  ]0 ; 1/k]
    // neg: ]-∞;0[ ∪ ]1/k;+∞[  or  ]-∞;0[ ∪ [1/k;+∞[
    if(pos)return{tex:`]0\\,;\\,${iT}${cb}`};
    else   return{tex:`]-\\infty\\,;\\,0[\\cup${strict?']':'['}${iT}\\,;\\,+\\infty[`};
  } else {
    // k<0: intersection at 1/k<0, x=0 in positive zone
    // pos: ]-∞;1/k[  ∪ ]0;+∞[   or  ]-∞;1/k] ∪ ]0;+∞[
    // neg: ]1/k;0[   or  [1/k;0[
    if(pos)return{tex:`]-\\infty\\,;\\,${iT}${cb}\\cup]0\\,;\\,+\\infty[`};
    else   return{tex:`${strict?']':'['}${iT}\\,;\\,0[`};
  }
}

/* ═══ MG — Lecture graphique ═══ */
const MG_SPECS=[
  {fn:'carre', fname:'f',tex:'f(x)=x^2',  cls:'C',xPool:[-3,-2,-1,0,1,2,3],yPool:[0,1,4],fw:x=>x*x,iv:y=>Math.sqrt(y)},
  {fn:'inverse',fname:'g',tex:'g(x)=\\tfrac{1}{x}',cls:'I',xPool:[-4,-2,-1,1,2,4],yPool:[-2,-1,1,2],fw:x=>1/x,iv:y=>1/y},
  {fn:'racine', fname:'h',tex:'h(x)=\\sqrt{x}',cls:'S',xPool:[0,1,4,9],yPool:[0,1,2,3],fw:x=>Math.sqrt(x),iv:y=>y*y},
  {fn:'cube',   fname:'k',tex:'k(x)=x^3',cls:'K',xPool:[-3,-2,-1,0,1,2,3],yPool:[-27,-8,-1,0,1,8,27],fw:x=>x*x*x,iv:y=>Math.cbrt(y)},
];
GEN.MG=()=>{const sp=pick(MG_SPECS);const isImg=Math.random()<0.5;if(isImg){const x=pick(sp.xPool);return{...sp,isImg:true,x,y:r4(sp.fw(x))};}const y=pick(sp.yPool);return{...sp,isImg:false,x:r4(sp.iv(y)),y};};
REND.MG=(q,box)=>{
  const xs=texN(q.x),ys=texN(q.y);
  const fb=document.createElement('div');fb.className='formula-box';
  fb.innerHTML=`\\(${q.tex}\\)`;rk(fb);box.appendChild(fb);
  const cc=document.createElement('div');cc.className='ctx-card';
  const lbl=document.createElement('span');lbl.className='ctx-label';lbl.textContent='📊 Lecture graphique';cc.appendChild(lbl);
  const desc=document.createElement('div');
  if(q.isImg){desc.appendChild(document.createTextNode('Lis l\'image de '));desc.appendChild(katexSpan(xs));desc.appendChild(document.createTextNode(' par '));desc.appendChild(katexSpan(q.fname));desc.appendChild(document.createTextNode(' sur la courbe.'));}
  else{desc.appendChild(document.createTextNode('Lis l\'antécédent de '));desc.appendChild(katexSpan(ys));desc.appendChild(document.createTextNode(' par '));desc.appendChild(katexSpan(q.fname));desc.appendChild(document.createTextNode(' sur la courbe.'));}
  cc.appendChild(desc);box.appendChild(cc);
  box.appendChild(graphBlock(q.fn,q.isImg?{markX:q.x}:{markY:q.y}));
  const row=document.createElement('div');row.className='arow';
  const lbl2=document.createElement('span');lbl2.className='arow-lbl';
  lbl2.innerHTML=q.isImg?`\\(${q.fname}(${xs})=\\)`:`\\(x=\\)`;rk(lbl2);row.appendChild(lbl2);
  const inp=document.createElement('input');inp.className='ai ai-w';inp.id='gAns';inp.inputMode='decimal';inp.placeholder='?';row.appendChild(inp);
  box.appendChild(row);
  enterKey(['gAns'],()=>$('btnCheck').click());setTimeout(()=>inp.focus(),40);
};
CHK.MG=(q)=>{const v=normNum($('gAns').value);const exp=q.isImg?q.y:q.x;const ok=v!==null&&okNum(v,exp);$('gAns').classList.remove('ok','err');$('gAns').classList.add(ok?'ok':'err');return{ok,msg:ok?(q.isImg?`\\(${q.fname}(${texN(q.x)})=${texN(q.y)}\\).`:`\\(x=${texN(q.x)}\\).`):(q.isImg?`\\(${q.fname}(${texN(q.x)})=${texN(q.y)}\\).`:`L'antécédent de \\(${texN(q.y)}\\) par \\(${q.fname}\\) est \\(x=${texN(q.x)}\\).`)};};
HINT.MG=q=>q.isImg?`Part de \\(${texN(q.x)}\\) sur l'axe des abscisses, remonte jusqu'à la courbe, lis l'ordonnée.`:`Part de \\(${texN(q.y)}\\) sur l'axe des ordonnées, avance horizontalement jusqu'à la courbe, lis l'abscisse.`;

/* ═══ MB — Bilan mixte ═══ */
const MB_POOL=['C1','C2','C3','C4','C5g','C5a','I1','I2','I3','I4','I5g','I5a','S1','S2','S3','S4','S5g','S5a','K1','K2','K3','K4','K5g','K5a','MG'];
GEN.MB=()=>{const id=pick(MB_POOL);const q=GEN[id]();q._sub=id;return q;};
REND.MB=(q,box)=>{const lv=LVS.find(l=>l.id===q._sub);if(lv){$('exBadge').innerHTML='\\('+lv.titleTex+'\\)';$('exBadge').className='ex-badge '+lv.cls;rk($('exBadge'));}REND[q._sub](q,box);};
CHK.MB=q=>CHK[q._sub](q);
HINT.MB=q=>HINT[q._sub]?HINT[q._sub](q):'Rappelle-toi les propriétés de la fonction concernée.';

/* ═══ Init questions for each level ═══ */
function startLevel(id){
  const lv=LVS.find(l=>l.id===id);
  st={lvId:id,qi:0,sc:0,total:lv.n,qs:[],done:false};
  // Pre-generate all questions
  while(st.qs.length<lv.n)st.qs.push(GEN[id]());
  const badge=$('exBadge');
  badge.innerHTML='\\('+lv.titleTex+'\\)';badge.className='ex-badge '+lv.cls;rk(badge);
  $('hdrMenu').classList.add('vis');
  showScreen('S_ex');loadQ();
}

/* ═══ INIT ═══ */
buildMenu();
</script>
