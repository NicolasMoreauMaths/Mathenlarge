<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suites géométriques — Exerciseur interactif</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #eef2f7;
    --grid: #d5dce6;
    --card: #fff;
    --blue: #1a6fa0;
    --blue-light: #2d8dc7;
    --blue-pale: rgba(26, 111, 160, 0.08);
    --blue-border: rgba(26, 111, 160, 0.2);
    --purple: #6b3fa0;
    --purple-light: #8b5fc8;
    --purple-pale: rgba(107, 63, 160, 0.1);
    --orange: #b85c0b;
    --orange-pale: rgba(184, 92, 11, 0.1);
    --orange-border: rgba(184, 92, 11, 0.25);
    --green: #1b7a40;
    --green-pale: rgba(27, 122, 64, 0.1);
    --red: #c0392b;
    --red-pale: rgba(192, 57, 43, 0.08);
    --teal: #0d9488;
    --teal-pale: rgba(13, 148, 136, 0.1);
    --gold: #b8860b;
    --gold-pale: rgba(184, 134, 11, 0.12);
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(30, 41, 59, 0.08);
}

body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: 16px 10px 60px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
}

.app { max-width: 900px; width: 100%; }

.app-header {
    background: linear-gradient(135deg, #0c1624 0%, #162236 45%, #1c3358 100%);
    color: #fff;
    padding: 18px 24px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(12, 22, 36, 0.4);
    position: relative;
    overflow: hidden;
}

.app-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 50%);
    pointer-events: none;
}

.app-header-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--red), var(--blue), var(--purple), var(--green));
}

.app-title {
    font-size: 1.25em;
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.app-title::before { content: '📐'; font-size: 1.15em; }

.main {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 28px var(--shadow);
    min-height: 60vh;
}

.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
}

h1 {
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--blue);
}

.sub {
    text-align: center;
    font-size: 0.92em;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
}

/* ── BUTTONS ── */
.btn {
    font-family: 'DM Sans', sans-serif;
    padding: 11px 26px;
    border-radius: 12px;
    font-size: 0.93em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
}

.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-blue { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 2px 12px rgba(26,111,160,0.2); }
.btn-blue:hover:not(:disabled) { background: var(--blue-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(26,111,160,0.3); }

.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }

.btn-ghost { background: transparent; color: var(--text-light); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text-light); }

.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

/* ── MENU ── */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin: 20px 0;
}

.mc {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mc:hover { border-color: var(--blue); transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
.mc-icon { font-size: 2em; margin-bottom: 8px; }
.mc-t { font-size: 0.9em; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
.mc-d { font-size: 0.78em; color: var(--text-light); line-height: 1.4; }
.mc-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--orange-pale); color: var(--orange);
    font-size: 0.68em; font-weight: 700; padding: 3px 10px; border-radius: 12px;
}

/* ── EX HEADER ── */
.ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.ex-badge { background: var(--blue-pale); color: var(--blue); padding: 6px 16px; border-radius: 20px; font-size: 0.84em; font-weight: 700; }
.ex-score { font-size: 0.88em; color: var(--text-light); font-weight: 600; }

.pbar { width: 100%; background: var(--border); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 20px; }
.pfill { height: 100%; background: linear-gradient(90deg, var(--red), var(--blue), var(--purple)); border-radius: 6px; transition: width 0.4s; }

/* ── CONTEXT CARD ── */
.ctx-card {
    background: linear-gradient(135deg, #f5f9ff, #eff4ff);
    border: 1.5px solid #c5d8f0;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.93em;
    line-height: 1.7;
}

.ctx-card .ctx-label {
    font-size: 0.68em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--blue); margin-bottom: 6px; display: block;
}

/* ── FORMULA REMINDER ── */
.formula-remind {
    background: var(--gold-pale);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.84em;
    color: #7a5800;
    margin: 0 0 18px;
    text-align: center;
    line-height: 1.7;
}

/* ── QUESTION BLOCK ── */
.q-prompt {
    font-size: 1.05em;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.6;
    text-align: center;
}

/* ── INPUT FIELD ── */
.answer-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.answer-unit {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--text-light);
}

.answer-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    width: 160px;
    padding: 10px 12px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
}

.answer-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-pale); }
.answer-input.ok { border-color: var(--green); background: var(--green-pale); color: var(--green); }
.answer-input.err { border-color: var(--red); background: var(--red-pale); animation: shake 0.3s; }

.answer-input.wide { width: 220px; }
.answer-input.narrow { width: 110px; }

/* ── MULTI-INPUT ROW ── */
.row-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.row-label {
    font-size: 0.85em; font-weight: 600; color: var(--text-light);
}

/* ── CHOICE BUTTONS ── */
.choice-grid {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
}

.choice-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95em;
    font-weight: 700;
    padding: 14px 22px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 120px;
    text-align: center;
}

.choice-btn:hover { border-color: var(--blue); transform: translateY(-2px); }
.choice-btn.chosen { background: var(--purple); border-color: var(--purple); color: white; }
.choice-btn.ok { background: var(--green-pale); border-color: var(--green); color: var(--green); }
.choice-btn.err { background: var(--red-pale); border-color: var(--red); color: var(--red); animation: shake 0.3s; }

/* ── CALCULATOR ── */
.calc-wrap {
    background: #1e293b;
    border-radius: 16px;
    padding: 16px;
    max-width: 320px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.calc-display {
    background: #0f172a;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-family: 'DM Sans', monospace;
    font-size: 1.5em;
    font-weight: 600;
    color: #7dd3fc;
    text-align: right;
    min-height: 52px;
    overflow: hidden;
    word-break: break-all;
}

.calc-expr {
    font-size: 0.55em;
    color: #475569;
    text-align: right;
    min-height: 18px;
    margin-bottom: 4px;
    font-family: 'DM Sans', monospace;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.calc-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 1em;
    font-weight: 700;
    padding: 12px 6px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 46px;
}

.calc-btn:active { transform: scale(0.93); }

.calc-num { background: #334155; color: #f1f5f9; }
.calc-num:hover { background: #475569; }
.calc-op { background: #1a6fa0; color: #fff; }
.calc-op:hover { background: #2d8dc7; }
.calc-eq { background: #1b7a40; color: #fff; }
.calc-eq:hover { filter: brightness(1.1); }
.calc-clear { background: #7f1d1d; color: #fecaca; }
.calc-clear:hover { background: #991b1b; }
.calc-back { background: #4c1d95; color: #ddd6fe; }
.calc-back:hover { background: #5b21b6; }
.calc-zero { grid-column: span 2; }
.calc-pct { background: #334155; color: #94a3b8; }
.calc-pct:hover { background: #475569; }
.calc-paren { background: #334155; color: #94a3b8; }
.calc-paren:hover { background: #475569; }
.calc-pow { background: #7c3aed; color: #fff; }
.calc-pow:hover { background: #8b5cf6; }
.calc-eq-full { grid-column: span 4; }

.calc-toggle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--text-light);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    margin: 0 auto 12px;
    display: block;
    transition: all 0.2s;
}

.calc-toggle:hover { background: var(--bg); border-color: var(--text-light); }

.calc-container { display: none; }
.calc-container.visible { display: block; }

/* ── STEP BLOCKS ── */
.step-block { margin-bottom: 18px; padding-bottom: 14px; }
.step-block.locked { opacity: 0.88; }
.step-block.locked .answer-input { pointer-events: none; }

.step-divider { border: none; border-top: 1.5px dashed var(--border); margin: 4px auto 18px; max-width: 500px; }

.step-tag {
    display: inline-block;
    font-size: 0.72em; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text-light);
    text-align: center; width: 100%; margin-bottom: 8px;
}

.step-tag.locked-tag { color: var(--green); }
.step-tag.locked-tag::before { content: '✓  '; }

/* ── FEEDBACK ── */
.fb {
    margin-top: 20px; padding: 14px 18px; border-radius: 12px;
    font-size: 0.93em; text-align: center; display: none;
    animation: fadeIn 0.3s; font-weight: 600; line-height: 1.7;
}
.fb.ok { display: block; background: var(--green-pale); color: var(--green); border: 2px solid rgba(27,122,64,0.2); }
.fb.bad { display: block; background: var(--red-pale); color: var(--red); border: 2px solid rgba(192,57,43,0.15); }

/* ── RESULTS ── */
.rc {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 20px auto; border: 6px solid;
}
.rc.good { border-color: var(--green); background: var(--green-pale); }
.rc.mid  { border-color: var(--orange); background: var(--orange-pale); }
.rc.bad  { border-color: var(--red); background: var(--red-pale); }
.rp { font-size: 2.2em; font-weight: 700; line-height: 1; }
.rm { font-size: 1.05em; text-align: center; margin: 16px 0; line-height: 1.5; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

@media (max-width: 640px) {
    .app-header { padding: 14px 18px; }
    .app-title { font-size: 1.05em; }
    .main { padding: 22px 16px; }
    h1 { font-size: 1.25em; }
    .menu-grid { grid-template-columns: 1fr; }
    .answer-input { width: 130px; font-size: 1.1em; }
}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(26,111,160,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(26,111,160,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 900px tablette ── */
@media(max-width:900px){
  .app { padding:0 12px; }
  .main { padding:12px; }
}
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-header-bar { flex-wrap:wrap; gap:4px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .mc-badge, .ex-badge { font-size:0.7rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }
  .choice-btn, .choice-grid .btn { font-size:0.85rem; padding:8px; }
  .choice-grid { gap:6px; }
  .q-prompt { font-size:0.9rem; }
  .screen { font-size:0.85rem; padding:10px; }
  .step-block { padding:8px; }
  .step-tag { font-size:0.75rem; }
  .fb { font-size:0.85rem; padding:8px; }
  .formula-remind, .formula-box { font-size:0.85rem; padding:8px; overflow-x:auto; }
  .ctx-card { padding:8px; font-size:0.85rem; }
  .answer-input, .ans-input { font-size:0.9rem; }
  .answer-wrap, .row-inputs { flex-wrap:wrap; gap:6px; }
  .pbar { height:6px; }
  .mode-toggle, .mode-btn { font-size:0.8rem; }
  .menu-btn { font-size:0.8rem; }
  .ex-top { flex-wrap:wrap; gap:4px; }
  .ex-score { font-size:0.8rem; }
}
/* ── overflow helpers ── */
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
svg[viewBox] { max-width:100%; height:auto; }
.mc, .screen, .step-block { overflow-wrap:break-word; word-break:break-word; }


/* ===== RESPONSIVE RENFORCÉ ===== */
@media(max-width:768px){
  body { padding: 12px 8px 50px; }
  .app { padding: 0 6px; }
  .app-header { padding: 12px 16px; border-radius: 12px 12px 0 0; }
  .app-title { font-size: 1rem; }
  .main { padding: 16px 14px; }
  h1 { font-size: 1.2em; }
  .menu-grid { grid-template-columns: 1fr; }
  .mc { padding: 12px; }
  .controls { flex-wrap: wrap; gap: 6px; justify-content: center; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.84rem; padding: 8px 14px; }
  .expr-line { font-size: 1.25em; }
  .term-input { width: 78px; font-size: 1em; }
  .id-btn { min-width: 120px; font-size: 0.76em; }
  .var-btn { min-width: 110px; padding: 10px 12px; }
  .memo-wrap { grid-template-columns: 1fr; }
  .build-input { width: 50px; }
  .step-block { padding: 10px; }
  .fb { font-size: 0.88rem; }
}
@media(max-width:480px){
  body { padding: 8px 4px 40px; }
  .app { padding: 0 2px; }
  .app-header { padding: 10px 12px; }
  .app-title { font-size: 0.92rem; }
  .main { padding: 12px 10px; }
  h1 { font-size: 1.1em; }
  .expr-line { font-size: 1.1em; }
  .term-input { width: 66px; font-size: 0.92em; }
  .id-btn { min-width: 100px; }
  .var-btn { min-width: 90px; padding: 8px 10px; font-size: 0.78em; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.8rem; padding: 7px 11px; }
  .mc-t { font-size: 0.9rem; }
}
@media(max-width:360px){
  .app-title { font-size: 0.85rem; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size: 0.76rem; padding: 6px 9px; }
  .expr-line { font-size: 1rem; }
  .term-input { width: 56px; }
}
svg[viewBox] { max-width:100%; height:auto; }
table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
.katex-display,.katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
.mc,.screen,.step-block,.mc-t { overflow-wrap:break-word; word-break:break-word; }

</style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Suites géométriques — Première</div>
        <div class="app-header-bar"></div>
    </div>
    <div class="main">

        <!-- MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Choisis un thème</h1>
            <p class="sub">Six exerciseurs pour maîtriser les suites géométriques : reconnaissance, calcul, terme général, raison, sens de variation et modélisation.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- EXERCISE -->
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Thème</span>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
            <div id="exBody"></div>
            <div class="fb" id="fb"></div>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue" id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc"><div class="rp" id="rp">0%</div></div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue" id="btnRetry">Recommencer</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ==========================================================
   CONFIG NIVEAUX
   ========================================================== */
const LEVELS = [
    { id: 'reconnaissance', icon: '🔍', title: 'Reconnaître une suite géométrique', desc: 'Décider si une suite est géométrique et trouver sa raison', n: 8 },
    { id: 'calcul_proche',   icon: '➡️', title: 'Calculer de proche en proche',       desc: 'Trouver u₁, u₂ et u₃ à partir de u₀ et q', n: 8 },
    { id: 'terme_general',   icon: '⚡', title: 'Terme général uₙ = u₀ × qⁿ',          desc: 'Sauter directement à un rang donné', n: 8, badge: 'Calculatrice' },

let state = { levelId: null, qIndex: 0, total: 0, score: 0, questions: [], checked: false };

/* ==========================================================
   UTILS
   ========================================================== */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function normNum(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(',', '.').replace(/\s+/g, '');
    if (s === '') return null;
    s = s.replace(/\u2212/g, '-').replace(/÷/g, '/');
    if (s.includes('/')) {
        const [n, d] = s.split('/').map(Number);
        if (isNaN(n) || isNaN(d) || d === 0) return null;
        return n / d;
    }
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
}

function close(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

function closeRel(a, b, eps = 1e-4) {
    if (Math.abs(b) < 1e-10) return Math.abs(a) < eps;
    return Math.abs((a - b) / b) < eps;
}

function round2(x) { return Math.round(x * 100) / 100; }
function round4(x) { return Math.round(x * 10000) / 10000; }

/* format number for display — avoids floating point noise */
function fmt(x) {
    const r = round2(x);
    return r % 1 === 0 ? String(r) : String(r).replace('.', ',');
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    LEVELS.forEach(lv => {
        const el = document.createElement('div');
        el.className = 'mc';
        el.innerHTML = `
            ${lv.badge ? `<div class="mc-badge">${lv.badge}</div>` : ''}
            <div class="mc-icon">${lv.icon}</div>
            <div class="mc-t">${lv.title}</div>
            <div class="mc-d">${lv.desc}</div>
        `;
        el.addEventListener('click', () => startLevel(lv.id));
        grid.appendChild(el);
    });
}

document.getElementById('btnMenu2').addEventListener('click', () => showScreen('screen-menu'));

buildMenu();

/* KaTeX auto-render — relancé après chaque rendu de question */
function renderKatex(el) {
    if (window.renderMathInElement) {
        renderMathInElement(el || document.body, {
            delimiters: [
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true },
            ],
            throwOnError: false
        });
    }
}

/* ==========================================================
   MOTEUR GENERIQUE
   ========================================================== */
const GENERATORS = {};
const RENDERERS = {};
const CHECKERS = {};

function startLevel(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    state.levelId = levelId;
    state.qIndex = 0;
    state.score = 0;
    state.total = lv.n;
    state.questions = [];
    for (let i = 0; i < lv.n; i++) state.questions.push(GENERATORS[levelId]());
    document.getElementById('exBadge').textContent = lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion() {
    state.checked = false;
    state.attempts = 0;
    const lv = LEVELS.find(l => l.id === state.levelId);
    document.getElementById('exScore').textContent = `Question ${state.qIndex + 1}/${state.total}`;
    document.getElementById('pfill').style.width = (state.qIndex / state.total * 100) + '%';
    const body = document.getElementById('exBody');
    body.innerHTML = '';
    const fb = document.getElementById('fb');
    fb.className = 'fb'; fb.textContent = '';
    document.getElementById('btnCheck').style.display = '';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnNext').style.display = 'none';
    RENDERERS[state.levelId](state.questions[state.qIndex], body);
    renderKatex(body);
}

document.getElementById('btnCheck').addEventListener('click', () => {
    if (state.checked) return;
    const q = state.questions[state.qIndex];
    const result = CHECKERS[state.levelId](q);
    const fb = document.getElementById('fb');
    if (result.ok) {
        fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + (result.msg || 'Exact, bien joué !');
        renderKatex(fb);
        if (result.advanceOnly) {
            setTimeout(() => { fb.className = 'fb'; fb.textContent = ''; }, 1200);
            // Cacher le Suivant provisoire (erreur précédente) s'il était visible
            document.getElementById('btnNext').style.display = 'none';
            return;
        }
        state.checked = true;
        state.score++;
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnNext').style.display = '';
    } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ ' + (result.msg || 'Ce n\'est pas encore ça, réessaie.');
        renderKatex(fb);
        // On ne montre PAS "Suivant" sur une erreur : l'élève corrige puis
        // reclique "Vérifier" (ou Entrée) et reçoit un vrai retour à chaque tentative.
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    state.qIndex++;
    if (state.qIndex >= state.total) showResults();
    else renderQuestion();
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const exScreen = document.getElementById('screen-ex');
    if (!exScreen.classList.contains('active')) return;
    e.preventDefault();
    const btnNext  = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');
    if (btnNext.style.display !== 'none' && btnNext.offsetParent) btnNext.click();
    else if (btnCheck.style.display !== 'none' && !btnCheck.disabled) btnCheck.click();
});

function showResults() {
    document.getElementById('pfill').style.width = '100%';
    const pct = Math.round(state.score / state.total * 100);
    const rc = document.getElementById('rc');
    rc.className = 'rc ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    document.getElementById('rp').textContent = pct + '%';
    let msg;
    if (pct >= 80) msg = `Excellent ! ${state.score}/${state.total} bonnes réponses. Tu maîtrises ce thème.`;
    else if (pct >= 50) msg = `${state.score}/${state.total} bonnes réponses. C'est en bonne voie, encore un peu d'entraînement !`;
    else msg = `${state.score}/${state.total} bonnes réponses. Reprends la leçon et réessaie, tu vas progresser.`;
    document.getElementById('rm').textContent = msg;
    showScreen('screen-res');
}

const calcState = {};

function toggleCalc(id) {
    const c = document.getElementById('calc-' + id);
    const btn = document.getElementById('calc-toggle-' + id);
    const visible = c.classList.toggle('visible');
    btn.textContent = visible ? '🔢 Masquer la calculatrice' : '🔢 Afficher la calculatrice';
    if (!calcState[id]) calcState[id] = { expr: '', result: '0', fresh: true };
}

function cCalc(id, key) {
    if (!calcState[id]) calcState[id] = { expr: '', result: '0', fresh: true };
    const s = calcState[id];
    const disp = document.getElementById('calc-val-' + id);
    const exprEl = document.getElementById('calc-expr-' + id);

    if (key === 'C') { s.expr = ''; s.result = '0'; s.fresh = true; }
    else if (key === '⌫') {
        if (s.fresh) { s.expr = ''; s.result = '0'; s.fresh = false; return; }
        s.expr = s.expr.slice(0, -1);
        if (!s.expr) { s.result = '0'; }
    }
    else if (key === '=') {
        try {
            let e = s.expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.').replace(/\^/g, '**');
            // handle % : replace number% by number/100
            e = e.replace(/(\d+(?:\.\d+)?)\s*%/g, '($1/100)');
            const v = Function('"use strict"; return (' + e + ')')();
            s.result = isFinite(v) ? String(round4(v)).replace('.', ',') : 'Erreur';
            exprEl.textContent = s.expr.replace(/\*\*/g, '^') + ' =';
            s.expr = s.result.replace(',', '.');
            s.fresh = true;
        } catch { s.result = 'Erreur'; }
    }
    else if (['+', '-', '×', '÷'].includes(key)) {
        if (s.fresh) { s.fresh = false; }
        s.expr += key;
        s.result = s.expr;
    }
    else if (key === 'xy') {
        if (s.fresh) { s.fresh = false; }
        s.expr += '^';
        s.result = s.expr;
    }
    else if (key === '%') {
        s.expr += '%';
        s.result = s.expr;
    }
    else {
        if (s.fresh) { s.expr = key; s.fresh = false; }
        else s.expr += key;
        s.result = s.expr;
    }
    disp.textContent = s.result;
    if (!s.fresh) exprEl.textContent = s.expr;
}

/* ==========================================================
   RAISONS "PROPRES" — partagé par plusieurs niveaux
   Chaque q est une fraction num/den à dénominateur en puissance de 2,
   ce qui permet de choisir u0 comme multiple de den^maxExp pour que
   TOUS les termes intermédiaires tombent juste (entiers), sans jamais
   afficher de décimales parasites comme "10,13".
   ========================================================== */
const Q_DEFS = [
    { num: 2, den: 1 }, { num: 3, den: 1 }, { num: 4, den: 1 }, { num: 5, den: 1 },
    { num: 1, den: 2 }, { num: 3, den: 2 }, { num: 5, den: 2 },
];

function pickCleanQU0(maxExp, u0poolInt) {
    const qd = Q_DEFS[rnd(0, Q_DEFS.length - 1)];
    const q = qd.num / qd.den;
    let u0;
    if (qd.den === 1) {
        u0 = u0poolInt[rnd(0, u0poolInt.length - 1)];
    } else {
        const denPow = Math.pow(qd.den, maxExp);
        const k = rnd(1, 3);
        u0 = denPow * k;
    }
    return { q, u0, num: qd.num, den: qd.den };
}

function cleanTerm(u0, num, den, k) {
    return Math.round(u0 * Math.pow(num, k) / Math.pow(den, k));
}

/* ==========================================================
   NIVEAU 1 : RECONNAÎTRE UNE SUITE GÉOMÉTRIQUE
   ========================================================== */
GENERATORS.reconnaissance = function () {
    const isGeo = Math.random() < 0.5;
    if (isGeo) {
        const { q, u0, num, den } = pickCleanQU0(3, [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]);
        const u1 = cleanTerm(u0, num, den, 1), u2 = cleanTerm(u0, num, den, 2), u3 = cleanTerm(u0, num, den, 3);
        return { isGeo: true, u0, u1, u2, u3, q };
    } else {
        const u0pool = [2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 50];
        const u0 = u0pool[rnd(0, u0pool.length - 1)];
        const rPool = [2, 3, 4, 5, 6, 8, 10, -2, -3, -4, 1.5, 2.5];
        let r = rPool[rnd(0, rPool.length - 1)];
        let u1 = round4(u0 + r), u2 = round4(u1 + r), u3 = round4(u2 + r);
        if (u1 <= 0 || u2 <= 0 || u3 <= 0) { r = Math.abs(r); u1 = round4(u0 + r); u2 = round4(u1 + r); u3 = round4(u2 + r); }
        return { isGeo: false, u0, u1, u2, u3 };
    }
};

RENDERERS.reconnaissance = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(u_{n+1}=q\\times u_n\\) — le quotient entre deux termes consécutifs doit être <strong>constant</strong>.</div>
        <div class="q-prompt">La suite suivante est-elle géométrique ?<br><strong>${fmt(q.u0)} ; ${fmt(q.u1)} ; ${fmt(q.u2)} ; ${fmt(q.u3)} ; …</strong></div>
        <div class="choice-grid" id="choiceGeo">
            <button class="choice-btn" data-val="oui">✅ Oui</button>
            <button class="choice-btn" data-val="non">❌ Non</button>
        </div>
        <div class="q-prompt" style="margin-top:12px;">Si oui, quelle est la raison \\(q\\) ?</div>
        <div class="answer-wrap">
            <input type="text" class="answer-input" id="ans" placeholder="…" inputmode="decimal">
        </div>`;
    box.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('chosen'));
            btn.classList.add('chosen');
            box._dir = btn.dataset.val;
        });
    });
    box._dir = null;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.reconnaissance = function (q) {
    const box = document.getElementById('exBody');
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const correctChoice = q.isGeo ? 'oui' : 'non';
    box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('ok', 'err'));
    box.querySelectorAll('.choice-btn').forEach(b => {
        if (b.dataset.val === correctChoice) b.classList.add('ok');
        else if (b.classList.contains('chosen')) b.classList.add('err');
    });
    if (!box._dir) {
        return { ok: false, msg: 'Choisis d\'abord Oui ou Non.' };
    }
    const dirOk = box._dir === correctChoice;
    if (q.isGeo) {
        const qOk = v !== null && closeRel(v, q.q, 0.01);
        inp.classList.add(qOk ? 'ok' : 'err');
        const ok = dirOk && qOk;
        const qStr = String(q.q).replace('.', ',');
        if (ok) return { ok: true, msg: `Oui : le quotient est constant, \\(q = ${qStr}\\).` };
        if (!dirOk) return { ok: false, msg: `C'est bien une suite géométrique de raison \\(q = ${qStr}\\) (quotient constant entre termes consécutifs).` };
        return { ok: false, msg: `Bonne réponse sur la nature, mais la raison est \\(q = \\dfrac{${fmt(q.u1)}}{${fmt(q.u0)}} = ${qStr}\\).` };
    } else {
        inp.classList.remove('ok', 'err');
        if (dirOk) return { ok: true, msg: `Non : le quotient entre termes consécutifs n'est pas constant (ce n'est pas une multiplication fixe).` };
        return { ok: false, msg: `Ce n'est pas une suite géométrique : le quotient \\(\\dfrac{u_1}{u_0}\\) diffère du quotient \\(\\dfrac{u_2}{u_1}\\).` };
    }
};

/* ==========================================================
   NIVEAU 2 : CALCULER DE PROCHE EN PROCHE
   ========================================================== */
GENERATORS.calcul_proche = function () {
    const { q, u0, num, den } = pickCleanQU0(3, [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25]);
    const u1 = cleanTerm(u0, num, den, 1), u2 = cleanTerm(u0, num, den, 2), u3 = cleanTerm(u0, num, den, 3);
    return { u0, q, u1, u2, u3 };
};

RENDERERS.calcul_proche = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(u_{n+1} = q\\times u_n\\)</div>
        <div class="q-prompt">Soit \\((u_n)\\) la suite géométrique de premier terme \\(u_0 = ${fmt(q.u0)}\\) et de raison \\(q = ${String(q.q).replace('.', ',')}\\).<br>Calcule \\(u_1\\), \\(u_2\\) et \\(u_3\\).</div>
        <div class="row-inputs">
            <span class="row-label">u₁ =</span>
            <input type="text" class="answer-input narrow" id="u1" placeholder="…" inputmode="decimal">

            <input type="text" class="answer-input narrow" id="u2" placeholder="…" inputmode="decimal">
            <span class="row-label" style="margin-left:16px;">u₃ =</span>
            <input type="text" class="answer-input narrow" id="u3" placeholder="…" inputmode="decimal">

CHECKERS.calcul_proche = function (q) {
    const i1 = document.getElementById('u1'), i2 = document.getElementById('u2'), i3 = document.getElementById('u3');
    const v1 = normNum(i1.value), v2 = normNum(i2.value), v3 = normNum(i3.value);
    const ok1 = v1 !== null && closeRel(v1, q.u1, 0.01);
    const ok2 = v2 !== null && closeRel(v2, q.u2, 0.01);
    const ok3 = v3 !== null && closeRel(v3, q.u3, 0.01);
    [i1, i2, i3].forEach((el, idx) => { el.classList.remove('ok', 'err'); el.classList.add([ok1, ok2, ok3][idx] ? 'ok' : 'err'); });
    const ok = ok1 && ok2 && ok3;
    const qStr = String(q.q).replace('.', ',');
    if (ok) return { ok: true, msg: `\\(u_1=${fmt(q.u0)}\\times ${qStr}=${fmt(q.u1)}\\), \\(u_2=${fmt(q.u1)}\\times ${qStr}=${fmt(q.u2)}\\), \\(u_3=${fmt(q.u2)}\\times ${qStr}=${fmt(q.u3)}\\).` };
    return { ok: false, msg: `On multiplie à chaque étape par \\(q=${qStr}\\) : \\(u_1=${fmt(q.u1)}\\), \\(u_2=${fmt(q.u2)}\\), \\(u_3=${fmt(q.u3)}\\).` };
};

/* ==========================================================
   NIVEAU 3 : TERME GÉNÉRAL uₙ = u₀ × qⁿ
   ========================================================== */
GENERATORS.terme_general = function () {
    const qd = Q_DEFS[rnd(0, Q_DEFS.length - 1)];
    const q = qd.num / qd.den;
    let n;
    if (qd.den === 1) n = (qd.num >= 4) ? rnd(3, 6) : rnd(4, 8);
    else n = rnd(3, 6);
    let u0;
    if (qd.den === 1) {
        const u0pool = [1, 2, 3, 4, 5, 6, 8, 10];
        u0 = u0pool[rnd(0, u0pool.length - 1)];
    } else {
        const denPow = Math.pow(qd.den, n);
        u0 = denPow * rnd(1, 3);
    }
    const un = cleanTerm(u0, qd.num, qd.den, n);
    if (!isFinite(un) || Math.abs(un) > 3000000) return GENERATORS.terme_general();
    return { u0, q, n, un };
};

RENDERERS.terme_general = function (q, box) {
    const qStr = String(q.q).replace('.', ',');
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(u_n = u_0 \\times q^{\\,n}\\)</div>
        <div class="q-prompt">Soit \\((u_n)\\) la suite géométrique de premier terme \\(u_0 = ${fmt(q.u0)}\\) et de raison \\(q = ${qStr}\\).<br>Calcule directement \\(u_{${q.n}}\\).</div>
        <div class="answer-wrap">
            <input type="text" class="answer-input" id="ans" placeholder="…" inputmode="decimal">
        </div>
        ${calcHTML('tg')}`;
    setTimeout(() => document.getElementById('ans')?.focus(), 50);
};

CHECKERS.terme_general = function (q) {
    const inp = document.getElementById('ans');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const ok = v !== null && closeRel(v, q.un, 0.01);
    inp.classList.add(ok ? 'ok' : 'err');
    const qStr = String(q.q).replace('.', ',');
    if (ok) return { ok: true, msg: `\\(u_{${q.n}} = u_0\\times q^{${q.n}} = ${fmt(q.u0)}\\times ${qStr}^{${q.n}} = ${fmt(q.un)}\\).` };
    return { ok: false, msg: `On applique la formule : \\(u_{${q.n}} = ${fmt(q.u0)}\\times ${qStr}^{${q.n}} = ${fmt(q.un)}\\).` };
};

/* ==========================================================
   NIVEAU 4 : RETROUVER q ET u₀
   ========================================================== */
GENERATORS.trouver_raison = function () {
    const qd = Q_DEFS[rnd(0, Q_DEFS.length - 1)];
    const q = qd.num / qd.den;
    const diff = rnd(2, 3);
    const p = rnd(1, 3); // p ≥ 1 : on ne révèle jamais u0 directement dans l'énoncé
    const n = p + diff;
    let u0;
    if (qd.den === 1) {
        const u0pool = [1, 2, 3, 4, 5, 6, 8, 10];
        u0 = u0pool[rnd(0, u0pool.length - 1)];
    } else {
        const denPow = Math.pow(qd.den, n);
        u0 = denPow * rnd(1, 3);
    }
    const up = cleanTerm(u0, qd.num, qd.den, p);
    const un = cleanTerm(u0, qd.num, qd.den, n);
    if (!isFinite(un) || Math.abs(un) > 2000000) return GENERATORS.trouver_raison();
    return { q, diff, p, n, u0, up, un };
};

CHECKERS.trouver_raison = function (q) {
    const box = document.getElementById('exBody');
    const stepsDone = box.querySelectorAll('.step-block.locked').length;
    const qStr = String(q.q).replace('.', ',');

    if (stepsDone === 0) {
        const inp = document.getElementById('qval');
        const v = normNum(inp.value);
        inp.classList.remove('ok', 'err');
        const ok = v !== null && closeRel(v, q.q, 0.01);
        inp.classList.add(ok ? 'ok' : 'err');
        const ratioStr = String(round4(Math.pow(q.q, q.diff))).replace('.', ',');
        if (ok) {
            lockStepSimple('step0');
            appendStepU0(q);
            return { ok: true, msg: `\\(q^{${q.diff}} = \\dfrac{${fmt(q.un)}}{${fmt(q.up)}} = ${ratioStr}\\), donc \\(q = ${qStr}\\). Maintenant trouve \\(u_0\\) !`, advanceOnly: true };
        }
        return { ok: false, msg: `On calcule \\(q^{${q.diff}} = \\dfrac{u_{${q.n}}}{u_{${q.p}}} = \\dfrac{${fmt(q.un)}}{${fmt(q.up)}} = ${ratioStr}\\), donc \\(q = ${qStr}\\) (car \\(${qStr}^{${q.diff}} = ${ratioStr}\\)).` };
    }

    if (stepsDone === 1) {
        const inp = document.getElementById('u0val');
        const v = normNum(inp.value);
        inp.classList.remove('ok', 'err');
        const ok = v !== null && closeRel(v, q.u0, 0.01);
        inp.classList.add(ok ? 'ok' : 'err');
        if (ok) {
            lockStepSimple('step1');
            appendStepFormule(q);
            return { ok: true, msg: `\\(u_{${q.p}} = u_0\\times q^{${q.p}}\\) donc \\(u_0 = \\dfrac{${fmt(q.up)}}{${qStr}^{${q.p}}} = ${fmt(q.u0)}\\). Plus qu'une étape : écris la forme générale de \\(u_n\\) !`, advanceOnly: true };
        }
        return { ok: false, msg: `On injecte le rang ${q.p} : \\(${fmt(q.up)} = u_0\\times ${qStr}^{${q.p}}\\), donc \\(u_0 = ${fmt(q.u0)}\\).` };
    }

    const iCoef = document.getElementById('coefval'), iBase = document.getElementById('baseval');
    const vCoef = normNum(iCoef.value), vBase = normNum(iBase.value);
    iCoef.classList.remove('ok', 'err'); iBase.classList.remove('ok', 'err');
    const coefOk = vCoef !== null && closeRel(vCoef, q.u0, 0.01);
    const baseOk = vBase !== null && closeRel(vBase, q.q, 0.01);
    iCoef.classList.add(coefOk ? 'ok' : 'err');
    iBase.classList.add(baseOk ? 'ok' : 'err');
    const ok = coefOk && baseOk;
    if (ok) return { ok: true, msg: `On a bien \\(u_n = u_0\\times q^{\\,n} = ${fmt(q.u0)}\\times ${qStr}^{\\,n}\\) pour tout \\(n\\).` };
    return { ok: false, msg: `La formule générale est \\(u_n = u_0\\times q^{\\,n} = ${fmt(q.u0)}\\times ${qStr}^{\\,n}\\) : on remplace \\(u_0\\) et \\(q\\) par leurs valeurs trouvées précédemment.` };
};

/* ==========================================================
   NIVEAU 5 : SENS DE VARIATION
   ========================================================== */
GENERATORS.sens_variation = function () {
    const qPool = [0.2, 0.25, 0.4, 0.5, 0.6, 0.75, 0.8, 0.9, 1, 1.1, 1.2, 1.5, 2, 2.5, 3, 4, 5];
    const q = qPool[rnd(0, qPool.length - 1)];
    const u0pool = [1, 2, 3, 5, 10, 20];
    const u0 = u0pool[rnd(0, u0pool.length - 1)];
    let sens;
    if (q > 1) sens = 'croissante';
    else if (q === 1) sens = 'constante';
    else sens = 'decroissante';
    return { q, u0, sens };
};

RENDERERS.sens_variation = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : \\(q \\gt 1\\) → croissante &nbsp;|&nbsp; \\(q = 1\\) → constante &nbsp;|&nbsp; \\(0 \\lt q \\lt 1\\) → décroissante</div>
        <div class="q-prompt">Une suite géométrique à termes strictement positifs a pour premier terme \\(u_0 = ${fmt(q.u0)}\\) et pour raison \\(q = ${String(q.q).replace('.', ',')}\\).<br>Quel est son sens de variation ?</div>
        <div class="choice-grid" id="choiceSens">
            <button class="choice-btn" data-val="croissante">📈 Croissante</button>
            <button class="choice-btn" data-val="decroissante">📉 Décroissante</button>
            <button class="choice-btn" data-val="constante">➡️ Constante</button>
        </div>`;
    box.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('chosen'));
            btn.classList.add('chosen');
            box._dir = btn.dataset.val;
        });
    });
    box._dir = null;
};

CHECKERS.sens_variation = function (q) {
    const box = document.getElementById('exBody');
    box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('ok', 'err'));
    if (!box._dir) return { ok: false, msg: 'Choisis une réponse.' };
    box.querySelectorAll('.choice-btn').forEach(b => {
        if (b.dataset.val === q.sens) b.classList.add('ok');
        else if (b.classList.contains('chosen')) b.classList.add('err');
    });
    const ok = box._dir === q.sens;
    const qStr = String(q.q).replace('.', ',');
    const cond = q.sens === 'croissante' ? '> 1' : (q.sens === 'constante' ? '= 1' : '< 1');
    const label = q.sens === 'croissante' ? 'croissante' : (q.sens === 'constante' ? 'constante' : 'décroissante');
    if (ok) return { ok: true, msg: `\\(q = ${qStr}\\) ${cond} → la suite est <strong>${label}</strong>.` };
    return { ok: false, msg: `\\(q = ${qStr}\\) ${cond} → la suite est <strong>${label}</strong>.` };
};

/* ==========================================================
   NIVEAU 6 : MODÉLISER UNE SITUATION CONCRÈTE
   ========================================================== */
const CONTEXTS_MODEL = [
    (u0, t) => `Une entreprise compte <strong>${fmt(u0)}</strong> employés. Ses effectifs ${t >= 0 ? 'augmentent' : 'diminuent'} de <strong>${Math.abs(t)}&nbsp;%</strong> chaque année.`,
    (u0, t) => `Une population de bactéries compte <strong>${fmt(u0)}</strong> individus. Elle ${t >= 0 ? 'croît' : 'décroît'} de <strong>${Math.abs(t)}&nbsp;%</strong> chaque heure.`,
    (u0, t) => `Un capital de <strong>${fmt(u0)}&nbsp;€</strong> est placé. Sa valeur ${t >= 0 ? 'augmente' : 'diminue'} de <strong>${Math.abs(t)}&nbsp;%</strong> chaque année.`,
    (u0, t) => `Une masse de matière radioactive de <strong>${fmt(u0)}&nbsp;g</strong> ${t >= 0 ? 'augmente' : 'diminue'} de <strong>${Math.abs(t)}&nbsp;%</strong> chaque jour.`,
    (u0, t) => `Le nombre d'abonnés d'une chaîne, actuellement de <strong>${fmt(u0)}</strong>, ${t >= 0 ? 'augmente' : 'diminue'} de <strong>${Math.abs(t)}&nbsp;%</strong> chaque mois.`,
];

GENERATORS.modelisation = function () {
    const u0pool = [100, 150, 200, 300, 500, 800, 1000, 1500, 2000, 5000];
    const u0 = u0pool[rnd(0, u0pool.length - 1)];
    const tauxPool = [-30, -25, -20, -15, -10, -5, 5, 10, 15, 20, 25, 30, 40, 50];
    const taux_pct = tauxPool[rnd(0, tauxPool.length - 1)];
    const q = round4(1 + taux_pct / 100);
    const n = rnd(3, 7);
    const un = round4(u0 * Math.pow(q, n));
    if (!isFinite(un) || Math.abs(un) > 5000000) return GENERATORS.modelisation();
    const ctx = CONTEXTS_MODEL[rnd(0, CONTEXTS_MODEL.length - 1)](u0, taux_pct);
    return { u0, taux_pct, q, n, un, ctx };
};

CHECKERS.modelisation = function (q) {
    const box = document.getElementById('exBody');
    const stepsDone = box.querySelectorAll('.step-block.locked').length;

    if (stepsDone === 0) {
        const inp = document.getElementById('qval');

        inp.classList.remove('ok', 'err');
        const ok = v !== null && closeRel(v, q.q, 0.005);

            lockStepSimple('step0');
            appendStepUn(q);
            return { ok: true, msg: `\\(q = 1 ${sign} ${Math.abs(q.taux_pct / 100)} = ${String(q.q).replace('.', ',')}\\). Calcule maintenant \\(u_{${q.n}}\\) !`, advanceOnly: true };
        }
        return { ok: false, msg: `\\(q = 1 + \\dfrac{t}{100} = 1 ${sign} ${Math.abs(q.taux_pct / 100)} = ${String(q.q).replace('.', ',')}\\).` };
    }

    const inp = document.getElementById('unval');
    const v = normNum(inp.value);
    inp.classList.remove('ok', 'err');
    const ok = v !== null && closeRel(v, q.un, 0.01);
    inp.classList.add(ok ? 'ok' : 'err');
    const qStr = String(q.q).replace('.', ',');
    if (ok) return { ok: true, msg: `\\(u_{${q.n}} = u_0\\times q^{${q.n}} = ${fmt(q.u0)}\\times ${qStr}^{${q.n}} \\approx ${fmt(q.un)}\\).` };
    return { ok: false, msg: `\\(u_{${q.n}} = ${fmt(q.u0)}\\times ${qStr}^{${q.n}} \\approx ${fmt(q.un)}\\).` };
};
