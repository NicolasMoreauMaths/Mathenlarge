<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Starter n°32 · Quatrième</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --paper:#F7F3E9; --card:#FFFDF7; --ink:#2B2A28; --muted:#6E675C;
  --line:#E7DEC9; --brique:#B0442F; --brique-soft:#f3e3dd;
  --teal:#2A7F73; --amber:#D98A3D; --shade:#DBEFD7;
  --chip:#efe7d4;
  --shadow:0 1px 2px rgba(60,45,20,.06), 0 8px 24px rgba(60,45,20,.06);
}
html[data-theme="dark"]{
  --paper:#201D19; --card:#2B2722; --ink:#ECE5D7; --muted:#A99F8E;
  --line:#3B362E; --brique:#E48267; --brique-soft:#3a2a25;
  --teal:#62B2A4; --amber:#E0A35C; --shade:rgba(98,178,164,.18);
  --chip:#34302a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif; line-height:1.45;
  -webkit-font-smoothing:antialiased; padding-bottom:3rem;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 18px}
header{padding:30px 0 14px}
.eyebrow{font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--teal); font-weight:600; margin:0 0 8px}
.headrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo{flex:none; width:clamp(46px,6.5vw,72px); color:var(--brique); line-height:0}
.logo svg{width:100%; height:auto; display:block}
.fshead .logo{width:1.25em}
h1{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(2rem,5.5vw,3.2rem); line-height:1.02; margin:0; letter-spacing:-.01em}
.sub{margin:12px 0 0; color:var(--muted); font-size:.96rem; max-width:64ch}
.theme{margin:6px 0 0; font-family:"Fraunces",serif; font-weight:600; font-size:1.06rem; color:var(--ink)}
.durstep{display:inline-flex; align-items:center; gap:4px}
.durlbl{font-size:.82rem; color:var(--muted); min-width:3.4em; text-align:center; font-variant-numeric:tabular-nums}
.sub b{color:var(--ink); font-weight:600}
.console{position:sticky; top:0; z-index:20; margin:18px 0 8px; background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:12px 14px}
.console-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.btn{font-family:inherit; font-size:.9rem; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; border-radius:10px; transition:transform .08s ease, background .15s, border-color .15s}
.btn:hover{border-color:var(--muted)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.btn.primary{background:var(--brique); border-color:var(--brique); color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent} .btn.icon{padding:9px 11px; line-height:1}
.spacer{flex:1 1 auto}
.chrono{font-family:"Fraunces",serif; font-weight:600; font-variant-numeric:tabular-nums; font-size:1.5rem; min-width:84px; text-align:center; letter-spacing:.02em; padding:2px 10px; border-radius:10px; background:var(--chip)}
.chrono.fin{color:var(--brique); animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.45}}
.count{font-size:.86rem; color:var(--muted); font-weight:600; white-space:nowrap}
.count b{color:var(--brique); font-size:1rem}
.piste{margin-top:12px; position:relative; height:30px}
.lane{position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%); background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px); border-radius:6px}
.runner{position:absolute; top:50%; transform:translate(-50%,-50%); left:0; font-size:1.35rem; transition:left 1s linear; will-change:left}
.flag{position:absolute; right:-2px; top:50%; transform:translateY(-50%); font-size:1.15rem}
.grid{margin-top:22px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px 14px 12px; cursor:pointer; display:flex; flex-direction:column; min-height:150px; transition:border-color .15s, box-shadow .15s, transform .08s}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.card.done{border-color:var(--brique)}
.card .top{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.num{font-family:"Fraunces",serif; font-weight:600; font-size:.95rem; width:30px; height:30px; flex:none; display:grid; place-items:center; background:var(--chip); color:var(--ink); border-radius:9px}
.card.done .num{background:var(--brique); color:#fff}
.tag{font-size:.7rem; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; font-weight:600}
.enonce{font-size:.96rem; margin:2px 0 6px}
.fig{margin:auto 0 4px; display:flex; align-items:center; justify-content:center}
.fig > svg{display:block; margin:.3rem auto; height:200px; width:auto; max-width:100%}
.fig img{display:block; margin:.3rem auto; max-height:300px; width:auto; max-width:100%}
.fig .stroke{fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round}
.fig .shade{fill:var(--shade); stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round}
.fig .dash{fill:none; stroke:var(--ink); stroke-width:1.5; stroke-dasharray:5 3.5}
.fig .ra{fill:none; stroke:var(--ink); stroke-width:1.4}
.fig .dot{fill:var(--ink)}
.fig text{fill:var(--ink); font-family:"DM Sans",sans-serif; font-size:12px; font-weight:600}
.fig .it{fill:var(--muted); font-style:italic; font-weight:500}
.fig .bg{fill:var(--card)}
.fig .grid-line{stroke:var(--line); stroke-width:.8}
.fig.fig-lg > svg{height:300px}
.fig.fig-lg img{max-height:520px}
@media (min-width:900px){.fig.fig-lg > svg{height:360px} .fig.fig-lg img{max-height:460px}}
@media (max-width:600px){.fig.fig-lg > svg{height:250px} .fig.fig-lg img{max-height:320px}}
sup{font-size:.7em}
.foot{margin-top:auto; padding-top:8px}
.reveal{display:flex; align-items:center; gap:8px; min-height:40px; border-top:1px dashed var(--line); padding-top:9px; margin-top:8px}
.hint{color:var(--muted); font-size:.82rem; font-style:italic}
.answer{display:none; align-items:baseline; gap:6px; flex-wrap:wrap; font-family:"Fraunces",serif; font-size:1.05rem; font-weight:600; color:var(--brique); line-height:1.45}
.answer .lab{font-family:"DM Sans",sans-serif; font-size:.7rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--teal)}
.answer .katex{white-space:nowrap}
.card.done .answer{display:flex}
.card.done .hint{display:none}
.answer.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8); opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1); opacity:1}}

/* ─── Override: answers containing arrow-method become block ─── */
.card.done .answer:has(.arrow-method){display:block}
.answer .lab-block{font-family:"DM Sans",sans-serif; font-size:.7rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); margin-bottom:6px}

#fsView{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; gap:30px; background:var(--paper); color:var(--ink); text-align:center; padding:24px}
#fsView.active{display:flex}
.fshead{font-family:"Fraunces",serif; font-size:clamp(1.1rem,3.4vw,2rem); color:var(--muted); display:flex; align-items:center; gap:12px}
.fshead .fox{font-size:1.5em; line-height:1}
#fsTime{font-family:"Fraunces",serif; font-weight:600; font-variant-numeric:tabular-nums; font-size:clamp(5rem,27vw,24rem); line-height:.86; letter-spacing:.02em}
#fsTime.fin{color:var(--brique); animation:pulse 1s ease infinite}
.fsbtns{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
.fsbtns .btn{font-size:1.05rem; padding:14px 22px; border-radius:14px}
.fshint{color:var(--muted); font-size:.85rem}
#fsView .fspiste{position:relative; height:48px; width:min(720px,82vw); margin:2px auto 0}
#fsView .fslane{position:absolute; left:0; right:0; top:50%; height:9px; transform:translateY(-50%); background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 34px); border-radius:9px}
#fsView .fsrunner{position:absolute; top:50%; left:0; transform:translate(-50%,-50%); font-size:2.1rem; line-height:1; transition:left 1s linear; will-change:left}
#fsView .fsflag{position:absolute; right:-2px; top:50%; transform:translateY(-50%); font-size:1.7rem}
footer{margin-top:30px; color:var(--muted); font-size:.82rem; text-align:center}
footer b{color:var(--ink)}
.card.card-wide{grid-column:span 2}
@media (min-width:900px){.fig > svg{height:230px}}
@media (max-width:520px){.card.card-wide{grid-column:span 1}}
@media (max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px} .chrono{font-size:1.25rem} .console{border-radius:14px} .fig > svg{height:180px}}
@media (max-width:420px){.grid{grid-template-columns:1fr} .card{min-height:auto; padding:14px} .fig > svg{height:190px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}

/* ─── Tableau de valeurs (dans les cartes) ─── */
.val-table{border-collapse:collapse; margin:.5rem auto; font-size:.92rem}
.val-table th,.val-table td{border:1.5px solid var(--line); padding:6px 14px; text-align:center; font-weight:600}
.val-table th{background:var(--chip); color:var(--muted); font-size:.82rem}
.val-table td{background:var(--card)}

/* ─── Highlight blue for common factors ─── */
.hi-blue{color:var(--teal); font-weight:700}

/* ─── Graph answer with figure ─── */
.card.done .answer:has(.fig-answer){display:block}
.fig-answer{margin:.4rem 0}
.fig-answer svg{display:block; margin:.3rem auto; height:280px; width:auto; max-width:100%}

/* ══ RESPONSIVE ENHANCEMENTS ══ */

/* ── KaTeX overflow ── */
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.katex { white-space: normal; }

/* ── 380px – very small screens ── */
@media (max-width:380px){
  body { padding-bottom: 2rem; }
  h1 { font-size: clamp(1.5rem, 5vw, 2rem) !important; }
  .sub { font-size: 0.82rem; }
  .theme { font-size: 0.92rem; }
  .chrono { font-size: 1.1rem; min-width: 68px; padding: 2px 6px; }
  .count { font-size: 0.78rem; }
  .btn { font-size: 0.82rem; padding: 7px 10px; }
  .card { padding: 12px; }
  .enonce { font-size: 0.92rem; }
  .sol-box { padding: 10px; font-size: 0.9rem; }
  .hint { font-size: 0.85rem; }
  .answer input, .answer select { font-size: 0.92rem; }
  .foot { font-size: 0.78rem; padding: 1rem 0.5rem; }
  .top { padding: 0.6rem 0.75rem; gap: 0.5rem; }
  .headrow { flex-wrap: wrap; gap: 0.4rem; }
  .eyebrow { font-size: 0.65rem; }
  .durlbl { font-size: 0.72rem; }
  .console { padding: 12px; border-radius: 10px; }
  .console-row { gap: 0.3rem; }
  .eq-line { font-size: 0.88rem; }
  .arrow-row { font-size: 0.85rem; }
  .grid { gap: 8px; }
  .fig > svg { height: 150px !important; }
  .reveal { font-size: 0.82rem; }
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <div class="headrow">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 100 104" fill="currentColor" stroke="currentColor" style="max-width:100%;height:auto;"><rect x="45" y="18" width="10" height="11" rx="1.5"/><rect x="41.5" y="11" width="17" height="8" rx="3.5"/><line x1="30" y1="40" x2="23.5" y2="33.5" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="58" r="30" fill="none" stroke-width="5"/><line x1="50" y1="30" x2="50" y2="36" stroke-width="3.4"/><line x1="78" y1="58" x2="72" y2="58" stroke-width="3.4"/><line x1="50" y1="86" x2="50" y2="80" stroke-width="3.4"/><line x1="22" y1="58" x2="28" y2="58" stroke-width="3.4"/><line x1="50" y1="58" x2="67" y2="43" stroke-width="5.5" stroke-linecap="round"/><circle cx="50" cy="58" r="4.2"/></svg></span>
      <h1 id="title"></h1>
    </div>
    <p class="theme" id="themeLine"></p>
    <p class="sub" id="sub"></p>
  </header>
  <div class="console" role="region" aria-label="Pilotage de la séance">
    <div class="console-row">
      <div class="chrono" id="chrono" aria-live="off">10:00</div>
      <button class="btn icon ghost" id="play" title="Démarrer / mettre en pause" aria-label="Démarrer ou mettre en pause">▶</button>
      <button class="btn icon ghost" id="rewind" title="Remettre le chrono à 10 min" aria-label="Réinitialiser le chrono">↺</button>
      <button class="btn icon ghost" id="fs" title="Chrono en plein écran" aria-label="Afficher le chrono en plein écran">⛶</button>
      <span class="durstep"><button class="btn icon ghost" id="durMinus" title="Diminuer la durée" aria-label="Diminuer la durée">−</button><span class="durlbl" id="durLbl">10 min</span><button class="btn icon ghost" id="durPlus" title="Augmenter la durée" aria-label="Augmenter la durée">+</button></span>
      <span class="spacer"></span>
      <span class="count" id="count"><b>0</b> / 10 dévoilées</span>
      <button class="btn icon ghost" id="theme" title="Thème clair / sombre" aria-label="Basculer le thème">☾</button>
    </div>
    <div class="console-row" style="margin-top:10px">
      <button class="btn primary" id="next">Dévoiler la réponse suivante</button>
      <button class="btn" id="all">Tout afficher</button>
      <button class="btn ghost" id="reset">Réinitialiser</button>
    </div>
    <div class="piste" aria-hidden="true"><div class="lane"></div><div class="runner" id="runner">🦊</div><div class="flag">🏁</div></div>
  </div>
  <main class="grid" id="grid" aria-label="Questions"></main>
  <footer><span id="footText"></span><br>Astuce&nbsp;: cliquez une carte pour dévoiler sa réponse, ou utilisez «&nbsp;Dévoiler la réponse suivante&nbsp;». Le bouton ⛶ met le chrono en plein écran.</footer>
</div>

<div id="fsView" aria-hidden="true">
  <div class="fshead"><span class="logo" aria-hidden="true"><svg viewBox="0 0 100 104" fill="currentColor" stroke="currentColor" style="max-width:100%;height:auto;"><rect x="45" y="18" width="10" height="11" rx="1.5"/><rect x="41.5" y="11" width="17" height="8" rx="3.5"/><line x1="30" y1="40" x2="23.5" y2="33.5" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="58" r="30" fill="none" stroke-width="5"/><line x1="50" y1="30" x2="50" y2="36" stroke-width="3.4"/><line x1="78" y1="58" x2="72" y2="58" stroke-width="3.4"/><line x1="50" y1="86" x2="50" y2="80" stroke-width="3.4"/><line x1="22" y1="58" x2="28" y2="58" stroke-width="3.4"/><line x1="50" y1="58" x2="67" y2="43" stroke-width="5.5" stroke-linecap="round"/><circle cx="50" cy="58" r="4.2"/></svg></span><span id="fsTitle"></span></div>
  <div id="fsTime">10:00</div>
  <div class="fspiste" aria-hidden="true"><div class="fslane"></div><div class="fsrunner" id="fsRunner">🦊</div><div class="fsflag">🏁</div></div>
  <div class="fsbtns">
    <button class="btn primary" id="fsPlay">▶ Démarrer</button>
    <button class="btn" id="fsRewind">↺ Remettre à 10:00</button>
    <button class="btn ghost" id="fsQuit">Quitter le plein écran</button>
  </div>
  <div class="fshint">Touche Échap pour quitter</div>
</div>

<script>
/* ============================================================ */
const TITRE     = "Le Starter n°32";
const THEME     = "";
const NIVEAU    = "Quatrième";
const DUREE_MIN = 10;

const QUESTIONS = [
  /* ── Q1 : Sections ── */
  { t:"Sections",
    e:"On coupe un cylindre de révolution par un plan parallèle à sa base.<br><br>Quelle est la forme de sa section&nbsp;?",
    a:`<span class="lab-block">Rép.</span>
<div style="font-size:.95rem; line-height:1.8; margin:.3rem 0">
La section d'un cylindre de révolution par un plan parallèle à sa base est <b>un disque</b> (un cercle).
</div>
<div class="fig-answer">
<svg viewBox="0 0 300 310" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <!-- Arrière du cylindre (partie cachée) -->
  <path d="M 70,240 A 80,25 0 0,1 230,240" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 3.5"/>
  <!-- Corps du cylindre -->
  <line x1="70" y1="240" x2="70" y2="70" stroke="var(--ink)" stroke-width="1.7"/>
  <line x1="230" y1="240" x2="230" y2="70" stroke="var(--ink)" stroke-width="1.7"/>
  <!-- Ellipse du bas (avant) -->
  <path d="M 70,240 A 80,25 0 0,0 230,240" fill="none" stroke="var(--ink)" stroke-width="1.7"/>
  <!-- Ellipse du haut -->
  <ellipse cx="150" cy="70" rx="80" ry="25" fill="var(--card)" stroke="var(--ink)" stroke-width="1.7"/>
  <!-- Plan de coupe (section) -->
  <ellipse cx="150" cy="160" rx="80" ry="25" fill="var(--shade)" stroke="var(--brique)" stroke-width="2.2" opacity=".85"/>
  <!-- Flèche + label plan -->
  <line x1="248" y1="160" x2="272" y2="160" stroke="var(--brique)" stroke-width="1.5" marker-end="url(#arrSec)"/>
  <defs><marker id="arrSec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="var(--brique)"/></marker></defs>
  <text x="255" y="150" fill="var(--brique)" font-size="11px" font-weight="600">plan de</text>
  <text x="255" y="164" fill="var(--brique)" font-size="11px" font-weight="600">coupe</text>
  <!-- Label section = disque -->
  <text x="150" y="165" text-anchor="middle" fill="var(--brique)" font-size="13px" font-weight="700">disque</text>
</svg>
</div>
<div class="sol-line">La section est <b>un disque</b>.</div>` },

  /* ── Q2 : Puissances de 10 ── */
  { t:"Puissances",
    e:"Calculer&nbsp;:<br><br>$$0{,}05 \\times 10^{-3}$$",
    a:`<span class="lab-block">Rép.</span>
<div class="sol-line">$0{,}05 \\times 10^{-3} = \\boldsymbol{0{,}00005}$</div>` },

  /* ── Q3 : Aire figure composée ── */
  { t:"Aires", wide:true,
    e:"Calculer l'aire de la figure ci-dessous&nbsp;:",
    f:`<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
      <!-- Figure composée : triangle rectangle à gauche + rectangle à droite -->
      <!-- Sommets : A(40,170) B(100,170) C(100,50) D(280,50) E(280,170) -->
      <!-- Triangle : A-B-C rectangle en B -->
      <!-- Rectangle : B-E-D-C -->
      <polygon class="shade" points="40,170 280,170 280,50 100,50 100,170"/>
      <!-- Triangle séparé visuellement -->
      <polygon style="fill:var(--shade); opacity:.5" points="40,170 100,170 100,50"/>
      <!-- Contour complet -->
      <polyline class="stroke" points="40,170 280,170 280,50 100,50 40,170"/>
      <!-- Séparation triangle / rectangle -->
      <line class="stroke" x1="100" y1="170" x2="100" y2="50" stroke-dasharray="5 3"/>

      <!-- Angle droit en B (100,170) — jonction triangle/rectangle -->
      <polyline class="ra" points="100,155 115,155 115,170"/>
      <!-- Angle droit en C (100,50) — coin rectangle -->
      <polyline class="ra" points="115,50 115,65 100,65"/>
      <!-- Angle droit en D (280,50) — coin rectangle -->
      <polyline class="ra" points="265,50 265,65 280,65"/>
      <!-- Angle droit en E (280,170) — coin rectangle -->
      <polyline class="ra" points="265,170 265,155 280,155"/>

      <!-- Codage côtés opposés du rectangle égaux -->
      <!-- Haut (C→D) et bas (B→E) : double tick -->
      <!-- CD milieu : (190, 50) -->
      <line stroke="var(--ink)" stroke-width="1.6" x1="186" y1="44" x2="190" y2="56"/>

  /* ── Q6 : Priorités opératoires ── */
  { t:"Priorités",
    e:"Calculer&nbsp;:<br><br>$$5 - 2 \\times 3^2$$",
    a:`<span class="lab-block">Rép.</span>
<div style="font-size:.95rem; line-height:1.8; margin:.3rem 0">
$5 - 2 \\times 3^2$<br>
$= 5 - 2 \\times 9$<br>
$= 5 - 18$<br>
$= -13$
</div>
<div class="sol-line">$5 - 2 \\times 3^2 = \\boldsymbol{-13}$</div>` },

/* ============================================================ */

const Q = QUESTIONS;

/* ---------- Construction des cartes ---------- */
const grid = document.getElementById('grid');
Q.forEach((q,i)=>{
  const c = document.createElement('div');
  c.className = 'card'+(q.wide?' card-wide':''); c.tabIndex = 0; c.dataset.i = i;
  c.setAttribute('role','button');
  c.setAttribute('aria-label','Question '+(i+1));
  c.innerHTML =
    `<div class="top"><span class="num">${i+1}</span>${q.t?`<span class="tag">${q.t}</span>`:''}</div>
     <div class="enonce">${q.e}</div>
     ${q.f?`<div class="fig${q.fc?' '+q.fc:''}">${q.f}</div>`:''}
     <div class="foot"><div class="reveal">
        <span class="hint">Réponse cachée</span>
        <span class="answer"><span class="lab">Rép.</span><span>${q.a}</span></span>
     </div></div>`;
  c.addEventListener('click', ()=>toggle(i));
  c.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault(); toggle(i);} });
  grid.appendChild(c);
});
const cards = [...grid.children];
const TOTQ = cards.length;

/* ---------- KaTeX render ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof renderMathInElement==='function'){
    renderMathInElement(document.body,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
});

/* ---------- Révélation ---------- */
const countEl = document.getElementById('count');
const runner  = document.getElementById('runner');
const fsRunner = document.getElementById('fsRunner');
function shown(){ return cards.filter(c=>c.classList.contains('done')).length; }
function refresh(){ const n=shown(); countEl.innerHTML='<b>'+n+'</b> / '+TOTQ+' dévoilées'; }
function setDone(c,on,pop){
  c.classList.toggle('done',on);
  if(on && pop){
    const a=c.querySelector('.answer');
    a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop');
    if(typeof renderMathInElement==='function'){
      renderMathInElement(a,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
    }
  }
  refresh();
}
function toggle(i){ setDone(cards[i], !cards[i].classList.contains('done'), true); }

document.getElementById('next').addEventListener('click', ()=>{
  const c = cards.find(c=>!c.classList.contains('done'));
  if(!c) return;
  setDone(c,true,true);
  c.scrollIntoView({behavior:'smooth', block:'center'});
});
document.getElementById('all').addEventListener('click', ()=>{
  cards.forEach(c=>setDone(c,true,false));
  if(typeof renderMathInElement==='function'){
    renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
});
document.getElementById('reset').addEventListener('click', ()=>{ cards.forEach(c=>setDone(c,false,false)); });
refresh();

/* ---------- Chronomètre ---------- */
let TOT = DUREE_MIN*60;
let left = TOT, timer = null;
const chrono  = document.getElementById('chrono');
const fsTime  = document.getElementById('fsTime');
const play    = document.getElementById('play');
const fsPlay  = document.getElementById('fsPlay');
function setPlayIcons(running){ play.textContent=running?'⏸':'▶'; fsPlay.textContent=running?'⏸ Pause':'▶ Démarrer'; }
function paint(){
  const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0');
  const t=m+':'+s; chrono.textContent=t; fsTime.textContent=t;
  chrono.classList.toggle('fin',left===0); fsTime.classList.toggle('fin',left===0);
  const pct=((TOT-left)/TOT*100)+'%'; runner.style.left=pct; if(fsRunner) fsRunner.style.left=pct;
}
function tick(){ if(left>0){left--;paint();}else stop(); }
function start(){ if(timer) return; timer=setInterval(tick,1000); setPlayIcons(true); }
function stop(){ clearInterval(timer); timer=null; setPlayIcons(false); }
function togglePlay(){ timer ? stop() : (left>0 && start()); }
function rewind(){ stop(); left=TOT; paint(); }
play.addEventListener('click', togglePlay);
fsPlay.addEventListener('click', togglePlay);
document.getElementById('rewind').addEventListener('click', rewind);
fsRewind.addEventListener('click', rewind);
paint();

/* ---------- Configuration + durée ---------- */
let DUR = DUREE_MIN;
const durLbl = document.getElementById('durLbl');
const subEl  = document.getElementById('sub');
function fmtMS(min){ return String(min).padStart(2,'0')+':00'; }
function setDuree(min){
  DUR = Math.max(1, Math.min(30, min));
  TOT = DUR*60; durLbl.textContent = DUR+' min';
  document.getElementById('rewind').title = 'Remettre le chrono à '+DUR+' min';
  fsRewind.textContent = '↺ Remettre à '+fmtMS(DUR);
  subEl.innerHTML = Q.length+' questions, <b>'+DUR+' minutes</b>, sans calculatrice. Lancez le chrono, puis dévoilez les réponses une à une pour la correction.';
  rewind();
}
document.getElementById('durMinus').addEventListener('click', ()=>setDuree(DUR-1));
document.getElementById('durPlus').addEventListener('click', ()=>setDuree(DUR+1));

(function applyConfig(){
  document.getElementById('eyebrow').textContent = 'Rituel de calcul mental · '+NIVEAU;
  document.getElementById('title').innerHTML = TITRE;
  const th = document.getElementById('themeLine');
  if(THEME){th.textContent=THEME;th.style.display='';} else {th.style.display='none';}
  const titrePlain = TITRE.replace(/<br\s*\/?>/gi,' ');
  document.getElementById('fsTitle').textContent = titrePlain;
  document.getElementById('footText').innerHTML = '<b>mathenlarge.fr</b> — '+titrePlain+' · '+NIVEAU+'.';
  document.title = titrePlain + (THEME?' — '+THEME:'') + ' · '+NIVEAU;
  setDuree(DUREE_MIN);
})();

/* ---------- Plein écran ---------- */
const fsView = document.getElementById('fsView');
function enterFS(){ fsView.classList.add('active'); fsView.setAttribute('aria-hidden','false'); if(fsView.requestFullscreen){fsView.requestFullscreen().catch(()=>{});} }
function exitFS(){ if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});} fsView.classList.remove('active'); fsView.setAttribute('aria-hidden','true'); }
document.getElementById('fs').addEventListener('click', enterFS);
document.getElementById('fsQuit').addEventListener('click', exitFS);
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement){fsView.classList.remove('active');fsView.setAttribute('aria-hidden','true');} });

/* ---------- Thème ---------- */
const root=document.documentElement, themeBtn=document.getElementById('theme');
themeBtn.addEventListener('click', ()=>{ const dark=root.getAttribute('data-theme')==='dark'; root.setAttribute('data-theme',dark?'light':'dark'); themeBtn.textContent=dark?'☾':'☀'; });
</script>
