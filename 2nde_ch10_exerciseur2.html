<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Équation cartésienne — Exerciseur interactif</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #eef2f7;
    --grid: #d5dce6;
    --card: #fff;
    --blue: #1a6fa0;
    --blue-light: #2d8dc7;
    --blue-pale: rgba(26, 111, 160, 0.08);
    --blue-border: rgba(26, 111, 160, 0.2);
    --purple: #6b3fa0;
    --purple-light: #8b5fc8;
    --purple-pale: rgba(107, 63, 160, 0.1);
    --orange: #b85c0b;
    --orange-pale: rgba(184, 92, 11, 0.1);
    --orange-border: rgba(184, 92, 11, 0.25);
    --green: #1b7a40;
    --green-pale: rgba(27, 122, 64, 0.1);
    --red: #c0392b;
    --red-pale: rgba(192, 57, 43, 0.08);
    --teal: #0d9488;
    --teal-pale: rgba(13, 148, 136, 0.1);
    --gold: #b8860b;
    --gold-pale: rgba(184, 134, 11, 0.12);
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(30, 41, 59, 0.08);
}

body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: 16px 10px 60px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
}

.app { max-width: 900px; width: 100%; }

.app-header {
    background: linear-gradient(135deg, #0c1624 0%, #162236 45%, #1c3358 100%);
    color: #fff;
    padding: 18px 24px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(12, 22, 36, 0.4);
    position: relative;
    overflow: hidden;
}

.app-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 50%);
    pointer-events: none;
}

.app-header-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--red), var(--blue), var(--purple), var(--green));
}

.app-title {
    font-size: 1.25em;
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.app-title::before { content: '📐'; font-size: 1.15em; }

.main {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 28px var(--shadow);
    min-height: 60vh;
}

.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
}

h1 {
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--blue);
}

.sub {
    text-align: center;
    font-size: 0.92em;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
}

/* ── BUTTONS ── */
.btn {
    font-family: 'DM Sans', sans-serif;
    padding: 11px 26px;
    border-radius: 12px;
    font-size: 0.93em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
}

.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-blue { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 2px 12px rgba(26,111,160,0.2); }
.btn-blue:hover:not(:disabled) { background: var(--blue-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(26,111,160,0.3); }

.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }

.btn-ghost { background: transparent; color: var(--text-light); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text-light); }

.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

/* ── MENU ── */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin: 20px 0;
}

.mc {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mc:hover { border-color: var(--blue); transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
.mc-icon { font-size: 2em; margin-bottom: 8px; }
.mc-t { font-size: 0.9em; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
.mc-d { font-size: 0.78em; color: var(--text-light); line-height: 1.4; }
.mc-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--orange-pale); color: var(--orange);
    font-size: 0.68em; font-weight: 700; padding: 3px 10px; border-radius: 12px;
}

/* ── EX HEADER ── */
.ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.ex-badge { background: var(--blue-pale); color: var(--blue); padding: 6px 16px; border-radius: 20px; font-size: 0.84em; font-weight: 700; }
.ex-score { font-size: 0.88em; color: var(--text-light); font-weight: 600; }

.pbar { width: 100%; background: var(--border); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 20px; }
.pfill { height: 100%; background: linear-gradient(90deg, var(--red), var(--blue), var(--purple)); border-radius: 6px; transition: width 0.4s; }

/* ── CONTEXT CARD ── */
.ctx-card {
    background: linear-gradient(135deg, #f5f9ff, #eff4ff);
    border: 1.5px solid #c5d8f0;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.93em;
    line-height: 1.7;
}

.ctx-card .ctx-label {
    font-size: 0.68em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--blue); margin-bottom: 6px; display: block;
}

/* ── FORMULA REMINDER ── */
.formula-remind {
    background: var(--gold-pale);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.84em;
    color: #7a5800;
    margin: 0 0 18px;
    text-align: center;
    line-height: 1.7;
}

/* ── QUESTION BLOCK ── */
.q-prompt {
    font-size: 1.05em;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.6;
    text-align: center;
}

.eq-display {
    text-align: center;
    font-size: 1.3em;
    font-weight: 700;
    margin: 4px 0 18px;
    color: var(--blue);
}

/* ── INPUT FIELD ── */
.answer-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.answer-unit {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--text-light);
}

.answer-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    width: 160px;
    padding: 10px 12px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
}

.answer-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-pale); }
.answer-input.ok { border-color: var(--green); background: var(--green-pale); color: var(--green); }
.answer-input.err { border-color: var(--red); background: var(--red-pale); animation: shake 0.3s; }

.answer-input.wide { width: 220px; }
.answer-input.narrow { width: 110px; }
.answer-input.tiny { width: 78px; }

/* ── MULTI-INPUT ROW ── */
.row-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.row-label {
    font-size: 0.85em; font-weight: 600; color: var(--text-light);
}

/* ── CHOICE BUTTONS ── */
.choice-grid {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
}

.choice-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95em;
    font-weight: 700;
    padding: 14px 22px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 120px;
    text-align: center;
}

.choice-btn:hover { border-color: var(--blue); transform: translateY(-2px); }
.choice-btn.chosen { background: var(--purple); border-color: var(--purple); color: white; }
.choice-btn.ok { background: var(--green-pale); border-color: var(--green); color: var(--green); }
.choice-btn.err { background: var(--red-pale); border-color: var(--red); color: var(--red); animation: shake 0.3s; }

/* ── CALCULATOR ── */
.calc-wrap {
    background: #1e293b;
    border-radius: 16px;
    padding: 16px;
    max-width: 320px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.calc-display {
    background: #0f172a;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-family: 'DM Sans', monospace;
    font-size: 1.5em;
    font-weight: 600;
    color: #7dd3fc;
    text-align: right;
    min-height: 52px;
    overflow: hidden;
    word-break: break-all;
}

.calc-expr {
    font-size: 0.55em;
    color: #475569;
    text-align: right;
    min-height: 18px;
    margin-bottom: 4px;
    font-family: 'DM Sans', monospace;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.calc-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 1em;
    font-weight: 700;
    padding: 12px 6px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 46px;
}

.calc-btn:active { transform: scale(0.93); }

.calc-num { background: #334155; color: #f1f5f9; }
.calc-num:hover { background: #475569; }
.calc-op { background: #1a6fa0; color: #fff; }
.calc-op:hover { background: #2d8dc7; }
.calc-eq { background: #1b7a40; color: #fff; }
.calc-eq:hover { filter: brightness(1.1); }
.calc-clear { background: #7f1d1d; color: #fecaca; }
.calc-clear:hover { background: #991b1b; }
.calc-back { background: #4c1d95; color: #ddd6fe; }
.calc-back:hover { background: #5b21b6; }
.calc-zero { grid-column: span 2; }
.calc-pct { background: #334155; color: #94a3b8; }
.calc-pct:hover { background: #475569; }

.calc-toggle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--text-light);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    margin: 0 auto 12px;
    display: block;
    transition: all 0.2s;
}

.calc-toggle:hover { background: var(--bg); border-color: var(--text-light); }

.calc-container { display: none; }
.calc-container.visible { display: block; }

/* ── STEP BLOCKS ── */
.step-block { margin-bottom: 18px; padding-bottom: 14px; }
.step-block.locked { opacity: 0.88; }
.step-block.locked .answer-input { pointer-events: none; }

.step-divider { border: none; border-top: 1.5px dashed var(--border); margin: 4px auto 18px; max-width: 500px; }

.step-tag {
    display: inline-block;
    font-size: 0.72em; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text-light);
    text-align: center; width: 100%; margin-bottom: 8px;
}

.step-tag.locked-tag { color: var(--green); }
.step-tag.locked-tag::before { content: '✓  '; }

/* ── FEEDBACK ── */
.fb {
    margin-top: 20px; padding: 14px 18px; border-radius: 12px;
    font-size: 0.93em; text-align: center; display: none;
    animation: fadeIn 0.3s; font-weight: 600; line-height: 1.7;
}
.fb.ok { display: block; background: var(--green-pale); color: var(--green); border: 2px solid rgba(27,122,64,0.2); }
.fb.bad { display: block; background: var(--red-pale); color: var(--red); border: 2px solid rgba(192,57,43,0.15); }

/* ── RESULTS ── */
.rc {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 20px auto; border: 6px solid;
}
.rc.good { border-color: var(--green); background: var(--green-pale); }
.rc.mid  { border-color: var(--orange); background: var(--orange-pale); }
.rc.bad  { border-color: var(--red); background: var(--red-pale); }
.rp { font-size: 2.2em; font-weight: 700; line-height: 1; }
.rm { font-size: 1.05em; text-align: center; margin: 16px 0; line-height: 1.5; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

@media (max-width: 640px) {
    .app-header { padding: 14px 18px; }
    .app-title { font-size: 1.05em; }
    .main { padding: 22px 16px; }
    h1 { font-size: 1.25em; }
    .menu-grid { grid-template-columns: 1fr; }
    .answer-input { width: 130px; font-size: 1.1em; }
}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(26,111,160,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(26,111,160,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 900px tablette ── */
@media(max-width:900px){
  .app { padding:0 12px; }
  .main { padding:12px; }
}
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-header-bar { flex-wrap:wrap; gap:4px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .mc-badge, .ex-badge { font-size:0.7rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }
  .choice-btn, .choice-grid .btn { font-size:0.85rem; padding:8px; }
  .choice-grid { gap:6px; }
  .q-prompt { font-size:0.9rem; }
  .screen { font-size:0.85rem; padding:10px; }
  .step-block { padding:8px; }
  .step-tag { font-size:0.75rem; }
  .fb { font-size:0.85rem; padding:8px; }
  .formula-remind, .formula-box { font-size:0.85rem; padding:8px; overflow-x:auto; }
  .ctx-card { padding:8px; font-size:0.85rem; }
  .answer-input, .ans-input { font-size:0.9rem; }
  .answer-wrap, .row-inputs { flex-wrap:wrap; gap:6px; }
  .pbar { height:6px; }
  .mode-toggle, .mode-btn { font-size:0.8rem; }
  .menu-btn { font-size:0.8rem; }
  .ex-top { flex-wrap:wrap; gap:4px; }
  .ex-score { font-size:0.8rem; }
}
/* ── overflow helpers ── */
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
svg[viewBox] { max-width:100%; height:auto; }
.mc, .screen, .step-block { overflow-wrap:break-word; word-break:break-word; }

</style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Droites — Équation cartésienne &amp; vecteur directeur</div>
        <div class="app-header-bar"></div>
    </div>
    <div class="main">

        <!-- MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Choisis un thème</h1>
            <p class="sub">Six exerciseurs pour maîtriser l'équation cartésienne, le vecteur directeur et le parallélisme des droites.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- EXERCISE -->
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Thème</span>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
            <div id="exBody"></div>
            <div class="fb" id="fb"></div>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue" id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc"><div class="rp" id="rp">0%</div></div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue" id="btnRetry">Recommencer</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ==========================================================
   CONFIG NIVEAUX
   ========================================================== */
const LEVELS = [
    { id: 'identification',    icon: '🔎', title: 'Identifier a, b, c',                         desc: 'Reconnaître les coefficients d\'une équation ax + by + c = 0', n: 10 },
    { id: 'vecteur_pente',      icon: '➡️', title: 'Vecteur directeur depuis y = mx + p',         desc: 'Utiliser la formule u(1 ; m)', n: 8 },
    { id: 'vecteur_cart',       icon: '📍', title: 'Vecteur directeur depuis ax + by + c = 0',     desc: 'Utiliser la formule u(−b ; a)', n: 8 },
    { id: 'vers_cartesienne',   icon: '↘️', title: 'De y = mx + p vers ax + by + c = 0',           desc: 'Tout passer à gauche du signe =', n: 8, badge: 'Calculatrice' },
    { id: 'vers_reduite',       icon: '↗️', title: 'De ax + by + c = 0 vers y = mx + p',           desc: 'Isoler y (si b ≠ 0)', n: 8, badge: 'Calculatrice' },
    { id: 'parallelisme',       icon: '∥',  title: 'Parallélisme et déterminant',                 desc: 'Deux droites sont parallèles ⇔ vecteurs directeurs colinéaires', n: 8, badge: 'Calculatrice' },
];

let state = { levelId: null, qIndex: 0, total: 0, score: 0, questions: [], checked: false };

/* ==========================================================
   UTILS
   ========================================================== */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function rndNonZero(min, max) {
    let v;
    do { v = rnd(min, max); } while (v === 0);
    return v;
}

function normNum(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(',', '.').replace(/\s+/g, '');
    if (s === '') return null;
    s = s.replace(/\u2212/g, '-').replace(/÷/g, '/');
    if (s.includes('/')) {
        const [n, d] = s.split('/').map(Number);
        if (isNaN(n) || isNaN(d) || d === 0) return null;
        return n / d;
    }
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
}

function close(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

function closeRel(a, b, eps = 1e-4) {
    if (Math.abs(b) < 1e-10) return Math.abs(a) < eps;
    return Math.abs((a - b) / b) < eps;
}

function round2(x) { return Math.round(x * 100) / 100; }
function round4(x) { return Math.round(x * 10000) / 10000; }

/* format number for display — avoids floating point noise */
function fmt(x) {
    const r = round2(x);
    return r % 1 === 0 ? String(r) : String(r).replace('.', ',');
}

/* nombre relatif signé pour affichage : renvoie {sign, abs} */
function signAbs(x) { return { sign: x < 0 ? '−' : '+', abs: Math.abs(x) }; }

/* Construit le texte LaTeX d'une équation cartésienne ax + by + c = 0
   à partir d'entiers a, b, c (a et b non tous deux nuls). Termes nuls omis. */
function texEq(a, b, c) {
    const terms = [];
    function push(coef, sym) {
        if (coef === 0) return;
        const abs = Math.abs(coef);
        const coefStr = (sym !== '' && abs === 1) ? '' : String(abs);
        terms.push({ neg: coef < 0, text: coefStr + sym });
    }
    push(a, 'x');
    push(b, 'y');
    push(c, '');
    if (terms.length === 0) return '0 = 0';
    let s = '';
    terms.forEach((t, i) => {
        if (i === 0) s += (t.neg ? '-' : '') + t.text;
        else s += ` ${t.neg ? '-' : '+'} ${t.text}`;
    });
    return s + ' = 0';
}

/* Compare un ensemble de valeurs saisies (vals) à un ensemble de valeurs de
   référence (targets) qui ne sont définies qu'à un facteur multiplicatif non
   nul près (ex : vecteur directeur, ou (a,b,c) d'une équation cartésienne).
   Au lieu de valider ou rejeter TOUT le groupe d'un bloc, on cherche le
   facteur k le plus plausible (celui qui fait correspondre le plus de
   champs), puis chaque champ est jugé individuellement par rapport à ce k :
   une seule erreur dans le lot n'invalide donc pas les champs corrects. */
function gradeProportional(vals, targets) {
    const n = vals.length;
    const tol = (v) => Math.max(0.02, Math.abs(v) * 0.02);
    const candidates = [];
    for (let i = 0; i < n; i++) {
        if (vals[i] !== null && Math.abs(targets[i]) > 1e-9) candidates.push(vals[i] / targets[i]);
    }
    if (candidates.length === 0) candidates.push(1);
    // À nombre de correspondances égal, on préfère le facteur le plus "simple"
    // (le plus proche d'un entier, puis le plus petit en valeur absolue) :
    // un élève se trompe rarement en choisissant une échelle exotique.
    function simplicity(k) {
        const intDist = Math.abs(k - Math.round(k));
        return [intDist, Math.abs(k)];
    }
    function better(k, bestK) {
        const [d1, a1] = simplicity(k), [d2, a2] = simplicity(bestK);
        if (d1 !== d2) return d1 < d2;
        return a1 < a2;
    }
    let bestK = candidates[0], bestMatches = -1;
    candidates.forEach((k) => {
        if (Math.abs(k) < 1e-9) return;
        let matches = 0;
        for (let i = 0; i < n; i++) {
            if (vals[i] !== null && close(vals[i], k * targets[i], tol(k * targets[i]))) matches++;
        }
        if (matches > bestMatches || (matches === bestMatches && better(k, bestK))) { bestMatches = matches; bestK = k; }
    });
    const oks = [];
    for (let i = 0; i < n; i++) {
        oks.push(vals[i] !== null && close(vals[i], bestK * targets[i], tol(bestK * targets[i])));
    }
    return { oks, full: oks.every(Boolean), k: bestK };
}

/* KaTeX auto-render — relancé après chaque rendu de question */
function renderKatex(el) {
    if (window.renderMathInElement) {
        renderMathInElement(el || document.body, {
            delimiters: [
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true },
            ],
            throwOnError: false
        });
    }
}

/* ==========================================================
   MOTEUR GENERIQUE
   ========================================================== */
const GENERATORS = {};
const RENDERERS = {};
const CHECKERS = {};

function startLevel(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    state.levelId = levelId;
    state.qIndex = 0;
    state.score = 0;
    state.total = lv.n;
    state.questions = [];
    for (let i = 0; i < lv.n; i++) state.questions.push(GENERATORS[levelId]());
    document.getElementById('exBadge').textContent = lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion() {
    state.checked = false;
    state.attempts = 0;
    const lv = LEVELS.find(l => l.id === state.levelId);
    document.getElementById('exScore').textContent = `Question ${state.qIndex + 1}/${state.total}`;
    document.getElementById('pfill').style.width = (state.qIndex / state.total * 100) + '%';
    const body = document.getElementById('exBody');
    body.innerHTML = '';
    const fb = document.getElementById('fb');
    fb.className = 'fb'; fb.textContent = '';
    document.getElementById('btnCheck').style.display = '';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnNext').style.display = 'none';
    RENDERERS[state.levelId](state.questions[state.qIndex], body);
    renderKatex(body);
}

document.getElementById('btnCheck').addEventListener('click', () => {
    if (state.checked) return;
    const q = state.questions[state.qIndex];
    const result = CHECKERS[state.levelId](q);
    const fb = document.getElementById('fb');
    if (result.ok) {
        fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + (result.msg || 'Exact, bien joué !');
        renderKatex(fb);
        if (result.advanceOnly) {
            setTimeout(() => { fb.className = 'fb'; fb.textContent = ''; }, 1200);
            // Cacher le Suivant provisoire (erreur précédente) s'il était visible
            document.getElementById('btnNext').style.display = 'none';
            return;
        }
        state.checked = true;
        state.score++;
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnNext').style.display = '';
    } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ ' + (result.msg || 'Ce n\'est pas encore ça, réessaie.');
        renderKatex(fb);
        // Dès la première erreur, afficher Suivant à côté de Vérifier
        document.getElementById('btnNext').style.display = '';
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    state.qIndex++;
    if (state.qIndex >= state.total) showResults();
    else renderQuestion();
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const exScreen = document.getElementById('screen-ex');
    if (!exScreen.classList.contains('active')) return;
    e.preventDefault();
    const btnNext  = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');
    // Entrée ne passe à la suite que si la réponse a déjà été validée (correcte).
    // Tant que ce n'est pas le cas (première tentative ou erreur à corriger),
    // Entrée relance toujours la vérification, même si le bouton "Suivant" est déjà affiché.
    if (state.checked && btnNext.style.display !== 'none' && btnNext.offsetParent) btnNext.click();
    else if (btnCheck.style.display !== 'none' && !btnCheck.disabled) btnCheck.click();
});

function showResults() {
    document.getElementById('pfill').style.width = '100%';
    const pct = Math.round(state.score / state.total * 100);
    const rc = document.getElementById('rc');
    rc.className = 'rc ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    document.getElementById('rp').textContent = pct + '%';
    let msg;
    if (pct >= 80) msg = `Excellent ! ${state.score}/${state.total} bonnes réponses. Tu maîtrises ce thème.`;
    else if (pct >= 50) msg = `${state.score}/${state.total} bonnes réponses. C'est en bonne voie, encore un peu d'entraînement !`;
    else msg = `${state.score}/${state.total} bonnes réponses. Reprends la leçon et réessaie, tu vas progresser.`;
    document.getElementById('rm').textContent = msg;
    showScreen('screen-res');
}

const calcState = {};

function toggleCalc(id) {
    const c = document.getElementById('calc-' + id);
    const btn = document.getElementById('calc-toggle-' + id);
    const visible = c.classList.toggle('visible');
    btn.textContent = visible ? '🔢 Masquer la calculatrice' : '🔢 Afficher la calculatrice';
    if (!calcState[id]) calcState[id] = { expr: '', result: '0', fresh: true };
}

function cCalc(id, key) {
    if (!calcState[id]) calcState[id] = { expr: '', result: '0', fresh: true };
    const s = calcState[id];
    const disp = document.getElementById('calc-val-' + id);
    const exprEl = document.getElementById('calc-expr-' + id);

    if (key === 'C') { s.expr = ''; s.result = '0'; s.fresh = true; }
    else if (key === '⌫') {
        if (s.fresh) { s.expr = ''; s.result = '0'; s.fresh = false; return; }
        s.expr = s.expr.slice(0, -1);
        if (!s.expr) { s.result = '0'; }
    }
    else if (key === '=') {
        try {
            let e = s.expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
            // handle % : replace number% by number/100
            e = e.replace(/(\d+(?:\.\d+)?)\s*%/g, '($1/100)');
            const v = Function('"use strict"; return (' + e + ')')();
            s.result = isFinite(v) ? String(round4(v)).replace('.', ',') : 'Erreur';
            exprEl.textContent = s.expr + ' =';
            s.expr = s.result.replace(',', '.');
            s.fresh = true;
        } catch { s.result = 'Erreur'; }
    }
    else if (['+', '-', '×', '÷'].includes(key)) {
        if (s.fresh) { s.fresh = false; }
        s.expr += key;
        s.result = s.expr;
    }
    else if (key === '%') {
        s.expr += '%';
        s.result = s.expr;
    }
    else {
        if (s.fresh) { s.expr = key; s.fresh = false; }
        else s.expr += key;
        s.result = s.expr;
    }
    disp.textContent = s.result;
    if (!s.fresh) exprEl.textContent = s.expr;
}

/* ==========================================================
   NIVEAU 1 : IDENTIFIER a, b, c
   ========================================================== */
GENERATORS.identification = function () {
    const modes = ['general', 'general', 'general', 'vertical', 'horizontale'];
    const mode = modes[rnd(0, modes.length - 1)];
    let a, b, c;
    if (mode === 'general') {
        a = rndNonZero(-6, 6);
        b = rndNonZero(-6, 6);
        c = rnd(-9, 9);
    } else if (mode === 'vertical') {
        a = [1, 1, 1, 2, 3, -1][rnd(0, 5)];
        b = 0;
        c = rnd(-9, 9);
        if (c === 0) c = 4;
    } else {
        a = 0;
        b = [1, 1, 1, -1, 2, -2][rnd(0, 5)];
        c = rnd(-9, 9);
        if (c === 0) c = 4;
    }
    const eq = texEq(a, b, c);
    return { a, b, c, mode, eq };
};

RENDERERS.identification = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : une équation cartésienne de droite s'écrit \\(ax + by + c = 0\\)</div>

CHECKERS.identification = function (q) {
    const ia = document.getElementById('ia'), ib = document.getElementById('ib'), ic = document.getElementById('ic');

    [ia, ib, ic].forEach((el, idx) => { el.classList.remove('ok', 'err'); el.classList.add([okA, okB, okC][idx] ? 'ok' : 'err'); });
    const ok = okA && okB && okC;
    let note = '';
    if (q.mode === 'vertical') note = ' Ici \\(b = 0\\) : c\'est une droite verticale.';
    else if (q.mode === 'horizontale') note = ' Ici \\(a = 0\\) : c\'est une droite horizontale.';
    if (ok) return { ok: true, msg: `On lit directement dans \\(ax + by + c = 0\\) : \\(a = ${q.a}\\), \\(b = ${q.b}\\), \\(c = ${q.c}\\).${note}` };
    return { ok: false, msg: `Compare terme à terme avec \\(ax + by + c = 0\\) : \\(a = ${q.a}\\), \\(b = ${q.b}\\), \\(c = ${q.c}\\). Un terme absent correspond à un coefficient <strong>nul</strong>.${note}` };
};

/* ==========================================================
   NIVEAU 4 : DE y = mx + p VERS ax + by + c = 0
   ========================================================== */
GENERATORS.vers_cartesienne = function () {
    const mPool = [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5];
    const m = mPool[rnd(0, mPool.length - 1)];
    const p = rnd(-8, 8);
    // forme de référence : a0 = m, b0 = -1, c0 = p
    return { m, p, a0: m, b0: -1, c0: p };
};

RENDERERS.vers_cartesienne = function (q, box) {
    const { sign, abs } = signAbs(q.p);
    const pStr = q.p === 0 ? '' : ` ${sign} ${abs}`;
    const mStr = q.m === 1 ? '' : q.m === -1 ? '-' : String(q.m);
    box.innerHTML = `
        <div class="formula-remind">Rappel : pour passer de \\(y = mx + p\\) à \\(ax + by + c = 0\\), on passe tout à gauche du signe =</div>
        <div class="q-prompt">Écris cette droite sous forme cartésienne \\(ax + by + c = 0\\) :</div>
        <div class="eq-display">\\(y = ${mStr}x${pStr}\\)</div>
        <div class="row-inputs">
            <span class="row-label">a =</span>
            <input type="text" class="answer-input tiny" id="ia" placeholder="…" inputmode="decimal">

CHECKERS.vers_cartesienne = function (q) {
    const ia = document.getElementById('ia'), ib = document.getElementById('ib'), ic = document.getElementById('ic');
    const va = normNum(ia.value), vb = normNum(ib.value), vc = normNum(ic.value);
    // N'importe quelle écriture équivalente est acceptée : (a,b,c) doit juste être
    // un multiple non nul de la forme de référence (a0, b0, c0). Chaque coefficient
    // est ensuite jugé individuellement par rapport au facteur le plus plausible.
    const g = gradeProportional([va, vb, vc], [q.a0, q.b0, q.c0]);
    [ia, ib, ic].forEach((el, idx) => { el.classList.remove('ok', 'err'); el.classList.add(g.oks[idx] ? 'ok' : 'err'); });
    const refEq = texEq(q.a0, q.b0, q.c0);
    if (g.full) return { ok: true, msg: `Bonne équation (elle est équivalente à \\(${refEq}\\)) : on passe tout à gauche du signe =.` };
    return { ok: false, msg: `On soustrait \\(y\\) des deux côtés : \\(y = ${q.m}x ${q.p >= 0 ? '+' : '-'} ${Math.abs(q.p)}\\) devient \\(${refEq}\\). Tout multiple non nul de \\((a\\,;\\,b\\,;\\,c)\\) est aussi accepté.` };
};

/* ==========================================================
   NIVEAU 5 : DE ax + by + c = 0 VERS y = mx + p
   ========================================================== */
GENERATORS.vers_reduite = function () {
    const denPool = [1, 1, 1, 2, 2, 3, 4, 5];
    const den = denPool[rnd(0, denPool.length - 1)];
    let num;
    do { num = rnd(-9, 9); } while (num === 0);
    const p = rnd(-6, 6);
    const a = num;
    const b = -den;
    const c = p * den;
    const m = round4(num / den);
    const eq = texEq(a, b, c);
    return { a, b, c, m, p, eq };
};

RENDERERS.vers_reduite = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : si \\(b \\neq 0\\), on isole \\(y\\) dans \\(ax + by + c = 0\\) pour obtenir \\(y = mx + p\\)</div>
        <div class="q-prompt">Écris cette droite sous forme réduite \\(y = mx + p\\) :</div>
        <div class="eq-display">\\(${q.eq}\\)</div>
        <div class="row-inputs">
            <span class="row-label">m =</span>
            <input type="text" class="answer-input narrow" id="im" placeholder="…" inputmode="decimal">
            <span class="row-label" style="margin-left:16px;">p =</span>
            <input type="text" class="answer-input narrow" id="ip" placeholder="…" inputmode="decimal">
        </div>
        ${calcHTML('vr')}`;
    setTimeout(() => document.getElementById('im')?.focus(), 50);
};

CHECKERS.vers_reduite = function (q) {
    const im = document.getElementById('im'), ip = document.getElementById('ip');
    const vm = normNum(im.value), vp = normNum(ip.value);
    const okM = vm !== null && closeRel(vm, q.m, 0.01);
    const okP = vp !== null && close(vp, q.p, 0.02);
    [im, ip].forEach((el, idx) => { el.classList.remove('ok', 'err'); el.classList.add([okM, okP][idx] ? 'ok' : 'err'); });
    const ok = okM && okP;
    const mStr = String(q.m).replace('.', ',');
    if (ok) return { ok: true, msg: `On isole \\(y\\) : \\(${q.b}y = ${-q.a}x ${-q.c >= 0 ? '+' : '-'} ${Math.abs(q.c)}\\), donc \\(m = ${mStr}\\) et \\(p = ${q.p}\\).` };
    return { ok: false, msg: `On isole \\(y\\) : \\(${q.b}y = ${-q.a}x ${-q.c >= 0 ? '+' : '-'} ${Math.abs(q.c)}\\), puis on divise par \\(${q.b}\\) : \\(m = ${mStr}\\) et \\(p = ${q.p}\\).` };
};

/* ==========================================================
   NIVEAU 6 : PARALLÉLISME ET DÉTERMINANT
   ========================================================== */
GENERATORS.parallelisme = function () {
    const a1 = rndNonZero(-6, 6);
    const b1 = rndNonZero(-6, 6);
    const c1 = rnd(-8, 8);
    const isParallelTarget = Math.random() < 0.5;
    let a2, b2;
    if (isParallelTarget) {
        const kPool = [-3, -2, 2, 3];
        const k = kPool[rnd(0, kPool.length - 1)];
        a2 = k * a1; b2 = k * b1;
    } else {
        let tries = 0;
        do {
            a2 = rndNonZero(-6, 6);
            b2 = rndNonZero(-6, 6);
            tries++;
        } while (a1 * b2 - a2 * b1 === 0 && tries < 30);
    }
    const c2 = rnd(-8, 8);
    const det = a1 * b2 - a2 * b1;
    const isParallel = det === 0;
    const eq1 = texEq(a1, b1, c1);
    const eq2 = texEq(a2, b2, c2);
    return { a1, b1, c1, a2, b2, c2, det, isParallel, eq1, eq2 };
};

RENDERERS.parallelisme = function (q, box) {
    box.innerHTML = `
        <div class="formula-remind">Rappel : D<sub>1</sub> et D<sub>2</sub> sont parallèles &hArr; a<sub>1</sub>b<sub>2</sub> − a<sub>2</sub>b<sub>1</sub> = 0</div>
        <div class="ctx-card"><span class="ctx-label">📝 Deux droites</span>
            \\(\\mathcal{D}_1 : ${q.eq1}\\) &nbsp;&nbsp;et&nbsp;&nbsp; \\(\\mathcal{D}_2 : ${q.eq2}\\)
        </div>
        <div class="step-block active" id="step0">
            <div class="step-tag">Étape 1 · Identifie les coefficients a et b</div>
            <div class="row-inputs">
                <span class="row-label">D<sub>1</sub> : a<sub>1</sub> =</span>
                <input type="text" class="answer-input tiny" id="ia1" placeholder="…" inputmode="decimal">
                <span class="row-label" style="margin-left:14px;">b<sub>1</sub> =</span>
                <input type="text" class="answer-input tiny" id="ib1" placeholder="…" inputmode="decimal">
            </div>
            <div class="row-inputs">
                <span class="row-label">D<sub>2</sub> : a<sub>2</sub> =</span>
                <input type="text" class="answer-input tiny" id="ia2" placeholder="…" inputmode="decimal">
                <span class="row-label" style="margin-left:14px;">b<sub>2</sub> =</span>
                <input type="text" class="answer-input tiny" id="ib2" placeholder="…" inputmode="decimal">
            </div>
        </div>
        ${calcHTML('par')}`;
    setTimeout(() => document.getElementById('ia1')?.focus(), 50);
};

CHECKERS.parallelisme = function (q) {
    const box = document.getElementById('exBody');
    const stepsDone = box.querySelectorAll('.step-block.locked').length;
    const calcAnchor = box.querySelector('.calc-toggle');

    /* ── Étape 1 : coefficients a1, b1, a2, b2 ── */
    if (stepsDone === 0) {
        const ia1 = document.getElementById('ia1'), ib1 = document.getElementById('ib1'),
              ia2 = document.getElementById('ia2'), ib2 = document.getElementById('ib2');
        const va1 = normNum(ia1.value), vb1 = normNum(ib1.value),
              va2 = normNum(ia2.value), vb2 = normNum(ib2.value);
        const ok1 = va1 !== null && close(va1, q.a1, 0.01);
        const ok2 = vb1 !== null && close(vb1, q.b1, 0.01);
        const ok3 = va2 !== null && close(va2, q.a2, 0.01);
        const ok4 = vb2 !== null && close(vb2, q.b2, 0.01);
        [ia1, ib1, ia2, ib2].forEach((el, idx) => { el.classList.remove('ok', 'err'); el.classList.add([ok1, ok2, ok3, ok4][idx] ? 'ok' : 'err'); });

        if (ok1 && ok2 && ok3 && ok4) {
            lockStepSimple('step0');
            const hr = document.createElement('hr'); hr.className = 'step-divider';
            box.insertBefore(hr, calcAnchor);
            const div = document.createElement('div'); div.className = 'step-block active'; div.id = 'step1';
            div.innerHTML = `
                <div class="step-tag">Étape 2 · Calcule le déterminant</div>
                <div class="q-prompt">a<sub>1</sub> × b<sub>2</sub> − a<sub>2</sub> × b<sub>1</sub> =</div>
                <div class="answer-wrap">
                    <input type="text" class="answer-input narrow" id="det" placeholder="…" inputmode="decimal">
                </div>`;
            box.insertBefore(div, calcAnchor);
            setTimeout(() => document.getElementById('det')?.focus(), 50);
            return { ok: true, msg: `a<sub>1</sub> = ${q.a1}, b<sub>1</sub> = ${q.b1}, a<sub>2</sub> = ${q.a2}, b<sub>2</sub> = ${q.b2}. Maintenant, calcule le déterminant !`, advanceOnly: true };
        }
        return { ok: false, msg: `On lit les coefficients dans chaque équation \\(ax + by + c = 0\\) : a<sub>1</sub> = ${q.a1}, b<sub>1</sub> = ${q.b1} pour D<sub>1</sub>, et a<sub>2</sub> = ${q.a2}, b<sub>2</sub> = ${q.b2} pour D<sub>2</sub>.` };
    }

    /* ── Étape 2 : déterminant ── */
    if (stepsDone === 1) {
        const inp = document.getElementById('det');
        const v = normNum(inp.value);
        inp.classList.remove('ok', 'err');
        const ok = v !== null && close(v, q.det, 0.01);
        inp.classList.add(ok ? 'ok' : 'err');
        if (ok) {
            lockStepSimple('step1');
            const hr = document.createElement('hr'); hr.className = 'step-divider';
            box.insertBefore(hr, calcAnchor);
            const div = document.createElement('div'); div.className = 'step-block active'; div.id = 'step2';
            div.innerHTML = `
                <div class="step-tag">Étape 3 · Conclusion</div>
                <div class="q-prompt">Les droites D<sub>1</sub> et D<sub>2</sub> sont-elles parallèles ?</div>
                <div class="choice-grid" id="choiceDir">
                    <button class="choice-btn" data-val="oui">∥ Parallèles</button>
                    <button class="choice-btn" data-val="non">✗ Non parallèles</button>
                </div>`;
            box.insertBefore(div, calcAnchor);
            div.querySelectorAll('.choice-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    div.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('chosen'));
                    btn.classList.add('chosen');
                    box._dir = btn.dataset.val;
                });
            });
            box._dir = null;
            return { ok: true, msg: `a<sub>1</sub> × b<sub>2</sub> − a<sub>2</sub> × b<sub>1</sub> = ${q.a1} × ${q.b2} − ${q.a2} × ${q.b1} = ${q.det}. Maintenant, conclus !`, advanceOnly: true };
        }
        return { ok: false, msg: `Le déterminant se calcule ainsi : a<sub>1</sub> × b<sub>2</sub> − a<sub>2</sub> × b<sub>1</sub> = ${q.a1} × ${q.b2} − ${q.a2} × ${q.b1} = ${q.det}.` };
    }

    /* ── Étape 3 : conclusion ── */
    const dirOk = box._dir === (q.isParallel ? 'oui' : 'non');
    box.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('ok', 'err'));
    box.querySelectorAll('.choice-btn').forEach(b => {
        if (b.dataset.val === (q.isParallel ? 'oui' : 'non')) b.classList.add('ok');
        else if (b.classList.contains('chosen')) b.classList.add('err');
    });
    if (!box._dir) return { ok: false, msg: 'Choisis une réponse : parallèles ou non parallèles.' };
    if (dirOk) return { ok: true, msg: `Le déterminant vaut ${q.det}${q.isParallel ? ', il est nul : les vecteurs directeurs sont colinéaires, donc les droites sont' : ', il est non nul : les vecteurs directeurs ne sont pas colinéaires, donc les droites ne sont pas'} <strong>parallèles</strong>.` };
    return { ok: false, msg: `Le déterminant vaut ${q.det}. ${q.isParallel ? 'Il est nul, donc les droites sont' : 'Il est non nul, donc les droites ne sont pas'} <strong>parallèles</strong>.` };
};
