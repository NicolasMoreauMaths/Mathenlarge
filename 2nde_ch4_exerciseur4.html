<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inéquations — Exerciseur interactif</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #eef2f7;
    --grid: #d5dce6;
    --card: #fff;
    --blue: #1d4ed8;
    --blue-light: #3b82f6;
    --blue-pale: rgba(59, 130, 246, 0.08);
    --blue-border: rgba(59, 130, 246, 0.2);
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-pale: rgba(124, 58, 237, 0.1);
    --orange: #ea580c;
    --orange-pale: rgba(234, 88, 12, 0.1);
    --orange-border: rgba(234, 88, 12, 0.25);
    --green: #16a34a;
    --green-pale: rgba(22, 163, 74, 0.1);
    --red: #dc2626;
    --red-pale: rgba(220, 38, 38, 0.08);
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(30, 41, 59, 0.08);
}

body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    background-image: 
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: 16px 10px 60px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
}

.app {
    max-width: 900px;
    width: 100%;
}

.app-header {
    background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
    color: #fff;
    padding: 18px 24px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(29, 78, 216, 0.3);
    position: relative;
    overflow: hidden;
}

.app-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 50%);
    pointer-events: none;
}

.app-title {
    font-size: 1.3em;
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.app-title::before {
    content: '📐';
    font-size: 1.2em;
}

.main {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 28px var(--shadow);
    min-height: 60vh;
}

.screen {
    display: none;
    animation: fadeIn 0.3s ease;
}

.screen.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

h1 {
    font-size: 1.6em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--blue);
}

.sub {
    text-align: center;
    font-size: 0.95em;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
}

.btn {
    font-family: 'DM Sans', sans-serif;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    min-height: 46px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
}

.btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.btn-blue {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
    box-shadow: 0 2px 12px rgba(29, 78, 216, 0.2);
}

.btn-blue:hover:not(:disabled) {
    background: var(--blue-light);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(29, 78, 216, 0.3);
}

.btn-green {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
}

.btn-green:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-2px);
}

.btn-ghost {
    background: transparent;
    color: var(--text-light);
    border-color: var(--border);
}

.btn-ghost:hover {
    background: var(--bg);
    border-color: var(--text-light);
}

.controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
}

/* MENU */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin: 20px 0;
}

.mc {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mc:hover {
    border-color: var(--blue);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px var(--shadow);
}

.mc-icon {
    font-size: 2em;
    margin-bottom: 8px;
}

.mc-t {
    font-size: 0.95em;
    color: var(--blue);
    font-weight: 700;
    margin-bottom: 4px;
}

.mc-d {
    font-size: 0.8em;
    color: var(--text-light);
    line-height: 1.4;
}

.mc-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--orange-pale);
    color: var(--orange);
    font-size: 0.7em;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
}

/* EX HEADER */
.ex-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
}

.ex-badge {
    background: var(--blue-pale);
    color: var(--blue);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 700;
}

.ex-score {
    font-size: 0.9em;
    color: var(--text-light);
    font-weight: 600;
}

.pbar {
    width: 100%;
    background: var(--border);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 20px;
}

.pfill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    border-radius: 6px;
    transition: width 0.4s;
}

/* EQUATION / INEQUATION HISTORY */
.equation-history {
    margin: 30px auto;
    max-width: 650px;
}

.equation-step-item {
    margin-bottom: 10px;
}

.equation-line {
    font-size: 1.5em;
    text-align: center;
    margin: 0.5rem 0;
    font-family: 'Times New Roman', serif;
    font-style: italic;
    line-height: 1.6;
}

.equation-line i {
    font-style: italic;
}

.circled {
    display: inline-block;
    border: 3px solid var(--red);
    border-radius: 50%;
    padding: 0.2em 0.6em;
    color: var(--red);
    font-weight: bold;
    font-style: normal;
}

.arrow-section {
    position: relative;
    height: 80px;
    margin: 1rem 0;
}

.arrow-svg {
    position: absolute;
    width: 100%;
    height: 100%;
}

.arrow-section {
    position: relative;
    height: 90px;
    margin: 0.5rem 0;
}

.arrow-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
}

/* ARROWS SYSTEM */
.arrows-container {
    margin: 30px auto;
    max-width: 650px;
}

.operation-input {
    position: absolute;
    transform: translateX(-50%);
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.1em;
    font-weight: 600;
    padding: 8px 14px;
    border: 2px dashed var(--purple);
    border-radius: 10px;
    background: white;
    text-align: center;
    outline: none;
    width: 90px;
    transition: all 0.2s;
    top: 0;
}

.operation-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-pale);
}

.operation-input.ok {
    border-color: var(--green);
    background: var(--green-pale);
    color: var(--green);
}

.operation-input.err {
    border-color: var(--red);
    background: var(--red-pale);
    animation: shake 0.3s;
}

.left-op {
    left: 22%;
}

.right-op {
    left: 78%;
}

/* RESULT ROW: fully editable (leftSide input | comparator select | rightSide input) */
.result-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 6px 0;
}

.result-input {
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.3em;
    font-weight: 600;
    width: 140px;
    padding: 9px 10px;
    text-align: center;
    border: 2px dashed var(--purple);
    border-radius: 10px;
    background: white;
    outline: none;
    transition: all 0.2s;
}

.result-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-pale);
}

.result-input.ok {
    border-color: var(--green);
    background: var(--green-pale);
    color: var(--green);
}

.result-input.err {
    border-color: var(--red);
    background: var(--red-pale);
    animation: shake 0.3s;
}

.result-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.15em;
    font-weight: 700;
    padding: 9px 8px;
    text-align: center;
    border: 2px dashed var(--purple);
    border-radius: 10px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--purple);
    cursor: pointer;
    width: 66px;
}

.result-select.ok {
    border-color: var(--green);
    background: var(--green-pale);
    color: var(--green);
}

.result-select.err {
    border-color: var(--red);
    background: var(--red-pale);
    animation: shake 0.3s;
}

@keyframes shake {
    0%, 100% { transform: translateX(-50%) translateX(0); }
    25% { transform: translateX(-50%) translateX(-8px); }
    75% { transform: translateY(-50%) translateX(8px); }
}

.solution-input, .step-input {
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.5em;
    font-weight: 600;
    width: 200px;
    padding: 10px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    display: inline-block;
}

.solution-input:focus, .step-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px var(--blue-pale);
}

.solution-input.ok, .step-input.ok {
    border-color: var(--green);
    background: var(--green-pale);
    color: var(--green);
}

.solution-input.err, .step-input.err {
    border-color: var(--red);
    background: var(--red-pale);
    animation: shake 0.3s;
}

.sol-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1em;
    font-weight: 700;
    padding: 10px 14px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--purple);
    cursor: pointer;
}

.sol-select.ok {
    border-color: var(--green);
    background: var(--green-pale);
    color: var(--green);
}

.sol-select.err {
    border-color: var(--red);
    background: var(--red-pale);
    animation: shake 0.3s;
}

/* SIGN FLIP WARNING BADGE */
.flip-alert {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--orange-pale);
    border: 2px solid var(--orange-border);
    border-radius: 12px;
    padding: 10px 16px;
    margin: 14px auto;
    max-width: 480px;
    font-size: 0.88em;
    color: var(--orange);
    font-weight: 600;
    line-height: 1.4;
}

.flip-alert .flip-icon {
    font-size: 1.4em;
    flex-shrink: 0;
}

/* FEEDBACK */
.fb {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.95em;
    text-align: center;
    display: none;
    animation: fadeIn 0.3s;
    font-weight: 600;
    line-height: 1.6;
}

.fb.ok {
    display: block;
    background: var(--green-pale);
    color: var(--green);
    border: 2px solid rgba(22, 163, 74, 0.2);
}

.fb.bad {
    display: block;
    background: var(--red-pale);
    color: var(--red);
    border: 2px solid rgba(220, 38, 38, 0.15);
}

/* RESULTS */
.rc {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
    border: 6px solid;
}

.rc.good {
    border-color: var(--green);
    background: var(--green-pale);
}

.rc.mid {
    border-color: var(--orange);
    background: var(--orange-pale);
}

.rc.bad {
    border-color: var(--red);
    background: var(--red-pale);
}

.rp {
    font-size: 2.2em;
    font-weight: 700;
    line-height: 1;
}

.rm {
    font-size: 1.1em;
    text-align: center;
    margin: 16px 0;
    line-height: 1.5;
}

/* NUMBER LINE (droite graduée) */
.numberline-wrap {
    margin: 30px auto;
    max-width: 620px;
    text-align: center;
}

.numberline-instructions {
    font-size: 0.88em;
    color: var(--text-light);
    margin-bottom: 18px;
    line-height: 1.5;
}

.numberline-svg-wrap {
    position: relative;
    width: 100%;
    overflow-x: auto;
}

.nl-tick-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    fill: var(--text-light);
}

.nl-point {
    cursor: pointer;
}

.nl-hitzone {
    cursor: pointer;
}

.nl-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
}

.nl-toggle-btn {
    padding: 10px 18px;
    border: 2px solid var(--blue-border);
    background: white;
    color: var(--blue);
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88em;
    transition: all 0.2s;
    min-height: 44px;
}

.nl-toggle-btn.active {
    background: var(--blue);
    color: white;
}

.nl-toggle-btn:hover {
    transform: translateY(-2px);
}

/* INTERVAL NOTATION BUILDER */
.interval-wrap {
    margin: 30px auto;
    max-width: 560px;
    text-align: center;
}

.interval-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.6em;
    background: var(--blue-pale);
    border: 2px dashed var(--blue-border);
    border-radius: 16px;
    padding: 24px 18px;
}

.interval-bracket-btn {
    font-family: 'DM Sans', sans-serif;
    font-style: normal;
    font-size: 0.55em;
    font-weight: 700;
    padding: 10px 14px;
    border: 2px solid var(--purple);
    border-radius: 10px;
    background: white;
    color: var(--purple);
    cursor: pointer;
    transition: all 0.2s;
    min-width: 46px;
}

.interval-bracket-btn:hover {
    background: var(--purple-pale);
}

.interval-bracket-btn.chosen {
    background: var(--purple);
    color: white;
}

.interval-bound-input {
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 0.7em;
    width: 90px;
    padding: 8px;
    text-align: center;
    border: 2px dashed var(--purple);
    border-radius: 10px;
    background: white;
    outline: none;
}

.interval-bound-fixed {
    font-size: 0.85em;
    font-weight: 700;
    color: var(--text);
    padding: 4px 8px;
}

/* MIXED CHALLENGE STEPPER */
.challenge-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 4px 0 24px;
    flex-wrap: wrap;
}

.challenge-tab {
    font-size: 0.78em;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--border);
    color: var(--text-light);
}

.challenge-tab.done {
    background: var(--green-pale);
    color: var(--green);
}

.challenge-tab.current {
    background: var(--blue);
    color: white;
}

/* LIBRE BUILDER (reuse equation builder style) */
.libre-equation-builder {
    margin: 28px auto;
    max-width: 650px;
    text-align: center;
}

.libre-eq-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 24px 20px 20px;
    background: var(--blue-pale);
    border: 2px dashed var(--blue-border);
    border-radius: 16px;
}

.libre-input {
    width: 64px;
    height: 64px;
    border: 3px solid var(--blue);
    border-radius: 12px;
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    background: white;
    color: var(--blue);
    outline: none;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
    -moz-appearance: textfield;
}

.libre-input::-webkit-outer-spin-button,
.libre-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.libre-input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 4px var(--purple-pale);
    color: var(--purple);
}

.libre-x-label {
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 2em;
    font-weight: 700;
    color: var(--red);
}

.libre-op {
    font-size: 1.6em;
    font-weight: 700;
    color: var(--text-light);
}

.libre-ineq-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.4em;
    font-weight: 700;
    color: var(--text);
    padding: 8px;
    border: 3px solid var(--border);
    border-radius: 10px;
    background: white;
    cursor: pointer;
    height: 64px;
}

.libre-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.libre-cell-label {
    font-size: 0.65em;
    color: var(--text-light);
    font-weight: 700;
    letter-spacing: 0.5px;
    min-height: 1em;
    line-height: 1;
    text-transform: uppercase;
}

.libre-symbol {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
}

@media (max-width: 640px) {
    .app-header {
        padding: 14px 18px;
    }
    
    .app-title {
        font-size: 1.1em;
    }
    
    .main {
        padding: 24px 18px;
    }
    
    h1 {
        font-size: 1.3em;
    }
    
    .menu-grid {
        grid-template-columns: 1fr;
    }
    
    .equation-line {
        font-size: 1.2em;
    }
    
    .operation-input {
        width: 66px;
        font-size: 0.95em;
        padding: 6px 8px;
    }
    
    .solution-input, .step-input {
        width: 150px;
        font-size: 1.2em;
    }

    .result-input {
        width: 105px;
        font-size: 1.05em;
    }

    .result-select {
        width: 58px;
        font-size: 1em;
    }

    .interval-row {
        font-size: 1.2em;
        padding: 18px 10px;
    }

    .interval-bound-input {
        width: 70px;
    }
}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(29,78,216,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(29,78,216,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 900px tablette ── */
@media(max-width:900px){
  .app { padding:0 12px; }
  .main { padding:12px; }
}
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-header-bar { flex-wrap:wrap; gap:4px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .mc-badge, .ex-badge { font-size:0.7rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }

<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Inéquations du 1er degré</div>
    </div>
    <div class="main">

        <!-- MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Choisis un niveau</h1>
            <p class="sub">Résous des inéquations avec la méthode des flèches, place la solution sur la droite graduée et écris-la sous forme d'intervalle.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- EXERCISE -->
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Niveau</span>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>

            <div id="exBody"></div>

            <div class="fb" id="fb"></div>

            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue" id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc">
                <div class="rp" id="rp">0%</div>
            </div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue" id="btnRetry">Recommencer ce niveau</button>
            </div>
        </div>

    </div>
</div>

<script>
/* =========================================================
   CONFIG NIVEAUX
   ========================================================= */
const LEVELS = [
    { id: 'add',    icon: '➕', title: 'Flèches — Addition/soustraction', desc: 'x + a ⋛ b  (le sens ne change pas)', n: 8 },
    { id: 'divpos', icon: '✖️', title: 'Flèches — Coefficient positif', desc: 'ax ⋛ b avec a > 0', n: 8 },
    { id: 'divneg', icon: '⚠️', title: 'Flèches — Coefficient négatif', desc: 'ax ⋛ b avec a < 0 — le sens change !', n: 8, badge: 'Piège' },
    { id: 'mixte',  icon: '🔀', title: 'Flèches — Cas mixte', desc: 'ax + c ⋛ bx + d', n: 8 },
    { id: 'droite', icon: '📏', title: 'Droite graduée', desc: 'Place la solution sur la droite', n: 8 },
    { id: 'inter',  icon: '⟨ ⟩', title: 'Écriture en intervalle', desc: 'Traduis la solution en intervalle', n: 8 },
    { id: 'defi',   icon: '🏆', title: 'Défi complet', desc: 'Flèches + intervalle + droite graduée', n: 6, badge: 'Bilan' },
];

let state = {
    levelId: null,
    qIndex: 0,
    total: 0,
    score: 0,
    questions: [],
    checked: false,
};

/* =========================================================
   UTILS MATH
   ========================================================= */
function rnd(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
function rndNonZero(min, max) {
    let v = 0;
    while (v === 0) v = rnd(min, max);
    return v;
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

function fracStr(num, den) {
    if (den < 0) { num = -num; den = -den; }
    const g = gcd(num, den) || 1;
    num /= g; den /= g;
    if (den === 1) return String(num);
    return num + '/' + den;
}
function fracVal(num, den) { return num / den; }

// Flip a comparator when dividing/multiplying by a negative
const FLIP = { '<': '>', '>': '<', '\u2264': '\u2265', '\u2265': '\u2264' };
const SYM_HTML = { '<': '&lt;', '>': '&gt;', '\u2264': '&le;', '\u2265': '&ge;' };
const SYM_WORD = { '<': 'strictement inférieur à', '>': 'strictement supérieur à', '\u2264': 'inférieur ou égal à', '\u2265': 'supérieur ou égal à' };

function randCmp() {
    const arr = ['<', '>', '\u2264', '\u2265'];
    return arr[rnd(0, 3)];
}

function fmtCoefX(a) {
    if (a === 1) return 'x';
    if (a === -1) return '-x';
    return a + 'x';
}
function fmtSigned(n) {
    if (n === 0) return '';
    return (n > 0 ? ' + ' : ' \u2212 ') + Math.abs(n);
}
function fmtSignedLead(n) {
    // for leading term display when constant alone (used in some contexts)
    return n < 0 ? ('\u2212' + Math.abs(n)) : String(n);
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    LEVELS.forEach(lv => {
        const el = document.createElement('div');
        el.className = 'mc';
        el.innerHTML = `
            ${lv.badge ? `<div class="mc-badge">${lv.badge}</div>` : ''}
            <div class="mc-icon">${lv.icon}</div>
            <div class="mc-t">${lv.title}</div>
            <div class="mc-d">${lv.desc}</div>
        `;
        el.addEventListener('click', () => startLevel(lv.id));
        grid.appendChild(el);
    });
}

document.getElementById('btnMenu').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnMenu2').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnRetry').addEventListener('click', () => startLevel(state.levelId));

buildMenu();

/* =========================================================
   MOTEUR GENERIQUE
   ========================================================= */
const GENERATORS = {};   // levelId -> function() -> question data
const RENDERERS = {};    // levelId -> function(q, container)
const CHECKERS = {};     // levelId -> function(q) -> {ok:bool, msg:string}

function startLevel(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    state.levelId = levelId;
    state.qIndex = 0;
    state.score = 0;
    state.total = lv.n;
    state.questions = [];
    for (let i = 0; i < lv.n; i++) state.questions.push(GENERATORS[levelId]());
    document.getElementById('exBadge').textContent = lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion() {
    state.checked = false;
    const lv = LEVELS.find(l => l.id === state.levelId);
    document.getElementById('exScore').textContent = `Question ${state.qIndex + 1}/${state.total}`;
    document.getElementById('pfill').style.width = (state.qIndex / state.total * 100) + '%';
    const body = document.getElementById('exBody');
    body.innerHTML = '';
    body._defiSub = 0;
    const fb = document.getElementById('fb');
    fb.className = 'fb';
    fb.textContent = '';
    document.getElementById('btnCheck').style.display = '';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnNext').style.display = 'none';
    RENDERERS[state.levelId](state.questions[state.qIndex], body);
}

document.getElementById('btnCheck').addEventListener('click', () => {
    if (state.checked) return;
    const q = state.questions[state.qIndex];
    const result = CHECKERS[state.levelId](q);
    const fb = document.getElementById('fb');
    if (result.ok) {
        fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + (result.msg || 'Exact, bien joué !');
        if (result.advanceOnly) {
            // move to next sub-step within the same question, don't count score yet
            const box = document.getElementById('exBody');
            setTimeout(() => { renderDefiSub(q, box); fb.className = 'fb'; fb.textContent = ''; }, 1100);
            return;
        }
        state.checked = true;
        state.score++;
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnNext').style.display = '';
    } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ ' + (result.msg || 'Ce n\'est pas encore ça, réessaie.');
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    state.qIndex++;
    if (state.qIndex >= state.total) {
        showResults();
    } else {
        renderQuestion();
    }
});

// Touche Entrée = valider (ou passer à la question suivante si déjà validé)
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const exScreen = document.getElementById('screen-ex');
    if (!exScreen.classList.contains('active')) return;
    e.preventDefault();
    const btnNext = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');
    if (btnNext.style.display !== 'none' && btnNext.offsetParent !== null) {
        btnNext.click();
    } else if (btnCheck.style.display !== 'none' && !btnCheck.disabled) {
        btnCheck.click();
    }
});

// Auto-formatage : remplace "/" par "÷" à l'affichage dans les champs d'opération
document.getElementById('exBody').addEventListener('input', (e) => {
    const el = e.target;
    if (!el.classList || !el.classList.contains('operation-input')) return;
    if (el.value.includes('/')) {
        const pos = el.selectionStart;
        const before = el.value;
        el.value = el.value.replace(/\//g, '\u00f7');
        // keep caret position stable (length unchanged since it's a 1-for-1 char replace)
        if (pos !== null) el.setSelectionRange(pos, pos);
    }
});

function showResults() {
    document.getElementById('pfill').style.width = '100%';
    const pct = Math.round(state.score / state.total * 100);
    const rc = document.getElementById('rc');
    const rp = document.getElementById('rp');
    const rm = document.getElementById('rm');
    rc.className = 'rc ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    rp.textContent = pct + '%';
    let msg;
    if (pct >= 80) msg = `Excellent ! ${state.score}/${state.total} bonnes réponses. Tu maîtrises cette notion.`;
    else if (pct >= 50) msg = `${state.score}/${state.total} bonnes réponses. C'est en bonne voie, encore un peu d'entraînement !`;
    else msg = `${state.score}/${state.total} bonnes réponses. Reprends les explications et réessaie, tu vas progresser.`;
    rm.textContent = msg;
    showScreen('screen-res');
}

/* helper: normalize a typed number/fraction string to a numeric value */
function normNum(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(',', '.').replace(/\s+/g, '');
    if (s === '') return null;
    s = s.replace(/\u00f7/g, '/'); // ÷ -> /
    s = s.replace(/\u2212/g, '-'); // − -> -
    // remove enclosing parentheses around the whole string or around a signed number: (-4) -> -4
    s = s.replace(/^\((-?\d+(?:\.\d+)?)\)$/, '$1');
    // leading "/" or "*" means "operator applied to a value" (e.g. student types "/-4" or "/(-4)" meaning "÷(-4)")
    // strip a single leading division or multiplication sign, keeping the (possibly negative) operand
    const opMatch = s.match(/^[\/\*]\(?(-?\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)?)\)?$/);
    if (opMatch) {
        s = opMatch[1];
    }
    if (s.includes('/')) {
        const parts = s.split('/');
        if (parts.length !== 2) return null;
        const n = parseFloat(parts[0]), d = parseFloat(parts[1]);
        if (isNaN(n) || isNaN(d) || d === 0) return null;
        return n / d;
    }
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
}
function closeEnough(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }

/* =========================================================
   SVG FLECHES DIAGONALES
   Partent des cases "?" (en haut, ~22% et ~78%) et convergent
   en diagonale vers le bas, comme sur le croquis fourni.
   ========================================================= */
function arrowSVG() {
    return `
    <svg class="arrow-svg" viewBox="0 0 600 90" preserveAspectRatio="none" style="max-width:100%;height:auto;">
        <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="var(--purple)"/>
            </marker>
        </defs>
        <path d="M 132,26 C 132,55 165,60 175,80" stroke="var(--purple)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
        <path d="M 468,26 C 468,55 435,60 425,80" stroke="var(--purple)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    </svg>`;
}

/* =========================================================
   LIGNE RESULTAT ENTIEREMENT EDITABLE
   input (membre gauche) | select (comparateur) | input (membre droite)
   ========================================================= */
function resultRowHTML(idPrefix, placeholderL, placeholderR) {
    return `
    <div class="result-row">
        <input type="text" class="result-input" id="${idPrefix}L" placeholder="${placeholderL || '...'}">
        <select class="result-select" id="${idPrefix}Cmp">
            <option value="">?</option>
            <option value="<">&lt;</option>
            <option value=">">&gt;</option>
            <option value="\u2264">&le;</option>
            <option value="\u2265">&ge;</option>
        </select>
        <input type="text" class="result-input" id="${idPrefix}R" placeholder="${placeholderR || '...'}">
    </div>`;
}

// Normalize an algebraic side typed by the student: "x+3", "-9x", "-x - 7", "18" ...
// Returns {a: coefficient of x (0 if none), c: constant}
function parseAlgSide(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(/\s+/g, '').replace(',', '.');
    if (s === '') return null;
    s = s.replace(/\u2212/g, '-'); // normalize minus sign
    // insert explicit + at start if starts with a term (not sign) for uniform splitting
    if (!/^[+-]/.test(s)) s = '+' + s;
    // split into signed terms
    const terms = s.match(/[+-][^+-]+/g);
    if (!terms) return null;
    let a = 0, c = 0;
    for (const t of terms) {
        if (/x$/i.test(t)) {
            let coefStr = t.slice(0, -1);
            let coef;
            if (coefStr === '+' || coefStr === '') coef = 1;
            else if (coefStr === '-') coef = -1;
            else coef = normNum(coefStr);
            if (coef === null || isNaN(coef)) return null;
            a += coef;
        } else {
            const v = normNum(t);
            if (v === null || isNaN(v)) return null;
            c += v;
        }
    }
    return { a, c };
}

function algSideMatches(str, expectedA, expectedC) {
    const p = parseAlgSide(str);
    if (!p) return false;
    return closeEnough(p.a, expectedA) && closeEnough(p.c, expectedC);
}

// Check a full result row: leftSide (a,c) cmp rightSide (a,c), with expected comparator
function checkResultRow(idPrefix, expA_L, expC_L, expCmp, expA_R, expC_R) {
    const L = document.getElementById(idPrefix + 'L');
    const R = document.getElementById(idPrefix + 'R');
    const Cmp = document.getElementById(idPrefix + 'Cmp');
    const lOk = algSideMatches(L.value, expA_L, expC_L);
    const rOk = algSideMatches(R.value, expA_R, expC_R);
    const cOk = Cmp.value === expCmp;
    L.classList.remove('ok', 'err'); L.classList.add(lOk ? 'ok' : 'err');
    R.classList.remove('ok', 'err'); R.classList.add(rOk ? 'ok' : 'err');
    Cmp.classList.remove('ok', 'err'); Cmp.classList.add(cOk ? 'ok' : 'err');
    return lOk && rOk && cOk;
}

// Build a display string "ax + c" for use in <i>...</i> equation lines (for the GIVEN parts only, never the answer)
function algSideDisplay(a, c) {
    if (a === 0) return String(c);
    return fmtCoefX(a) + fmtSigned(c);
}

/* =========================================================
   NIVEAU 1 : x + a  ⋛  b   (flèches, addition/soustraction)
   ========================================================= */
GENERATORS.add = function () {
    const a = rndNonZero(-12, 12);
    const cmp = randCmp();
    const x0 = rnd(-8, 8); // target boundary value for x
    const b = x0 + a; // so that x + a cmp b  <=>  x cmp x0
    // operation to cancel a: subtract a (i.e. add -a)
    const op = -a;
    return { a, b, cmp, op, x0 };
};

RENDERERS.add = function (q, box) {
    box.innerHTML = `
        <p class="sub" style="margin-bottom:18px;">Complète les deux opérations identiques (une pour chaque membre), puis écris toi-même la ligne obtenue (membre gauche, symbole, membre droite).</p>
        <div class="equation-history">
            <div class="equation-step-item">
                <div class="equation-line"><i>x</i>${fmtSigned(q.a)} ${SYM_HTML[q.cmp]} ${q.b}</div>
                <div class="arrow-section">
                    ${arrowSVG()}
                    <input type="text" class="operation-input left-op" id="opL" placeholder="?">
                    <input type="text" class="operation-input right-op" id="opR" placeholder="?">
                </div>
                ${resultRowHTML('res', 'x', 'nombre')}
            </div>
        </div>
    `;
};

CHECKERS.add = function (q) {
    const opL = document.getElementById('opL');
    const opR = document.getElementById('opR');
    const vL = normNum(opL.value);
    const vR = normNum(opR.value);
    const opOk = vL !== null && vR !== null && closeEnough(vL, q.op) && closeEnough(vR, q.op);
    [opL, opR].forEach(el => { el.classList.remove('ok', 'err'); el.classList.add(opOk ? 'ok' : 'err'); });

    const rowOk = checkResultRow('res', 1, 0, q.cmp, 0, q.x0);

    if (opOk && rowOk) {
        return { ok: true, msg: `On ${q.op >= 0 ? 'ajoute' : 'soustrait'} ${Math.abs(q.op)} de chaque côté. Comme on additionne/soustrait un nombre, <b>le sens de l'inégalité ne change pas</b>. Solution : x ${SYM_HTML[q.cmp]} ${q.x0}.` };
    }
    if (!opOk) return { ok: false, msg: 'L\'opération à effectuer sur chaque flèche n\'est pas correcte.' };
    return { ok: false, msg: 'La ligne obtenue n\'est pas correcte. Vérifie les deux membres et le symbole.' };
};

// Accept "x<3", "x < 3", "3>x" reversed form not required — keep simple & tolerant
function checkIneqSolutionText(txt, cmp, boundary) {
    if (!txt) return false;
    txt = txt.replace(/<=/g, '\u2264').replace(/>=/g, '\u2265');
    const m = txt.match(/^x?(<|>|\u2264|\u2265)(-?\d+(\.\d+)?(\/\d+(\.\d+)?)?)$/i);
    if (!m) return false;
    const sym = m[1];
    const val = normNum(m[2]);
    if (val === null) return false;
    return sym === cmp && closeEnough(val, boundary);
}

/* =========================================================
   NIVEAUX 2 & 3 : ax  ⋛  b   (division, a>0 ou a<0)
   ========================================================= */
function genDiv(positive) {
    let a = positive ? rnd(2, 9) : -rnd(2, 9);
    const x0 = rnd(-9, 9);
    const cmp = randCmp();
    const b = a * x0; // ax cmp b <=> x cmp x0 (avec flip éventuel)
    return { a, b, cmp, x0, positive };
}
GENERATORS.divpos = () => genDiv(true);
GENERATORS.divneg = () => genDiv(false);

function renderDiv(q, box) {
    const flip = q.a < 0;
    box.innerHTML = `
        <p class="sub" style="margin-bottom:18px;">Divise chaque membre par ${q.a} (le coefficient de <i>x</i>), puis écris toi-même la ligne obtenue.</p>
        <div class="equation-history">
            <div class="equation-step-item">
                <div class="equation-line"><i>${fmtCoefX(q.a)}</i> ${SYM_HTML[q.cmp]} ${q.b}</div>
                <div class="arrow-section">
                    ${arrowSVG()}
                    <input type="text" class="operation-input left-op" id="opL" placeholder="?">
                    <input type="text" class="operation-input right-op" id="opR" placeholder="?">
                </div>
                ${resultRowHTML('res', 'x', 'nombre')}
            </div>
        </div>
        ${flip ? `<div class="flip-alert"><span class="flip-icon">⚠️</span><span>On divise par un nombre <b>négatif</b> (${q.a}) : le sens de l'inégalité doit être <b>inversé</b> !</span></div>` : ''}
    `;
}
RENDERERS.divpos = renderDiv;
RENDERERS.divneg = renderDiv;

function checkDiv(q) {
    const opL = document.getElementById('opL');
    const opR = document.getElementById('opR');

    const vL = normNum(opL.value);
    const vR = normNum(opR.value);
    const opOk = vL !== null && vR !== null && closeEnough(vL, q.a) && closeEnough(vR, q.a);
    [opL, opR].forEach(el => { el.classList.remove('ok', 'err'); el.classList.add(opOk ? 'ok' : 'err'); });

    const flip = q.a < 0;
    const expectedCmp = flip ? FLIP[q.cmp] : q.cmp;
    const rowOk = checkResultRow('res', 1, 0, expectedCmp, 0, q.x0);

    if (opOk && rowOk) {
        const flipMsg = flip
            ? `On divise par ${q.a}, qui est <b>négatif</b> : le sens de l'inégalité s'inverse (${SYM_HTML[q.cmp]} devient ${SYM_HTML[expectedCmp]}).`
            : `On divise par ${q.a}, qui est <b>positif</b> : le sens de l'inégalité ne change pas.`;
        return { ok: true, msg: `${flipMsg} Solution : x ${SYM_HTML[expectedCmp]} ${q.x0}.` };
    }
    if (!opOk) return { ok: false, msg: `Il fallait diviser chaque membre par ${q.a}.` };
    return { ok: false, msg: flip ? 'Vérifie la ligne obtenue : attention, en divisant par un nombre négatif, le sens de l\'inégalité change !' : 'Vérifie la ligne obtenue (membres et symbole).' };
}
CHECKERS.divpos = checkDiv;
CHECKERS.divneg = checkDiv;

/* =========================================================
   NIVEAU 4 : ax + c  ⋛  bx + d   (cas mixte, 2 étapes)
   Étape 1 : regrouper les x d'un côté (flèches -bx)
   Étape 2 : diviser par le coefficient restant (peut être <0)
   ========================================================= */
GENERATORS.mixte = function () {
    let a, b, c, x0, coefFinal, cmp, d, nbSteps;
    // regenerate until we get a genuinely 2-or-3-step problem (avoid trivial 0-step already-solved forms)
    do {
        do { a = rndNonZero(-6, 6); b = rndNonZero(-6, 6); } while (a === b);
        c = rnd(-10, 10);
        x0 = rnd(-8, 8);
        coefFinal = a - b;
        cmp = randCmp();
        d = coefFinal * x0 + c;
        nbSteps = (b !== 0 ? 1 : 0) + (c !== 0 ? 1 : 0) + (coefFinal !== 1 ? 1 : 0);
    } while (nbSteps < 2);
    return { a, b, c, d, cmp, x0, coefFinal, nbSteps };
};

RENDERERS.mixte = function (q, box) {
    let stepsHTML = '';
    for (let i = 1; i <= q.nbSteps; i++) {
        const isLast = (i === q.nbSteps);
        stepsHTML += `
            <div class="equation-step-item">
                ${i === 1 ? `<div class="equation-line"><i>${fmtCoefX(q.a)}</i>${fmtSigned(q.c)} ${SYM_HTML[q.cmp]} <i>${fmtCoefX(q.b)}</i>${fmtSigned(q.d)}</div>` : ''}
                <div class="arrow-section">
                    ${arrowSVG()}
                    <input type="text" class="operation-input left-op" id="op${i}L" placeholder="?">
                    <input type="text" class="operation-input right-op" id="op${i}R" placeholder="?">
                </div>
                ${resultRowHTML('res' + i, isLast ? 'x' : 'x et/ou nb', isLast ? 'nombre' : 'x et/ou nb')}
            </div>`;
    }
    box.innerHTML = `
        <p class="sub" style="margin-bottom:18px;">À chaque étape, ajoute ou soustrais un même terme aux deux membres (ou divise-les), dans l'ordre de ton choix, jusqu'à isoler <i>x</i>.</p>
        <div class="equation-history">
            ${stepsHTML}
        </div>
    `;
};

/* =========================================================
   Validation générique d'une résolution en plusieurs étapes,
   sans imposer d'ordre entre "regrouper les x" et "isoler la
   constante". Chaque étape accepte soit :
   - une opération additive : on ajoute le même terme (nombre
     ou terme en x) aux deux membres (le sens ne change jamais)
   - une opération de division : on divise les deux membres
     par le même nombre non nul (le sens change si négatif)
   L'état algébrique est représenté par {aL,cL,aR,cR,cmp}
   pour  aL*x + cL  cmp  aR*x + cR
   ========================================================= */
function stepIsAdditive(opValStr) {
    // returns {isX:bool, val:number} or null if not parseable as "k" or "kx"
    if (opValStr === null || opValStr === undefined) return null;
    let s = String(opValStr).trim().replace(/\s+/g, '').replace(',', '.').replace(/\u2212/g, '-').replace(/\u00f7/g, '/');
    if (s === '') return null;
    if (/x$/i.test(s)) {
        let coefStr = s.slice(0, -1);
        let coef;
        if (coefStr === '+' || coefStr === '') coef = 1;
        else if (coefStr === '-') coef = -1;
        else coef = normNum(coefStr);
        if (coef === null || isNaN(coef)) return null;
        return { isX: true, val: coef };
    }
    const v = normNum(s);
    if (v === null || isNaN(v)) return null;
    return { isX: false, val: v };
}

// Try to validate one step given current algebraic state; returns {ok, newState, wasDivision} or {ok:false}
function tryValidateStep(state, opLraw, opRraw, resPrefix) {
    const vL = normNum(opLraw);
    const vR = normNum(opRraw);
    const bothSameNumber = vL !== null && vR !== null && closeEnough(vL, vR);

    // Try DIVISION first: both op fields must be the same non-zero number, distinct from a pure "add" reading
    // We treat it as division if the resulting row matches a division by that number.
    if (bothSameNumber && vL !== 0) {
        const divisor = vL;
        const flip = divisor < 0;
        const newCmp = flip ? FLIP[state.cmp] : state.cmp;
        const expA_L = state.aL / divisor, expC_L = state.cL / divisor;
        const expA_R = state.aR / divisor, expC_R = state.cR / divisor;
        if (checkResultRow(resPrefix, expA_L, expC_L, newCmp, expA_R, expC_R)) {
            return {
                ok: true, wasDivision: true, divisor,
                newState: { aL: expA_L, cL: expC_L, aR: expA_R, cR: expC_R, cmp: newCmp }
            };
        }
    }

    // Try ADDITIVE: both op fields describe the same term (number k, or k*x) added to both sides
    const pL = stepIsAdditive(opLraw), pR = stepIsAdditive(opRraw);
    if (pL && pR && pL.isX === pR.isX && closeEnough(pL.val, pR.val)) {
        const term = pL.val;
        const isX = pL.isX;
        const newState = isX
            ? { aL: state.aL + term, cL: state.cL, aR: state.aR + term, cR: state.cR, cmp: state.cmp }
            : { aL: state.aL, cL: state.cL + term, aR: state.aR, cR: state.cR + term, cmp: state.cmp };
        if (checkResultRow(resPrefix, newState.aL, newState.cL, newState.cmp, newState.aR, newState.cR)) {
            return { ok: true, wasDivision: false, newState };
        }
    }

    // nothing matched — still mark fields as invalid for visual feedback
    checkResultRow(resPrefix, NaN, NaN, '', NaN, NaN);
    return { ok: false };
}

function markOpFields(elL, elR, ok) {
    [elL, elR].forEach(el => { el.classList.remove('ok', 'err'); el.classList.add(ok ? 'ok' : 'err'); });
}

CHECKERS.mixte = function (q) {
    let st = { aL: q.a, cL: q.c, aR: q.b, cR: q.d, cmp: q.cmp };
    const usedDivisions = [];

    for (let i = 1; i <= q.nbSteps; i++) {
        const opL = document.getElementById('op' + i + 'L');
        const opR = document.getElementById('op' + i + 'R');
        const step = tryValidateStep(st, opL.value, opR.value, 'res' + i);
        markOpFields(opL, opR, step.ok);
        if (!step.ok) {
            return { ok: false, msg: `L'étape ${i} n'est pas correcte : vérifie que tu ajoutes (ou divises par) la même chose des deux côtés, et que la ligne obtenue correspond.` };
        }
        st = step.newState;
        usedDivisions.push(step);
    }

    // final state must be exactly "x cmp x0"
    const finalOk = closeEnough(st.aL, 1) && closeEnough(st.cL, 0) && closeEnough(st.aR, 0) && closeEnough(st.cR, q.x0);
    if (!finalOk) {
        return { ok: false, msg: 'Tu n\'as pas encore isolé x seul avec sa valeur limite. Continue à simplifier (il ne doit rester que "x" à gauche).' };
    }

    const usedDivisionNeg = usedDivisions.some(s => s.wasDivision && s.divisor < 0);
    const flipMsg = usedDivisionNeg
        ? ` Attention, une division par un nombre négatif a bien fait changer le sens de l'inégalité.`
        : '';
    return { ok: true, msg: `Bien joué, tu as isolé x : x ${SYM_HTML[st.cmp]} ${q.x0}.${flipMsg}` };
};

/* =========================================================
   NIVEAU 5 : DROITE GRADUEE
   L'élève doit : choisir un point plein/vide sur la bonne
   graduation, et cliquer/glisser pour hachurer le bon côté.
   ========================================================= */
GENERATORS.droite = function () {
    const x0 = rnd(-6, 6);
    const cmp = randCmp();
    return { x0, cmp };
};

function nlLayout() {
    // ticks from -8 to 8, svg 0..640 width mapped
    const min = -8, max = 8;
    const w = 680, h = 120, padX = 55;
    const scale = (w - 2 * padX) / (max - min);
    const xToPx = (x) => padX + (x - min) * scale;
    return { min, max, w, h, padX, scale, xToPx };
}

// state5 = { pos: number|null, filled: bool|null, dir: 'left'|'right'|null }
function renderNumberLine(containerId, state5, opts) {
    opts = opts || {};
    const L = nlLayout();
    let ticks = '';
    for (let t = L.min; t <= L.max; t++) {
        const px = L.xToPx(t);
        ticks += `<line x1="${px}" y1="${L.h/2 - 6}" x2="${px}" y2="${L.h/2 + 6}" stroke="var(--text-light)" stroke-width="1.5"/>`;
        ticks += `<text x="${px}" y="${L.h/2 + 26}" text-anchor="middle" class="nl-tick-label">${t}</text>`;
    }
    let hitzones = '';
    if (!opts.readOnly) {
        for (let t = L.min; t <= L.max; t++) {
            const px = L.xToPx(t);
            hitzones += `<rect class="nl-hitzone" data-val="${t}" x="${px - 14}" y="${L.h/2 - 22}" width="28" height="44" fill="transparent"/>`;
        }
    }
    const dir = state5.dir;
    const filled = state5.filled;
    const pos = state5.pos;
    let ray = '', dot = '', infLabel = '';
    if (pos !== null) {
        const px0 = L.xToPx(pos);
        if (dir === 'left') {
            ray = `<line x1="${L.padX - 25}" y1="${L.h/2}" x2="${px0}" y2="${L.h/2}" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" marker-start="url(#nlArrowBlueLeft)"/>`;
            infLabel = `<text x="${L.padX - 25}" y="${L.h/2 - 14}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--blue)" font-style="italic">&minus;&infin;</text>`;
        } else if (dir === 'right') {
            ray = `<line x1="${px0}" y1="${L.h/2}" x2="${L.w - L.padX + 25}" y2="${L.h/2}" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" marker-end="url(#nlArrowBlueRight)"/>`;
            infLabel = `<text x="${L.w - L.padX + 25}" y="${L.h/2 - 14}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--blue)" font-style="italic">+&infin;</text>`;
        }
        dot = `<circle cx="${px0}" cy="${L.h/2}" r="9" fill="${filled ? 'var(--blue)' : 'white'}" stroke="var(--blue)" stroke-width="3"/>`;
    }
    const axisLine = `<line x1="${L.padX - 30}" y1="${L.h/2}" x2="${L.w - L.padX + 30}" y2="${L.h/2}" stroke="var(--text-light)" stroke-width="1.5" marker-end="url(#nlArrow)"/>`;

    document.getElementById(containerId).innerHTML = `
        <svg viewBox="0 0 ${L.w} ${L.h}" width="100%" style="max-width:680px; display:block; margin:0 auto;">
            <defs>
                <marker id="nlArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="var(--text-light)"/>
                </marker>
                <marker id="nlArrowBlueRight" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
                    <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blue)"/>
                </marker>
                <marker id="nlArrowBlueLeft" markerWidth="9" markerHeight="9" refX="3" refY="4.5" orient="auto-start-reverse">
                    <path d="M9,0 L0,4.5 L9,9 Z" fill="var(--blue)"/>
                </marker>
            </defs>
            ${axisLine}
            ${ticks}
            ${ray}
            ${infLabel}
            ${dot}
            ${hitzones}
        </svg>
    `;
    if (!opts.readOnly) {
        document.querySelectorAll(`#${containerId} .nl-hitzone`).forEach(hz => {
            hz.addEventListener('click', () => {
                state5.pos = parseInt(hz.dataset.val, 10);
                renderNumberLine(containerId, state5, opts);
                if (opts.onPick) opts.onPick();
            });
        });
    }
}

function numberLineBlockHTML() {
    return `
        <div class="numberline-wrap">
            <p class="numberline-instructions">Clique sur la graduation qui correspond à la borne de la solution, choisis si le point est <b>plein</b> ou <b>vide</b>, puis la direction vers l'infini.</p>

RENDERERS.droite = function (q, box) {

CHECKERS.droite = function (q) {
    const box = document.getElementById('exBody');

    const expectedDir = (q.cmp === '<' || q.cmp === '\u2264') ? 'left' : 'right';
    const posOk = state5.pos !== null && state5.pos === q.x0;
    const dotOk = state5.filled === expectedFilled;
    const dirOk = state5.dir === expectedDir;

    if (posOk && dotOk && dirOk) {
        return { ok: true, msg: `Le point est placé en ${q.x0}, il est ${expectedFilled ? '<b>plein</b> car la solution est incluse (\u2264 ou \u2265)' : '<b>vide</b> car la solution est exclue (< ou >)'}, et le trait va ${expectedDir === 'left' ? 'vers &minus;&infin; (les valeurs plus petites que ' + q.x0 + ')' : 'vers +&infin; (les valeurs plus grandes que ' + q.x0 + ')'}.` };
    }
    let msg = 'Ce n\'est pas encore correct : ';
    if (!posOk) msg += `le point doit être placé sur la graduation ${q.x0}. `;
    if (!dotOk) msg += `le point doit être ${expectedFilled ? 'plein (●), car ' + SYM_HTML[q.cmp] + ' inclut la valeur limite' : 'vide (○), car ' + SYM_HTML[q.cmp] + ' exclut la valeur limite'}. `;
    if (!dirOk) msg += `le trait doit aller vers ${expectedDir === 'left' ? '\u2212\u221e' : '+\u221e'}.`;
    return { ok: false, msg };
};

CHECKERS.inter = function (q) {
    const box = document.getElementById('exBody');

    // infinity side must always be open "]" for -inf and "[" for +inf
    let bracketsOk;
    if (isLeft) {
        const infBracketOk = true; // fixed, always ']'
        const boundaryBracketOk = closedAtBoundary ? state6.rightBracket === ']' : state6.rightBracket === '[';
        bracketsOk = infBracketOk && boundaryBracketOk;
    } else {
        const infBracketOk = true; // fixed, always '['
        const boundaryBracketOk = closedAtBoundary ? state6.leftBracket === '[' : state6.leftBracket === ']';
        bracketsOk = infBracketOk && boundaryBracketOk;

            : `[${q.x0}${closedAtBoundary ? '' : ''} ; +&infin;[`;
        return { ok: true, msg: `${closedAtBoundary ? 'Le crochet est fermé côté ' + q.x0 + ' car la valeur est incluse (\u2264 ou \u2265).' : 'Le crochet est ouvert côté ' + q.x0 + ' car la valeur est exclue (< ou >).'} L'infini est toujours du côté ouvert. Intervalle : ${notation}` };
    }
    let msg = '';

    if (!bracketsOk) msg += `Attention au type de crochet : ${closedAtBoundary ? 'il doit être fermé (la valeur ' + q.x0 + ' est incluse)' : 'il doit être ouvert (la valeur ' + q.x0 + ' est exclue)'}.`;
    return { ok: false, msg };
};

/* =========================================================
   NIVEAU 7 : DEFI COMPLET (3 sous-étapes)
   Génère un cas mixte (a et b différents, éventuellement
   coefFinal négatif) puis demande : résolution par flèches
   (2 étapes), puis intervalle, puis droite graduée.
   ========================================================= */
GENERATORS.defi = function () {
    let a, b;
    do { a = rndNonZero(-6, 6); b = rndNonZero(-6, 6); } while (a === b);

    const nbSteps = (b !== 0 ? 1 : 0) + (c !== 0 ? 1 : 0) + (coefFinal !== 1 ? 1 : 0) || 1; // au moins 1 étape
    return { a, b, c, d, cmp, x0, coefFinal, nbSteps, sub: 0 };
};

            rightSlot.innerHTML = `<span class="interval-bound-fixed">+&infin;</span>`;
        }
        box.querySelectorAll('.interval-bracket-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const side = btn.dataset.side;
                box.querySelectorAll(`.interval-bracket-btn[data-side="${side}"]`).forEach(b => b.classList.remove('chosen'));
                btn.classList.add('chosen');
                box._interState = box._interState || {};
                if (side === 'left') box._interState.leftBracket = btn.dataset.val;
                else box._interState.rightBracket = btn.dataset.val;
            });
        });
        box._interState = {};
    } else if (sub === 2) {
        const expectedCmp = defiExpectedCmp(q);
        const state5 = { pos: null, dir: null, filled: null };
        box._nlState = state5;
        box.innerHTML = challengeTabsHTML(2) + `
            <p class="sub" style="margin-bottom:14px;">Place la solution <i>x</i> ${SYM_HTML[expectedCmp]} ${q.x0} sur la droite graduée.</p>
            ${numberLineBlockHTML()}
        `;
        renderNumberLine('nlSvgBox', state5);
        wireNumberLineControls(box, state5, 'nlSvgBox');
    }
}

CHECKERS.defi = function (q) {
    const box = document.getElementById('exBody');
    const sub = box._defiSub;
    const expectedCmp = defiExpectedCmp(q);

    if (sub === 0) {
        let st = { aL: q.a, cL: q.c, aR: q.b, cR: q.d, cmp: q.cmp };

        for (let i = 1; i <= q.nbSteps; i++) {
            const opL = document.getElementById('op' + i + 'L');
            const opR = document.getElementById('op' + i + 'R');
            const step = tryValidateStep(st, opL.value, opR.value, 'res' + i);
            markOpFields(opL, opR, step.ok);
            if (!step.ok) {
                return { ok: false, msg: `L'étape ${i} n'est pas correcte : vérifie l'opération et la ligne obtenue.` };
            }
            st = step.newState;
        }

        const finalOk = closeEnough(st.aL, 1) && closeEnough(st.cL, 0) && closeEnough(st.aR, 0) && closeEnough(st.cR, q.x0);
        if (!finalOk) {
            return { ok: false, msg: 'Tu n\'as pas encore isolé x seul avec sa valeur limite. Continue à simplifier.' };
        }

        box._defiSub = 1;
        return { ok: true, msg: `Bien joué : x ${SYM_HTML[st.cmp]} ${q.x0}. Étape suivante : l'écriture en intervalle.`, advanceOnly: true };
    }

    if (sub === 1) {
        const isLeft = (expectedCmp === '<' || expectedCmp === '\u2264');
        const closedAtBoundary = (expectedCmp === '\u2264' || expectedCmp === '\u2265');
        const boundInput = document.getElementById('boundInput');
        const boundVal = normNum(boundInput.value);
        const boundOk = boundVal !== null && closeEnough(boundVal, q.x0);
        const st = box._interState || {};
        let bracketsOk;
        if (isLeft) bracketsOk = closedAtBoundary ? st.rightBracket === ']' : st.rightBracket === '[';
        else bracketsOk = closedAtBoundary ? st.leftBracket === '[' : st.leftBracket === ']';

        boundInput.classList.remove('ok', 'err'); boundInput.classList.add(boundOk ? 'ok' : 'err');

        if (boundOk && bracketsOk) {
            box._defiSub = 2;
            return { ok: true, msg: `Bien joué. Dernière étape : la droite graduée.`, advanceOnly: true };
        }
        return { ok: false, msg: 'Vérifie la borne et le type de crochet (ouvert/fermé).' };
    }

    if (sub === 2) {
        const state5 = box._nlState;
        const expectedFilled = (expectedCmp === '\u2264' || expectedCmp === '\u2265');
        const expectedDir = (expectedCmp === '<' || expectedCmp === '\u2264') ? 'left' : 'right';
        const posOk = state5.pos !== null && state5.pos === q.x0;
        const dotOk = state5.filled === expectedFilled;
        const dirOk = state5.dir === expectedDir;
        if (posOk && dotOk && dirOk) {
            return { ok: true, msg: `Parfait, tu as résolu l'inéquation de bout en bout : flèches, intervalle et droite graduée cohérents !` };
        }
        let msg = 'Vérifie ';
        const parts = [];
        if (!posOk) parts.push(`la position du point (doit être en ${q.x0})`);
        if (!dotOk) parts.push('le type de point (plein/vide)');
        if (!dirOk) parts.push('la direction vers l\'infini');
        return { ok: false, msg: msg + parts.join(', ') + '.' };
    }
};
