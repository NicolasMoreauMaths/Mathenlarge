<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloriage Magique — Équations Produit Nul</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f6;
  --card: #fff;
  --txt: #2d2d2d;
  --txt2: #888;
  --bdr: #e0ddd5;
  --acc: #e74c3c;
  --acc-lt: #fdecea;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Quicksand', sans-serif;
  background: var(--bg);
  color: var(--txt);
  max-width: 860px;
  margin: 0 auto;
  padding: 12px;
  -webkit-user-select: none;
  user-select: none;
}
h1 { font-size: 20px; text-align: center; font-weight: 700; margin-bottom: 2px; }
.sub { text-align: center; font-size: 12px; color: var(--txt2); margin-bottom: 12px; }

.layout { display: flex; gap: 16px; align-items: flex-start; }
@media (max-width: 700px) { .layout { flex-direction: column; align-items: center; } }

.col-draw { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.col-panel { flex: 1; min-width: 0; }

/* SVG container */
.svg-wrap {
  background: var(--card);
  border: 1.5px solid var(--bdr);
  border-radius: 12px;
  padding: 10px;
  width: min(85vw, 400px);
}
.svg-wrap svg { width: 100%; height: auto; }

/* Zones */
.zone {
  fill: #f5f4ef;
  stroke: #333;
  stroke-width: 1.8;
  cursor: pointer;
  transition: fill 0.2s;
}
.zone:hover { filter: brightness(0.95); }
.zone-num {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 13px;
  fill: #666;
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: central;
}
.zone.colored .zone-num { fill: rgba(0,0,0,0.3); }

/* Panel */
.panel {
  background: var(--card);
  border: 1.5px solid var(--bdr);
  border-radius: 12px;
  padding: 16px;
}
.panel-empty {
  display: flex; align-items: center; justify-content: center;
  color: var(--txt2); font-size: 14px; min-height: 120px;
  text-align: center; line-height: 1.6;
}
.pcontent { display: none; }

.zone-badge {
  display: inline-block;
  background: var(--acc);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
}
.equation {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--bdr);
  letter-spacing: 0.5px;
}

/* Color palette */
.pal-label { font-size: 12px; color: var(--txt2); margin-bottom: 6px; text-align: center; }
.palette {
  display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 14px;
}
.pal-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 2.5px solid transparent; cursor: pointer;
  transition: all 0.15s; position: relative;
}
.pal-btn.pick { border-color: var(--txt); box-shadow: 0 0 0 2px var(--acc-lt); }
.pal-num {
  position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; color: var(--txt2);
}

/* Legend */
.leg-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--txt2); }
.leg-grid { display: flex; flex-direction: column; gap: 4px; }
.leg-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--bdr);
  border-radius: 8px;
  background: var(--bg);
  font-size: 13px;
}
.leg-swatch {
  width: 22px; height: 22px; border-radius: 5px;
  border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
}
.leg-text { font-weight: 600; }

/* Equations list */
.eq-title { font-size: 13px; font-weight: 700; margin: 14px 0 8px; color: var(--txt2); }
.eq-list { display: flex; flex-direction: column; gap: 3px; }
.eq-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px;
  border: 1px solid var(--bdr);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.eq-item:hover { background: var(--acc-lt); }
.eq-item.done { background: #e8f8f0; border-color: #1d9e75; }
.eq-num {
  display: inline-block;
  width: 22px; height: 22px; line-height: 22px;
  text-align: center;
  background: var(--acc);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  border-radius: 6px;
  flex-shrink: 0;
}

/* Actions */
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.btn {
  padding: 9px 16px; font-size: 13px; font-weight: 700;
  font-family: 'Quicksand', sans-serif;
  border: 1.5px solid var(--bdr); background: var(--card);
  color: var(--txt); border-radius: 8px; cursor: pointer;
}
.btn:active { transform: scale(0.97); }
.btn-a { background: var(--acc); color: #fff; border-color: var(--acc); }
.btn-g { background: #1d9e75; color: #fff; border-color: #1d9e75; }

.score { text-align: center; font-size: 13px; color: var(--txt2); min-height: 20px; padding: 6px 0; }
.score b { color: var(--acc); }

@media (max-width: 700px) {
  .svg-wrap { width: min(95vw, 400px); }
  .panel { width: min(95vw, 400px); }
}
</style>
</head>
<body>

<h1>Coloriage Magique — Équations Produit Nul</h1>
<p class="sub">Résous chaque équation, calcule la somme des solutions, et colorie la zone avec la bonne couleur.</p>

<div class="layout">
<div class="col-draw">
  <div class="svg-wrap">
    <svg id="flower" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
      <!-- Pot -->
      <path class="zone" id="z13" d="M145,390 L125,490 L275,490 L255,390 Z"/>
      <text class="zone-num" x="200" y="440">13</text>
      <path class="zone" id="z14" d="M140,380 L260,380 L255,390 L145,390 Z"/>
      <text class="zone-num" x="200" y="386">14</text>
      <!-- Stem -->
      <rect class="zone" id="z12" x="195" y="265" width="10" height="118"/>
      <text class="zone-num" x="200" y="330">12</text>
      <!-- Leaves -->
      <path class="zone" id="z10" d="M200,340 Q140,310 110,340 Q140,370 200,350 Z"/>
      <text class="zone-num" x="155" y="343">10</text>
      <path class="zone" id="z11" d="M200,340 Q260,310 290,340 Q260,370 200,350 Z"/>
      <text class="zone-num" x="245" y="343">11</text>
      <!-- Petals (8 petals around center) -->
      <ellipse class="zone" id="z2" cx="200" cy="115" rx="22" ry="35"/>
      <text class="zone-num" x="200" y="115">2</text>
      <ellipse class="zone" id="z3" cx="245" cy="130" rx="22" ry="35" transform="rotate(45,245,130)"/>
      <text class="zone-num" x="248" y="128">3</text>
      <ellipse class="zone" id="z4" cx="260" cy="175" rx="22" ry="35" transform="rotate(90,260,175)"/>
      <text class="zone-num" x="260" y="175">4</text>
      <ellipse class="zone" id="z5" cx="245" cy="220" rx="22" ry="35" transform="rotate(135,245,220)"/>
      <text class="zone-num" x="243" y="222">5</text>
      <ellipse class="zone" id="z6" cx="200" cy="238" rx="22" ry="35"/>
      <text class="zone-num" x="200" y="238">6</text>
      <ellipse class="zone" id="z7" cx="155" cy="220" rx="22" ry="35" transform="rotate(45,155,220)"/>
      <text class="zone-num" x="157" y="222">7</text>
      <ellipse class="zone" id="z8" cx="140" cy="175" rx="22" ry="35" transform="rotate(90,140,175)"/>
      <text class="zone-num" x="140" y="175">8</text>
      <ellipse class="zone" id="z9" cx="155" cy="130" rx="22" ry="35" transform="rotate(135,155,130)"/>
      <text class="zone-num" x="153" y="128">9</text>
      <!-- Center -->
      <circle class="zone" id="z1" cx="200" cy="175" r="40"/>
      <text class="zone-num" x="200" y="175">1</text>
    </svg>
  </div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="razAll()">Tout effacer</button>
    <button class="btn btn-a" onclick="checkAll()">Vérifier</button>
  </div>
</div>

<div class="col-panel">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">← Clique sur une zone<br>pour voir son équation</div>
    <div class="pcontent" id="pcontent">
      <div class="zone-badge" id="zbadge">Zone 1</div>
      <div class="equation" id="peq"></div>
      <div class="pal-label">Choisis la couleur correspondant à ta réponse :</div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="leg-title" style="margin-top:16px">Code couleur</div>
    <div class="leg-grid" id="legGrid"></div>

    <div class="eq-title">Toutes les équations</div>
    <div class="eq-list" id="eqList"></div>
  </div>
</div>
</div>

<script>
// ── Data ──
// Each zone: equation (produit nul), the answer determines the color.
// Rule: solve (ax+b)(cx+d)=0, compute the SUM of solutions → color number.
// Or: use specific mapping per zone.

// Colors: 8 couleurs pour empêcher de deviner
const COLORS = {
  1: { name: "Jaune", css: "#f1c40f" },
  2: { name: "Rose", css: "#e84393" },
  3: { name: "Vert", css: "#27ae60" },
  4: { name: "Marron", css: "#8B4513" },
  5: { name: "Vert foncé", css: "#1e8449" },
  6: { name: "Orange", css: "#e67e22" },
  7: { name: "Violet", css: "#8e44ad" },
  8: { name: "Rouge", css: "#e74c3c" }
};

// Règle: somme des solutions → numéro de couleur
// Petals: couleurs variées pour que l'élève ne puisse pas deviner

const ZONES = [
  // zone 1: center → jaune (sum=1)
  { id: 1, eq: "(x + 4)(x − 5) = 0", sols: [-4, 5], color: 1 },
  // zones 2-9: pétales → couleurs variées
  { id: 2, eq: "(x + 3)(x − 5) = 0", sols: [-3, 5], color: 2 },       // rose, sum=2
  { id: 3, eq: "(x − 10)(x + 4) = 0", sols: [10, -4], color: 6 },     // orange, sum=6
  { id: 4, eq: "(x − 5)(x + 3) = 0", sols: [5, -3], color: 2 },       // rose, sum=2
  { id: 5, eq: "(x − 9)(x + 2) = 0", sols: [9, -2], color: 7 },       // violet, sum=7
  { id: 6, eq: "(x − 11)(x + 3) = 0", sols: [11, -3], color: 8 },     // rouge, sum=8
  { id: 7, eq: "(2x − 14)(x + 1) = 0", sols: [7, -1], color: 6 },     // orange, sum=6
  { id: 8, eq: "(x − 5)(x − 2) = 0", sols: [5, 2], color: 7 },        // violet, sum=7
  { id: 9, eq: "(x − 3)(x + 1) = 0", sols: [3, -1], color: 2 },       // rose, sum=2
  // zones 10-11: feuilles → vert (sum=3)
  { id: 10, eq: "(x + 2)(x − 5) = 0", sols: [-2, 5], color: 3 },
  { id: 11, eq: "(x − 4)(x + 1) = 0", sols: [4, -1], color: 3 },
  // zone 12: tige → vert foncé (sum=5)
  { id: 12, eq: "(x − 1)(x − 4) = 0", sols: [1, 4], color: 5 },
  // zones 13-14: pot → marron (sum=4)
  { id: 13, eq: "(x + 3)(x − 7) = 0", sols: [-3, 7], color: 4 },
  { id: 14, eq: "(x − 6)(x + 2) = 0", sols: [6, -2], color: 4 },      // marron, sum=4
];

let zoneColors = {}; // zoneId → colorNumber chosen by student

function init() {
  buildPalette();
  buildLegend();
  buildEqList();
  
  // Click handlers on SVG zones
  ZONES.forEach(z => {
    const el = document.getElementById('z' + z.id);
    if (el) {
      el.addEventListener('click', () => selectZone(z.id));
    }
  });
}

let selZone = -1;

function selectZone(id) {
  selZone = id;
  document.getElementById('pempty').style.display = 'none';
  document.getElementById('pcontent').style.display = 'block';
  const z = ZONES.find(z => z.id === id);
  document.getElementById('zbadge').textContent = 'Zone ' + id;
  document.getElementById('peq').textContent = z.eq;
  buildPalette();
  
  // Highlight in eq list
  document.querySelectorAll('.eq-item').forEach(el => {
    el.style.outline = el.dataset.id == id ? '2px solid var(--acc)' : 'none';
  });
  
  if (window.innerWidth <= 700)
    document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function buildPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  for (const [num, col] of Object.entries(COLORS)) {
    const btn = document.createElement('div');
    btn.className = 'pal-btn' + (zoneColors[selZone] == num ? ' pick' : '');
    btn.style.background = col.css;
    btn.innerHTML = '<span class="pal-num">' + num + '</span>';
    btn.addEventListener('click', () => applyColor(+num));
    pal.appendChild(btn);
  }
}

function applyColor(colorNum) {
  if (selZone < 0) return;
  zoneColors[selZone] = colorNum;
  
  // Color the SVG zone
  const el = document.getElementById('z' + selZone);
  if (el) {
    el.style.fill = COLORS[colorNum].css;
    el.classList.add('colored');
  }
  
  // Update palette highlight
  buildPalette();
  
  // Mark in eq list
  const eqItem = document.querySelector('.eq-item[data-id="' + selZone + '"]');
  if (eqItem) eqItem.classList.add('done');
}

function buildLegend() {
  const grid = document.getElementById('legGrid');
  // Rule description
  const rule = document.createElement('div');
  rule.style.cssText = 'font-size:12px;color:var(--txt2);margin-bottom:6px;line-height:1.5;';
  rule.innerHTML = 'Résous l\'équation, calcule <b>la somme des solutions</b>, puis colorie avec la couleur correspondante.';
  grid.appendChild(rule);
  
  for (const [num, col] of Object.entries(COLORS)) {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = '<div class="leg-swatch" style="background:' + col.css + '"></div>' +
      '<span class="leg-text">' + num + ' → ' + col.name + '</span>';
    grid.appendChild(item);
  }
}

function buildEqList() {
  const list = document.getElementById('eqList');
  ZONES.forEach(z => {
    const item = document.createElement('div');
    item.className = 'eq-item';
    item.dataset.id = z.id;
    item.innerHTML = '<span class="eq-num">' + z.id + '</span> ' + z.eq;
    item.addEventListener('click', () => selectZone(z.id));
    list.appendChild(item);
  });
}

function checkAll() {
  let ok = 0, total = ZONES.length;
  ZONES.forEach(z => {
    const el = document.getElementById('z' + z.id);
    if (zoneColors[z.id] === z.color) {
      ok++;
      el.style.stroke = '#1d9e75';
      el.style.strokeWidth = '3';
    } else if (zoneColors[z.id] !== undefined) {
      el.style.stroke = '#e24b4a';
      el.style.strokeWidth = '3';
    }
  });
  const s = document.getElementById('score');
  if (ok === total) s.innerHTML = '🎉 <b>Parfait !</b> ' + ok + '/' + total + ' zones correctes !';
  else s.innerHTML = '<b>' + ok + '/' + total + '</b> zones correctes';
}

function razAll() {
  zoneColors = {};
  ZONES.forEach(z => {
    const el = document.getElementById('z' + z.id);
    if (el) {
      el.style.fill = '#f5f4ef';
      el.style.stroke = '#333';
      el.style.strokeWidth = '1.8';
      el.classList.remove('colored');
    }
  });
  document.querySelectorAll('.eq-item').forEach(el => {
    el.classList.remove('done');
    el.style.outline = 'none';
  });
  document.getElementById('score').innerHTML = '';
  document.getElementById('pempty').style.display = 'flex';
  document.getElementById('pcontent').style.display = 'none';
  selZone = -1;
}

init();
</script>

<a href="index.html" class="btn-retour-flottant">
  <span>🏠</span> Menu
</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5c67f2;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5c67f2;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all .3s ease}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5c67f2;color:white}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem}}
</style>
</body>
</html>
