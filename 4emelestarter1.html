<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Starter · Quatrième — n°1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3E9; --card:#FFFDF7; --ink:#2B2A28; --muted:#6E675C;
  --line:#E7DEC9; --brique:#B0442F; --brique-soft:#f3e3dd;
  --teal:#2A7F73; --amber:#D98A3D; --shade:#DBEFD7;
  --chip:#efe7d4;
  --shadow:0 1px 2px rgba(60,45,20,.06), 0 8px 24px rgba(60,45,20,.06);
}
html[data-theme="dark"]{
  --paper:#201D19; --card:#2B2722; --ink:#ECE5D7; --muted:#A99F8E;
  --line:#3B362E; --brique:#E48267; --brique-soft:#3a2a25;
  --teal:#62B2A4; --amber:#E0A35C; --shade:rgba(98,178,164,.18);
  --chip:#34302a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif; line-height:1.45;
  -webkit-font-smoothing:antialiased; padding-bottom:3rem;
}
.wrap{max-width:1340px; margin:0 auto; padding:0 22px}

/* ---------- En-tête ---------- */
header{padding:30px 0 14px}
.eyebrow{
  font-size:.72rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--teal); font-weight:600; margin:0 0 8px;
}
.headrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo{flex:none; width:clamp(46px,6.5vw,72px); color:var(--brique); line-height:0}
.logo svg{width:100%; height:auto; display:block}
.fshead .logo{width:1.25em}
h1{
  font-family:"Fraunces",serif; font-weight:600; font-size:clamp(2rem,5.5vw,3.2rem);
  line-height:1.02; margin:0; letter-spacing:-.01em;
}
.mascotte{display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--muted); font-size:.85rem}
.mascotte .fox{font-size:1.6rem; line-height:1}
.sub{margin:12px 0 0; color:var(--muted); font-size:1.05rem; max-width:70ch}
.theme{margin:6px 0 0; font-family:"Fraunces",serif; font-weight:600; font-size:1.06rem; color:var(--ink)}
.durstep{display:inline-flex; align-items:center; gap:4px}
.durlbl{font-size:.82rem; color:var(--muted); min-width:3.4em; text-align:center; font-variant-numeric:tabular-nums}
.sub b{color:var(--ink); font-weight:600}

/* ---------- Barre de pilotage ---------- */
.console{
  position:sticky; top:0; z-index:20; margin:18px 0 8px;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  padding:12px 14px;
}
.console-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.btn{
  font-family:inherit; font-size:.9rem; font-weight:600; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 14px; border-radius:10px; transition:transform .08s ease, background .15s, border-color .15s;
}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.btn.primary{background:var(--brique); border-color:var(--brique); color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.icon{padding:9px 11px; line-height:1}
.spacer{flex:1 1 auto}
.chrono{
  font-family:"Fraunces",serif; font-weight:600; font-variant-numeric:tabular-nums;
  font-size:1.5rem; min-width:84px; text-align:center; letter-spacing:.02em;
  padding:2px 10px; border-radius:10px; background:var(--chip);
}
.chrono.fin{color:var(--brique); animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.45}}
.count{font-size:.86rem; color:var(--muted); font-weight:600; white-space:nowrap}
.count b{color:var(--brique); font-size:1rem}

/* ---------- Piste (signature) ---------- */
.piste{margin-top:12px; position:relative; height:30px}
.lane{
  position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px);
  border-radius:6px;
}
.runner{
  position:absolute; top:50%; transform:translate(-50%,-50%); left:0;
  font-size:1.35rem; transition:left 1s linear; will-change:left;
}
.flag{position:absolute; right:-2px; top:50%; transform:translateY(-50%); font-size:1.15rem}

/* ---------- Grille de questions ---------- */
.grid{
  margin-top:26px; display:grid; gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:18px 18px 14px; cursor:pointer;
  display:flex; flex-direction:column; min-height:210px;
  transition:border-color .15s, box-shadow .15s, transform .08s;
}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.card.done{border-color:var(--brique)}
.card .top{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.num{
  font-family:"Fraunces",serif; font-weight:600; font-size:1.05rem;
  width:34px; height:34px; flex:none; display:grid; place-items:center;
  background:var(--chip); color:var(--ink); border-radius:9px;
}
.card.done .num{background:var(--brique); color:#fff}
.tag{font-size:.82rem; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; font-weight:600}
.enonce{font-size:1.16rem; margin:2px 0 10px}
.fig{margin:auto 0 4px}
.fig svg{display:block; margin:.4rem auto; height:185px; width:auto; max-width:100%}
.fig .stroke{fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round}
.fig .shade{fill:var(--shade); stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round}
.fig .dash{fill:none; stroke:var(--ink); stroke-width:1.5; stroke-dasharray:5 3.5}
.fig .ra{fill:none; stroke:var(--ink); stroke-width:1.4}
.fig .dot{fill:var(--ink)}
.fig text{fill:var(--ink); font-family:"DM Sans",sans-serif; font-size:12.5px; font-weight:700}
.fig .it{fill:var(--muted); font-style:italic; font-weight:500}
.fig .bg{fill:var(--card)}
sup{font-size:.7em}
.foot{margin-top:auto; padding-top:8px}
.reveal{
  display:flex; align-items:center; gap:8px; min-height:40px;
  border-top:1px dashed var(--line); padding-top:9px; margin-top:8px;
}
.hint{color:var(--muted); font-size:.82rem; font-style:italic}
.answer{
  display:none; align-items:baseline; gap:6px; flex-wrap:wrap;
  font-family:"Fraunces",serif; font-size:1.4rem; font-weight:600; color:var(--brique);
}
.frac{display:inline-flex; flex-direction:column; text-align:center; vertical-align:middle;
  margin:0 1px; font-size:.66em; line-height:1.05}
.frac .n{border-bottom:1.6px solid currentColor; padding:0 4px}
.frac .d{padding:0 4px}
.answer .lab{font-family:"DM Sans",sans-serif; font-size:.7rem; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--teal)}
var{font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:500}
.detail{flex-basis:100%; font-family:"DM Sans",sans-serif; font-weight:400; font-size:.96rem;
  color:var(--muted); margin-top:3px; line-height:1.35}
.card.done .answer{display:flex}
.card.done .hint{display:none}
.answer.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8); opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1); opacity:1}}

/* ---------- Chrono plein écran ---------- */
#fsView{
  position:fixed; inset:0; z-index:100; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:30px;
  background:var(--paper); color:var(--ink); text-align:center; padding:24px;
}
#fsView.active{display:flex}
.fshead{font-family:"Fraunces",serif; font-size:clamp(1.1rem,3.4vw,2rem); color:var(--muted);
  display:flex; align-items:center; gap:12px}
.fshead .fox{font-size:1.5em; line-height:1}
#fsTime{
  font-family:"Fraunces",serif; font-weight:600; font-variant-numeric:tabular-nums;
  font-size:clamp(5rem,27vw,24rem); line-height:.86; letter-spacing:.02em;
}
#fsTime.fin{color:var(--brique); animation:pulse 1s ease infinite}
.fsbtns{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
.fsbtns .btn{font-size:1.05rem; padding:14px 22px; border-radius:14px}
.fshint{color:var(--muted); font-size:.85rem}
#fsView .fspiste{position:relative; height:48px; width:min(720px,82vw); margin:2px auto 0}
#fsView .fslane{position:absolute; left:0; right:0; top:50%; height:9px; transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 34px); border-radius:9px}
#fsView .fsrunner{position:absolute; top:50%; left:0; transform:translate(-50%,-50%);
  font-size:2.1rem; line-height:1; transition:left 1s linear; will-change:left}
#fsView .fsflag{position:absolute; right:-2px; top:50%; transform:translateY(-50%); font-size:1.7rem}

.fig .grid{stroke:var(--line); stroke-width:1}
.scratch{display:inline-flex; flex-direction:column; gap:4px; align-items:stretch;
  width:230px; margin:.5rem auto .3rem; font-size:.82rem; font-weight:600; color:#fff; text-align:left}
.scratch .sb{padding:6px 11px; border-radius:5px; line-height:1.3}
.scratch .ev,.scratch .ctrl{background:#E9A037}
.scratch .pen{background:#14A096}
.scratch .mot{background:#4C97FF}
.scratch .cwrap{display:flex; flex-direction:column; gap:4px; margin-left:12px;
  padding:4px 0; border-left:12px solid #E9A037; border-radius:0 0 0 3px}
.scratch .foot{height:12px; padding:0; border-radius:0 5px 5px 5px; width:60%}
.scratch .flag{color:#36c95f}
footer{margin-top:30px; color:var(--muted); font-size:.82rem; text-align:center}
footer b{color:var(--ink)}

@media (max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px}
  .chrono{font-size:1.25rem}
  .console{border-radius:14px}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr}
  .card{min-height:130px; padding:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important; scroll-behavior:auto!important}
}

/* ══ RESPONSIVE ENHANCEMENTS ══ */

/* ── KaTeX overflow ── */
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.katex { white-space: normal; }

/* ── 380px – very small screens ── */
@media (max-width:380px){
  body { padding-bottom: 2rem; }
  h1 { font-size: clamp(1.5rem, 5vw, 2rem) !important; }
  .sub { font-size: 0.82rem; }
  .theme { font-size: 0.92rem; }
  .chrono { font-size: 1.1rem; min-width: 68px; padding: 2px 6px; }
  .count { font-size: 0.78rem; }
  .btn { font-size: 0.82rem; padding: 7px 10px; }
  .card { padding: 12px; }
  .enonce { font-size: 0.92rem; }
  .sol-box { padding: 10px; font-size: 0.9rem; }
  .hint { font-size: 0.85rem; }
  .answer input, .answer select { font-size: 0.92rem; }
  .foot { font-size: 0.78rem; padding: 1rem 0.5rem; }
  .top { padding: 0.6rem 0.75rem; gap: 0.5rem; }
  .headrow { flex-wrap: wrap; gap: 0.4rem; }
  .eyebrow { font-size: 0.65rem; }
  .durlbl { font-size: 0.72rem; }
  .console { padding: 12px; border-radius: 10px; }
  .console-row { gap: 0.3rem; }
  .eq-line { font-size: 0.88rem; }
  .arrow-row { font-size: 0.85rem; }
  .grid { gap: 8px; }
  .fig > svg { height: 150px !important; }
  .reveal { font-size: 0.82rem; }
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <div class="headrow">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 100 104" fill="currentColor" stroke="currentColor" style="max-width:100%;height:auto;"><rect x="45" y="18" width="10" height="11" rx="1.5"/><rect x="41.5" y="11" width="17" height="8" rx="3.5"/><line x1="30" y1="40" x2="23.5" y2="33.5" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="58" r="30" fill="none" stroke-width="5"/><line x1="50" y1="30" x2="50" y2="36" stroke-width="3.4"/><line x1="78" y1="58" x2="72" y2="58" stroke-width="3.4"/><line x1="50" y1="86" x2="50" y2="80" stroke-width="3.4"/><line x1="22" y1="58" x2="28" y2="58" stroke-width="3.4"/><line x1="50" y1="58" x2="67" y2="43" stroke-width="5.5" stroke-linecap="round"/><circle cx="50" cy="58" r="4.2"/></svg></span>
      <h1 id="title"></h1>
    </div>
    <p class="theme" id="themeLine"></p>
    <p class="sub" id="sub"></p>
  </header>

  <div class="console" role="region" aria-label="Pilotage de la séance">
    <div class="console-row">
      <div class="chrono" id="chrono" aria-live="off">07:00</div>
      <button class="btn icon ghost" id="play"  title="Démarrer / mettre en pause" aria-label="Démarrer ou mettre en pause">▶</button>
      <button class="btn icon ghost" id="rewind" title="Remettre le chrono à 7 min" aria-label="Réinitialiser le chrono">↺</button>
      <button class="btn icon ghost" id="fs" title="Chrono en plein écran" aria-label="Afficher le chrono en plein écran">⛶</button>
      <span class="durstep"><button class="btn icon ghost" id="durMinus" title="Diminuer la durée" aria-label="Diminuer la durée">−</button><span class="durlbl" id="durLbl">7 min</span><button class="btn icon ghost" id="durPlus" title="Augmenter la durée" aria-label="Augmenter la durée">+</button></span>
      <span class="spacer"></span>
      <span class="count" id="count"><b>0</b> / 10 dévoilées</span>
      <button class="btn icon ghost" id="theme" title="Thème clair / sombre" aria-label="Basculer le thème">☾</button>
    </div>
    <div class="console-row" style="margin-top:10px">
      <button class="btn primary" id="next">Dévoiler la réponse suivante</button>
      <button class="btn" id="all">Tout afficher</button>
      <button class="btn ghost" id="reset">Réinitialiser</button>
    </div>
    <div class="piste" aria-hidden="true">
      <div class="lane"></div>
      <div class="runner" id="runner">🦊</div>
      <div class="flag">🏁</div>
    </div>
  </div>

  <main class="grid" id="grid" aria-label="Questions"></main>

  <footer>
    <span id="footText"></span><br>
    Astuce&nbsp;: cliquez une carte pour dévoiler sa réponse, ou utilisez «&nbsp;Dévoiler la réponse suivante&nbsp;». Le bouton ⛶ met le chrono en plein écran.
  </footer>
</div>

<!-- Chrono plein écran -->
<div id="fsView" aria-hidden="true">
  <div class="fshead"><span class="logo" aria-hidden="true"><svg viewBox="0 0 100 104" fill="currentColor" stroke="currentColor" style="max-width:100%;height:auto;"><rect x="45" y="18" width="10" height="11" rx="1.5"/><rect x="41.5" y="11" width="17" height="8" rx="3.5"/><line x1="30" y1="40" x2="23.5" y2="33.5" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="58" r="30" fill="none" stroke-width="5"/><line x1="50" y1="30" x2="50" y2="36" stroke-width="3.4"/><line x1="78" y1="58" x2="72" y2="58" stroke-width="3.4"/><line x1="50" y1="86" x2="50" y2="80" stroke-width="3.4"/><line x1="22" y1="58" x2="28" y2="58" stroke-width="3.4"/><line x1="50" y1="58" x2="67" y2="43" stroke-width="5.5" stroke-linecap="round"/><circle cx="50" cy="58" r="4.2"/></svg></span><span id="fsTitle"></span></div>
  <div id="fsTime">07:00</div>
  <div class="fspiste" aria-hidden="true">
    <div class="fslane"></div>
    <div class="fsrunner" id="fsRunner">🦊</div>
    <div class="fsflag">🏁</div>
  </div>
  <div class="fsbtns">
    <button class="btn primary" id="fsPlay">▶ Démarrer</button>
    <button class="btn" id="fsRewind">↺ Remettre à 7:00</button>
    <button class="btn ghost" id="fsQuit">Quitter le plein écran</button>
  </div>
  <div class="fshint">Touche Échap pour quitter</div>
</div>

<script>
/* ---------- Figures (SVG, héritent du thème via classes) ---------- */
/* ============================================================
   BIBLIOTHÈQUE DE FIGURES (SVG / Scratch) — réutilisable
   Appelez FIG.nom(...) dans le champ f des questions ci-dessous.
   ============================================================ */
const FIG = {
  cube:(l="10 cm")=>`<svg viewBox="0 0 150 146" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="30,42 110,42 110,122 30,122"/>
    <line class="stroke" x1="30" y1="42" x2="58" y2="14"/><line class="stroke" x1="110" y1="42" x2="138" y2="14"/>
    <line class="stroke" x1="110" y1="122" x2="138" y2="94"/><line class="stroke" x1="58" y1="14" x2="138" y2="14"/>
    <line class="stroke" x1="138" y1="14" x2="138" y2="94"/>
    <line class="dash" x1="58" y1="94" x2="138" y2="94"/><line class="dash" x1="58" y1="94" x2="58" y2="14"/>
    <line class="dash" x1="58" y1="94" x2="30" y2="122"/>
    <text x="70" y="139" text-anchor="middle">${l}</text></svg>`,
  pave:(L="…",l="…",h="…")=>`<svg viewBox="0 0 175 150" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="25,55 120,55 120,125 25,125"/>
    <line class="stroke" x1="120" y1="55" x2="150" y2="30"/><line class="stroke" x1="120" y1="125" x2="150" y2="100"/>
    <line class="stroke" x1="25" y1="55" x2="55" y2="30"/><line class="stroke" x1="55" y1="30" x2="150" y2="30"/>
    <line class="stroke" x1="150" y1="30" x2="150" y2="100"/>
    <line class="dash" x1="55" y1="100" x2="150" y2="100"/><line class="dash" x1="55" y1="100" x2="55" y2="30"/>
    <line class="dash" x1="55" y1="100" x2="25" y2="125"/>
    <text x="72" y="139" text-anchor="middle">${L}</text>
    <text x="158" y="70" text-anchor="start">${h}</text>
    <text x="103" y="44" text-anchor="middle">${l}</text></svg>`,
  pyramide:()=>`<svg viewBox="0 0 150 128" style="max-width:100%;height:auto;">
    <line class="stroke" x1="30" y1="110" x2="110" y2="110"/><line class="stroke" x1="110" y1="110" x2="135" y2="80"/>
    <line class="dash" x1="135" y1="80" x2="55" y2="80"/><line class="dash" x1="55" y1="80" x2="30" y2="110"/>
    <line class="stroke" x1="30" y1="110" x2="78" y2="18"/><line class="stroke" x1="110" y1="110" x2="78" y2="18"/>
    <line class="stroke" x1="135" y1="80" x2="78" y2="18"/><line class="dash" x1="55" y1="80" x2="78" y2="18"/></svg>`,
  cylindre:(r="5 cm",h="10 cm")=>`<svg viewBox="0 0 155 140" style="max-width:100%;height:auto;">
    <ellipse class="stroke" cx="75" cy="30" rx="40" ry="13"/>
    <line class="stroke" x1="35" y1="30" x2="35" y2="110"/><line class="stroke" x1="115" y1="30" x2="115" y2="110"/>
    <path class="stroke" d="M35 110 A40 13 0 0 0 115 110"/><path class="dash" d="M35 110 A40 13 0 0 1 115 110"/>
    <line class="dash" x1="75" y1="30" x2="115" y2="30"/>
    <text x="96" y="24" text-anchor="middle">${r}</text>
    <text x="122" y="73" text-anchor="start">${h}</text></svg>`,
  triangleAire:(b="10 cm",h="5 cm",g="6 cm",d="7 cm")=>`<svg viewBox="0 0 200 146" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="20,120 180,120 80,30"/>
    <line class="dash" x1="80" y1="120" x2="80" y2="30"/>
    <path class="ra" d="M80 108 L92 108 L92 120"/>
    <text x="100" y="138" text-anchor="middle">${b}</text>
    <text x="44" y="72" text-anchor="end">${g}</text>
    <text x="86" y="78" text-anchor="start">${h}</text>
    <text x="138" y="78" text-anchor="start">${d}</text>
    <text x="14" y="128" text-anchor="end">A</text><text x="186" y="128" text-anchor="start">B</text>
    <text x="80" y="22" text-anchor="middle">C</text></svg>`,
  pythagore:(cg="8 cm",ch="6 cm",hyp="?")=>`<svg viewBox="0 0 180 142" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="40,30 40,120 150,30"/>
    <path class="ra" d="M52 30 L52 42 L40 42"/>
    <text x="34" y="78" text-anchor="end">${cg}</text>
    <text x="95" y="22" text-anchor="middle">${ch}</text>
    <text x="103" y="83" text-anchor="start">${hyp}</text>
    <text x="34" y="26" text-anchor="end">D</text><text x="34" y="130" text-anchor="end">F</text>
    <text x="156" y="26" text-anchor="start">E</text></svg>`,
  angle:(v="25°")=>`<svg viewBox="0 0 170 134" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="30,110 140,110 30,25"/>
    <path class="ra" d="M42 110 L42 98 L30 98"/>
    <path class="stroke" d="M118 110 A22 22 0 0 1 122.6 96.6"/>
    <text x="108" y="101" text-anchor="middle">${v}</text>
    <text x="44" y="44" text-anchor="start">?</text>
    <text x="24" y="122" text-anchor="end">B</text><text x="146" y="122" text-anchor="start">A</text>
    <text x="24" y="20" text-anchor="end">C</text></svg>`,
  repere:(x=-2,y=1,nom="A")=>{ const px=110+22*x, py=95-22*y; return `<svg viewBox="0 0 200 150" style="max-width:100%;height:auto;">
    <g class="grid">
      <line x1="44" y1="51" x2="44" y2="117"/><line x1="66" y1="51" x2="66" y2="117"/>
      <line x1="88" y1="51" x2="88" y2="117"/><line x1="110" y1="51" x2="110" y2="117"/>
      <line x1="132" y1="51" x2="132" y2="117"/><line x1="154" y1="51" x2="154" y2="117"/>
      <line x1="176" y1="51" x2="176" y2="117"/>
      <line x1="44" y1="51" x2="176" y2="51"/><line x1="44" y1="73" x2="176" y2="73"/>
      <line x1="44" y1="95" x2="176" y2="95"/><line x1="44" y1="117" x2="176" y2="117"/></g>
    <line class="stroke" x1="38" y1="95" x2="184" y2="95"/><polyline class="stroke" points="178,91 184,95 178,99"/>
    <line class="stroke" x1="110" y1="125" x2="110" y2="44"/><polyline class="stroke" points="106,50 110,44 114,50"/>
    <text x="132" y="108" text-anchor="middle">1</text><text x="104" y="78" text-anchor="end">1</text>
    <text x="104" y="108" text-anchor="end">O</text>
    <circle cx="${px}" cy="${py}" r="3.6" fill="var(--brique)"/>
    <text x="${px-6}" y="${py-5}" text-anchor="end" fill="var(--brique)">${nom}</text></svg>`; },
  quadrillage:()=>`<svg viewBox="0 0 160 160" style="max-width:100%;height:auto;">
    <g class="grid">
      <line x1="30" y1="30" x2="30" y2="130"/><line x1="80" y1="30" x2="80" y2="130"/><line x1="130" y1="30" x2="130" y2="130"/>
      <line x1="30" y1="30" x2="130" y2="30"/><line x1="30" y1="80" x2="130" y2="80"/><line x1="30" y1="130" x2="130" y2="130"/></g>
    <g class="dot">
      <circle cx="30" cy="30" r="2.6"/><circle cx="80" cy="30" r="2.6"/><circle cx="130" cy="30" r="2.6"/>
      <circle cx="30" cy="80" r="2.6"/><circle cx="80" cy="80" r="2.6"/><circle cx="130" cy="80" r="2.6"/>
      <circle cx="30" cy="130" r="2.6"/><circle cx="80" cy="130" r="2.6"/><circle cx="130" cy="130" r="2.6"/></g>
    <text x="30" y="22" text-anchor="middle">A</text><text x="80" y="22" text-anchor="middle">D</text><text x="130" y="22" text-anchor="middle">G</text>
    <text x="22" y="84" text-anchor="end">B</text><text x="72" y="76" text-anchor="end">E</text><text x="138" y="84" text-anchor="start">H</text>
    <text x="22" y="134" text-anchor="end">C</text><text x="80" y="148" text-anchor="middle">F</text><text x="138" y="134" text-anchor="start">I</text></svg>`,
  scratch:(n=3,pas=10,angle=120)=>`<div class="scratch">
    <div class="sb ev">quand le drapeau cliqué</div>
    <div class="sb pen">stylo en position d'écriture</div>
    <div class="sb ctrl">répéter ${n} fois</div>
    <div class="cwrap">
      <div class="sb mot">avancer de ${pas} pas</div>
      <div class="sb mot">tourner &#8635; de ${angle}°</div>
    </div>
    <div class="sb foot"></div>
  </div>`,
  tableauProp:(a="6",b="18",c="12",d="a")=>`<svg viewBox="0 0 150 92" style="max-width:100%;height:auto;">
    <rect class="stroke" x="15" y="14" width="120" height="64" fill="none"/>
    <line class="stroke" x1="75" y1="14" x2="75" y2="78"/>
    <line class="stroke" x1="15" y1="46" x2="135" y2="46"/>
    <text x="45" y="37" text-anchor="middle">${a}</text><text x="105" y="37" text-anchor="middle">${b}</text>
    <text x="45" y="69" text-anchor="middle">${c}</text><text x="105" y="69" text-anchor="middle">${d}</text></svg>`,
  triangleAngles:(aF="65°",aE="70°")=>`<svg viewBox="0 0 170 150" style="max-width:100%;height:auto;">
    <polygon class="stroke" points="20,120 150,120 65,30"/>
    <polyline class="stroke" fill="none" points="40.0,120.0 39.2,114.5 37.0,109.5 33.5,105.2 28.9,102.1"/>
    <polyline class="stroke" fill="none" points="130.0,120.0 130.4,116.0 131.6,112.1 133.6,108.5 136.3,105.5"/>
    <polyline class="stroke" fill="none" points="76.0,41.6 72.0,44.4 67.3,45.8 62.5,45.8 57.8,44.3"/>
    <text x="45" y="108" text-anchor="middle">?</text>
    <text x="122" y="108" text-anchor="middle">${aE}</text>
    <text x="65" y="59" text-anchor="middle">${aF}</text>
    <text x="14" y="132" text-anchor="end">D</text><text x="156" y="132" text-anchor="start">E</text>
    <text x="65" y="24" text-anchor="middle">F</text></svg>`
};

/* ============================================================
   À PERSONNALISER — modifiez uniquement ce bloc pour une nouvelle feuille
   ============================================================ */
const TITRE     = "Le Starter";
const THEME     = "";   // n°1 : pas de thème précis
const NIVEAU    = "Quatrième";
const NUMERO    = "n°1";
const DUREE_MIN = 10;                          // durée par défaut (réglable via − / +)

const QUESTIONS = [
 { t:"Fractions",        e:"Écrire 0,75 sous la forme d'une fraction.", a:"FR(3,4) (ou FR(75,100))", d:"0,75 = 75/100 = 3/4" },
 { t:"Calcul littéral",  e:"Développer <var>x</var>(3<var>x</var> − 6).", a:"3<var>x</var><sup>2</sup> − 6<var>x</var>", d:"<var>x</var> × 3<var>x</var> − <var>x</var> × 6" },
 { t:"Nombres relatifs", e:"Calculer −12 + 9.", a:"−3", d:"On repère <span style='color:#c0392b'>−12</span> et <span style='color:#2b6cb0'>9</span>. 12 est plus grand que 9, donc son signe (le −) est celui du résultat. Ensuite les deux « se battent » : 12 − 9 = 3. Le résultat est −3." },
 { t:"Statistiques",     e:"Calculer la moyenne de la série : 7 ; 5 ; 3 ; 9.", a:"6", d:"(7 + 5 + 3 + 9) ÷ 4 = 24 ÷ 4" },
 { t:"Proportionnalité", e:"Dans ce tableau de proportionnalité, trouver <var>a</var>.", f:FIG.tableauProp("6","18","12","a"), a:"<var>a</var> = 36", d:"Par lignes : ×2 (12 = 2×6), donc a = 2×18 = 36. Par colonnes : ×3 (18 = 3×6), donc a = 3×12 = 36." },
 { t:"Pourcentage",      e:"Calculer 25 % de 300 élèves.", a:"75 élèves", d:"25 % = un quart : 300 ÷ 4" },
 { t:"Nombres décimaux", e:"Calculer 72 × 0,001.", a:"0,072", d:"× 0,001 revient à diviser par 1000 (on décale de 3 rangs)." },
 { t:"Scratch",          e:"Quelle figure ce programme trace-t-il ?", f:FIG.scratch(4,100,90), a:"Un carré", d:"4 côtés égaux et des angles de 90°" },
 { t:"Repérage",         e:"Donner les coordonnées du point A.", f:FIG.repere(3,-1,"A"), a:"A(3 ; −1)", d:"abscisse 3 ; ordonnée −1" },
 { t:"Angles",           e:"Calculer l'angle <var>FDE</var>.", f:FIG.triangleAngles("65°","70°"), a:"45°", d:"somme des angles : 180° − 65° − 70°" }
]
/* ============================================================ */

const Q = QUESTIONS;
function _fr(n,d){return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>';}
Q.forEach(q=>{ q.a = q.a.replace(/FR\(([^,]+),([^)]+)\)/g,(m,n,d)=>_fr(n.trim(),d.trim())); });

/* ---------- Construction des cartes ---------- */
const grid = document.getElementById('grid');
Q.forEach((q,i)=>{
  const c = document.createElement('div');
  c.className = 'card'; c.tabIndex = 0; c.dataset.i = i;
  c.setAttribute('role','button');
  c.setAttribute('aria-label','Question '+(i+1)+'. '+q.e.replace(/<[^>]+>/g,''));
  c.innerHTML =
    `<div class="top"><span class="num">${i+1}</span>${q.t?`<span class="tag">${q.t}</span>`:''}</div>
     <div class="enonce">${q.e}</div>
     ${q.f?`<div class="fig">${q.f}</div>`:''}
     <div class="foot"><div class="reveal">
        <span class="hint">Réponse cachée</span>
        <span class="answer"><span class="lab">Rép.</span><span>${q.a}</span>${q.d?`<span class="detail">${q.d}</span>`:''}</span>
     </div></div>`;
  c.addEventListener('click', ()=>toggle(i));
  c.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault(); toggle(i);} });
  grid.appendChild(c);
});
const cards = [...grid.children];
const TOTQ = cards.length;

/* ---------- Révélation ---------- */
const countEl = document.getElementById('count');
const runner  = document.getElementById('runner');
const fsRunner = document.getElementById('fsRunner');
function shown(){ return cards.filter(c=>c.classList.contains('done')).length; }
function refresh(){
  const n = shown();
  countEl.innerHTML = '<b>'+n+'</b> / '+TOTQ+' dévoilées';
}
function setDone(c,on,pop){
  c.classList.toggle('done',on);
  if(on && pop){ const a=c.querySelector('.answer'); a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop'); }
  refresh();
}
function toggle(i){ setDone(cards[i], !cards[i].classList.contains('done'), true); }

document.getElementById('next').addEventListener('click', ()=>{
  const c = cards.find(c=>!c.classList.contains('done'));
  if(!c) return;
  setDone(c,true,true);
  c.scrollIntoView({behavior:'smooth', block:'center'});
});
document.getElementById('all').addEventListener('click', ()=>{ cards.forEach(c=>setDone(c,true,false)); });
document.getElementById('reset').addEventListener('click', ()=>{ cards.forEach(c=>setDone(c,false,false)); });
refresh();

/* ---------- Chronomètre 6 min (partagé console + plein écran) ---------- */
let TOT = DUREE_MIN*60;
let left = TOT, timer = null;
const chrono  = document.getElementById('chrono');
const fsTime  = document.getElementById('fsTime');
const play    = document.getElementById('play');
const fsPlay  = document.getElementById('fsPlay');
function setPlayIcons(running){
  play.textContent   = running ? '⏸' : '▶';
  fsPlay.textContent = running ? '⏸ Pause' : '▶ Démarrer';
}
function paint(){
  const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0');
  const t = m+':'+s;
  chrono.textContent = t; fsTime.textContent = t;
  chrono.classList.toggle('fin', left===0);
  fsTime.classList.toggle('fin', left===0);
  const pct = ((TOT-left)/TOT*100)+'%';
  runner.style.left = pct;
  if(fsRunner) fsRunner.style.left = pct;
}
function tick(){ if(left>0){ left--; paint(); } else stop(); }
function start(){ if(timer) return; timer=setInterval(tick,1000); setPlayIcons(true); }
function stop(){ clearInterval(timer); timer=null; setPlayIcons(false); }
function togglePlay(){ timer ? stop() : (left>0 && start()); }
function rewind(){ stop(); left=TOT; paint(); }
play.addEventListener('click', togglePlay);
fsPlay.addEventListener('click', togglePlay);
document.getElementById('rewind').addEventListener('click', rewind);
fsRewind.addEventListener('click', rewind);
paint();

/* ---------- Application de la configuration + réglage de la durée ---------- */
let DUR = DUREE_MIN;
const durLbl = document.getElementById('durLbl');
const subEl  = document.getElementById('sub');
function fmtMS(min){ return String(min).padStart(2,'0')+':00'; }
function setDuree(min){
  DUR = Math.max(1, Math.min(30, min));
  TOT = DUR*60;
  durLbl.textContent = DUR+' min';
  document.getElementById('rewind').title = 'Remettre le chrono à '+DUR+' min';
  fsRewind.textContent = '↺ Remettre à '+fmtMS(DUR);
  subEl.innerHTML = Q.length+' questions, <b>'+DUR+' minutes</b>, sans calculatrice. '
                  + 'Lancez le chrono, puis dévoilez les réponses une à une pour la correction.';
  rewind();
}
document.getElementById('durMinus').addEventListener('click', ()=>setDuree(DUR-1));
document.getElementById('durPlus').addEventListener('click', ()=>setDuree(DUR+1));

(function applyConfig(){
  document.getElementById('eyebrow').textContent = 'Rituel de calcul mental · '+NIVEAU + (NUMERO ? ' · '+NUMERO : '');
  document.getElementById('title').innerHTML = TITRE;
  const th = document.getElementById('themeLine');
  if(THEME){ th.textContent = THEME; th.style.display=''; } else { th.style.display='none'; }
  const titrePlain = TITRE.replace(/<br\s*\/?>/gi,' ');
  document.getElementById('fsTitle').textContent = titrePlain;
  document.getElementById('footText').innerHTML = '<b>mathenlarge.fr</b> — '+titrePlain+' · '+NIVEAU+'.';
  document.title = titrePlain + (THEME? ' — '+THEME : '') + ' · '+NIVEAU;
  setDuree(DUREE_MIN);
})();

/* ---------- Plein écran du chrono ---------- */
const fsView = document.getElementById('fsView');
function enterFS(){
  fsView.classList.add('active');
  fsView.setAttribute('aria-hidden','false');
  if(fsView.requestFullscreen){ fsView.requestFullscreen().catch(()=>{}); }
}
function exitFS(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  fsView.classList.remove('active');
  fsView.setAttribute('aria-hidden','true');
}
document.getElementById('fs').addEventListener('click', enterFS);
document.getElementById('fsQuit').addEventListener('click', exitFS);
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){ fsView.classList.remove('active'); fsView.setAttribute('aria-hidden','true'); }
});

/* ---------- Thème ---------- */
const root=document.documentElement, themeBtn=document.getElementById('theme');
themeBtn.addEventListener('click', ()=>{
  const dark = root.getAttribute('data-theme')==='dark';
  root.setAttribute('data-theme', dark?'light':'dark');
  themeBtn.textContent = dark?'☾':'☀';
});
</script>
