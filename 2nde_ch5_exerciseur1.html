<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance entre deux points — Exerciseur interactif</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #eef2f7;
    --grid: #d5dce6;
    --card: #fff;
    --blue: #1a6fa0;
    --blue-light: #2d8dc7;
    --blue-pale: rgba(26, 111, 160, 0.08);
    --blue-border: rgba(26, 111, 160, 0.2);
    --purple: #6b3fa0;
    --purple-light: #8b5fc8;
    --purple-pale: rgba(107, 63, 160, 0.1);
    --orange: #b85c0b;
    --orange-pale: rgba(184, 92, 11, 0.1);
    --orange-border: rgba(184, 92, 11, 0.25);
    --green: #1b7a40;
    --green-pale: rgba(27, 122, 64, 0.1);
    --red: #c0392b;
    --red-pale: rgba(192, 57, 43, 0.08);
    --teal: #0d9488;
    --teal-pale: rgba(13, 148, 136, 0.1);
    --gold: #b8860b;
    --gold-pale: rgba(184, 134, 11, 0.12);
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(30, 41, 59, 0.08);
}

body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    justify-content: center;
    padding: 16px 10px 60px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
}

.app { max-width: 900px; width: 100%; }

.app-header {
    background: linear-gradient(135deg, #0c1624 0%, #162236 45%, #1c3358 100%);
    color: #fff;
    padding: 18px 24px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(12, 22, 36, 0.4);
    position: relative;
    overflow: hidden;
}

.app-header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 50%);
    pointer-events: none;
}

.app-header-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--purple), var(--green));
}

.app-title {
    font-size: 1.25em;
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.app-title::before { content: '📐'; font-size: 1.15em; }

.main {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 28px var(--shadow);
    min-height: 60vh;
}

.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
}

h1 {
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: var(--blue);
}

.sub {
    text-align: center;
    font-size: 0.92em;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
}

/* ── BUTTONS ── */
.btn {
    font-family: 'DM Sans', sans-serif;
    padding: 11px 26px;
    border-radius: 12px;
    font-size: 0.93em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
}

.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-blue { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 2px 12px rgba(26,111,160,0.2); }
.btn-blue:hover:not(:disabled) { background: var(--blue-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(26,111,160,0.3); }

.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }

.btn-ghost { background: transparent; color: var(--text-light); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text-light); }

.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

/* ── MENU ── */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin: 20px 0;
}

.mc {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mc:hover { border-color: var(--blue); transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
.mc-icon { font-size: 2.4em; margin-bottom: 10px; }
.mc-t { font-size: 0.92em; color: var(--blue); font-weight: 700; margin-bottom: 6px; }
.mc-d { font-size: 0.78em; color: var(--text-light); line-height: 1.5; }
.mc-badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--orange-pale); color: var(--orange);
    font-size: 0.68em; font-weight: 700; padding: 3px 10px; border-radius: 12px;
}

/* ── EX HEADER ── */
.ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.ex-badge { background: var(--blue-pale); color: var(--blue); padding: 6px 16px; border-radius: 20px; font-size: 0.84em; font-weight: 700; }
.ex-score { font-size: 0.88em; color: var(--text-light); font-weight: 600; }

/* ── MODE TOGGLE ── */
.mode-toggle {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    font-size: 0.78em;
    font-weight: 700;
}
.mode-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 1em;
    font-weight: 700;
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    min-height: 36px;
}
.mode-btn.active {
    background: var(--blue);
    color: #fff;
    border-radius: 16px;
}
.mode-btn:hover:not(.active) { background: var(--blue-pale); color: var(--blue); }

.pbar { width: 100%; background: var(--border); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 20px; }
.pfill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 6px; transition: width 0.4s; }

/* ── CONTEXT CARD ── */
.ctx-card {
    background: linear-gradient(135deg, #f5f9ff, #eff4ff);
    border: 1.5px solid #c5d8f0;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.93em;
    line-height: 1.7;
}

.ctx-card .ctx-label {
    font-size: 0.68em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--blue); margin-bottom: 6px; display: block;
}

/* ── FORMULA REMINDER ── */
.formula-remind {
    background: var(--gold-pale);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.84em;
    color: #7a5800;
    margin: 0 0 18px;
    text-align: center;
    line-height: 1.8;
}

/* ── QUESTION BLOCK ── */
.q-prompt {
    font-size: 1.0em;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.6;
    text-align: center;
}

/* ── INPUT FIELD ── */
.answer-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0;
}

.answer-unit {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--text-light);
}

.answer-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    width: 160px;
    padding: 10px 12px;
    text-align: center;
    border: 3px dashed var(--purple);
    border-radius: 12px;
    background: white;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
}

.answer-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-pale); }
.answer-input.ok { border-color: var(--green); background: var(--green-pale); color: var(--green); }
.answer-input.err { border-color: var(--red); background: var(--red-pale); animation: shake 0.3s; }

.answer-input.wide { width: 220px; }
.answer-input.narrow { width: 110px; }
.answer-input.xnarrow { width: 90px; }

/* ── MULTI-INPUT ROW ── */
.row-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0;
}

.row-label {
    font-size: 0.88em; font-weight: 600; color: var(--text-light);
}

/* ── CHOICE BUTTONS (nature du triangle) ── */
.choice-grid {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 18px 0;
}

.choice-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92em;
    font-weight: 700;
    padding: 12px 20px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 130px;
    text-align: center;
}

.choice-btn:hover { border-color: var(--blue); transform: translateY(-2px); }
.choice-btn.chosen { background: var(--purple-pale); border-color: var(--purple); color: var(--purple); }
.choice-btn.ok { background: var(--green-pale); border-color: var(--green); color: var(--green); }
.choice-btn.err { background: var(--red-pale); border-color: var(--red); color: var(--red); animation: shake 0.3s; }
.choice-btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

/* ── CALCULATOR ── */
.calc-toggle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--text-light);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    margin: 0 auto 12px;
    display: block;
    transition: all 0.2s;
}
.calc-toggle:hover { background: var(--bg); border-color: var(--text-light); }
.calc-container { display: none; }
.calc-container.visible { display: block; }

/* Corps Casio */
.calc-wrap {
    background: #2b2f3a;
    border-radius: 18px;
    padding: 14px 14px 16px;
    max-width: 360px;
    margin: 0 auto 20px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.06);
    border: 1.5px solid #1a1d26;
}

/* Écran LCD style Casio : une seule ligne qui scroll */
.calc-screen {
    background: #c8d9a0;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.08);
    border: 2px solid #8a9e60;
    position: relative;
    overflow: hidden;
}

/* Ligne "résultat précédent / historique" — petite, en haut */
.calc-history {
    font-family: 'Courier New', monospace;
    font-size: 0.72em;
    color: #4a5a2a;
    text-align: right;
    min-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    letter-spacing: 0.02em;
    opacity: 0.75;
}

/* Ligne principale : expression en cours de saisie, scroll horizontal */
.calc-expr-line {
    font-family: 'Courier New', monospace;
    font-size: 1.35em;
    font-weight: 700;
    color: #1a2a05;
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: visible;
    scrollbar-width: none;
    min-height: 38px;
    line-height: 1.6;
    letter-spacing: 0.03em;
    padding-top: 6px;
}
.calc-expr-line::-webkit-scrollbar { display: none; }

/* Radical style Casio : barre horizontale au-dessus du contenu */
.rad-wrap {
    display: inline-flex;
    align-items: flex-end;
    vertical-align: middle;
    position: relative;
    margin: 0 1px;
}
/* Le crochet √ à gauche */
.rad-hook {
    font-size: 1.18em;
    line-height: 1;
    color: #1a2a05;
    margin-right: 1px;
    position: relative;
    top: 1px;
}
/* Le contenu sous la barre */
.rad-content {
    display: inline-block;
    border-top: 2px solid #1a2a05;
    padding: 1px 3px 0 2px;
    min-width: 4px;
    line-height: 1.2;
    vertical-align: middle;
}

/* Grille de touches 5 colonnes */
.calc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.calc-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88em;
    font-weight: 700;
    padding: 0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.1s, transform 0.1s;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    position: relative;
    box-shadow: 0 3px 0 rgba(0,0,0,0.45);
    line-height: 1.1;
}
.calc-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.45); }
.calc-btn:hover { filter: brightness(1.12); }

/* Étiquette secondaire (shift) au-dessus — petite */
.calc-btn-top {
    font-size: 0.62em;
    font-weight: 600;
    opacity: 0.65;
    color: #fde68a;
    letter-spacing: 0.02em;
    height: 11px;
}
.calc-btn-main { font-size: 1em; }

/* Couleurs des touches */
.calc-num  { background: #3d4355; color: #f1f5f9; }
.calc-op   { background: #1a4a7a; color: #e0f0ff; }
.calc-fn   { background: #2e3545; color: #94a3b8; } /* fonctions grises */
.calc-eq   { background: #15623a; color: #d1fae5; }
.calc-ac   { background: #7f1d1d; color: #fecaca; }
.calc-del  { background: #4c1d95; color: #ddd6fe; }
.calc-shift { background: #78350f; color: #fef3c7; font-size: 0.78em; }

/* ── STEP BLOCKS ── */
.step-block { margin-bottom: 18px; padding-bottom: 14px; }
.step-block.locked { opacity: 0.88; }
.step-block.locked .answer-input { pointer-events: none; }
.step-block.locked .choice-btn { pointer-events: none; }

.step-divider { border: none; border-top: 1.5px dashed var(--border); margin: 4px auto 18px; max-width: 500px; }

.step-tag {
    display: inline-block;
    font-size: 0.72em; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text-light);
    text-align: center; width: 100%; margin-bottom: 8px;
}

.step-tag.locked-tag { color: var(--green); }
.step-tag.locked-tag::before { content: '✓  '; }

/* ── RÉSULTAT INTERMÉDIAIRE (valeur locked) ── */
.locked-val {
    display: inline-block;
    background: var(--green-pale);
    color: var(--green);
    border: 1.5px solid rgba(27,122,64,0.3);
    border-radius: 8px;
    padding: 4px 12px;
    font-weight: 700;
    font-size: 0.95em;
    margin: 2px 4px;
}

/* ── FEEDBACK ── */
.fb {
    margin-top: 20px; padding: 14px 18px; border-radius: 12px;
    font-size: 0.93em; text-align: center; display: none;
    animation: fadeIn 0.3s; font-weight: 600; line-height: 1.7;
}
.fb.ok  { display: block; background: var(--green-pale); color: var(--green); border: 2px solid rgba(27,122,64,0.2); }
.fb.bad { display: block; background: var(--red-pale);   color: var(--red);   border: 2px solid rgba(192,57,43,0.15); }

/* ── RESULTS ── */
.rc {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 20px auto; border: 6px solid;
}
.rc.good { border-color: var(--green); background: var(--green-pale); }
.rc.mid  { border-color: var(--orange); background: var(--orange-pale); }
.rc.bad  { border-color: var(--red); background: var(--red-pale); }
.rp { font-size: 2.2em; font-weight: 700; line-height: 1; }
.rm { font-size: 1.05em; text-align: center; margin: 16px 0; line-height: 1.5; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

@media (max-width: 640px) {
    .app-header { padding: 14px 18px; }
    .app-title { font-size: 1.05em; }
    .main { padding: 22px 16px; }
    h1 { font-size: 1.25em; }
    .menu-grid { grid-template-columns: 1fr; }
    .answer-input { width: 130px; font-size: 1.1em; }
    .choice-btn { min-width: 110px; padding: 10px 12px; font-size: 0.85em; }
}
/* -- Floating menu button -- */
.menu-btn{position:fixed;bottom:1.5rem;left:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue));color:white;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(26,111,160,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease,box-shadow 0.2s ease;text-decoration:none;}
.menu-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(26,111,160,0.5);}

/* ══ RESPONSIVE ENHANCEMENTS ══ */
/* ── 900px tablette ── */
@media(max-width:900px){
  .app { padding:0 12px; }
  .main { padding:12px; }
}
/* ── 380px petit écran ── */
@media(max-width:380px){
  body { font-size:13px; }
  .app { padding:0 6px; }
  .app-header { padding:8px 10px; }
  .app-header-bar { flex-wrap:wrap; gap:4px; }
  .app-title { font-size:1rem; }
  .mc { padding:10px; }
  .mc-t { font-size:0.9rem; }
  .mc-d { font-size:0.82rem; }
  .mc-badge, .ex-badge { font-size:0.7rem; }
  .main { padding:8px; }
  .btn, .btn-blue, .btn-ghost, .btn-green { font-size:0.82rem; padding:7px 12px; }
  .controls { flex-wrap:wrap; gap:6px; }
  .choice-btn, .choice-grid .btn { font-size:0.85rem; padding:8px; }
  .choice-grid { gap:6px; }
  .q-prompt { font-size:0.9rem; }
  .screen { font-size:0.85rem; padding:10px; }
  .step-block { padding:8px; }
  .step-tag { font-size:0.75rem; }
  .fb { font-size:0.85rem; padding:8px; }
  .formula-remind, .formula-box { font-size:0.85rem; padding:8px; overflow-x:auto; }
  .ctx-card { padding:8px; font-size:0.85rem; }
  .answer-input, .ans-input { font-size:0.9rem; }
  .answer-wrap, .row-inputs { flex-wrap:wrap; gap:6px; }
  .pbar { height:6px; }
  .mode-toggle, .mode-btn { font-size:0.8rem; }
  .menu-btn { font-size:0.8rem; }
  .ex-top { flex-wrap:wrap; gap:4px; }
  .ex-score { font-size:0.8rem; }
}
/* ── overflow helpers ── */
.katex-display, .katex { overflow-x:auto; overflow-y:hidden; max-width:100%; }
svg[viewBox] { max-width:100%; height:auto; }
.mc, .screen, .step-block { overflow-wrap:break-word; word-break:break-word; }

</style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <div class="app-title">Distance entre deux points — Repère orthonormé</div>
        <div class="app-header-bar"></div>
    </div>
    <div class="main">

        <!-- MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Choisis un exercice</h1>
            <p class="sub">Deux niveaux pour maîtriser la formule de la distance dans un repère orthonormé.</p>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- EXERCISE -->
        <div id="screen-ex" class="screen">
            <div class="ex-top">
                <span class="ex-badge" id="exBadge">Thème</span>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btnGuided" onclick="setMode(true)">🧭 Guidé</button>
                    <button class="mode-btn" id="btnFast" onclick="setMode(false)">⚡ Rapide</button>
                </div>
                <span class="ex-score" id="exScore">Question 1/8</span>
            </div>
            <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
            <div id="exBody"></div>
            <div class="fb" id="fb"></div>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu">← Menu</button>
                <button class="btn btn-blue" id="btnCheck">Vérifier</button>
                <button class="btn btn-green" id="btnNext" style="display:none">Suivant →</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="screen-res" class="screen">
            <h1>Résultats</h1>
            <div class="rc" id="rc"><div class="rp" id="rp">0%</div></div>
            <p class="rm" id="rm"></p>
            <div class="controls">
                <button class="btn btn-ghost" id="btnMenu2">← Menu</button>
                <button class="btn btn-blue" id="btnRetry">Recommencer</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ==========================================================
   CONFIG NIVEAUX
   ========================================================== */
const LEVELS = [
    {
        id: 'distance2',
        icon: '📏',
        title: 'Distance entre deux points',
        desc: 'Applique pas à pas la formule \u00e0 partir des coordonn\u00e9es de A et B',
        n: 10,
        badge: 'Calculatrice'
    },
    {
        id: 'triangle',
        icon: '🔺',
        title: 'Nature d\u2019un triangle',
        desc: 'Calcule les trois distances puis identifie la nature du triangle',
        n: 8,
        badge: 'Calculatrice'
    },
];

let state = { levelId: null, qIndex: 0, total: 0, score: 0, questions: [], checked: false, guided: true };

/* ==========================================================
   UTILS
   ========================================================== */
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function normNum(str) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(',', '.').replace(/\s+/g, '');
    if (s === '') return null;
    s = s.replace(/\u2212/g, '-').replace(/÷/g, '/');
    if (s.includes('/')) {
        const [n, d] = s.split('/').map(Number);
        if (isNaN(n) || isNaN(d) || d === 0) return null;
        return n / d;
    }
    const v = parseFloat(s);
    return isNaN(v) ? null : v;
}

function close(a, b, eps = 1e-6) { return Math.abs(a - b) < eps; }
function closeRel(a, b, eps = 1e-4) {
    if (Math.abs(b) < 1e-10) return Math.abs(a) < eps;
    return Math.abs((a - b) / b) < eps;
}
// Tolérance : accepte arrondi au dixième OU à l'unité (±0,5)
function closeTenth(a, b) { return Math.abs(a - b) < 0.505; }

function round2(x) { return Math.round(x * 100) / 100; }
function round4(x) { return Math.round(x * 10000) / 10000; }

function fmt(x) {
    const r = round2(x);
    return r % 1 === 0 ? String(r) : String(r).replace('.', ',');
}

/* Formatage d'une coordonnée avec signe pour affichage */
function fmtCoord(v) {
    return v < 0 ? String(v) : String(v);
}

/* Formatage d'un résultat sous forme radicale simplifiée — retourne { decimal, texKatex, texHtml } */
function simplifyRoot(n) {
    // n doit être un entier positif (AB² avant racine)
    if (n === 0) return { decimal: 0, katex: '0', html: '0' };
    // cherche le plus grand carré parfait diviseur
    let outside = 1;
    let inside = n;
    for (let k = Math.floor(Math.sqrt(n)); k >= 2; k--) {
        if (n % (k * k) === 0) {
            outside = k;
            inside = n / (k * k);
            break;
        }
    }
    const decimal = round4(Math.sqrt(n));
    if (inside === 1) {
        return { decimal, katex: `${outside}`, html: `${outside}` };
    }
    if (outside === 1) {
        return { decimal, katex: `\\sqrt{${inside}}`, html: `&radic;${inside}` };
    }
    return { decimal, katex: `${outside}\\sqrt{${inside}}`, html: `${outside}&radic;${inside}` };
}

/* Génère un point aléatoire avec coordonnées dans [-5, 5] */
function randPt(exclude) {
    let x, y;
    let tries = 0;
    do {
        x = rnd(-5, 5);
        y = rnd(-5, 5);
        tries++;
    } while (
        tries < 50 &&
        exclude && exclude.some(p => p.x === x && p.y === y)
    );
    return { x, y };
}

/* Calcule AB² (entier) */
function dist2(A, B) {
    return (B.x - A.x) ** 2 + (B.y - A.y) ** 2;
}

/* ==========================================================
   NAVIGATION
   ========================================================== */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    LEVELS.forEach(lv => {
        const el = document.createElement('div');
        el.className = 'mc';
        el.innerHTML = `
            ${lv.badge ? `<div class="mc-badge">${lv.badge}</div>` : ''}
            <div class="mc-icon">${lv.icon}</div>
            <div class="mc-t">${lv.title}</div>
            <div class="mc-d">${lv.desc}</div>
        `;
        el.addEventListener('click', () => startLevel(lv.id));
        grid.appendChild(el);
    });
}

document.getElementById('btnMenu').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnMenu2').addEventListener('click', () => showScreen('screen-menu'));
document.getElementById('btnRetry').addEventListener('click', () => startLevel(state.levelId));

function setMode(guided) {
    state.guided = guided;
    document.getElementById('btnGuided').classList.toggle('active', guided);
    document.getElementById('btnFast').classList.toggle('active', !guided);
    // Relance la question courante dans le nouveau mode
    if (document.getElementById('screen-ex').classList.contains('active')) {
        renderQuestion();
    }
}

buildMenu();

function renderKatex(el) {
    if (window.renderMathInElement) {
        renderMathInElement(el || document.body, {
            delimiters: [
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true },
            ],
            throwOnError: false
        });
    }
}

/* ==========================================================
   MOTEUR GÉNÉRIQUE
   ========================================================== */
const GENERATORS = {};
const RENDERERS  = {};
const CHECKERS   = {};

function startLevel(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    state.levelId = levelId;
    state.qIndex  = 0;
    state.score   = 0;
    state.total   = lv.n;
    state.questions = [];
    for (let i = 0; i < lv.n; i++) state.questions.push(GENERATORS[levelId]());
    document.getElementById('exBadge').textContent = lv.title;
    showScreen('screen-ex');
    renderQuestion();
}

function renderQuestion() {
    state.checked  = false;
    state.attempts = 0;
    const lv = LEVELS.find(l => l.id === state.levelId);
    document.getElementById('exScore').textContent = `Question ${state.qIndex + 1}/${state.total}`;
    document.getElementById('pfill').style.width = (state.qIndex / state.total * 100) + '%';
    const body = document.getElementById('exBody');
    body.innerHTML = '';
    const fb = document.getElementById('fb');
    fb.className = 'fb'; fb.textContent = '';
    document.getElementById('btnCheck').style.display = '';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnNext').style.display = 'none';
    RENDERERS[state.levelId](state.questions[state.qIndex], body);
    renderKatex(body);
}

document.getElementById('btnCheck').addEventListener('click', () => {
    if (state.checked) return;
    const q = state.questions[state.qIndex];
    const result = CHECKERS[state.levelId](q);
    const fb = document.getElementById('fb');
    if (result.ok) {
        fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + (result.msg || 'Exact, bien joué\u00a0!');
        renderKatex(fb);
        if (result.advanceOnly) {
            setTimeout(() => { fb.className = 'fb'; fb.textContent = ''; }, 1500);
            document.getElementById('btnNext').style.display = 'none';
            return;
        }
        state.checked = true;
        state.score++;
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnNext').style.display = '';
    } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ ' + (result.msg || 'Ce n\'est pas encore ça, réessaie.');
        renderKatex(fb);
        document.getElementById('btnNext').style.display = '';
    }
});

document.getElementById('btnNext').addEventListener('click', () => {
    state.qIndex++;
    if (state.qIndex >= state.total) showResults();
    else renderQuestion();
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const exScreen = document.getElementById('screen-ex');
    if (!exScreen.classList.contains('active')) return;
    e.preventDefault();
    const btnNext  = document.getElementById('btnNext');
    const btnCheck = document.getElementById('btnCheck');
    if (btnNext.style.display !== 'none' && btnNext.offsetParent) btnNext.click();
    else if (btnCheck.style.display !== 'none' && !btnCheck.disabled) btnCheck.click();
});

function showResults() {
    document.getElementById('pfill').style.width = '100%';
    const pct = Math.round(state.score / state.total * 100);
    const rc = document.getElementById('rc');
    rc.className = 'rc ' + (pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad');
    document.getElementById('rp').textContent = pct + '%';
    let msg;
    if (pct >= 80) msg = `Excellent\u00a0! ${state.score}/${state.total} bonnes réponses. Tu maîtrises ce thème.`;
    else if (pct >= 50) msg = `${state.score}/${state.total} bonnes réponses. C'est en bonne voie, encore un peu d'entraînement\u00a0!`;
    else msg = `${state.score}/${state.total} bonnes réponses. Reprends la leçon et réessaie, tu vas progresser.`;
    document.getElementById('rm').textContent = msg;
    showScreen('screen-res');
}

/* ==========================================================
   CALCULATRICE STYLE CASIO
   ========================================================== */

/* Helper : une touche avec étiquette shift optionnelle */
function cBtn(id, key, label, cls, shiftLabel) {
    const top = shiftLabel
        ? `<span class="calc-btn-top">${shiftLabel}</span>`
        : `<span class="calc-btn-top"></span>`;
    return `<button class="calc-btn ${cls}" onclick="cCalc('${id}','${key}')">${top}<span class="calc-btn-main">${label}</span></button>`;
}

function calcHTML(id) {
    const b = (key, label, cls, sh) => cBtn(id, key, label, cls, sh);
    return `
    <button class="calc-toggle" id="calc-toggle-${id}" onclick="toggleCalc('${id}')">🔢 Afficher la calculatrice</button>
    <div class="calc-container" id="calc-${id}">
      <div class="calc-wrap">

        <!-- Écran LCD -->
        <div class="calc-screen">
          <div class="calc-history" id="calc-hist-${id}"></div>
          <div class="calc-expr-line" id="calc-expr-${id}">0</div>
        </div>

        <!-- Clavier 5 colonnes -->
        <div class="calc-grid">

          <!-- Ligne 1 : fonctions -->
          ${b('√','√','√','calc-fn','√')}
          ${b('x²','x²','x²','calc-fn','²')}
          ${b('(','(','(','calc-fn','')}
          ${b(')',')',')','calc-fn','')}
          ${b('AC','AC','AC','calc-ac','')}

          <!-- Ligne 2 : 7 8 9 ÷ DEL -->
          ${b('7','7','7','calc-num','')}
          ${b('8','8','8','calc-num','')}
          ${b('9','9','9','calc-num','')}
          ${b('÷','÷','÷','calc-op','')}
          ${b('⌫','⌫','⌫','calc-del','')}

          <!-- Ligne 3 : 4 5 6 × -->
          ${b('4','4','4','calc-num','')}
          ${b('5','5','5','calc-num','')}
          ${b('6','6','6','calc-num','')}
          ${b('×','×','×','calc-op','')}
          ${b('^','^','xⁿ','calc-fn','')}

          <!-- Ligne 4 : 1 2 3 − -->
          ${b('1','1','1','calc-num','')}
          ${b('2','2','2','calc-num','')}
          ${b('3','3','3','calc-num','')}
          ${b('−','−','−','calc-op','')}
          ${b('(-)','(-)','(−)','calc-fn','')}

          <!-- Ligne 5 : 0 . + = -->
          ${b('0','0','0','calc-num','')}
          ${b('.','.',',','calc-num','')}
          ${b('00','00','00','calc-num','')}
          ${b('+','+','+','calc-op','')}
          ${b('=','=','=','calc-eq','')}

        </div>
      </div>
    </div>`;
}

const calcState = {};

function toggleCalc(id) {
    const c = document.getElementById('calc-' + id);
    const btn = document.getElementById('calc-toggle-' + id);
    const visible = c.classList.toggle('visible');
    btn.textContent = visible ? '🔢 Masquer la calculatrice' : '🔢 Afficher la calculatrice';
    if (!calcState[id]) calcState[id] = { expr: '', history: '', afterEq: false };
}

/* Évalue une expression affichée (symboles visuels → JS)
   √ prend TOUT ce qui suit jusqu'à la fin (comme Casio fx-92). */
function evalExpr(expr) {
    // Remplacements symboles → JS d'abord
    let e = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/,/g, '.')
        .replace(/²/g, '**2')
        .replace(/\^/g, '**');
    // Puis wrap √<reste> en Math.sqrt(<reste>)
    if (e.includes('√')) {
        const idx = e.indexOf('√');
        const before = e.slice(0, idx);
        const after  = e.slice(idx + 1);
        e = before + 'Math.sqrt(' + after + ')';
    }
    return Function('"use strict"; return (' + e + ')')();
}

/* Convertit l'expression texte en HTML avec radical visuel.
   √ englobe tout le reste de l'expression (barre extensible). */
function exprToHTML(expr) {
    const sqIdx = expr.indexOf('√');
    if (sqIdx === -1) {
        return escHTML(expr) || '0';
    }
    const before = expr.slice(0, sqIdx);
    const inner  = expr.slice(sqIdx + 1);   // tout ce qui suit √
    const beforeHTML = escHTML(before);
    const innerHTML  = escHTML(inner);
    return (beforeHTML
        + `<span class="rad-wrap"><span class="rad-hook">√</span><span class="rad-content">${innerHTML}</span></span>`)
        || '0';
}

function escHTML(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Met à jour l'affichage écran */
function calcRedraw(id) {
    const s = calcState[id];
    const exprEl = document.getElementById('calc-expr-' + id);
    const histEl = document.getElementById('calc-hist-' + id);
    exprEl.innerHTML = exprToHTML(s.expr);
    histEl.textContent = s.history;
    // Scroll à droite pour voir la fin de l'expression
    exprEl.scrollLeft = exprEl.scrollWidth;
}

function cCalc(id, key) {
    if (!calcState[id]) calcState[id] = { expr: '', history: '', afterEq: false };
    const s = calcState[id];

    /* ── AC : tout effacer ── */
    if (key === 'AC') {
        s.expr = '';
        s.history = '';
        s.afterEq = false;
        calcRedraw(id);
        return;
    }

    /* ── ⌫ : supprimer dernier caractère ── */
    if (key === '⌫') {
        if (s.afterEq) { s.expr = ''; s.afterEq = false; }
        else {
            // Supprime dernier token multi-char (√, ², 00) ou un char simple
            s.expr = s.expr.replace(/√$|²$|\^\s*$|00$|,$/, '') || s.expr.slice(0, -1);
        }
        calcRedraw(id);
        return;
    }

    /* ── = : évaluer ── */
    if (key === '=') {
        if (!s.expr) { calcRedraw(id); return; }
        try {
            const val = evalExpr(s.expr);
            const res = isFinite(val)
                ? (Number.isInteger(val) ? String(val) : String(round4(val)).replace('.', ','))
                : 'Erreur';
            s.history = s.expr + ' =';
            s.expr = res;
            s.afterEq = true;
        } catch {
            s.history = s.expr + ' =';
            s.expr = 'Erreur';
            s.afterEq = true;
        }
        calcRedraw(id);
        return;
    }

    /* ── Après un = : comportement contextuel ── */
    if (s.afterEq) {
        // Si on tape un opérateur, on enchaîne sur le résultat
        if (['+', '−', '×', '÷', '^'].includes(key)) {
            s.afterEq = false;
            // s.expr contient déjà le résultat, on ajoute l'opérateur
        } else {
            // Nouveau calcul : on repart de zéro
            s.history = '';
            s.expr = '';
            s.afterEq = false;
        }
    }

    /* ── Saisie normale ── */
    switch (key) {
        case '√':    s.expr += '√';   break;
        case 'x²':   s.expr += '²';   break;
        case '^':    s.expr += '^';   break;
        case '(-)':
            // Insère un moins unaire
            if (!s.expr || /[+−×÷(^]$/.test(s.expr)) s.expr += '−';
            else s.expr = '−(' + s.expr + ')';
            break;
        case '00':   s.expr += '00';  break;
        case '.':
            // N'ajoute une virgule que si le nombre courant n'en a pas déjà une
            if (!/[,]\d*$/.test(s.expr)) s.expr += ',';
            break;
        default:
            s.expr += key;
    }

    calcRedraw(id);
}

/* ==========================================================
   UTILITAIRES STEPS
   ========================================================== */
function lockStep(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('locked');
    const tag = el.querySelector('.step-tag');
    if (tag) tag.classList.add('locked-tag');
    el.querySelectorAll('input').forEach(i => i.disabled = true);
    el.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
}

function insertStep(html, beforeSelector) {
    const box = document.getElementById('exBody');
    const anchor = box.querySelector(beforeSelector);
    const hr = document.createElement('hr');
    hr.className = 'step-divider';
    box.insertBefore(hr, anchor);
    const div = document.createElement('div');
    div.innerHTML = html;
    const node = div.firstElementChild;
    box.insertBefore(node, anchor);
    renderKatex(node);
    // focus premier input du nouveau step
    setTimeout(() => node.querySelector('input')?.focus(), 50);
    return node;
}

/* Affiche un point sous la forme A(x ; y) en KaTeX */
function ptKatex(name, pt) {
    const xs = fmtCoord(pt.x);
    const ys = fmtCoord(pt.y);
    return `\\(${name}(${xs}\\,;\\,${ys})\\)`;
}

/* Affiche une soustraction proprement (parenthèses si négatif) */
function diffStr(a, b) {
    // retourne la chaîne (a) - (b) ou a - (b) etc.
    const bs = b < 0 ? `(${b})` : `${b}`;
    return `${a} - ${bs}`;
}

/* ==========================================================
   NIVEAU 1 : DISTANCE ENTRE DEUX POINTS
   ========================================================== */
GENERATORS.distance2 = function () {
    let A, B, d2;
    do {
        A = randPt();
        B = randPt([A]);
        d2 = dist2(A, B);
    } while (d2 === 0 || d2 > 100); // garde des distances raisonnables
    const root = simplifyRoot(d2);
    return { A, B, d2, root };
};

RENDERERS.distance2 = function (q, box) {
    const { A, B } = q;
    if (!state.guided) {
        // ── MODE RAPIDE ──
        box.innerHTML = `
            <div class="formula-remind">
                Formule : \\(AB = \\sqrt{(x_B - x_A)^2 + (y_B - y_A)^2}\\)
            </div>
            <div class="ctx-card">
                <span class="ctx-label">📝 Énoncé</span>
                Dans un repère orthonormé, on donne ${ptKatex('A', A)} et ${ptKatex('B', B)}.<br>
                Calcule la distance \\(AB\\).
            </div>
            <div class="step-block active" id="step0">
                <div class="step-tag">Résultat</div>
                <div class="answer-wrap">
                    <span class="row-label">\\(AB =\\)</span>
                    <input type="text" class="answer-input" id="abval" placeholder="…" inputmode="decimal">
                </div>
                <p style="font-size:0.78em;color:var(--text-light);text-align:center;margin-top:6px;">
                    Valeur exacte ou approchée (ex. <em>5</em> ou <em>7,21</em>).
                </p>
            </div>
            ${calcHTML('d2')}`;
        setTimeout(() => document.getElementById('abval')?.focus(), 50);
        return;
    }
    // ── MODE GUIDÉ ──
    box.innerHTML = `
        <div class="formula-remind">
            Formule : \\(AB = \\sqrt{(x_B - x_A)^2 + (y_B - y_A)^2}\\)
        </div>
        <div class="ctx-card">
            <span class="ctx-label">📝 Énoncé</span>
            Dans un repère orthonormé, on donne ${ptKatex('A', A)} et ${ptKatex('B', B)}.<br>
            Calcule la distance \\(AB\\).
        </div>

        <!-- Étape 1 : écarts -->
        <div class="step-block active" id="step0">
            <div class="step-tag">Étape 1 · Calcule les écarts en x et en y</div>
            <div class="row-inputs">
                <span class="row-label">\\(x_B - x_A\\) =</span>
                <input type="text" class="answer-input narrow" id="dx" placeholder="…" inputmode="decimal">
            </div>
            <div class="row-inputs">
                <span class="row-label">\\(y_B - y_A\\) =</span>
                <input type="text" class="answer-input narrow" id="dy" placeholder="…" inputmode="decimal">
            </div>
        </div>
        ${calcHTML('d2')}
    `;
    setTimeout(() => document.getElementById('dx')?.focus(), 50);
};

CHECKERS.distance2 = function (q) {
    const box = document.getElementById('exBody');
    const { A, B, d2, root } = q;
    const dx = B.x - A.x;
    const dy = B.y - A.y;
    const calcAnchor = '.calc-toggle';
    const approxStr = String(round2(root.decimal)).replace('.', ',');
    const katexResult = (root.katex.includes('\\sqrt'))
        ? `\\(AB = ${root.katex} \\approx ${approxStr}\\)`
        : `\\(AB = ${root.katex}\\)`;

    // ── MODE RAPIDE ──
    if (!state.guided) {
        const iab = document.getElementById('abval');
        const vab = normNum(iab.value);
        iab.classList.remove('ok','err');
        const ok = vab !== null && closeTenth(vab, root.decimal);
        iab.classList.add(ok ? 'ok' : 'err');
        if (ok) return { ok: true, msg: `Bravo\u00a0! ${katexResult}` };
        return { ok: false, msg: `${katexResult}.` };
    }

    // ── MODE GUIDÉ ──
    const stepsDone = box.querySelectorAll('.step-block.locked').length;

    /* ── Étape 1 : écarts ── */
    if (stepsDone === 0) {
        const idx = document.getElementById('dx');
        const idy = document.getElementById('dy');
        const vx = normNum(idx.value);
        const vy = normNum(idy.value);
        const okX = vx !== null && close(vx, dx, 0.01);
        const okY = vy !== null && close(vy, dy, 0.01);
        [idx, idy].forEach((el, i) => { el.classList.remove('ok','err'); el.classList.add([okX,okY][i] ? 'ok' : 'err'); });
        if (okX && okY) {
            lockStep('step0');

    /* ── Étape 2 : carrés ── */
    if (stepsDone === 1) {
        const dx2 = dx * dx;
        const dy2 = dy * dy;
        const idx2 = document.getElementById('dx2');
        const idy2 = document.getElementById('dy2');
        const vx2 = normNum(idx2.value);
        const vy2 = normNum(idy2.value);
        const okX2 = vx2 !== null && close(vx2, dx2, 0.01);

        if (!okX2) hint += `\\((${dx})^2 = ${dx * dx}\\). `;
        if (!okY2) hint += `\\((${dy})^2 = ${dy * dy}\\).`;
        return { ok: false, msg: hint };
    }

    /* ── Étape 3 : somme ── */
    if (stepsDone === 2) {
        const isum = document.getElementById('sum2');
        const vsum = normNum(isum.value);
        const okS = vsum !== null && close(vsum, d2, 0.01);
        isum.classList.remove('ok','err');
        isum.classList.add(okS ? 'ok' : 'err');
        if (okS) {
            lockStep('step2');
            const rootHint = root.katex === String(root.decimal) ? `\\(AB = ${root.katex}\\)` : `\\(AB = \\sqrt{${d2}} = ${root.katex} \\approx ${String(root.decimal).replace('.',',')}\\)`;
            insertStep(`
                <div class="step-block active" id="step3">
                    <div class="step-tag">Étape 4 · Prends la racine carrée</div>
                    <div class="q-prompt">\\(AB = \\sqrt{${d2}}\\) — Donne la valeur exacte de \\(AB\\) (sous forme simplifiée si possible) :</div>
                    <div class="answer-wrap">
                        <input type="text" class="answer-input wide" id="abval" placeholder="…" inputmode="decimal">

            return { ok: true, msg: `\\(${dx * dx} + ${dy * dy} = ${d2}\\). Il reste à prendre la racine carrée\u00a0!`, advanceOnly: true };
        }
        return { ok: false, msg: `\\(${dx*dx} + ${dy*dy} = ${d2}\\).` };
    }

    /* ── Étape 4 : racine carrée ── */
    if (stepsDone === 3) {
        const iab = document.getElementById('abval');
        const vab = normNum(iab.value);
        iab.classList.remove('ok','err');
        const okExact = vab !== null && close(vab, root.decimal, 0.001);
        const okApprox = vab !== null && closeTenth(vab, root.decimal);
        const ok = okExact || okApprox;
        iab.classList.add(ok ? 'ok' : 'err');
        if (ok) return { ok: true, msg: `Bravo\u00a0! ${katexResult}` };
        return { ok: false, msg: `${katexResult}.` };
    }

    return { ok: false, msg: 'Une erreur inattendue s\'est produite.' };
};

/* ==========================================================
   NIVEAU 2 : NATURE D'UN TRIANGLE
   ========================================================== */

/* Génère un triangle "intéressant" :
   - isocèle (non équilatéral)
   - équilatéral (cas rare, coordonnées entières)
   - rectangle (non isocèle)
   - rectangle isocèle
   - quelconque
   Le tirage au sort pondère vers des cas variés. */
GENERATORS.triangle = function () {
    const typePool = ['isocele', 'isocele', 'rectangle', 'rectangle', 'quelconque', 'quelconque', 'rect_isocele'];
    const wantedType = typePool[rnd(0, typePool.length - 1)];
    return generateTriangle(wantedType);
};

function generateTriangle(wantedType) {
    let tries = 0;
    while (tries++ < 200) {
        const A = randPt();
        const B = randPt([A]);
        const C = randPt([A, B]);
        const ab2 = dist2(A, B);
        const bc2 = dist2(B, C);
        const ca2 = dist2(C, A);
        if (ab2 === 0 || bc2 === 0 || ca2 === 0) continue;
        // Vérifier que c'est un vrai triangle (pas colinéaire)
        const cross = (B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x);
        if (cross === 0) continue;

        const sAB = ab2, sBC = bc2, sCA = ca2;
        const isocele   = (sAB === sBC) || (sBC === sCA) || (sCA === sAB);
        const equilat   = (sAB === sBC && sBC === sCA);
        const rectangle = (sAB + sBC === sCA) || (sBC + sCA === sAB) || (sCA + sAB === sBC);
        const rectIso   = rectangle && isocele;
        const quelconque = !isocele && !rectangle;

        // Nature réelle
        let nature;
        if (equilat) nature = 'equilateral';
        else if (rectIso) nature = 'rect_isocele';
        else if (rectangle) nature = 'rectangle';
        else if (isocele) nature = 'isocele';
        else nature = 'quelconque';

        // Filtrer selon le type voulu
        if (wantedType === 'isocele'      && nature !== 'isocele') continue;
        if (wantedType === 'rectangle'    && nature !== 'rectangle') continue;
        if (wantedType === 'quelconque'   && nature !== 'quelconque') continue;
        if (wantedType === 'rect_isocele' && nature !== 'rect_isocele') continue;

        // Sommet de l'isocèle (côté double)
        let isoceleVertex = null;
        if (nature === 'isocele' || nature === 'rect_isocele') {
            if (sCA === sAB) isoceleVertex = 'A';
            else if (sAB === sBC) isoceleVertex = 'B';
            else isoceleVertex = 'C';
        }
        // Sommet de l'angle droit
        let rightVertex = null;
        if (rectangle || rectIso) {
            if (sCA + sAB === sBC) rightVertex = 'A';
            else if (sAB + sBC === sCA) rightVertex = 'C';
            else rightVertex = 'B';
        }

        const rAB = simplifyRoot(ab2);
        const rBC = simplifyRoot(bc2);
        const rCA = simplifyRoot(ca2);
        return { A, B, C, ab2, bc2, ca2, rAB, rBC, rCA, nature, isoceleVertex, rightVertex };
    }
    // fallback : quelconque simple
    return generateTriangle('quelconque');
}

/* Label affiché pour la nature */
function natureLabel(nature) {
    switch(nature) {
        case 'equilateral':  return 'Équilatéral';
        case 'isocele':      return 'Isocèle (non rectangle)';
        case 'rectangle':    return 'Rectangle (non isocèle)';
        case 'rect_isocele': return 'Rectangle et isocèle';
        case 'quelconque':   return 'Quelconque';
        default:             return 'Quelconque';
    }
}

/* Pour les 4 boutons de choix, simplification : on regroupe isocèle/rect_isocèle/équilatéral */
function choiceKey(nature) {
    // Boutons : isocele | rectangle | equilateral | quelconque
    if (nature === 'equilateral') return 'equilateral';
    if (nature === 'isocele') return 'isocele';
    if (nature === 'rectangle') return 'rectangle';
    if (nature === 'rect_isocele') return 'rectangle'; // rectangle isocèle → rectangle (l'élève doit voir les deux)
    return 'quelconque';
}

CHECKERS.triangle = function (q) {

    const { A, B, C, ab2, bc2, ca2, rAB, rBC, rCA, nature, isoceleVertex, rightVertex } = q;

    /* ── Explication finale commune ── */
    function buildExpl() {
        const correct = choiceKey(nature);
        if (nature === 'equilateral') return `\\(AB = BC = CA = ${rAB.katex}\\) : les trois côtés sont égaux → triangle <strong>équilatéral</strong>.`;
        if (nature === 'isocele') {
            const eq = isoceleVertex === 'A' ? `\\(CA = AB = ${rCA.katex}\\)` : isoceleVertex === 'B' ? `\\(AB = BC = ${rAB.katex}\\)` : `\\(BC = CA = ${rBC.katex}\\)`;
            return `${eq} : deux côtés égaux → triangle <strong>isocèle en ${isoceleVertex}</strong>.`;
        }
        if (nature === 'rectangle') {
            const hyp = rightVertex === 'A' ? `BC` : rightVertex === 'B' ? `CA` : `AB`;

            const s1  = rightVertex === 'A' ? ab2 : rightVertex === 'B' ? ab2 : bc2;
            const s2  = rightVertex === 'A' ? ca2 : rightVertex === 'B' ? bc2 : ca2;
            return `\\(${hyp}^2 = ${h2} = ${s1} + ${s2}\\) → réciproque de Pythagore → <strong>rectangle en ${rightVertex}</strong>.`;
        }

        return `\\(AB \\neq BC \\neq CA\\) et pas de relation de Pythagore → triangle <strong>quelconque</strong>.`;

    function ca2hint() { return `\\(CA^2 = (${A.x}-(${C.x}))^2+(${A.y}-(${C.y}))^2 = ${(A.x-C.x)**2}+${(A.y-C.y)**2} = ${ca2}\\)`; }

    function lockedTag(sq, r) {
        return `<span class="locked-val">\\(${sq}\\) → \\(${r.katex}\\)</span>`;
    }

    /* ── Étape 1 : AB² et AB ── */
    if (stepsDone === 0) {
        const iAB2 = document.getElementById('ab2');
        const iAB  = document.getElementById('ab');
        const vAB2 = normNum(iAB2.value);
        const vAB  = normNum(iAB.value);
        const okAB2 = vAB2 !== null && close(vAB2, ab2, 0.01);
        const okAB  = vAB  !== null && closeTenth(vAB, rAB.decimal);
        [iAB2, iAB].forEach((el, i) => { el.classList.remove('ok','err'); el.classList.add([okAB2, okAB][i] ? 'ok' : 'err'); });
        if (okAB2 && okAB) {
            lockStep('step0');
            insertStep(`
                <div class="step-block active" id="step1">
                    <div class="step-tag">Étape 2 · Calcule \\(BC\\)</div>
                    <div class="row-inputs">
                        <span class="row-label">\\(BC^2 = (x_C-x_B)^2+(y_C-y_B)^2 =\\)</span>
                        <input type="text" class="answer-input narrow" id="bc2i" placeholder="…" inputmode="decimal">
                    </div>
                    <div class="row-inputs">
                        <span class="row-label">\\(BC = \\sqrt{\\phantom{00}} =\\)</span>
                        <input type="text" class="answer-input narrow" id="bc" placeholder="…" inputmode="decimal">
                    </div>
                </div>`, calcAnchor);
            return { ok: true, msg: `\\(AB^2 = ${ab2}\\), donc \\(AB = ${rAB.katex}\\). Calcule maintenant \\(BC\\)\u00a0!`, advanceOnly: true };
        }
        let hint = '';
        if (!okAB2) hint += ab2hint() + '. ';
        if (okAB2 && !okAB) hint += `\\(AB = \\sqrt{${ab2}} = ${rAB.katex}\\).`;
        if (!okAB2 && !okAB) hint += ` Commence par \\(AB^2\\).`;
        return { ok: false, msg: hint };
    }

    /* ── Étape 2 : BC² et BC ── */
    if (stepsDone === 1) {
        const iBC2 = document.getElementById('bc2i');
        const iBC  = document.getElementById('bc');
        const vBC2 = normNum(iBC2.value);
        const vBC  = normNum(iBC.value);
        const okBC2 = vBC2 !== null && close(vBC2, bc2, 0.01);
        const okBC  = vBC  !== null && closeTenth(vBC, rBC.decimal);
        [iBC2, iBC].forEach((el, i) => { el.classList.remove('ok','err'); el.classList.add([okBC2, okBC][i] ? 'ok' : 'err'); });
        if (okBC2 && okBC) {
            lockStep('step1');
            insertStep(`
                <div class="step-block active" id="step2">
                    <div class="step-tag">Étape 3 · Calcule \\(CA\\)</div>
                    <div class="row-inputs">
                        <span class="row-label">\\(CA^2 = (x_A-x_C)^2+(y_A-y_C)^2 =\\)</span>
                        <input type="text" class="answer-input narrow" id="ca2i" placeholder="…" inputmode="decimal">
                    </div>
                    <div class="row-inputs">
                        <span class="row-label">\\(CA = \\sqrt{\\phantom{00}} =\\)</span>
                        <input type="text" class="answer-input narrow" id="ca" placeholder="…" inputmode="decimal">
                    </div>
                </div>`, calcAnchor);
            return { ok: true, msg: `\\(BC^2 = ${bc2}\\), donc \\(BC = ${rBC.katex}\\). Calcule maintenant \\(CA\\)\u00a0!`, advanceOnly: true };
        }
        let hint = '';
        if (!okBC2) hint += bc2hint() + '. ';
        if (okBC2 && !okBC) hint += `\\(BC = \\sqrt{${bc2}} = ${rBC.katex}\\).`;
        if (!okBC2 && !okBC) hint += ' Commence par \\(BC^2\\).';
        return { ok: false, msg: hint };
    }

    /* ── Étape 3 : CA² et CA ── */
    if (stepsDone === 2) {
        const iCA2 = document.getElementById('ca2i');
        const iCA  = document.getElementById('ca');
        const vCA2 = normNum(iCA2.value);
        const vCA  = normNum(iCA.value);
        const okCA2 = vCA2 !== null && close(vCA2, ca2, 0.01);
        const okCA  = vCA  !== null && closeTenth(vCA, rCA.decimal);
        [iCA2, iCA].forEach((el, i) => { el.classList.remove('ok','err'); el.classList.add([okCA2, okCA][i] ? 'ok' : 'err'); });
        if (okCA2 && okCA) {
            lockStep('step2');

            if (nature === 'rectangle' || nature === 'rect_isocele') {
                // Étape intermédiaire : vérification réciproque Pythagore
                // Identifier hypoténuse (plus grand carré) et les deux autres
                const sides = [{name:'AB', sq: ab2}, {name:'BC', sq: bc2}, {name:'CA', sq: ca2}];
                sides.sort((a,b) => b.sq - a.sq);
                const hyp = sides[0], leg1 = sides[1], leg2 = sides[2];
                insertStep(`
                    <div class="step-block active" id="step3">
                        <div class="step-tag">Étape 4 · Vérifie la réciproque du théorème de Pythagore</div>
                        <p style="text-align:center;font-size:0.88em;color:var(--text-light);margin-bottom:12px;">
                            \\(AB=${rAB.katex}\\) &nbsp;·&nbsp; \\(BC=${rBC.katex}\\) &nbsp;·&nbsp; \\(CA=${rCA.katex}\\)
                        </p>
                        <p style="text-align:center;font-size:0.9em;font-weight:600;margin-bottom:10px;">
                            Le plus grand côté est \\(${hyp.name}\\). Calcule et compare :
                        </p>
                        <div class="row-inputs">
                            <span class="row-label">\\(${hyp.name}^2 =\\)</span>
                            <input type="text" class="answer-input narrow" id="pyth-hyp" placeholder="…" inputmode="decimal">
                        </div>
                        <div class="row-inputs">
                            <span class="row-label">\\(${leg1.name}^2 + ${leg2.name}^2 =\\)</span>
                            <input type="text" class="answer-input narrow" id="pyth-sum" placeholder="…" inputmode="decimal">
                        </div>
                        <p style="font-size:0.78em;color:var(--text-light);text-align:center;margin-top:6px;">
                            Si les deux valeurs sont égales, le triangle est rectangle en \\(${rightVertex}\\).
                        </p>
                    </div>`, calcAnchor);
                return { ok: true, msg: `\\(CA^2 = ${ca2}\\), donc \\(CA = ${rCA.katex}\\). Maintenant vérifie Pythagore\u00a0!`, advanceOnly: true };
            }

            // Pas rectangle : on va directement aux boutons de nature
            let verif = '';
            if (nature === 'isocele') {
                verif = `<p style="font-size:0.82em;color:var(--text-light);text-align:center;margin:8px 0 4px;">
                    💡 Compare les trois longueurs : deux sont-elles égales ?
                </p>`;
            }
            insertStep(`
                <div class="step-block active" id="step3">
                    <div class="step-tag">Étape 4 · Nature du triangle ABC</div>
                    <p style="text-align:center;font-size:0.9em;margin-bottom:10px;color:var(--text-light);">
                        \\(AB=${rAB.katex}\\) &nbsp;·&nbsp; \\(BC=${rBC.katex}\\) &nbsp;·&nbsp; \\(CA=${rCA.katex}\\)
                    </p>
                    ${verif}
                    <p style="text-align:center;font-weight:600;margin-bottom:12px;">Quelle est la nature du triangle \\(ABC\\) ?</p>
                    <div class="choice-grid">
                        <button class="choice-btn" data-choice="isocele" onclick="selectChoice(this)">Isocèle</button>
                        <button class="choice-btn" data-choice="equilateral" onclick="selectChoice(this)">Équilatéral</button>
                        <button class="choice-btn" data-choice="rectangle" onclick="selectChoice(this)">Rectangle</button>
                        <button class="choice-btn" data-choice="quelconque" onclick="selectChoice(this)">Quelconque</button>
                    </div>
                </div>`, calcAnchor);
            return { ok: true, msg: `\\(CA^2 = ${ca2}\\), donc \\(CA = ${rCA.katex}\\). Maintenant détermine la nature du triangle\u00a0!`, advanceOnly: true };
        }
        let hint = '';
        if (!okCA2) hint += ca2hint() + '. ';
        if (okCA2 && !okCA) hint += `\\(CA = \\sqrt{${ca2}} = ${rCA.katex}\\).`;
        if (!okCA2 && !okCA) hint += ' Commence par \\(CA^2\\).';
        return { ok: false, msg: hint };
    }

    /* ── Étape 4 : vérification Pythagore (rectangle seulement) ── */
    if (stepsDone === 3 && (nature === 'rectangle' || nature === 'rect_isocele')) {
        const sides = [{name:'AB', sq: ab2}, {name:'BC', sq: bc2}, {name:'CA', sq: ca2}];
        sides.sort((a,b) => b.sq - a.sq);
        const hyp = sides[0], leg1 = sides[1], leg2 = sides[2];
        const iHyp = document.getElementById('pyth-hyp');
        const iSum = document.getElementById('pyth-sum');
        const vHyp = normNum(iHyp.value);
        const vSum = normNum(iSum.value);
        const okHyp = vHyp !== null && close(vHyp, hyp.sq, 0.01);
        const okSum = vSum !== null && close(vSum, leg1.sq + leg2.sq, 0.01);
        [iHyp, iSum].forEach((el, i) => { el.classList.remove('ok','err'); el.classList.add([okHyp, okSum][i] ? 'ok' : 'err'); });
        if (okHyp && okSum) {
            lockStep('step3');
            insertStep(`
                <div class="step-block active" id="step4">
                    <div class="step-tag">Étape 5 · Nature du triangle ABC</div>
                    <p style="text-align:center;font-size:0.9em;margin-bottom:6px;color:var(--text-light);">
                        \\(${hyp.name}^2 = ${hyp.sq} = ${leg1.sq} + ${leg2.sq} = ${leg1.name}^2 + ${leg2.name}^2\\) ✓
                    </p>
                    <p style="text-align:center;font-weight:600;margin-bottom:12px;">Quelle est la nature du triangle \\(ABC\\) ?</p>
                    <div class="choice-grid">
                        <button class="choice-btn" data-choice="isocele" onclick="selectChoice(this)">Isocèle</button>
                        <button class="choice-btn" data-choice="equilateral" onclick="selectChoice(this)">Équilatéral</button>
                        <button class="choice-btn" data-choice="rectangle" onclick="selectChoice(this)">Rectangle</button>
                        <button class="choice-btn" data-choice="quelconque" onclick="selectChoice(this)">Quelconque</button>
                    </div>
                </div>`, calcAnchor);
            return { ok: true, msg: `\\(${hyp.name}^2 = ${hyp.sq} = ${leg1.sq} + ${leg2.sq}\\) : la réciproque de Pythagore confirme un angle droit en \\(${rightVertex}\\). Choisis la nature\u00a0!`, advanceOnly: true };
        }
        let hint = '';
        if (!okHyp) hint += `\\(${hyp.name}^2 = ${hyp.sq}\\). `;
        if (!okSum) hint += `\\(${leg1.name}^2 + ${leg2.name}^2 = ${leg1.sq} + ${leg2.sq} = ${leg1.sq + leg2.sq}\\).`;
        return { ok: false, msg: hint };
    }

    /* ── Étape finale : boutons de nature ── */
    // stepsDone === 3 (non-rectangle) ou stepsDone === 4 (rectangle)
    const natStepId = (nature === 'rectangle' || nature === 'rect_isocele') ? '#step4' : '#step3';
    if (stepsDone === 3 || stepsDone === 4) {
        const chosen = document.querySelector(natStepId + ' .choice-btn.chosen');
        if (!chosen) return { ok: false, msg: 'Choisis une réponse parmi les boutons.' };
        const userChoice = chosen.dataset.choice;
        const correct = choiceKey(nature);
        chosen.classList.remove('chosen');
        if (userChoice === correct) {
            chosen.classList.add('ok');
            return { ok: true, msg: buildExpl() };
        } else {
            chosen.classList.add('err');
            return { ok: false, msg: buildHint(correct) };
        }
    }

    return { ok: false, msg: 'Erreur inattendue.' };
};

function selectChoice(btn) {
    document.querySelectorAll('#step3 .choice-btn').forEach(b => b.classList.remove('chosen'));
    btn.classList.add('chosen');
}
