<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloriage Magique — Équations</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--card:#fff;--txt:#2d2d2d;--txt2:#888;--bdr:#e0ddd5;--acc:#2e86c1;--acc-lt:#d6eaf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--txt);max-width:920px;margin:0 auto;padding:12px;-webkit-user-select:none;user-select:none}
h1{font-size:19px;text-align:center;font-weight:700;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:12px}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:700px){.layout{flex-direction:column;align-items:center}}
.col-draw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-panel{flex:1;min-width:0}
.svg-wrap{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:10px;width:min(85vw,400px)}
.svg-wrap svg{width:100%;height:auto}
.zone{fill:#f5f4ef;stroke:#333;stroke-width:1.8;cursor:pointer;transition:fill .2s}
.zone:hover{filter:brightness(.95)}
.zone-num{font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;fill:#666;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.panel{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:14px}
.panel-empty{display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;min-height:100px;text-align:center;line-height:1.6}
.pcontent{display:none}
.zone-badge{display:inline-block;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;margin-bottom:8px}
.equation{text-align:center;font-size:18px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.qcm{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.qcm-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:10px;background:var(--card);cursor:pointer;transition:all .15s;font-size:14px;font-weight:600;font-family:'Quicksand',sans-serif}
.qcm-btn:hover{background:var(--acc-lt);border-color:var(--acc)}
.qcm-btn.picked{border-color:var(--acc);background:var(--acc-lt)}
.qcm-swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.qcm-letter{width:22px;height:22px;line-height:22px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:11px;border-radius:6px;flex-shrink:0}
.qcm-expr{flex:1;min-width:0}
.leg-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--txt2)}
.leg-grid{display:flex;flex-wrap:wrap;gap:4px}
.leg-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg);font-size:12px}
.leg-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.leg-text{font-weight:600}
.eq-title{font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--txt2)}
.eq-list{display:flex;flex-direction:column;gap:3px}
.eq-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.eq-item:hover{background:var(--acc-lt)}
.eq-item.done{background:#e8f8f0;border-color:#1d9e75}
.eq-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:10px;border-radius:5px;flex-shrink:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{padding:9px 16px;font-size:13px;font-weight:700;font-family:'Quicksand',sans-serif;border:1.5px solid var(--bdr);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-g{background:#1d9e75;color:#fff;border-color:#1d9e75}
.score{text-align:center;font-size:13px;color:var(--txt2);min-height:20px;padding:6px 0}
.score b{color:var(--acc)}
@media(max-width:700px){.svg-wrap{width:min(95vw,400px)}.panel{width:min(95vw,400px)}.equation{font-size:16px}.qcm-btn{font-size:13px;padding:8px 10px}}
</style>
</head>
<body>
<h1>Coloriage Magique — Équations</h1>
<p class="sub">Résous l'équation, choisis la bonne solution parmi les propositions, et colorie la zone.</p>
<div class="layout">
<div class="col-draw">
  <div class="svg-wrap">
    <svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
      <!-- Sky background elements -->
      <!-- Roof -->
      <polygon class="zone" id="z1" points="200,30 60,160 340,160"/>
      <text class="zone-num" x="200" y="120">1</text>
      <!-- Chimney -->
      <rect class="zone" id="z2" x="270" y="50" width="30" height="80"/>
      <text class="zone-num" x="285" y="95">2</text>
      <!-- Smoke puffs -->
      <ellipse class="zone" id="z3" cx="300" cy="40" rx="18" ry="12"/>
      <text class="zone-num" x="300" y="40">3</text>
      <ellipse class="zone" id="z4" cx="320" cy="20" rx="14" ry="10"/>
      <text class="zone-num" x="320" y="21">4</text>
      <!-- Wall left -->
      <rect class="zone" id="z5" x="80" y="160" width="120" height="180"/>
      <text class="zone-num" x="140" y="250">5</text>
      <!-- Wall right -->
      <rect class="zone" id="z6" x="200" y="160" width="120" height="180"/>
      <text class="zone-num" x="260" y="250">6</text>
      <!-- Door -->
      <rect class="zone" id="z7" x="170" y="260" width="60" height="80" rx="4"/>
      <text class="zone-num" x="200" y="300">7</text>
      <!-- Door knob -->
      <circle class="zone" id="z8" cx="218" cy="305" r="6"/>
      <text class="zone-num" x="218" y="305" style="font-size:8px">8</text>
      <!-- Window left -->
      <rect class="zone" id="z9" x="100" y="195" width="50" height="45" rx="3"/>
      <text class="zone-num" x="125" y="220">9</text>
      <!-- Window right -->
      <rect class="zone" id="z10" x="250" y="195" width="50" height="45" rx="3"/>
      <text class="zone-num" x="275" y="220">10</text>
      <!-- Roof window / lucarne -->
      <circle class="zone" id="z11" cx="200" cy="110" r="20"/>
      <text class="zone-num" x="200" y="110">11</text>
      <!-- Ground / grass -->
      <rect class="zone" id="z12" x="0" y="340" width="400" height="50"/>
      <text class="zone-num" x="45" y="368">12</text>
      <!-- Path to door -->
      <path class="zone" id="z13" d="M170,340 L160,390 L240,390 L230,340 Z"/>
      <text class="zone-num" x="200" y="370">13</text>
      <!-- Sun -->
      <circle class="zone" id="z14" cx="55" cy="55" r="30"/>
      <text class="zone-num" x="55" y="55">14</text>
      <!-- Tree trunk -->
      <rect class="zone" id="z15" x="365" y="270" width="20" height="70"/>
      <text class="zone-num" x="375" y="310">15</text>
      <!-- Tree foliage -->
      <ellipse class="zone" id="z16" cx="375" cy="240" rx="35" ry="45"/>
      <text class="zone-num" x="375" y="240">16</text>
      <!-- Fence left -->
      <rect class="zone" id="z17" x="10" y="300" width="60" height="40" rx="2"/>
      <text class="zone-num" x="40" y="323">17</text>
      <!-- Cloud -->
      <ellipse class="zone" id="z18" cx="130" cy="40" rx="35" ry="18"/>
      <text class="zone-num" x="130" y="41">18</text>
    </svg>
  </div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="razAll()">Tout effacer</button>
    <button class="btn btn-a" onclick="checkAll()">Vérifier</button>
  </div>
</div>
<div class="col-panel">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">← Clique sur une zone<br>pour voir son équation</div>
    <div class="pcontent" id="pcontent">
      <div class="zone-badge" id="zbadge">Zone 1</div>
      <div class="equation" id="peq"></div>
      <div class="qcm" id="qcm"></div>
    </div>
    <div class="leg-title" style="margin-top:12px">Couleurs</div>
    <div class="leg-grid" id="legGrid"></div>
    <div class="eq-title">Toutes les équations</div>
    <div class="eq-list" id="eqList"></div>
  </div>
</div>
</div>
<script>
const COLORS={
  rouge:{name:"Rouge",css:"#e74c3c"},
  orange:{name:"Orange",css:"#e67e22"},
  jaune:{name:"Jaune",css:"#f1c40f"},
  vert:{name:"Vert",css:"#27ae60"},
  bleu:{name:"Bleu ciel",css:"#5dade2"},
  violet:{name:"Violet",css:"#8e44ad"},
  marron:{name:"Marron",css:"#8B4513"},
  gris:{name:"Gris",css:"#95a5a6"},
  blanc:{name:"Blanc",css:"#ecf0f1"},
  beige:{name:"Beige",css:"#d4a574"}
};

// Equations 4ème: ax + b = cx + d → solution x = (d-b)/(a-c)
// No produit nul, no x²=a. Just linear equations, progressively harder.
// QCM: 4 proposed solutions, each mapped to a color.

const ZONES=[
  // z1: Roof → rouge
  {id:1, eq:"3x + 5 = 2x + 9", sol:4, choices:[
    {val:"x = 4",color:"rouge",correct:true},
    {val:"x = 14",color:"bleu"},
    {val:"x = 2",color:"vert"},
    {val:"x = −4",color:"jaune"}]},
  // z2: Chimney → rouge
  {id:2, eq:"5x − 3 = 2x + 9", sol:4, choices:[
    {val:"x = 2",color:"orange"},
    {val:"x = 4",color:"rouge",correct:true},
    {val:"x = 6",color:"marron"},
    {val:"x = −4",color:"violet"}]},
  // z3: Smoke → gris
  {id:3, eq:"4x + 1 = 2x + 7", sol:3, choices:[
    {val:"x = 4",color:"bleu"},
    {val:"x = 2",color:"rouge"},
    {val:"x = 3",color:"gris",correct:true},
    {val:"x = 1",color:"jaune"}]},
  // z4: Smoke → gris
  {id:4, eq:"7x − 2 = 4x + 7", sol:3, choices:[
    {val:"x = 3",color:"gris",correct:true},
    {val:"x = 5",color:"vert"},
    {val:"x = −3",color:"orange"},
    {val:"x = 1",color:"violet"}]},
  // z5: Wall left → beige
  {id:5, eq:"8x + 1 = 3x + 26", sol:5, choices:[
    {val:"x = 8",color:"rouge"},
    {val:"x = 5",color:"beige",correct:true},
    {val:"x = 3",color:"gris"},
    {val:"x = 27",color:"bleu"}]},
  // z6: Wall right → beige
  {id:6, eq:"9x − 5 = 2x + 44", sol:7, choices:[
    {val:"x = 1",color:"violet"},
    {val:"x = 5",color:"rouge"},
    {val:"x = 7",color:"beige",correct:true},
    {val:"x = −7",color:"vert"}]},
  // z7: Door → marron
  {id:7, eq:"4x + 2 = 6x − 4", sol:3, choices:[
    {val:"x = 1",color:"beige"},
    {val:"x = −3",color:"bleu"},
    {val:"x = 6",color:"rouge"},
    {val:"x = 3",color:"marron",correct:true}]},
  // z8: Knob → jaune
  {id:8, eq:"8x − 5 = 3x + 5", sol:2, choices:[
    {val:"x = 2",color:"jaune",correct:true},
    {val:"x = 0",color:"gris"},
    {val:"x = 10",color:"marron"},
    {val:"x = −2",color:"rouge"}]},
  // z9: Window left → bleu
  {id:9, eq:"7x + 3 = 4x + 9", sol:2, choices:[
    {val:"x = 7",color:"rouge"},
    {val:"x = 2",color:"bleu",correct:true},
    {val:"x = 4",color:"jaune"},
    {val:"x = 1",color:"marron"}]},
  // z10: Window right → bleu
  {id:10, eq:"3x + 7 = 5x − 5", sol:6, choices:[
    {val:"x = 1",color:"beige"},
    {val:"x = −6",color:"orange"},
    {val:"x = 6",color:"bleu",correct:true},
    {val:"x = 12",color:"rouge"}]},
  // z11: Roof window → bleu
  {id:11, eq:"2(3x + 1) = 4(x + 3)", sol:5, choices:[
    {val:"x = 5",color:"bleu",correct:true},
    {val:"x = 7",color:"marron"},
    {val:"x = 2",color:"gris"},
    {val:"x = −5",color:"rouge"}]},
  // z12: Grass → vert
  {id:12, eq:"6x − 4 = 3x + 8", sol:4, choices:[
    {val:"x = 4",color:"vert",correct:true},
    {val:"x = 2",color:"bleu"},
    {val:"x = 12",color:"rouge"},
    {val:"x = −4",color:"jaune"}]},
  // z13: Path → gris
  {id:13, eq:"9x + 1 = 7x + 7", sol:3, choices:[
    {val:"x = 4",color:"vert"},
    {val:"x = 3",color:"gris",correct:true},
    {val:"x = 8",color:"rouge"},
    {val:"x = 1",color:"bleu"}]},
  // z14: Sun → jaune
  {id:14, eq:"10x − 6 = 7x + 6", sol:4, choices:[
    {val:"x = 4",color:"jaune",correct:true},
    {val:"x = 2",color:"vert"},
    {val:"x = −4",color:"violet"},
    {val:"x = 12",color:"marron"}]},
  // z15: Tree trunk → marron
  {id:15, eq:"7x + 1 = 3x + 13", sol:3, choices:[
    {val:"x = 2",color:"jaune"},
    {val:"x = 3",color:"marron",correct:true},
    {val:"x = 14",color:"rouge"},
    {val:"x = −3",color:"bleu"}]},
  // z16: Tree foliage → vert
  {id:16, eq:"5x − 7 = 2x + 5", sol:4, choices:[
    {val:"x = −4",color:"rouge"},
    {val:"x = 4",color:"vert",correct:true},
    {val:"x = 12",color:"orange"},
    {val:"x = 2",color:"gris"}]},
  // z17: Fence → blanc
  {id:17, eq:"4(x − 2) = 2(x + 1)", sol:5, choices:[
    {val:"x = 3",color:"gris"},
    {val:"x = −5",color:"rouge"},
    {val:"x = 10",color:"jaune"},
    {val:"x = 5",color:"blanc",correct:true}]},
  // z18: Cloud → blanc
  {id:18, eq:"6x + 2 = 4x + 12", sol:5, choices:[
    {val:"x = 0",color:"bleu"},
    {val:"x = 5",color:"blanc",correct:true},
    {val:"x = 7",color:"violet"},
    {val:"x = −5",color:"orange"}]},
];

let zoneColors={},selZone=-1;

function init(){
  buildLegend();buildEqList();
  ZONES.forEach(z=>{
    const el=document.getElementById('z'+z.id);
    if(el)el.addEventListener('click',()=>selectZone(z.id));
  });
}

function selectZone(id){
  selZone=id;
  document.getElementById('pempty').style.display='none';
  document.getElementById('pcontent').style.display='block';
  const z=ZONES.find(z=>z.id===id);
  document.getElementById('zbadge').textContent='Zone '+id;
  document.getElementById('peq').innerHTML='Résous : '+z.eq;
  buildQCM(z);
  document.querySelectorAll('.eq-item').forEach(el=>{
    el.style.outline=el.dataset.id==id?'2px solid var(--acc)':'none';
  });
  if(window.innerWidth<=700)
    document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function buildQCM(z){
  const qcm=document.getElementById('qcm');qcm.innerHTML='';
  const L=['A','B','C','D'];
  z.choices.forEach((ch,i)=>{
    const btn=document.createElement('div');
    btn.className='qcm-btn'+(zoneColors[z.id]===ch.color?' picked':'');
    btn.innerHTML=
      '<span class="qcm-letter">'+L[i]+'</span>'+
      '<div class="qcm-swatch" style="background:'+COLORS[ch.color].css+'"></div>'+
      '<span class="qcm-expr">'+ch.val+'</span>';
    btn.addEventListener('click',()=>pickChoice(z.id,ch.color));
    qcm.appendChild(btn);
  });
}

function pickChoice(zid,ck){
  zoneColors[zid]=ck;
  const el=document.getElementById('z'+zid);
  if(el){el.style.fill=COLORS[ck].css;el.classList.add('colored');}
  const z=ZONES.find(z=>z.id===zid);
  buildQCM(z);
  const ei=document.querySelector('.eq-item[data-id="'+zid+'"]');
  if(ei)ei.classList.add('done');
}

function buildLegend(){
  const g=document.getElementById('legGrid');
  const r=document.createElement('div');
  r.style.cssText='font-size:12px;color:var(--txt2);margin-bottom:6px;line-height:1.5;width:100%';
  r.innerHTML='Résous l\'équation puis choisis <b>la bonne solution</b>. La couleur associée colorie la zone.';
  g.appendChild(r);
  for(const[k,c] of Object.entries(COLORS)){
    const i=document.createElement('div');i.className='leg-item';
    i.innerHTML='<div class="leg-swatch" style="background:'+c.css+'"></div><span class="leg-text">'+c.name+'</span>';
    g.appendChild(i);
  }
}

function buildEqList(){
  const l=document.getElementById('eqList');
  ZONES.forEach(z=>{
    const i=document.createElement('div');i.className='eq-item';i.dataset.id=z.id;
    i.innerHTML='<span class="eq-num">'+z.id+'</span> '+z.eq;
    i.addEventListener('click',()=>selectZone(z.id));
    l.appendChild(i);
  });
}

function checkAll(){
  let ok=0;
  ZONES.forEach(z=>{
    const el=document.getElementById('z'+z.id);
    const c=z.choices.find(c=>c.correct).color;
    if(zoneColors[z.id]===c){ok++;el.style.stroke='#1d9e75';el.style.strokeWidth='3';}
    else if(zoneColors[z.id]!==undefined){el.style.stroke='#e24b4a';el.style.strokeWidth='3';}
  });
  const s=document.getElementById('score');
  if(ok===ZONES.length)s.innerHTML='🎉 <b>Parfait !</b> '+ok+'/'+ZONES.length+' zones correctes !';
  else s.innerHTML='<b>'+ok+'/'+ZONES.length+'</b> zones correctes';
}

function razAll(){
  zoneColors={};
  ZONES.forEach(z=>{
    const el=document.getElementById('z'+z.id);
    if(el){el.style.fill='#f5f4ef';el.style.stroke='#333';el.style.strokeWidth='1.8';el.classList.remove('colored');}
  });
  document.querySelectorAll('.eq-item').forEach(el=>{el.classList.remove('done');el.style.outline='none';});
  document.getElementById('score').innerHTML='';
  document.getElementById('pempty').style.display='flex';
  document.getElementById('pcontent').style.display='none';
  selZone=-1;
}

init();
</script>
<a href="index.html" class="btn-retour-flottant"><span>🏠</span> Menu</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5c67f2;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5c67f2;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all .3s ease}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5c67f2;color:white}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem}}
</style>
</body>
</html>
