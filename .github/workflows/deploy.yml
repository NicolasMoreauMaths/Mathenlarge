name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Injecter la clé API
        run: |
          KEY="${{ secrets.GROQ_API_KEY }}"
          P1="${KEY:0:20}"
          P2="${KEY:20}"
          sed -i "s/%%GROQ_KEY_P1%%/$P1/g" index.html
          sed -i "s/%%GROQ_KEY_P2%%/$P2/g" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
