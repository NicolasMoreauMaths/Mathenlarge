<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Art — Plus Grand Diviseur Commun</title>
<style>
:root {
  --bg:#f5f5f0;--card:#fff;--txt:#1a1a1a;--txt2:#777;--bdr:#d0d0d0;
  --acc:#5b4fc4;--acc-lt:#eeedfe;--ok:#1d9e75;
  --ko:#e24b4a;
  --pxoff:#dddcd5;--pxon:#2d2d2d;--pxbdr:#c5c4bc;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a1a;--card:#262626;--txt:#e8e8e8;--txt2:#999;--bdr:#444;
  --acc:#8b82e8;--acc-lt:#2a2650;--ok:#5dcaa5;--ok-bg:#0a2e22;
  --ko:#f09595;
  --pxoff:#3a3a3a;--pxon:#e0e0e0;--pxbdr:#555;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);
  max-width:920px;margin:0 auto;padding:12px;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
h1{font-size:18px;text-align:center;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:14px}
.main{display:flex;gap:16px;align-items:flex-start}
@media(max-width:660px){.main{flex-direction:column;align-items:center}}
.col-g{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-p{flex:1;min-width:0}
.board{
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
  width:min(82vw,360px);padding:5px;
  background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;
}
.tile{
  position:relative;border:2px solid var(--bdr);border-radius:4px;
  overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-lt)}
.tile.ok{border-color:var(--ok)}
.tile.ko{border-color:var(--ko);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tnum{position:absolute;top:0;left:2px;font-size:7px;color:var(--txt2);pointer-events:none;z-index:2;opacity:.55;line-height:1;}
.tg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tg .px{aspect-ratio:1;border:.5px solid var(--pxbdr)}
.tg .px.off{background:var(--pxoff)}
.tg .px.on{background:var(--pxon)}
.tile:not(.sel) .tg{pointer-events:none}
.panel{background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;padding:14px;}
.panel-empty{display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:13px;min-height:100px;text-align:center;line-height:1.6;}
.pcontent{display:none}
.panel-calc{text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr);}
.badge{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:8px;}
.pexo{font-size:15px;font-weight:500;line-height:1.7;color:var(--txt)}
.ed-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.ed-label{font-size:12px;color:var(--txt2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:72px;height:72px;border:2.5px solid var(--acc);border-radius:6px;overflow:hidden;}
.mini .mx{cursor:pointer;border:.5px solid var(--pxbdr);transition:background .1s}
.mini .mx.off{background:var(--pxoff)}
.mini .mx.on{background:var(--pxon)}
.leg-t{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--txt2)}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:4px}
.li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);}
.lp{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:27px;height:27px;border:1px solid var(--bdr);border-radius:2px;flex-shrink:0;overflow:hidden;}
.lp .lon{background:var(--pxon)}.lp .loff{background:var(--pxoff);border:.5px solid var(--pxbdr)}
.lf{font-size:13px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn{padding:8px 14px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer;}
.btn:active{transform:scale(.97)}
.btn-a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-g{background:var(--ok);color:#fff;border-color:var(--ok)}
.score{text-align:center;font-size:13px;color:var(--txt2);min-height:18px;padding:4px 0}
.score b{color:var(--acc)}
.corr{display:none;margin-top:10px;text-align:center}
.corr.show{display:block}
.corr-g{
  display:inline-grid;
  grid-template-columns:repeat(15,min(4.5vw,18px));
  grid-template-rows:repeat(15,min(4.5vw,18px));
  gap:0;border:2px solid var(--txt);border-radius:4px;overflow:hidden;
}
.corr-g div{border:.25px solid rgba(0,0,0,.07)}
.corr-g .con{background:var(--pxon)}.corr-g .coff{background:var(--pxoff)}
@media(max-width:660px){
  .board{width:min(92vw,360px)}
  .panel{width:min(92vw,400px)}
  .leg{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
  .corr-g{grid-template-columns:repeat(15,min(5.5vw,18px));grid-template-rows:repeat(15,min(5.5vw,18px))}
}
</style>
</head>
<body>

<h1>Pixel Art — Plus Grand Diviseur Commun</h1>
<p class="sub">Pour chaque tuile, calcule le plus grand diviseur commun, puis colorie selon le code.</p>

<div class="main">
<div class="col-g">
  <div class="board" id="board"></div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="raz()">Tout effacer</button>
    <button class="btn btn-a" onclick="check()">Vérifier</button>
    <button class="btn btn-g" id="bcorr" onclick="corrTog()">Correction</button>
  </div>
  <div class="corr" id="corrBox">
    <div class="corr-g" id="corrG"></div>
    <p style="font-size:10px;color:var(--txt2);margin-top:4px">Image révélée ⛏️</p>
  </div>
</div>

<div class="col-p">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">
      &#x2190; Clique sur une tuile<br>pour voir son exercice
    </div>
    <div class="pcontent" id="pcontent">
      <div class="panel-calc">
        <div class="badge" id="pbadge">Tuile 1</div>
        <div class="pexo" id="pexo"></div>
      </div>
      <div class="ed-row">
        <span class="ed-label">Colorie :</span>
        <div class="mini" id="mini"></div>
      </div>
      <div class="leg-t">Code : résultat &#x2192; motif</div>
      <div class="leg" id="leg"></div>
    </div>
  </div>
</div>
</div>

<script>
/*
  12 réponses possibles (PGCD), chacune avec un motif 3×3 UNIQUE.
  Les motifs des bonnes réponses reconstituent exactement la pioche Minecraft
  (grille 15×15 = 5×5 tuiles de 3×3) telle qu'elle a été dessinée.

  Correspondance motif → PGCD :
    tout vide       →  1   (fond blanc)
    1 pixel BD      →  2
    2 px col gauche →  3
    2 px diag \     →  4
    barre HG (3px)  →  5   (T18, T22)
    L inversé       →  6   (T21)
    L bas-droite    →  7   (T07)
    Z haut          →  8   (T04)
    tout plein      →  9   (T08, T09, T13)
    plein−coin BG   → 10   (T14)
    escalier D      → 12   (T03)
    plein−coin HG   → 14   (T17)
*/
const L = [
  { key:"1",  pattern:[0,0,0, 0,0,0, 0,0,0] },
  { key:"2",  pattern:[0,0,0, 0,0,0, 0,0,1] },
  { key:"3",  pattern:[1,0,0, 1,0,0, 0,0,0] },
  { key:"4",  pattern:[0,0,1, 0,0,0, 0,0,1] },
  { key:"5",  pattern:[1,1,0, 1,0,0, 0,0,0] },
  { key:"6",  pattern:[0,1,1, 0,1,1, 0,0,1] },
  { key:"7",  pattern:[0,0,1, 0,1,1, 0,1,1] },
  { key:"8",  pattern:[1,0,0, 1,1,0, 1,1,0] },
  { key:"9",  pattern:[1,1,1, 1,1,1, 1,1,1] },
  { key:"10", pattern:[1,1,1, 1,1,1, 0,1,1] },
  { key:"12", pattern:[0,0,1, 0,1,1, 1,1,1] },
  { key:"14", pattern:[0,1,1, 1,1,1, 1,1,1] },
];

const lMap = {};
L.forEach(l => { lMap[l.key] = l; });

/*
  25 exercices — plus grand diviseur commun.
  La réponse de chaque tuile est dictée par le motif de l'image finale.

  Grille de réponses (5 colonnes × 5 lignes, lecture gauche→droite, haut→bas) :
    T01=1  T02=1  T03=12 T04=8  T05=1
    T06=1  T07=7  T08=9  T09=9  T10=1
    T11=1  T12=4  T13=9  T14=10 T15=3
    T16=2  T17=14 T18=5  T19=1  T20=1
    T21=6  T22=5  T23=1  T24=1  T25=1
*/
const P = [
  // T01 → 1
  { q:"Quel est le plus grand diviseur commun de <b>7</b> et <b>13</b> ?", ans:"1" },
  // T02 → 1
  { q:"Deux nombres premiers : <b>11</b> et <b>17</b>.<br>Quel est leur plus grand diviseur commun ?", ans:"1" },
  // T03 → 12
  { q:"Quel est le plus grand diviseur commun de <b>24</b> et <b>36</b> ?", ans:"12" },
  // T04 → 8
  { q:"Quel est le plus grand diviseur commun de <b>16</b> et <b>24</b> ?", ans:"8" },
  // T05 → 1
  { q:"Quel est le plus grand diviseur commun de <b>5</b> et <b>9</b> ?", ans:"1" },
  // T06 → 1
  { q:"Quel est le plus grand diviseur commun de <b>4</b> et <b>9</b> ?", ans:"1" },
  // T07 → 7
  { q:"Quel est le plus grand diviseur commun de <b>14</b> et <b>21</b> ?", ans:"7" },
  // T08 → 9
  { q:"Un jardin mesure <b>27 m</b> sur <b>18 m</b>. On le dallage avec des carreaux carrés identiques, sans coupe.<br>Quelle est la taille maximale d'un carreau ?", ans:"9" },
  // T09 → 9
  { q:"Quel est le plus grand diviseur commun de <b>27</b> et <b>36</b> ?", ans:"9" },
  // T10 → 1
  { q:"Deux nombres premiers : <b>13</b> et <b>19</b>.<br>Quel est leur plus grand diviseur commun ?", ans:"1" },
  // T11 → 1
  { q:"Quel est le plus grand diviseur commun de <b>8</b> et <b>9</b> ?", ans:"1" },
  // T12 → 4
  { q:"Quel est le plus grand diviseur commun de <b>8</b> et <b>12</b> ?", ans:"4" },
  // T13 → 9
  { q:"On coupe une planche de <b>27 cm</b> et une de <b>18 cm</b> en morceaux identiques, sans reste.<br>Quelle est la longueur maximale d'un morceau ?", ans:"9" },
  // T14 → 10
  { q:"Quel est le plus grand diviseur commun de <b>20</b> et <b>30</b> ?", ans:"10" },
  // T15 → 3
  { q:"Quel est le plus grand diviseur commun de <b>9</b> et <b>15</b> ?", ans:"3" },
  // T16 → 2
  { q:"Quel est le plus grand diviseur commun de <b>6</b> et <b>10</b> ?", ans:"2" },
  // T17 → 14
  { q:"Quel est le plus grand diviseur commun de <b>28</b> et <b>42</b> ?", ans:"14" },
  // T18 → 5
  { q:"Un fleuriste a <b>10</b> roses et <b>25</b> tulipes. Il veut faire des bouquets identiques (même nombre de chaque fleur).<br>Combien de bouquets au maximum ?", ans:"5" },
  // T19 → 1
  { q:"Quel est le plus grand diviseur commun de <b>7</b> et <b>11</b> ?", ans:"1" },
  // T20 → 1
  { q:"Quel est le plus grand diviseur commun de <b>16</b> et <b>25</b> ?", ans:"1" },
  // T21 → 6
  { q:"Paul a <b>18</b> billes rouges et <b>24</b> billes bleues. Il veut des sachets identiques (même contenu).<br>Combien de sachets au maximum ?", ans:"6" },
  // T22 → 5
  { q:"Quel est le plus grand diviseur commun de <b>10</b> et <b>25</b> ?", ans:"5" },
  // T23 → 1
  { q:"Quel est le plus grand diviseur commun de <b>9</b> et <b>16</b> ?", ans:"1" },
  // T24 → 1
  { q:"Deux nombres premiers : <b>3</b> et <b>23</b>.<br>Quel est leur plus grand diviseur commun ?", ans:"1" },
  // T25 → 1
  { q:"Quel est le plus grand diviseur commun de <b>4</b> et <b>25</b> ?", ans:"1" },
];

/* Tableau de référence : bonne réponse = bon pattern pour chaque tuile */
const T = P.map((p, i) => {
  const l = lMap[p.ans];
  if (!l) { console.warn('Réponse inconnue tuile', i+1, ':', p.ans); return Array(9).fill(0); }
  return l.pattern.slice();
});

const NP = 9;
let G = Array.from({length:25}, () => Array(NP).fill(0));
let sel = -1;

function buildBoard() {
  const b = document.getElementById('board');
  for (let t = 0; t < 25; t++) {
    const d = document.createElement('div');
    d.className = 'tile'; d.id = 't' + t;
    d.innerHTML = '<span class="tnum">' + (t+1) + '</span>';
    const g = document.createElement('div'); g.className = 'tg';
    for (let p = 0; p < NP; p++) {
      const c = document.createElement('div');
      c.className = 'px off'; c.dataset.t = t; c.dataset.p = p;
      c.addEventListener('click', onPxClick);
      g.appendChild(c);
    }
    d.appendChild(g);
    d.addEventListener('click', function(e) {
      if (e.target.classList.contains('px')) return;
      selectTile(t);
    });
    b.appendChild(d);
  }
}

function onPxClick(e) {
  const el = e.target;
  const t = +el.dataset.t, p = +el.dataset.p;
  G[t][p] = G[t][p] ? 0 : 1;
  el.className = 'px ' + (G[t][p] ? 'on' : 'off');
  syncMini(t);
}

function selectTile(t) {
  sel = t;
  document.querySelectorAll('.tile').forEach(el => el.classList.remove('sel'));
  document.getElementById('t' + t).classList.add('sel');
  document.getElementById('pempty').style.display = 'none';
  document.getElementById('pcontent').style.display = 'block';
  document.getElementById('pbadge').textContent = 'Tuile ' + (t+1);
  document.getElementById('pexo').innerHTML = P[t].q;
  buildMini(t);
  if (window.innerWidth <= 660)
    document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function buildMini(t) {
  const mg = document.getElementById('mini'); mg.innerHTML = '';
  for (let p = 0; p < NP; p++) {
    const c = document.createElement('div');
    c.className = 'mx ' + (G[t][p] ? 'on' : 'off');
    c.addEventListener('click', function() {
      G[t][p] = G[t][p] ? 0 : 1;
      this.className = 'mx ' + (G[t][p] ? 'on' : 'off');
      syncBoard(t);
    });
    mg.appendChild(c);
  }
}

function syncBoard(t) {
  const pxs = document.querySelectorAll('#t' + t + ' .tg .px');
  for (let p = 0; p < NP; p++) pxs[p].className = 'px ' + (G[t][p] ? 'on' : 'off');
}

function syncMini(t) {
  const mxs = document.querySelectorAll('#mini .mx');
  if (mxs.length === NP)
    for (let p = 0; p < NP; p++) mxs[p].className = 'mx ' + (G[t][p] ? 'on' : 'off');
}

function buildLeg() {
  const lg = document.getElementById('leg');
  L.forEach(l => {
    const d = document.createElement('div'); d.className = 'li';
    let ph = '<div class="lp">';
    l.pattern.forEach(v => { ph += '<div class="' + (v ? 'lon' : 'loff') + '"></div>'; });
    ph += '</div>';
    d.innerHTML = ph + '<span class="lf">' + l.key + '</span>';
    lg.appendChild(d);
  });
}

/*
  Reconstruction de l'image de correction 15×15.
  Ordre : pour chaque ligne de tuiles tr (0-4), pour chaque ligne de pixels pr (0-2),
  pour chaque colonne de tuiles tc (0-4), pour chaque colonne de pixels pc (0-2).
  Cela génère les 225 divs dans l'ordre correct pour le CSS grid de 15 colonnes.
*/
function buildCorr() {
  const cg = document.getElementById('corrG');
  for (let tr = 0; tr < 5; tr++) {
    for (let pr = 0; pr < 3; pr++) {
      for (let tc = 0; tc < 5; tc++) {
        const t = tr * 5 + tc;
        for (let pc = 0; pc < 3; pc++) {
          const d = document.createElement('div');
          d.className = T[t][pr * 3 + pc] ? 'con' : 'coff';
          cg.appendChild(d);
        }
      }
    }
  }
}

function check() {
  let ok = 0;
  for (let t = 0; t < 25; t++) {
    const el = document.getElementById('t' + t);
    el.classList.remove('ok', 'ko');
    const match = T[t].every((v, i) => v === G[t][i]);
    if (match) { el.classList.add('ok'); ok++; }
    else if (G[t].some(v => v)) { el.classList.add('ko'); }
  }
  const s = document.getElementById('score');
  if (ok === 25) s.innerHTML = '&#127881; <b>Bravo !</b> 25/25 tuiles correctes !';
  else s.innerHTML = '<b>' + ok + '/25</b> tuiles correctes';
}

function raz() {
  G = Array.from({length:25}, () => Array(NP).fill(0));
  document.querySelectorAll('.tg .px').forEach(el => { el.className = 'px off'; });
  document.querySelectorAll('.tile').forEach(el => { el.classList.remove('ok','ko','sel'); });
  document.getElementById('score').innerHTML = '';
  document.getElementById('pempty').style.display = 'flex';
  document.getElementById('pcontent').style.display = 'none';
  sel = -1;
}

function corrTog() {
  const b = document.getElementById('corrBox'), n = document.getElementById('bcorr');
  if (b.classList.contains('show')) { b.classList.remove('show'); n.textContent = 'Correction'; }
  else { b.classList.add('show'); n.textContent = 'Masquer'; }
}

buildBoard(); buildLeg(); buildCorr();
</script>

<a href="index.html" class="btn-retour-flottant"><span>🏠</span> Menu</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5b4fc4;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5b4fc4;box-shadow:0 4px 15px rgba(0,0,0,.1);transition:all .3s ease;}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5b4fc4;color:white;}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem;}}
</style>
</body>
</html>
