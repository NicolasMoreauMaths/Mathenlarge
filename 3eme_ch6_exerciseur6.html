<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloriage Magique — Double Distributivité</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--card:#fff;--txt:#2d2d2d;--txt2:#888;--bdr:#e0ddd5;--acc:#8e44ad;--acc-lt:#f4ecf7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--txt);max-width:920px;margin:0 auto;padding:12px;-webkit-user-select:none;user-select:none}
h1{font-size:19px;text-align:center;font-weight:700;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:12px}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:700px){.layout{flex-direction:column;align-items:center}}
.col-draw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-panel{flex:1;min-width:0}
.svg-wrap{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:10px;width:min(85vw,400px)}
.svg-wrap svg{width:100%;height:auto}
.zone{fill:#f5f4ef;stroke:#333;stroke-width:1.8;cursor:pointer;transition:fill .2s}
.zone:hover{filter:brightness(.95)}
.zone-num{font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;fill:#666;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.panel{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:14px}
.panel-empty{display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;min-height:100px;text-align:center;line-height:1.6}
.pcontent{display:none}
.zone-badge{display:inline-block;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;margin-bottom:8px}
.equation{text-align:center;font-size:19px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.qcm{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.qcm-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border:1.5px solid var(--bdr);border-radius:10px;
  background:var(--card);cursor:pointer;transition:all .15s;
  font-size:14px;font-weight:600;font-family:'Quicksand',sans-serif;
}
.qcm-btn:hover{background:var(--acc-lt);border-color:var(--acc)}
.qcm-btn.picked{border-color:var(--acc);background:var(--acc-lt)}
.qcm-swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.qcm-letter{
  width:22px;height:22px;line-height:22px;text-align:center;
  background:var(--acc);color:#fff;font-weight:700;font-size:11px;
  border-radius:6px;flex-shrink:0;
}
.qcm-expr{flex:1;min-width:0}
.leg-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--txt2)}
.leg-grid{display:flex;flex-wrap:wrap;gap:4px}
.leg-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg);font-size:12px}
.leg-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.leg-text{font-weight:600}
.eq-title{font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--txt2)}
.eq-list{display:flex;flex-direction:column;gap:3px}
.eq-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.eq-item:hover{background:var(--acc-lt)}
.eq-item.done{background:#e8f8f0;border-color:#1d9e75}
.eq-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:10px;border-radius:5px;flex-shrink:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{padding:9px 16px;font-size:13px;font-weight:700;font-family:'Quicksand',sans-serif;border:1.5px solid var(--bdr);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-g{background:#1d9e75;color:#fff;border-color:#1d9e75}
.score{text-align:center;font-size:13px;color:var(--txt2);min-height:20px;padding:6px 0}
.score b{color:var(--acc)}
@media(max-width:700px){.svg-wrap{width:min(95vw,400px)}.panel{width:min(95vw,400px)}.equation{font-size:17px}.qcm-btn{font-size:13px;padding:8px 10px}}
</style>
</head>
<body>
<h1>Coloriage Magique — Double Distributivité</h1>
<p class="sub">Développe l'expression, choisis le bon résultat, et colorie la zone.</p>
<div class="layout">
<div class="col-draw">
  <div class="svg-wrap">
    <svg viewBox="0 0 440 400" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="zone" id="z1" cx="220" cy="130" rx="14" ry="22"/><text class="zone-num" x="220" y="130">1</text>
      <ellipse class="zone" id="z2" cx="220" cy="175" rx="16" ry="25"/><text class="zone-num" x="220" y="175">2</text>
      <ellipse class="zone" id="z3" cx="220" cy="225" rx="16" ry="25"/><text class="zone-num" x="220" y="225">3</text>
      <ellipse class="zone" id="z4" cx="220" cy="270" rx="14" ry="22"/><text class="zone-num" x="220" y="270">4</text>
      <line x1="220" y1="110" x2="190" y2="55" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <line x1="220" y1="110" x2="250" y2="55" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <circle cx="190" cy="52" r="6" fill="#333"/><circle cx="250" cy="52" r="6" fill="#333"/>
      <path class="zone" id="z5" d="M206,140 Q120,60 80,110 Q50,160 110,170 Q140,175 206,165 Z"/><text class="zone-num" x="135" y="135">5</text>
      <path class="zone" id="z6" d="M206,165 Q110,170 80,195 Q65,220 130,210 Q170,200 206,185 Z"/><text class="zone-num" x="135" y="190">6</text>
      <path class="zone" id="z7" d="M234,140 Q320,60 360,110 Q390,160 330,170 Q300,175 234,165 Z"/><text class="zone-num" x="305" y="135">7</text>
      <path class="zone" id="z8" d="M234,165 Q330,170 360,195 Q375,220 310,210 Q270,200 234,185 Z"/><text class="zone-num" x="305" y="190">8</text>
      <path class="zone" id="z9" d="M206,220 Q140,215 100,240 Q60,270 90,300 Q120,330 170,290 Q195,270 206,250 Z"/><text class="zone-num" x="135" y="268">9</text>
      <path class="zone" id="z10" d="M206,250 Q170,290 160,320 Q155,355 200,340 Q210,330 206,280 Z"/><text class="zone-num" x="185" y="315">10</text>
      <path class="zone" id="z11" d="M234,220 Q300,215 340,240 Q380,270 350,300 Q320,330 270,290 Q245,270 234,250 Z"/><text class="zone-num" x="305" y="268">11</text>
      <path class="zone" id="z12" d="M234,250 Q270,290 280,320 Q285,355 240,340 Q230,330 234,280 Z"/><text class="zone-num" x="255" y="315">12</text>
      <ellipse class="zone" id="z13" cx="140" cy="125" rx="18" ry="14"/><text class="zone-num" x="140" y="125">13</text>
      <ellipse class="zone" id="z14" cx="300" cy="125" rx="18" ry="14"/><text class="zone-num" x="300" y="125">14</text>
      <ellipse class="zone" id="z15" cx="125" cy="270" rx="16" ry="20"/><text class="zone-num" x="125" y="270">15</text>
      <ellipse class="zone" id="z16" cx="315" cy="270" rx="16" ry="20"/><text class="zone-num" x="315" y="270">16</text>
    </svg>
  </div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="razAll()">Tout effacer</button>
    <button class="btn btn-a" onclick="checkAll()">Vérifier</button>
  </div>
</div>
<div class="col-panel">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">← Clique sur une zone<br>pour voir l'expression à développer</div>
    <div class="pcontent" id="pcontent">
      <div class="zone-badge" id="zbadge">Zone 1</div>
      <div class="equation" id="peq"></div>
      <div class="qcm" id="qcm"></div>
    </div>
    <div class="leg-title" style="margin-top:12px">Couleurs</div>
    <div class="leg-grid" id="legGrid"></div>
    <div class="eq-title">Toutes les expressions</div>
    <div class="eq-list" id="eqList"></div>
  </div>
</div>
</div>
<script>
const COLORS={
  rose:{name:"Rose",css:"#e84393"},bleu:{name:"Bleu",css:"#5dade2"},
  orange:{name:"Orange",css:"#e67e22"},violet:{name:"Violet",css:"#8e44ad"},
  jaune:{name:"Jaune",css:"#f1c40f"},rouge:{name:"Rouge",css:"#e74c3c"},
  vert:{name:"Vert",css:"#27ae60"},marron:{name:"Marron",css:"#8B4513"}
};
const ZONES=[
  {id:1,eq:"(x + 3)(x + 4)",choices:[
    {expr:"x² + 7x + 12",color:"marron",correct:true},
    {expr:"x² + 7x + 7",color:"rose"},
    {expr:"x² + 12x + 7",color:"bleu"},
    {expr:"x² − 7x + 12",color:"orange"}]},
  {id:2,eq:"(x + 2)(x + 6)",choices:[
    {expr:"x² + 8x + 8",color:"violet"},
    {expr:"x² + 8x + 12",color:"marron",correct:true},
    {expr:"x² + 12x + 8",color:"jaune"},
    {expr:"x² − 8x + 12",color:"rouge"}]},
  {id:3,eq:"(x − 3)(x − 4)",choices:[
    {expr:"x² − 7x − 12",color:"bleu"},
    {expr:"x² + 7x + 12",color:"rose"},
    {expr:"x² − 7x + 12",color:"marron",correct:true},
    {expr:"x² − 12x + 7",color:"vert"}]},
  {id:4,eq:"(x + 1)(x + 12)",choices:[
    {expr:"x² + 13x + 12",color:"marron",correct:true},
    {expr:"x² + 12x + 12",color:"orange"},
    {expr:"x² + 13x − 12",color:"rouge"},
    {expr:"x² + 11x + 12",color:"violet"}]},
  {id:5,eq:"(x + 1)(x + 5)",choices:[
    {expr:"x² + 5x + 5",color:"vert"},
    {expr:"x² + 6x + 5",color:"rose",correct:true},
    {expr:"x² + 6x − 5",color:"bleu"},
    {expr:"x² + 4x + 5",color:"marron"}]},
  {id:6,eq:"(x + 2)(x + 3)",choices:[
    {expr:"x² + 5x + 5",color:"rose"},
    {expr:"x² + 6x + 6",color:"jaune"},
    {expr:"x² + 5x + 6",color:"violet",correct:true},
    {expr:"x² + 5x − 6",color:"orange"}]},
  {id:7,eq:"(x − 1)(x − 5)",choices:[
    {expr:"x² − 6x − 5",color:"marron"},
    {expr:"x² − 6x + 5",color:"rose",correct:true},
    {expr:"x² + 6x + 5",color:"vert"},
    {expr:"x² − 4x + 5",color:"bleu"}]},
  {id:8,eq:"(x − 2)(x − 3)",choices:[
    {expr:"x² − 5x − 6",color:"jaune"},
    {expr:"x² + 5x + 6",color:"orange"},
    {expr:"x² − 5x + 6",color:"violet",correct:true},
    {expr:"x² − 6x + 6",color:"rouge"}]},
  {id:9,eq:"(x + 1)(x + 4)",choices:[
    {expr:"x² + 5x + 4",color:"orange",correct:true},
    {expr:"x² + 4x + 4",color:"bleu"},
    {expr:"x² + 5x − 4",color:"marron"},
    {expr:"x² + 3x + 4",color:"rose"}]},
  {id:10,eq:"(x + 1)(x + 3)",choices:[
    {expr:"x² + 3x + 3",color:"rouge"},
    {expr:"x² + 4x + 3",color:"jaune",correct:true},
    {expr:"x² + 4x − 3",color:"violet"},
    {expr:"x² + 3x + 4",color:"vert"}]},
  {id:11,eq:"(x − 1)(x − 4)",choices:[
    {expr:"x² − 5x + 4",color:"orange",correct:true},
    {expr:"x² − 5x − 4",color:"rose"},
    {expr:"x² + 5x + 4",color:"jaune"},
    {expr:"x² − 3x + 4",color:"marron"}]},
  {id:12,eq:"(x − 1)(x − 3)",choices:[
    {expr:"x² − 4x − 3",color:"bleu"},
    {expr:"x² + 4x + 3",color:"vert"},
    {expr:"x² − 4x + 3",color:"jaune",correct:true},
    {expr:"x² − 2x + 3",color:"rouge"}]},
  {id:13,eq:"(x + 1)(x + 2)",choices:[
    {expr:"x² + 3x + 2",color:"bleu",correct:true},
    {expr:"x² + 2x + 2",color:"rose"},
    {expr:"x² + 3x − 2",color:"orange"},
    {expr:"x² + 3x + 3",color:"marron"}]},
  {id:14,eq:"(x − 1)(x − 2)",choices:[
    {expr:"x² − 3x − 2",color:"vert"},
    {expr:"x² + 3x + 2",color:"violet"},
    {expr:"x² − 3x + 2",color:"bleu",correct:true},
    {expr:"x² − 2x + 2",color:"jaune"}]},
  {id:15,eq:"(x + 2)(x + 4)",choices:[
    {expr:"x² + 6x + 6",color:"violet"},
    {expr:"x² + 6x + 8",color:"rouge",correct:true},
    {expr:"x² + 8x + 6",color:"marron"},
    {expr:"x² + 6x − 8",color:"jaune"}]},
  {id:16,eq:"(x − 2)(x − 4)",choices:[
    {expr:"x² − 6x + 8",color:"rouge",correct:true},
    {expr:"x² − 6x − 8",color:"bleu"},
    {expr:"x² + 6x + 8",color:"orange"},
    {expr:"x² − 8x + 6",color:"vert"}]},
];
let zoneColors={},selZone=-1;
function init(){buildLegend();buildEqList();ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el)el.addEventListener('click',()=>selectZone(z.id));});}
function selectZone(id){selZone=id;document.getElementById('pempty').style.display='none';document.getElementById('pcontent').style.display='block';const z=ZONES.find(z=>z.id===id);document.getElementById('zbadge').textContent='Zone '+id;document.getElementById('peq').innerHTML='Développe : '+z.eq;buildQCM(z);document.querySelectorAll('.eq-item').forEach(el=>{el.style.outline=el.dataset.id==id?'2px solid var(--acc)':'none';});if(window.innerWidth<=700)document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});}
function buildQCM(z){const qcm=document.getElementById('qcm');qcm.innerHTML='';const L=['A','B','C','D'];z.choices.forEach((ch,i)=>{const btn=document.createElement('div');btn.className='qcm-btn'+(zoneColors[z.id]===ch.color?' picked':'');btn.innerHTML='<span class="qcm-letter">'+L[i]+'</span><div class="qcm-swatch" style="background:'+COLORS[ch.color].css+'"></div><span class="qcm-expr">'+ch.expr+'</span>';btn.addEventListener('click',()=>pickChoice(z.id,ch.color));qcm.appendChild(btn);});}
function pickChoice(zid,ck){zoneColors[zid]=ck;const el=document.getElementById('z'+zid);if(el){el.style.fill=COLORS[ck].css;el.classList.add('colored');}const z=ZONES.find(z=>z.id===zid);buildQCM(z);const ei=document.querySelector('.eq-item[data-id="'+zid+'"]');if(ei)ei.classList.add('done');}
function buildLegend(){const g=document.getElementById('legGrid');const r=document.createElement('div');r.style.cssText='font-size:12px;color:var(--txt2);margin-bottom:6px;line-height:1.5;width:100%';r.innerHTML='Choisis <b>le bon développement</b> parmi les 4 propositions. La couleur associée colorie la zone.';g.appendChild(r);for(const[k,c] of Object.entries(COLORS)){const i=document.createElement('div');i.className='leg-item';i.innerHTML='<div class="leg-swatch" style="background:'+c.css+'"></div><span class="leg-text">'+c.name+'</span>';g.appendChild(i);}}
function buildEqList(){const l=document.getElementById('eqList');ZONES.forEach(z=>{const i=document.createElement('div');i.className='eq-item';i.dataset.id=z.id;i.innerHTML='<span class="eq-num">'+z.id+'</span> '+z.eq;i.addEventListener('click',()=>selectZone(z.id));l.appendChild(i);});}
function checkAll(){let ok=0;ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);const c=z.choices.find(c=>c.correct).color;if(zoneColors[z.id]===c){ok++;el.style.stroke='#1d9e75';el.style.strokeWidth='3';}else if(zoneColors[z.id]!==undefined){el.style.stroke='#e24b4a';el.style.strokeWidth='3';}});const s=document.getElementById('score');if(ok===ZONES.length)s.innerHTML='🎉 <b>Parfait !</b> '+ok+'/'+ZONES.length+' zones correctes !';else s.innerHTML='<b>'+ok+'/'+ZONES.length+'</b> zones correctes';}
function razAll(){zoneColors={};ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el){el.style.fill='#f5f4ef';el.style.stroke='#333';el.style.strokeWidth='1.8';el.classList.remove('colored');}});document.querySelectorAll('.eq-item').forEach(el=>{el.classList.remove('done');el.style.outline='none';});document.getElementById('score').innerHTML='';document.getElementById('pempty').style.display='flex';document.getElementById('pcontent').style.display='none';selZone=-1;}
init();
</script>
<a href="index.html" class="btn-retour-flottant"><span>🏠</span> Menu</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5c67f2;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5c67f2;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all .3s ease}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5c67f2;color:white}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem}}
</style>
</body>
</html>
