<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloriage Magique — Fraction d'une quantité</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--card:#fff;--txt:#2d2d2d;--txt2:#888;--bdr:#e0ddd5;--acc:#e67e22;--acc-lt:#fef5ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--txt);max-width:920px;margin:0 auto;padding:12px;-webkit-user-select:none;user-select:none}
h1{font-size:19px;text-align:center;font-weight:700;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:12px}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:700px){.layout{flex-direction:column;align-items:center}}
.col-draw{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-panel{flex:1;min-width:0}
.svg-wrap{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:10px;width:min(85vw,400px)}
.svg-wrap svg{width:100%;height:auto}
.zone{fill:#f5f4ef;stroke:#333;stroke-width:1.5;cursor:pointer;transition:fill .2s}
.zone:hover{filter:brightness(.93)}
.zone-num{font-family:'Quicksand',sans-serif;font-weight:700;font-size:10px;fill:#666;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.panel{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:14px}
.panel-empty{display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px;min-height:100px;text-align:center;line-height:1.6}
.pcontent{display:none}
.zone-badge{display:inline-block;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;margin-bottom:8px}
.equation{text-align:center;font-size:18px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr);line-height:1.5}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1}
.frac .fn{border-bottom:2.5px solid currentColor;padding:0 .3em .05em;font-weight:700}
.frac .fd{padding:.05em .3em 0;font-weight:700}
.qcm{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.qcm-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:10px;background:var(--card);cursor:pointer;transition:all .15s;font-size:15px;font-weight:600;font-family:'Quicksand',sans-serif}
.qcm-btn:hover{background:var(--acc-lt);border-color:var(--acc)}
.qcm-btn.picked{border-color:var(--acc);background:var(--acc-lt)}
.qcm-swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.qcm-letter{width:22px;height:22px;line-height:22px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:11px;border-radius:6px;flex-shrink:0}
.qcm-expr{flex:1;min-width:0}
.leg-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--txt2)}
.leg-grid{display:flex;flex-wrap:wrap;gap:4px}
.leg-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg);font-size:12px}
.leg-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.leg-text{font-weight:600}
.eq-title{font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--txt2)}
.eq-list{display:flex;flex-direction:column;gap:3px}
.eq-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.eq-item:hover{background:var(--acc-lt)}
.eq-item.done{background:#e8f8f0;border-color:#1d9e75}
.eq-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:10px;border-radius:5px;flex-shrink:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{padding:9px 16px;font-size:13px;font-weight:700;font-family:'Quicksand',sans-serif;border:1.5px solid var(--bdr);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-g{background:#1d9e75;color:#fff;border-color:#1d9e75}
.score{text-align:center;font-size:13px;color:var(--txt2);min-height:20px;padding:6px 0}
.score b{color:var(--acc)}
@media(max-width:700px){.svg-wrap{width:min(95vw,400px)}.panel{width:min(95vw,400px)}.equation{font-size:16px}.qcm-btn{font-size:14px;padding:8px 10px}}
</style>
</head>
<body>
<h1>🍕 Coloriage Magique — Fraction d'une quantité</h1>
<p class="sub">Calcule la fraction de la quantité, choisis le bon résultat, et colorie la zone !</p>
<div class="layout">
<div class="col-draw">
  <div class="svg-wrap">
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <!-- Plate rim: 4 arc segments forming an annulus -->
      <path class="zone" id="z16" d="
        M200,5 A195,195 0 0,1 395,200 A195,195 0 0,1 200,395 A195,195 0 0,1 5,200 A195,195 0 0,1 200,5 Z
        M200,40 A160,160 0 0,0 40,200 A160,160 0 0,0 200,360 A160,160 0 0,0 360,200 A160,160 0 0,0 200,40 Z
      " fill-rule="evenodd"/>
      <text class="zone-num" x="200" y="22">16</text>
      <!-- Pizza slices (inside the inner circle r=160, center=200,200) -->
      <!-- Slice 1: top-right -->
      <path class="zone" id="z1" d="M200,200 L200,40 A160,160 0 0,1 313,87 Z"/>
      <text class="zone-num" x="235" y="105">1</text>
      <!-- Slice 2: right -->
      <path class="zone" id="z2" d="M200,200 L313,87 A160,160 0 0,1 360,200 Z"/>
      <text class="zone-num" x="295" y="170">2</text>
      <!-- Slice 3: bottom-right -->
      <path class="zone" id="z3" d="M200,200 L360,200 A160,160 0 0,1 313,313 Z"/>
      <text class="zone-num" x="295" y="245">3</text>
      <!-- Slice 4: bottom -->
      <path class="zone" id="z4" d="M200,200 L313,313 A160,160 0 0,1 200,360 Z"/>
      <text class="zone-num" x="240" y="300">4</text>
      <!-- Slice 5: bottom-left -->
      <path class="zone" id="z5" d="M200,200 L200,360 A160,160 0 0,1 87,313 Z"/>
      <text class="zone-num" x="160" y="300">5</text>
      <!-- Slice 6: left -->
      <path class="zone" id="z6" d="M200,200 L87,313 A160,160 0 0,1 40,200 Z"/>
      <text class="zone-num" x="105" y="245">6</text>
      <!-- Slice 7: top-left -->
      <path class="zone" id="z7" d="M200,200 L40,200 A160,160 0 0,1 87,87 Z"/>
      <text class="zone-num" x="105" y="170">7</text>
      <!-- Slice 8: top -->
      <path class="zone" id="z8" d="M200,200 L87,87 A160,160 0 0,1 200,40 Z"/>
      <text class="zone-num" x="160" y="105">8</text>
      <!-- Center circle (sauce) -->
      <circle class="zone" id="z9" cx="200" cy="200" r="45"/>
      <text class="zone-num" x="200" y="200">9</text>
      <!-- Pepperoni -->
      <circle class="zone" id="z10" cx="250" cy="120" r="18"/>
      <text class="zone-num" x="250" y="120" style="font-size:9px">10</text>
      <circle class="zone" id="z11" cx="300" cy="220" r="18"/>
      <text class="zone-num" x="300" y="220" style="font-size:9px">11</text>
      <circle class="zone" id="z12" cx="250" cy="310" r="18"/>
      <text class="zone-num" x="250" y="310" style="font-size:9px">12</text>
      <circle class="zone" id="z13" cx="140" cy="300" r="18"/>
      <text class="zone-num" x="140" y="300" style="font-size:9px">13</text>
      <circle class="zone" id="z14" cx="100" cy="170" r="18"/>
      <text class="zone-num" x="100" y="170" style="font-size:9px">14</text>
      <circle class="zone" id="z15" cx="155" cy="115" r="18"/>
      <text class="zone-num" x="155" y="115" style="font-size:9px">15</text>
    </svg>
  </div>
  <div class="score" id="score"></div>
  <div class="actions">
    <button class="btn" onclick="razAll()">Tout effacer</button>
    <button class="btn btn-a" onclick="checkAll()">Vérifier</button>
  </div>
</div>
<div class="col-panel">
  <div class="panel" id="panel">
    <div class="panel-empty" id="pempty">← Clique sur une zone<br>pour voir son calcul</div>
    <div class="pcontent" id="pcontent">
      <div class="zone-badge" id="zbadge">Zone 1</div>
      <div class="equation" id="peq"></div>
      <div class="qcm" id="qcm"></div>
    </div>
    <div class="leg-title" style="margin-top:12px">Couleurs</div>
    <div class="leg-grid" id="legGrid"></div>
    <div class="eq-title">Tous les calculs</div>
    <div class="eq-list" id="eqList"></div>
  </div>
</div>
</div>
<script>
const COLORS={
  rouge:{name:"Rouge",css:"#e74c3c"},
  orange:{name:"Orange",css:"#e67e22"},
  jaune:{name:"Jaune",css:"#f1c40f"},
  vert:{name:"Vert",css:"#27ae60"},
  bleu:{name:"Bleu",css:"#5dade2"},
  violet:{name:"Violet",css:"#8e44ad"},
  marron:{name:"Marron",css:"#8B5e2f"},
  beige:{name:"Beige",css:"#f5deb3"}
};

/* Each zone: fraction of a quantity, 4 QCM choices with typical errors.
   Colors distributed pseudo-randomly — no detectable pattern. */
const ZONES=[
  // Slice 1 → jaune
  {id:1, eq:'<span class="frac"><span class="fn">3</span><span class="fd">4</span></span> de 24 m', eqTxt:'3/4 de 24 m', choices:[
    {val:"18 m",color:"jaune",correct:true},
    {val:"6 m",color:"orange"},
    {val:"8 m",color:"rouge"},
    {val:"72 m",color:"vert"}]},
  // Slice 2 → jaune
  {id:2, eq:'<span class="frac"><span class="fn">2</span><span class="fd">5</span></span> de 30 €', eqTxt:'2/5 de 30 €', choices:[
    {val:"6 €",color:"orange"},
    {val:"12 €",color:"jaune",correct:true},
    {val:"15 €",color:"rouge"},
    {val:"60 €",color:"vert"}]},
  // Slice 3 → orange
  {id:3, eq:'<span class="frac"><span class="fn">5</span><span class="fd">6</span></span> de 42 L', eqTxt:'5/6 de 42 L', choices:[
    {val:"35 L",color:"orange",correct:true},
    {val:"7 L",color:"marron"},
    {val:"30 L",color:"jaune"},
    {val:"210 L",color:"vert"}]},
  // Slice 4 → jaune
  {id:4, eq:'<span class="frac"><span class="fn">3</span><span class="fd">5</span></span> de 25 kg', eqTxt:'3/5 de 25 kg', choices:[
    {val:"5 kg",color:"rouge"},
    {val:"15 kg",color:"jaune",correct:true},
    {val:"75 kg",color:"vert"},
    {val:"8 kg",color:"orange"}]},
  // Slice 5 → orange
  {id:5, eq:'<span class="frac"><span class="fn">4</span><span class="fd">7</span></span> de 49 min', eqTxt:'4/7 de 49 min', choices:[
    {val:"28 min",color:"orange",correct:true},
    {val:"7 min",color:"marron"},
    {val:"12 min",color:"jaune"},
    {val:"196 min",color:"vert"}]},
  // Slice 6 → orange
  {id:6, eq:'<span class="frac"><span class="fn">2</span><span class="fd">3</span></span> de 18 cm', eqTxt:'2/3 de 18 cm', choices:[
    {val:"12 cm",color:"orange",correct:true},
    {val:"6 cm",color:"jaune"},
    {val:"9 cm",color:"rouge"},
    {val:"36 cm",color:"vert"}]},
  // Slice 7 → jaune
  {id:7, eq:'<span class="frac"><span class="fn">3</span><span class="fd">7</span></span> de 28 €', eqTxt:'3/7 de 28 €', choices:[
    {val:"4 €",color:"marron"},
    {val:"12 €",color:"jaune",correct:true},
    {val:"84 €",color:"vert"},
    {val:"9 €",color:"orange"}]},
  // Slice 8 → orange
  {id:8, eq:'<span class="frac"><span class="fn">5</span><span class="fd">8</span></span> de 40 g', eqTxt:'5/8 de 40 g', choices:[
    {val:"25 g",color:"orange",correct:true},
    {val:"5 g",color:"jaune"},
    {val:"8 g",color:"rouge"},
    {val:"200 g",color:"vert"}]},

  // Center → rouge
  {id:9, eq:'<span class="frac"><span class="fn">1</span><span class="fd">4</span></span> de 36 L', eqTxt:'1/4 de 36 L', choices:[
    {val:"9 L",color:"rouge",correct:true},
    {val:"4 L",color:"jaune"},
    {val:"32 L",color:"vert"},
    {val:"144 L",color:"orange"}]},

  // Pepperoni: rouge / vert / violet / rouge / vert / violet
  {id:10, eq:'<span class="frac"><span class="fn">3</span><span class="fd">4</span></span> de 16 L', eqTxt:'3/4 de 16 L', choices:[
    {val:"12 L",color:"vert",correct:true},
    {val:"4 L",color:"jaune"},
    {val:"48 L",color:"rouge"},
    {val:"8 L",color:"orange"}]},
  {id:11, eq:'<span class="frac"><span class="fn">2</span><span class="fd">3</span></span> de 21 m', eqTxt:'2/3 de 21 m', choices:[
    {val:"14 m",color:"rouge",correct:true},
    {val:"7 m",color:"jaune"},
    {val:"42 m",color:"vert"},
    {val:"10 m",color:"orange"}]},
  {id:12, eq:'<span class="frac"><span class="fn">1</span><span class="fd">5</span></span> de 35 kg', eqTxt:'1/5 de 35 kg', choices:[
    {val:"5 kg",color:"jaune"},
    {val:"7 kg",color:"violet",correct:true},
    {val:"175 kg",color:"vert"},
    {val:"30 kg",color:"orange"}]},
  {id:13, eq:'<span class="frac"><span class="fn">4</span><span class="fd">5</span></span> de 20 €', eqTxt:'4/5 de 20 €', choices:[
    {val:"16 €",color:"rouge",correct:true},
    {val:"4 €",color:"jaune"},
    {val:"5 €",color:"orange"},
    {val:"80 €",color:"vert"}]},
  {id:14, eq:'<span class="frac"><span class="fn">1</span><span class="fd">3</span></span> de 27 cm', eqTxt:'1/3 de 27 cm', choices:[
    {val:"3 cm",color:"jaune"},
    {val:"9 cm",color:"violet",correct:true},
    {val:"81 cm",color:"rouge"},
    {val:"24 cm",color:"orange"}]},
  {id:15, eq:'<span class="frac"><span class="fn">5</span><span class="fd">6</span></span> de 30 min', eqTxt:'5/6 de 30 min', choices:[
    {val:"25 min",color:"vert",correct:true},
    {val:"5 min",color:"jaune"},
    {val:"6 min",color:"orange"},
    {val:"150 min",color:"rouge"}]},

  // Plate rim → marron
  {id:16, eq:'<span class="frac"><span class="fn">1</span><span class="fd">2</span></span> de 48 €', eqTxt:'1/2 de 48 €', choices:[
    {val:"24 €",color:"marron",correct:true},
    {val:"96 €",color:"vert"},
    {val:"46 €",color:"jaune"},
    {val:"2 €",color:"rouge"}]},
];

let zoneColors={},selZone=-1;
function init(){buildLegend();buildEqList();ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el)el.addEventListener('click',()=>selectZone(z.id));});}
function selectZone(id){
  selZone=id;
  document.getElementById('pempty').style.display='none';
  document.getElementById('pcontent').style.display='block';
  const z=ZONES.find(z=>z.id===id);
  document.getElementById('zbadge').textContent='Zone '+id;
  document.getElementById('peq').innerHTML=z.eq+' = ?';
  buildQCM(z);
  document.querySelectorAll('.eq-item').forEach(el=>{el.style.outline=el.dataset.id==id?'2px solid var(--acc)':'none';});
  if(window.innerWidth<=700)document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function buildQCM(z){
  const qcm=document.getElementById('qcm');qcm.innerHTML='';
  const L=['A','B','C','D'];
  z.choices.forEach((ch,i)=>{
    const btn=document.createElement('div');
    btn.className='qcm-btn'+(zoneColors[z.id]===ch.color?' picked':'');
    btn.innerHTML='<span class="qcm-letter">'+L[i]+'</span><div class="qcm-swatch" style="background:'+COLORS[ch.color].css+'"></div><span class="qcm-expr">'+ch.val+'</span>';
    btn.addEventListener('click',()=>pickChoice(z.id,ch.color));
    qcm.appendChild(btn);
  });
}
function pickChoice(zid,ck){
  zoneColors[zid]=ck;
  const el=document.getElementById('z'+zid);
  if(el)el.style.fill=COLORS[ck].css;
  const z=ZONES.find(z=>z.id===zid);
  buildQCM(z);
  const ei=document.querySelector('.eq-item[data-id="'+zid+'"]');
  if(ei)ei.classList.add('done');
}
function buildLegend(){
  const g=document.getElementById('legGrid');
  const r=document.createElement('div');
  r.style.cssText='font-size:12px;color:var(--txt2);margin-bottom:6px;line-height:1.5;width:100%';
  r.innerHTML='Calcule la fraction de la quantité, puis choisis <b>le bon résultat</b>.';
  g.appendChild(r);
  for(const[k,c] of Object.entries(COLORS)){
    const i=document.createElement('div');i.className='leg-item';
    i.innerHTML='<div class="leg-swatch" style="background:'+c.css+'"></div><span class="leg-text">'+c.name+'</span>';
    g.appendChild(i);
  }
}
function buildEqList(){
  const l=document.getElementById('eqList');
  ZONES.forEach(z=>{
    const i=document.createElement('div');i.className='eq-item';i.dataset.id=z.id;
    i.innerHTML='<span class="eq-num">'+z.id+'</span> '+z.eqTxt;
    i.addEventListener('click',()=>selectZone(z.id));
    l.appendChild(i);
  });
}
function checkAll(){
  let ok=0;
  ZONES.forEach(z=>{
    const el=document.getElementById('z'+z.id);
    const c=z.choices.find(c=>c.correct).color;
    if(zoneColors[z.id]===c){ok++;el.style.stroke='#1d9e75';el.style.strokeWidth='3';}
    else if(zoneColors[z.id]!==undefined){el.style.stroke='#e24b4a';el.style.strokeWidth='3';}
  });
  const s=document.getElementById('score');
  if(ok===ZONES.length) s.innerHTML='🎉 <b>Parfait !</b> '+ok+'/'+ZONES.length+' — La pizza est prête !';
  else s.innerHTML='<b>'+ok+'/'+ZONES.length+'</b> zones correctes';
}
function razAll(){
  zoneColors={};
  ZONES.forEach(z=>{const el=document.getElementById('z'+z.id);if(el){el.style.fill='#f5f4ef';el.style.stroke='#333';el.style.strokeWidth='1.5';}});
  document.querySelectorAll('.eq-item').forEach(el=>{el.classList.remove('done');el.style.outline='none';});
  document.getElementById('score').innerHTML='';
  document.getElementById('pempty').style.display='flex';
  document.getElementById('pcontent').style.display='none';
  selZone=-1;
}
init();
</script>
<a href="index.html" class="btn-retour-flottant"><span>🏠</span> Menu</a>
<style>
.btn-retour-flottant{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;gap:8px;background:white;color:#5c67f2;text-decoration:none;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:50px;border:2px solid #5c67f2;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all .3s ease}
.btn-retour-flottant:hover{transform:scale(1.05);background:#5c67f2;color:white}
@media(max-width:600px){.btn-retour-flottant{top:auto;bottom:20px;left:20px;padding:12px 22px;font-size:1rem}}
</style>
</body>
</html>
